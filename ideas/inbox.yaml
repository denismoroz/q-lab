  date: '2026-10-27'
  source: owner
  text: bv2 можно оставить как защита. bv3 - доход. новая стратегия где страховка снимается чаще, по разным
    таймфреймам. ведь таймфреймы они как матрешки - чем ниже тем больше колебаний. если рассмотреть варианты
    определения тренда по более высокому таймфрейму а включать по более низкому... в качестве основы по
    тренду брать не биткоин а монету на которой работать - вот такие идеи
  status: implemented
  card: cards/bv2-fast-release-by-own-trend.yaml
  notes: карточка написана 2026-10-28; в очереди реализации
  attempts: 2
  problems: []
  review_blocks: []
  review_notes:
  - '`carder.readings_ru[1]` and `grid[fast_entry]` contradict each other. The reading says "тренд даёт
    медленное правило", but `fast_entry`=1 and `new_block.rule_ru` say the slow rule "не участвует". The
    idea''s own wording is "trend by the higher timeframe, enter by the lower". That is closest to the
    `fast_entry`=0 variant, where "slow says down AND fast is not above zero" is required before the hedge
    goes on. Say so in `readings_ru`. The `fast_entry`=1 variant is a third, fast-only reading and should
    be labeled that way.'
  - In `grid[fast_entry]` and `hypothesis_ru`, `fast_entry`=0 is described as "включение остаётся по медленному
    правилу". With step 4, the hedge cannot switch on while the fast return is above zero, so the entry
    is also delayed by the fast window. Describe it as "включение по медленному правилу плюс короткий
    доход не выше нуля", so the entry-side question is visibly covered.
  - The grid has a redundant cell, (`fast_window_hours`=0, `fast_entry`=1), which equals the baseline.
    Mention that it is the same as the baseline, or drop the cell, to save a run.
  - '`vs_tried[bv2-sig-momentum-sign].difference_ru` repeats itself ("окно... короче 3 дней" appears twice).
    It also has a broken line wrap. Fix it by saying once: "то же правило, сочетание знаков доходов через
    «и»; окна 12 и 24 часа, оба короче 3 дней, самого короткого из перебранных".'
  - 'In `new_block.rule_ru`, "залог" is used in "размер, залог, продажа…" before its explanation a few
    lines later. "Храповик" and "продажа выросшей части монеты по порогу книги" are never explained. Give
    a short gloss at first use, for example "порог: когда монета выросла на столько-то, часть её продаётся".'
  - In `new_block.rule_ru`, the "спот" explanation is crammed into one long line. Break it into sentences
    so it reads like the rest of the rule.
  - 'The title is very long. A shorter one, such as "Bv2: страховку снимают, когда монета растёт за 12–24
    часа", reads better.'
