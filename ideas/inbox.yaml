    и выхода'
  status: needs-owner
  card: null
  notes: 'вопрос владельцу: Эта идея не стратегия, а ежедневная сверка: живые сделки FRAB против того,
    что насчитал бы стенд (так мы называем программу q-lab, которая проигрывает стратегию на истории цен)
    за те же часы. Сверять надо четыре вещи: цену исполнения, комиссии, плату за финансирование и время
    входа и выхода. Стенд не может вынести по ней вердикт: у неё нет правила входа и выхода, нет сетки
    вариантов и нет блока кода, который нужно построить. Эта работа уже передана исследователю FRAB: директор
    поставил её ему в записке 2026-10-30 (docs/research/frab-2026-10-30.md оценивает её как «код, без
    испытаний»), поэтому карточка стратегии не нужна. Что уже есть в q-lab: файл paper_check.py (программа,
    которая сверяет бумажные книги, то есть учебные сделки без настоящих денег, со стендом за одно окно)
    и файл paper_replay.py (он проигрывает эти книги заново). В docs/FRAB_LIVE.md описана сверка с таблицей
    живых позиций frab: там учтены комиссии (за вход и выход вместе, то есть за полный круг сделки) и
    плата за финансирование по часам, то есть суммы за окно, а не каждая сделка отдельно. Единственное,
    что остаётся решить вам: нужна ли сверка именно по каждой сделке отдельно (цена исполнения и время
    входа и выхода каждой сделки) как отдельная задача на код, не как карточка?'
