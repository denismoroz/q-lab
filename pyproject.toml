[project]
name = "qlab"
version = "0.1.0"
description = "Strategy discovery, screening and allocation lab (research only — never places orders)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.1.0",
    "pyarrow>=18.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "typer>=0.15.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tenacity>=9.0.0",
]

[project.scripts]
qlab = "qlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlab"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/qlab"]
branch = true
omit = ["src/qlab/registry/migrations/*", "src/qlab/**/test_*.py"]
