# Overlay variant of bv2-research-headroom-causal (qlab overlays, src/qlab/overlay_variants.py):
# the same strategy with a chain of overlays on its weights (docs/OVERLAYS.md).
# Written by code, not by hand.
idea_id: bv2-research-headroom-causal-ov-gate-vol
title: 'Bv2 как на проде, но пул маржи рассчитан на спот, выросший в 1.5 раза (эксперимент исследователя
  1): числа выбирает код раз в месяц только по прошлому, история Binance с 2019: надстройки — не торговать
  в одном из рыночных состояний + уменьшать размер, когда собственные результаты стали неспокойнее обычного'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.overlays:Overlaid
  base_params:
    inner_code_ref: qlab.strategies.retune:Retune
    inner_params:
      inner_code_ref: qlab.strategies.live.bv2:LiveBv2
      base_params:
        coins:
        - BTC
        - ETH
        - SOL
        - AVAX
        capital_usd: 257.0
        spot_share: 0.5
        hedge_threshold: 0.0
        sticky_exit_hours: 12
        ratchet_threshold: 0.5
        carry_enabled: false
        carry_fraction: 0.6
        carry_entry_apr: 0.1
        carry_exit_hours: 24
        slippage: 0.0005
        min_order_usd: 10.0
        margin_enabled: true
        short_leverage:
          BTC: 3.0
          ETH: 2.0
          SOL: 1.5
          AVAX: 1.5
        default_leverage: 1.0
        maint_margin_rate:
          BTC: 0.0125
          ETH: 0.02
          SOL: 0.025
          AVAX: 0.05
        default_maint_margin_rate: 0.05
        margin_buffer: 0.1
        hedge_margin_headroom: 1.0
        rebalance_at_im_share: 0.5
        mode: paper
      grid:
        variant:
          base: {}
          experiment:
            hedge_margin_headroom: 1.5
      refit_every: M
      window: expanding
      objective: sharpe_net
      score_costs:
        taker_fee_bps: 5.25
        slippage_bps: 0.9
    overlays: []
    costs:
      taker_fee_bps: 5.25
      slippage_bps: 0.9
  grid:
    overlay:
      market_gate:skip-bull+vol_target:d30-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - flat
            - bear
        - name: vol_target
          params:
            lookback_days: 30
            max_scale: 1.0
      market_gate:skip-bull+vol_target:d90-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - flat
            - bear
        - name: vol_target
          params:
            lookback_days: 90
            max_scale: 1.0
      market_gate:skip-flat+vol_target:d30-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - bear
        - name: vol_target
          params:
            lookback_days: 30
            max_scale: 1.0
      market_gate:skip-flat+vol_target:d90-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - bear
        - name: vol_target
          params:
            lookback_days: 90
            max_scale: 1.0
      market_gate:skip-bear+vol_target:d30-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - flat
        - name: vol_target
          params:
            lookback_days: 30
            max_scale: 1.0
      market_gate:skip-bear+vol_target:d90-max1:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - flat
        - name: vol_target
          params:
            lookback_days: 90
            max_scale: 1.0
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5.25
    slippage_bps: 0.9
data:
  source: binance
  interval: 1h
  include_spot: false
  spot_prices: perp
  start: '2019-09-08'
  end: '2026-10-28'
  instruments:
  - BTC-SPOT
  - ETH-SPOT
  - SOL-SPOT
  - AVAX-SPOT
  - BTC
  - ETH
  - SOL
  - AVAX
costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of bv2-research-headroom: the numbers it trades are chosen by code, every month, from returns
  realised before the choice (the base strategy-b-v2 against its experiment (hedge_margin_headroom));
  the data is Binance''s history, a proxy for hyperliquid''s market, with the original''s costs and minimum
  leg.'
- 'The twin trades only 8 named columns (BTC-SPOT, ETH-SPOT, SOL-SPOT, AVAX-SPOT, BTC, ETH, SOL, AVAX),
  the required_instruments of bv2-research-headroom, not the whole market: the list was chosen by 2025-06-01
  and would know which coins survived if applied to the history before it (survivorship), so the twin
  is judged only from 2025-06-01 (judged_from = instruments_chosen_at); the days from 2019-09-08 are warm-up
  for the choice (docs/RETUNE.md, docs/FIT_VS_FORWARD.md).'
- 'Overlay variant of bv2-research-headroom-causal (qlab.overlay_variants, docs/OVERLAYS.md): the same
  strategy with market_gate, vol_target applied to its target weights; the strategy''s own numbers are
  untouched. The numbers of the overlays are chosen by code every month from the past only.'
noise_universe: held
measure_hedge_timing: true
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2020-06-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  base can first trade on 2019-11-01; the longest warm-up of the overlay family (market_gate, vol_target)
  is 180 days, so the overlay can first act on 2020-04-29; a candidate is eligible only after one whole
  month re-tuning period, so the first re-tuning after 2020-04-29 is 2020-05-01 and the first choice is
  made at the one after it, 2020-06-01. The family is declared whole in docs/OVERLAYS.md before any run:
  6 candidates, none chosen by looking at the data it is judged on. What this does not prove: the family
  itself (which overlays and which settings are offered) was written by people who had seen the market.'
judged_from: '2025-06-01'
