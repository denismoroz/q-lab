# Overlay variant of trend-binance-cap-gated-causal (qlab overlays, src/qlab/overlay_variants.py):
# the same strategy with a chain of overlays on its weights (docs/OVERLAYS.md).
# Written by code, not by hand.
idea_id: trend-binance-cap-gated-causal-ov-gate
title: 'Trend по капитализации на Binance 2019–2026, торгует только на росте и падении (определитель режима
  только по прошлому): числа выбирает код раз в месяц только по прошлому, история Binance с 2019: надстройки
  — не торговать в одном из рыночных состояний'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.overlays:Overlaid
  base_params:
    inner_code_ref: qlab.strategies.retune:Retune
    inner_params:
      inner_code_ref: qlab.strategies.regime_gate:RegimeGate
      base_params:
        inner_code_ref: qlab.strategies.live.trend:LiveTrendTSMOMEnsemble
        inner_params:
          coins: null
          top_k_by_market_cap: 25
          exclude_tags:
          - stablecoin
          top_k_requires_history: true
          capital_usd: 3000.0
          lookbacks:
          - 30
          - 60
          - 90
          - 120
          vol_window: 30
          vol_target_daily: 0.02
          leverage_cap: 3.0
          risk_scale: 0.2
          book_vol_target_ann: 0.14
          book_vol_window_days: 60
          book_vol_min_days: 20
          book_vol_scale_min: 0.25
          book_vol_scale_max: 2.0
          book_vol_prior_ann: 0.3
          min_history_days: 151
      grid:
        gate:
          always:
            trade_in:
            - bull
            - flat
            - bear
          only_bull_bear:
            trade_in:
            - bull
            - bear
      refit_every: M
      window: expanding
      objective: sharpe_net
      score_costs:
        taker_fee_bps: 3.5
        slippage_bps: 0.9
    overlays: []
    costs:
      taker_fee_bps: 3.5
      slippage_bps: 0.9
  grid:
    overlay:
      market_gate:skip-bull:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - flat
            - bear
      market_gate:skip-flat:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - bear
      market_gate:skip-bear:
        overlays:
        - name: market_gate
          params:
            detector: direction_terciles
            trade_in:
            - bull
            - flat
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 3.5
    slippage_bps: 0.9
data:
  source: binance
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2019-09-08'
  end: '2026-10-26'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 3000
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of trend-binance-cap-gated: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the base trend-binance-cap against its regime-gated experiment);
  the data is Binance''s history, a proxy for binance''s market, with the original''s costs and minimum
  leg.'
- 'Overlay variant of trend-binance-cap-gated-causal (qlab.overlay_variants, docs/OVERLAYS.md): the same
  strategy with market_gate applied to its target weights; the strategy''s own numbers are untouched.
  The numbers of the overlays are chosen by code every month from the past only.'
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-07-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  base can first trade on 2020-04-01; the longest warm-up of the overlay family (market_gate) is 30 days,
  so the overlay can first act on 2020-05-01; a candidate is eligible only after one whole month re-tuning
  period, so the first re-tuning after 2020-05-01 is 2020-06-01 and the first choice is made at the one
  after it, 2020-07-01. The family is declared whole in docs/OVERLAYS.md before any run: 3 candidates,
  none chosen by looking at the data it is judged on. What this does not prove: the family itself (which
  overlays and which settings are offered) was written by people who had seen the market.'
