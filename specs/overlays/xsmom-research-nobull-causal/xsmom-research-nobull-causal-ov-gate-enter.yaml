differs_from_source:
- 'Causal twin of xsmom-research-nobull: the numbers it trades are chosen by code, every month, from returns
  realised before the choice (the base xsmom-honest-20legs against its regime-gated experiment); the data
  is Binance''s history, a proxy for hyperliquid''s market, with the original''s costs and minimum leg.'
- 'Overlay variant of xsmom-research-nobull-causal (qlab.overlay_variants, docs/OVERLAYS.md): the same
  strategy with market_gate, gradual_entry applied to its target weights; the strategy''s own numbers
  are untouched. The numbers of the overlays are chosen by code every month from the past only.'
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-03-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  base can first trade on 2020-01-01; the longest warm-up of the overlay family (market_gate, gradual_entry)
  is 30 days, so the overlay can first act on 2020-01-31; a candidate is eligible only after one whole
  month re-tuning period, so the first re-tuning after 2020-01-31 is 2020-02-01 and the first choice is
  made at the one after it, 2020-03-01. The family is declared whole in docs/OVERLAYS.md before any run:
  24 candidates, none chosen by looking at the data it is judged on. What this does not prove: the family
  itself (which overlays and which settings are offered) was written by people who had seen the market.'
