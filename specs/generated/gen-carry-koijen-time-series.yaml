# mechanism: classic-carry
idea_id: gen-carry-koijen-time-series
title: 'Перенос по ставке финансирования, каждая монета по своему знаку: покупать, если средняя ставка за год отрицательна, продавать, если положительна, пересмотр раз в месяц'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: funding
    window_days: 360
  portfolio:
    block: time_series_sign
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 30
  min_history_days: 360
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-11-04'
costs:
  taker_fee_bps: 5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- The paper does not test cryptocurrencies; this spec carries its result over to Binance USDT perpetuals.
- The paper's carry is computed from futures prices and interest rates; here it is minus the average funding rate, an assumption.
- The paper's main portfolio weights assets by carry rank; this spec uses the paper's time-series variant (buy if carry is positive, sell if negative), which the paper gives as a separate check.
- The paper's pnl is price change plus carry as here, but the stand does not separate the mechanical funding payment from price prediction.
- The paper's numbers come from the NBER working paper; the journal version may differ.
choice:
  nothing_to_choose: 'the catalogue gives exactly one value for each number this spec uses (window 360, rebalance 30 days), and night/own_numbers.yaml declares nothing for the remaining blocks, which take no numbers'
params_fixed_at: '2024-06-16'
params_fixed_evidence: 'named by code: the start of the last third of the window'
sources:
  universe: 'docs/MECHANISMS.md, mechanism classic-carry, blocks: universe: all (Koijen et al. 2018)'
  signal: 'docs/MECHANISMS.md, mechanism classic-carry, blocks: signal: funding'
  signal.window_days: 'docs/MECHANISMS.md, mechanism classic-carry, row signal.window_days: 360 (carry 1-12, 12 months of 30 days; Koijen, Moskowitz, Pedersen, Vrugt 2018)'
  portfolio: 'docs/MECHANISMS.md, mechanism classic-carry, blocks: portfolio: time_series_sign (Koijen, Moskowitz, Pedersen, Vrugt 2018)'
  sizing: 'docs/MECHANISMS.md, mechanism classic-carry, blocks: sizing: equal (Koijen, Moskowitz, Pedersen, Vrugt 2018)'
  sizing.gross: 'docs/MECHANISMS.md, framework value: gross 1 = the whole capital, no leverage'
  rebalance_days: 'docs/MECHANISMS.md, mechanism classic-carry, row rebalance_days: 30 (monthly; Koijen, Moskowitz, Pedersen, Vrugt 2018)'
  min_history_days: 'derived: 360; the signal window_days of mechanism classic-carry, row signal.window_days: 360'
  costs.taker_fee_bps: 'night/costs.yaml, venue binance, taker_fee_bps'
