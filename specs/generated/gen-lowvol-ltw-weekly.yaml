# mechanism: crypto-low-vol
idea_id: gen-lowvol-ltw-weekly
title: 'Спокойные монеты против дёрганых на Binance: пятая часть самых ровных против пятой части самых резких, пересмотр раз в неделю'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: low_vol
    window_days: 7
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-10-27'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- The paper weights coins by market capitalization; this spec uses equal weights.
- The paper's prices are composite across 200+ venues and its sample is 1,707 coins, not Binance USDT perpetuals.
- The paper keeps only coins with at least 30 daily observations as a whole-sample filter, not as an admission rule on each date; the block applies it on each date.
- The paper found no significant effect (t = -1.237), so this run reproduces a negative result.
params_fixed_at: '2025-09-07'
params_fixed_evidence: Liu, Tsyvinski, Wu 2019 (sample 2014-2018, working paper of 2019-04-15) give the window, groups and rebalance; Borri, Liu, Tsyvinski, Wu 2026 (CoinGecko data to 2025-09-06) give min_history_days; the day after the latest sample end among them is 2025-09-07.
sources:
  universe: 'docs/MECHANISMS.md, mechanism crypto-low-vol, blocks: universe: all (Liu, Tsyvinski, Wu 2019)'
  signal: 'docs/MECHANISMS.md, mechanism crypto-low-vol, blocks: signal: low_vol'
  signal.window_days: 'docs/MECHANISMS.md, mechanism crypto-low-vol, row signal.window_days: 7 (RETVOL, daily-return spread inside the formation week; Liu, Tsyvinski, Wu 2019)'
  portfolio: 'docs/MECHANISMS.md, mechanism crypto-low-vol, blocks: portfolio: long_short_quantile'
  portfolio.quantiles: 'docs/MECHANISMS.md, mechanism crypto-low-vol, row portfolio.quantiles: 5 (weekly quintiles by spread; Liu, Tsyvinski, Wu 2019)'
  sizing: 'docs/MECHANISMS.md, mechanism crypto-low-vol, blocks: sizing: equal (Liu, Tsyvinski, Wu 2019)'
  sizing.gross: 'docs/MECHANISMS.md, framework value: gross 1 = the whole capital, no leverage'
  rebalance_days: 'docs/MECHANISMS.md, mechanism crypto-low-vol, row rebalance_days: 7 (weekly sorting; Liu, Tsyvinski, Wu 2019)'
  min_history_days: 'docs/MECHANISMS.md, mechanism crypto-low-vol, row min_history_days: 30 (Borri, Liu, Tsyvinski, Wu 2026)'
  costs.taker_fee_bps: 'funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»'
