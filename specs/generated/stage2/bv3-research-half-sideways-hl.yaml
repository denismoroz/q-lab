plain_summary: 'Держим четыре монеты боевой книги (BTC, ETH, SOL, AVAX) на 257 долларов, по 64.25 на монету.
  Если монета упала и за две недели, и за четыре, включаем страховку на всю сумму: продаём бессрочный
  контракт (ставку на цену монеты без даты окончания) той же монеты, и падение цены гасится. Если эти
  два срока расходятся, то есть цена ходит туда-сюда без общего хода, страхуем только половину. Как только
  сама монета выросла за последние 12 или 24 часа, страховку снимаем сразу. Должно зарабатывать тем, что
  в боковике частые включения и снятия стоят вдвое меньше, а на падении защита та же; риск — начало обвала,
  пока сроки ещё расходятся, половина монеты остаётся без защиты.'
plain_title: 'Страховка по трём срокам самой монеты: сколько страховать и когда снимать'
differs_from_source:
- 'One check of bv3-research-half-sideways: the numbers it trades are chosen by code, once, at the cut
  of the window at its last third, from returns realised on the first 2/3, and held on the last third
  (the lists declared in night/own_numbers.yaml, cards/bv2-fast-release-by-own-trend.yaml, funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md);
  the data is Binance''s history, a proxy for binance''s market, judged for Binance itself: Binance''s
  costs and minimum leg and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- 'The twin trades only 8 named columns (AVAX, AVAX-SPOT, BTC, BTC-SPOT, ETH, ETH-SPOT, SOL, SOL-SPOT),
  the data.instruments of bv3-research-half-sideways, not the whole market: the list was knowable only
  from 2021-09-11 (night/knowable_coins.yaml: top 10 of the venue''s perpetuals by the mean daily traded
  value of the previous 30 days, binance candles in data/raw), so the twin is judged only from 2021-09-11
  (judged_from = instruments_chosen_at); the days before are warm-up for the choice.'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv3-research-half-sideways) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'Knowable-coins check on hyperliquid''s own listing and volumes: Монета AVAX за всю историю данных не
  была в первой десятке по обороту на Hyperliquid: список считается выбранным вручную и оценивается со
  дня, когда его записали.'
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
