# Stage 2 of gen-xsmom-liu-equal-weekly (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-xsmom-liu-equal-weekly-hl
title: 'Недельное продолжение движения монет на Binance: пятая часть лучших против пятой части худших,
  равные доли, срок оценки 1–4 недели: числа выбирает код один раз, на первых 2/3 данных, история Binance
  с 2019 (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.blocks:Composed
  base_params:
    universe:
      rule: all
    signal:
      block: momentum
      lookback_days: 7
    portfolio:
      block: long_short_quantile
      quantiles: 5
    sizing:
      block: equal
      gross: 1.0
    rebalance_days: 7
    min_history_days: 30
  grid:
    signal.lookback_days:
      lookback_days=7:
        signal.lookback_days: 7
      lookback_days=14:
        signal.lookback_days: 14
      lookback_days=21:
        signal.lookback_days: 21
      lookback_days=28:
        signal.lookback_days: 28
  refit_every: once
  choose_at: split
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5.0
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-11-03'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- The paper weights coins by market capitalization (value-weighted); this spec uses equal shares.
- The paper's prices are composite across many venues (more than 200 exchanges), not Binance USDT perpetuals.
- The paper keeps only coins with a capitalization of at least one million dollars; the blocks have no
  capitalization filter.
- The paper's 30-day filter is a whole-sample filter in the review work, not an admission rule on each
  date; the block applies it on each date.
- The paper has no costs and no funding; the stand charges both.
- 'One check of gen-xsmom-liu-equal-weekly: the numbers it trades are chosen by code, once, at the cut
  of the window at its last third, from returns realised on the first 2/3, and held on the last third
  (the lists declared in docs/MECHANISMS.md, mechanism crypto-xs-momentum, row signal.lookback_days: 7,
  14, 21, 28 (Liu, Tsyvinski, Wu 2019)); the data is Binance''s history, a proxy for binance''s market,
  judged for Binance itself: Binance''s costs and minimum leg and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml, its minimum leg is Binance''s (venues/binance.yaml, per contract
  where Binance states it), and the facts about execution (venue_supported, atomic_execution) are Binance''s:
  a run that passes every rule routes needs-infrastructure because the lab has no Binance order adapter.
  Text above that speaks of the original''s or Hyperliquid''s costs and minimum leg describes the spec
  as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-xsmom-liu-equal-weekly) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2024-06-15'
params_fixed_evidence: 'Inherited from stage 1 (gen-xsmom-liu-equal-weekly): The numbers are chosen once
  by code (qlab.strategies.retune, refit_every: once, choose_at: split; docs/RETUNE.md), at the stand''s
  cut: the first day of the last third of the judged window (rules 2026-11-04.1; owner 2026-11-04: «все
  стратегии должны проходить проверку вперед по 2/3 и 1/3 правилу»), by the after-cost Sharpe each value
  realised on the strategy''s own money before that day, and held to the end. The stand puts the day in
  for the window it runs on, so this date is the cut of the spec''s own window (2019-09-08..2026-11-03):
  2024-06-15. The data starts 2019-09-08; the longest warm-up read from the parameters is 30 days (min_history_days
  = 30), so the book can first trade on 2019-10-08. The grid is the idea''s declared lists (signal.lookback_days),
  4 candidates. What this does not prove: the lists were declared with the idea before its check ran;
  what was seen of the history when they were declared is not recorded, so the choice is only as honest
  as the lists are.'
