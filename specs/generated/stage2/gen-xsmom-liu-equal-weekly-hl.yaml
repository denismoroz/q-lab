    docs/FRAB_BINANCE_SPOT.md line 113: Binance USDⓈ-M perpetual taker, a regular user, 0.0500% (5 bps),
    https://www.binance.com/en/support/articles/360033544231 (read 2026-10-25; the live table https://www.binance.com/en/fee/futureFee
