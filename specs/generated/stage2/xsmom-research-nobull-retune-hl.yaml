differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (xsmom-research-nobull-retune) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-03-01'
params_fixed_evidence: 'Inherited from stage 1 (xsmom-research-nobull-retune): The wrapper''s first causal
  choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08 with BTC alone; a long/short
  book needs two scored contracts, and the second, ETH, is listed on 2019-11-27 (docs/FRAB_LIVE.md: «ETH
  с 27 ноября 2019»); its 60-day longest lookback is complete on 2020-01-26, the first Thursday rebalance
  after it is 2020-01-30 (the BTC detector is known from November 2019); a candidate is eligible after
  one whole monthly re-tuning period, so the first choice is made at the 2020-03-01 refit. Warm-up arithmetic,
  not a result. If other contracts were scored earlier the true first choice is earlier and this date
  only drops forward days; the book reaches its full 20 legs only once Binance lists enough contracts,
  and trades a thinner, smaller book until then (the live engine''s effective_k, docs/XSMOM_T21.md). The
  grid was declared by the researcher on 2026-10-26 from the Hyperliquid drawdown evidence before 2026-06-15
  (data/research/xsmom-2026-10-26.md): Binance 2020-03 .. 2024-12 was not seen by it; 2025-01 .. 2026-06
  is the period it was designed on (other venue, same market), so that part of the forward test is in-sample
  for the grid.

  '
