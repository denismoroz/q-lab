differs_from_source:
- 'One check of bv2-fast-release-by-own-trend: the numbers it trades are chosen by code, every month,
  from returns realised before the choice (the lists declared in cards/bv2-fast-release-by-own-trend.yaml);
  the data is Binance''s history, a proxy for binance''s market, judged for Binance itself: Binance''s
  costs and minimum leg and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- 'The twin trades only 4 named columns (BTC, BTC-SPOT, ETH, ETH-SPOT), the data.instruments of bv2-fast-release-by-own-trend,
  not the whole market: the list was chosen by 2025-06-01 and would know which coins survived if applied
  to the history before it (survivorship), so the twin is judged only from 2025-06-01 (judged_from = instruments_chosen_at);
  the days from 2019-09-08 are warm-up for the choice (docs/RETUNE.md, docs/FIT_VS_FORWARD.md).'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-fast-release-by-own-trend) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- Judged from 2025-06-01, the day the instrument list was known (instruments_chosen_at); the days before
  it are warm-up.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
noise_universe: panel
measure_hedge_timing: false
required_instruments:
- BTC-SPOT
- ETH-SPOT
- BTC
- ETH
params_fixed_at: '2019-11-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-fast-release-by-own-trend): The wrapper''s first causal
  choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up read
  from the parameters is 1 days (fast_window_hours = 24), so the book can first trade on 2019-09-09; a
  candidate is eligible only after one whole month re-tuning period, so the first re-tuning after 2019-09-09
  is 2019-10-01 and the first choice is made at the one after it, 2019-11-01. This is warm-up arithmetic
  read generically from the parameters (every day, hour, window and lookback number, whatever the strategy
  does with it), not a result. If the strategy needs more than the parameters show (enough instruments
  listed on Binance, a signal that waits for history), the true first choice is later and the days before
  it are judged as flat days. The grid is the idea''s declared lists (fast_window_hours, fast_entry),
  6 candidates. What this does not prove: the lists were declared with the idea before its check ran;
  what was seen of the history when they were declared is not recorded, so the choice is only as honest
  as the lists are (the spec''s own date for its numbers: 2026-10-30). The instrument list is not point-in-time
  before 2025-06-01. The twin trades only the 4 columns BTC, BTC-SPOT, ETH, ETH-SPOT (data.instruments
  of bv2-fast-release-by-own-trend) (hourly candles of every Binance perpetual take hours; these take
  about 2 minutes). A list chosen by hand and applied to history from 2019-09-08 knows which coins existed
  and survived, which the days before it was chosen did not; a coin Binance listed later has no candles
  before its listing day and enters then. The earliest documented day the list existed is 2025-06-01 (data.honest_from
  of bv2-fast-release-by-own-trend), so the twin is judged only from that day (`judged_from` = `instruments_chosen_at`
  = 2025-06-01): the history before it is warm-up for the code''s monthly choice (more data to choose
  with), not judged, and from that day the stand counts the list as point-in-time (docs/FIT_VS_FORWARD.md).'
judged_from: '2025-06-01'
