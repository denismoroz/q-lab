differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (trend-live-full-universe) on binance''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are binance's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'The idea was born on Hyperliquid (trend-live-full-universe''s own data is Hyperliquid''s); this is
  its binance verdict, judged independently (docs/VENUE_SPLIT.md; owner, 2026-11-05: «почему вот эта стратегия
  не тестировалась на бинансе?»). The data starts with binance''s archive on 2019-09-08, not on Hyperliquid''s
  first day; numbers inside the parameters (a wrapper''s scoring costs, its grid) are stage 1''s, unchanged,
  and a wrapper that chooses by code chooses again on this data. The facts about execution are this venue''s:
  the lab has no order adapter here, so a pass is needs-infrastructure.'
- The minimum leg is binance's own, $5 (venues/binance.yaml), not stage 1's $10.
