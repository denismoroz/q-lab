differs_from_source:
- Grobys et al. pick the 30 largest coins by market capitalization at the end of the previous December;
  the block picks the 30 coins with the highest average dollar turnover.
- Ficura defines the liquid group by thresholds (capitalization of at least 50 million dollars and weekly
  turnover of at least 5 million), not by a coin count.
- The papers sort at the end of a calendar week, and Grobys et al. skip the last day between formation
  and holding; the block measures the price change up to the current candle inclusive.
- The result of Grobys et al. on the full sample is not significant and rests on one coin in one week
  of December 2020.
- The papers use composite prices across venues, not Binance USDT perpetuals.
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-liquid-momentum-grobys) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $10.
- 'Judged from 2025-07-01: the first day hyperliquid has the 5 coins the portfolio rule needs at once
  (snapshot 28dfb67cb8ccbb062b7d64b0b02a24a790494f951c83a39a2f823444d3fac90b); the days before are warm-up
  with no book.'
