unexpressed_mechanisms: []
plain_summary: 'Держим BTC и ETH на половину денег стратегии. Когда монета падает две и четыре недели
  подряд (её доход за 14 и за 30 дней не выше нуля), включаем страховку: продаём на бирже бессрочный контракт
  (ставку на цену монеты без даты окончания) на ту же сумму, и падение цены гасится. Новое здесь одно:
  страховку снимаем, как только сама монета выросла за последние 12 или 24 часа, и не ждём, пока развернётся
  медленное правило; когда короткий рост кончился, а медленное правило всё ещё говорит «вниз», страховка
  возвращается в тот же час. Должно зарабатывать на быстрых отскоках внутри падения, которые нынешняя
  книга проводит под страховкой. Риск: отскок оказался ложным и цена ушла ниже без страховки, а частые
  включения и снятия стоят комиссий. Деньги стратегии 128.5 доллара, по 64.25 на монету, как у книги Bv2
  на прод.'
plain_title: Страховка, которую снимают в первые часы отскока самой монеты
differs_from_source:
- 'One check of bv3-research-fast-release: the numbers it trades are chosen by code, once, at the cut
  of the window at its last third, from returns realised on the first 2/3, and held on the last third
  (the lists declared in cards/bv2-fast-release-by-own-trend.yaml, funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md);
  the data is Binance''s history, a proxy for binance''s market, judged for Binance itself: Binance''s
  costs and minimum leg and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- 'The twin trades only 4 named columns (BTC, BTC-SPOT, ETH, ETH-SPOT), the data.instruments of bv3-research-fast-release,
  not the whole market: the list was knowable only from 2019-12-27 (night/knowable_coins.yaml: top 10
  of the venue''s perpetuals by the mean daily traded value of the previous 30 days, binance candles in
  data/raw), so the twin is judged only from 2019-12-27 (judged_from = instruments_chosen_at); the days
  before are warm-up for the choice.'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv3-research-fast-release) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'Knowable-coins check on hyperliquid''s own listing and volumes: Монеты BTC, ETH были в первой десятке
  по обороту на Hyperliquid (за предыдущие 30 дней) на каждый день с 2025-01-31 — история честная, оценка
  идёт с начала данных.'
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
