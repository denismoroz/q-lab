# Stage 2 of bv3-research-fast-release (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: bv3-research-fast-release-hl
title: 'Bv3: страховку снимают по росту самой монеты за 12 или 24 часа, без или с 12-часовым ожиданием
  (BTC и ETH, Binance с 2019): числа выбирает код один раз, на первых 2/3 данных, история Binance с 2019
  (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
