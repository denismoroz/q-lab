params_fixed_at: '2024-07-19'
params_fixed_evidence: 'Inherited from stage 1 (bv3-research-fast-release): The numbers are chosen once
  by code (qlab.strategies.retune, refit_every: once, choose_at: split; docs/RETUNE.md), at the stand''s
  cut: the first day of the last third of the judged window (rules 2026-11-04.1; owner 2026-11-04: «все
  стратегии должны проходить проверку вперед по 2/3 и 1/3 правилу»), by the after-cost Sharpe each value
  realised on the strategy''s own money before that day, and held to the end. The stand puts the day in
  for the window it runs on, so this date is the cut of the spec''s own window (2019-09-08..2026-10-30):
  2024-07-19. The data starts 2019-09-08; the longest warm-up read from the parameters is 1 days (fast_window_hours
  = 24), so the book can first trade on 2019-09-09. The grid is the idea''s declared lists (fast_window_hours,
  sticky_exit_hours), 4 candidates. What this does not prove: the lists were declared with the idea before
  its check ran; what was seen of the history when they were declared is not recorded, so the choice is
  only as honest as the lists are. The twin trades only the 4 columns BTC, BTC-SPOT, ETH, ETH-SPOT (data.instruments
  of bv3-research-fast-release) (hourly candles of every Binance perpetual take hours; these take about
  2 minutes). Every coin of the list was knowable as a pick on the days it is judged: listed for 30 days
  and among the venue''s top 10 perpetuals by trailing traded value, looking only at earlier days (night/knowable_coins.yaml:
  top 10 of the venue''s perpetuals by the mean daily traded value of the previous 30 days, binance candles
  in data/raw); Монета ETH появилась на Binance только 2019-11-27; с 2019-12-27 все монеты (BTC, ETH)
  были в первой десятке по обороту (за предыдущие 30 дней) — история честная с этого дня, раньше — разгон.
  The list is knowable only from 2019-12-27, so the twin is judged from that day (`judged_from` = `instruments_chosen_at`
  = 2019-12-27): the history before it is warm-up for the code''s monthly choice, not judged..'
