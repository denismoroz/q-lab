plain_summary: 'Владелец не просил держать Bv3 на двух монетах: боевая книга Bv2 держит четыре (BTC, ETH,
  SOL, AVAX). Исследователь сам сузил список до двух, опираясь на своё прежнее предположение, что SOL
  и AVAX «дёргают» страховку, — но это предположение никто не проверял. Здесь монеты выбирает код: каждый
  день он берёт первые K монет по обороту за последние 30 дней на бирже Binance (оборот — сколько денег
  в монете прошло через торги), только из тех, у кого есть и обычный рынок, и бессрочный контракт (ставка
  на цену монеты без даты окончания). Число K — одно из трёх: 2, 4 или 6; каждый месяц код сам выбирает
  лучшее по прошлому. Деньги стратегии те же, что у боевой Bv2, — 257 долларов, поровну между теми монетами,
  которые держим. Монета, которая вышла из первых K, продаётся вместе со страховкой при следующей перестановке.
  Страховка включается, когда монета падает две и четыре недели подряд, а снимается, как только сама монета
  выросла за последние 12 или 24 часа. Выберет код малое K — значит, догадка про SOL и AVAX была верна;
  выберет большое — значит, нет. Риск: у монет из хвоста списка (новых и мелких) слабее рынок, шире разрыв
  цены и дороже вход и выход, а частые перестановки стоят комиссий.'
plain_title: Страховка, которую снимают на отскоке, и монеты, которые выбирает код, а не человек
differs_from_source:
- 'One check of bv3-research-topk-coins: the numbers it trades are chosen by code, once, at the cut of
  the window at its last third, from returns realised on the first 2/3, and held on the last third (the
  lists declared in docs/IDEA_STANDARD.md, cards/bv2-fast-release-by-own-trend.yaml); the data is Binance''s
  history, a proxy for binance''s market, judged for Binance itself: Binance''s costs and minimum leg
  and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- 'The twin trades the 140 columns of bv3-research-topk-coins''s candidates for a rule of code that chooses
  the coins each day from earlier days only (`params.universe`), not a hand-picked list: no survivorship
  guard applies and it is judged from the start of the data (2019-09-08).'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv3-research-topk-coins) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
