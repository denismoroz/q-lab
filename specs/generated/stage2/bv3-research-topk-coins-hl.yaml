params_fixed_evidence: 'Inherited from stage 1 (bv3-research-topk-coins): The numbers are chosen once
  by code (qlab.strategies.retune, refit_every: once, choose_at: split; docs/RETUNE.md), at the stand''s
  cut: the first day of the last third of the judged window (rules 2026-11-04.1; owner 2026-11-04: «все
  стратегии должны проходить проверку вперед по 2/3 и 1/3 правилу»), by the after-cost Sharpe each value
  realised on the strategy''s own money before that day, and held to the end. The stand puts the day in
  for the window it runs on, so this date is the cut of the spec''s own window (2019-09-08..2026-10-30):
  2024-06-12. The data starts 2019-09-08; the longest warm-up read from the parameters is 30 days (universe.window_days
  = 30), so the book can first trade on 2019-10-08. The grid is the idea''s declared lists (universe.n,
  fast_window_hours), 6 candidates. What this does not prove: the lists were declared with the idea before
  its check ran; what was seen of the history when they were declared is not recorded, so the choice is
  only as honest as the lists are. The twin trades only the 140 columns 1000BONK, 1000BONK-SPOT, 1000LUNC,
  1000LUNC-SPOT, 1000PEPE, 1000PEPE-SPOT, 1000SHIB, 1000SHIB-SPOT, ADA, ADA-SPOT, APE, APE-SPOT, APT,
  APT-SPOT, ARB, ARB-SPOT, ARPA, ARPA-SPOT, ATOM, ATOM-SPOT, AVAX, AVAX-SPOT, AXS, AXS-SPOT, BAND, BAND-SPOT,
  BANK, BANK-SPOT, BCH, BCH-SPOT, BNB, BNB-SPOT, BTC, BTC-SPOT, CFX, CFX-SPOT, CHZ, CHZ-SPOT, CYBER, CYBER-SPOT,
  DOGE, DOGE-SPOT, DOGS, DOGS-SPOT, DOT, DOT-SPOT, ENA, ENA-SPOT, ETC, ETC-SPOT, ETH, ETH-SPOT, FIL, FIL-SPOT,
  FTM, FTM-SPOT, GALA, GALA-SPOT, GAS, GAS-SPOT, GMT, GMT-SPOT, HYPE, HYPE-SPOT, LINK, LINK-SPOT, LPT,
  LPT-SPOT, LRC, LRC-SPOT, LTC, LTC-SPOT, LUNA, LUNA-SPOT, MANA, MANA-SPOT, MASK, MASK-SPOT, MATIC, MATIC-SPOT,
  NEAR, NEAR-SPOT, NEIRO, NEIRO-SPOT, NOT, NOT-SPOT, OP, OP-SPOT, ORDI, ORDI-SPOT, PEOPLE, PEOPLE-SPOT,
  RARE, RARE-SPOT, RUNE, RUNE-SPOT, SAND, SAND-SPOT, SOL, SOL-SPOT, SUI, SUI-SPOT, SUSHI, SUSHI-SPOT,
  SXP, SXP-SPOT, TAO, TAO-SPOT, TON, TON-SPOT, TRB, TRB-SPOT, TRUMP, TRUMP-SPOT, TRX, TRX-SPOT, UNI, UNI-SPOT,
  VET, VET-SPOT, WIF, WIF-SPOT, WLD, WLD-SPOT, WLFI, WLFI-SPOT, XLM, XLM-SPOT, XPL, XPL-SPOT, XRP, XRP-SPOT,
  XTZ, XTZ-SPOT, YFI, YFI-SPOT, ZEC, ZEC-SPOT, ZIL, ZIL-SPOT (data.instruments of bv3-research-topk-coins)
  (hourly candles of every Binance perpetual take hours; these take about 58 minutes). They are the data
  of a rule of code that chooses the coins each day (`params.universe`: the first K by trailing traded
  value, reading earlier days only), not a list somebody picked, so no coin of the history is known to
  have survived and the idea is judged from the start of the data (2019-09-08) (docs/COIN_SCOPE.md)..'
