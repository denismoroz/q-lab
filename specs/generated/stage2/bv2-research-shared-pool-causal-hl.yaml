    variant:
      base: {}
      experiment:
        shared_margin: true
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5.25
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1h
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-10-26'
  instruments:
  - AVAX
  - BTC
  - ETH
  - SOL
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of bv2-research-shared-pool: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the base bv2-binance against its experiment (shared_margin)); the
  data is Binance''s history, a proxy for binance''s market, with the original''s costs and minimum leg.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-research-shared-pool-causal) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- '4 instrument(s) of stage 1 are not listed on hyperliquid and are not traded: AVAX-SPOT, BTC-SPOT, ETH-SPOT,
  SOL-SPOT.'
noise_universe: held
measure_hedge_timing: true
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2019-11-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-research-shared-pool-causal): The wrapper''s first
  causal choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up
  read from the parameters is 1 days (carry_exit_hours = 24), so the book can first trade on 2019-09-09;
  a candidate is eligible only after one whole month re-tuning period, so the first re-tuning after 2019-09-09
  is 2019-10-01 and the first choice is made at the one after it, 2019-11-01. This is warm-up arithmetic
  read generically from the parameters (every day, hour, window and lookback number, whatever the strategy
  does with it), not a result. If the strategy needs more than the parameters show (enough instruments
  listed on Binance, a signal that waits for history), the true first choice is later and the days before
  it are judged as flat days. The grid is two candidates declared whole: the numbers of bv2-binance unchanged,
  and the numbers of bv2-research-shared-pool (shared_margin). What this does not prove: the experiment''s
  own data was already Binance''s: 2023-04-28 .. 2025-06-01 may have been seen when its numbers were chosen,
  so that stretch is in-sample for the grid and the twin adds only the days before 2023-04-28 (the spec''s
  own date for its numbers: 2025-06-01).'
