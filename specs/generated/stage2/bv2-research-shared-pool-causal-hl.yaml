# Stage 2 of bv2-research-shared-pool-causal (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: bv2-research-shared-pool-causal-hl
title: 'Bv2 как на проде (запас 1.0), но залог один на все четыре монеты, Binance 2023–2026 (эксперимент
  исследователя 26.10, исправление 1): числа выбирает код раз в месяц только по прошлому, история Binance
  с 2019 (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.live.bv2:LiveBv2
  base_params:
    coins:
    - BTC
    - ETH
    - SOL
    - AVAX
    capital_usd: 257.0
