# Stage 2 of trend-research-gate-hl-causal (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: trend-research-gate-hl-causal-hl
title: 'Trend по капитализации на Hyperliquid, выключен в боковике (эксперимент исследователя 1): числа
  выбирает код раз в месяц только по прошлому, история Binance с 2019 (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.regime_gate:RegimeGate
  base_params:
    inner_code_ref: qlab.strategies.live.trend:LiveTrendTSMOMEnsemble
    inner_params:
      coins: null
      top_k_by_market_cap: 25
      exclude_tags:
      - stablecoin
      top_k_requires_history: true
      capital_usd: 3000.0
      lookbacks:
      - 30
      - 60
      - 90
      - 120
      vol_window: 30
      vol_target_daily: 0.02
      leverage_cap: 3.0
      risk_scale: 0.2
      book_vol_target_ann: 0.14
      book_vol_window_days: 60
      book_vol_min_days: 20
      book_vol_scale_min: 0.25
      book_vol_scale_max: 2.0
      book_vol_prior_ann: 0.3
      min_history_days: 151
  grid:
    gate:
      always:
        trade_in:
        - bull
        - flat
        - bear
      only_bull_bear:
        trade_in:
        - bull
        - bear
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 3.5
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-10-26'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of trend-research-gate-hl: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the base trend-live-top25-cap against its regime-gated experiment);
  the data is Binance''s history, a proxy for hyperliquid''s market, with the original''s costs and minimum
  leg.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (trend-research-gate-hl-causal) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-04-01'
params_fixed_evidence: 'Inherited from stage 1 (trend-research-gate-hl-causal): The wrapper''s first causal
  choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up read
  from the parameters is 151 days (inner_params.min_history_days = 151), so the book can first trade on
  2020-02-06; a candidate is eligible only after one whole month re-tuning period, so the first re-tuning
  after 2020-02-06 is 2020-03-01 and the first choice is made at the one after it, 2020-04-01. This is
  warm-up arithmetic read generically from the parameters (every day, hour, window and lookback number,
  whatever the strategy does with it), not a result. If the strategy needs more than the parameters show
  (enough instruments listed on Binance, a signal that waits for history), the true first choice is later
  and the days before it are judged as flat days. The grid is two candidates declared whole: the book
  of trend-live-top25-cap traded in every regime (always), and held only in bull, bear (trend-research-gate-hl).
  What this does not prove: the experiment''s numbers were chosen by hand, looking at hyperliquid data
  up to 2026-10-03 (its window starts 2025-01-01): the same market on Binance from 2025-01-01 to 2026-10-03
  is in-sample for the grid (it may have been seen), while the days before 2025-01-01 and after 2026-10-03
  were not (the spec''s own date for its numbers: 2026-10-03).'
