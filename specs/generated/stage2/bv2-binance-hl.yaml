# Stage 2 of bv2-binance (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: bv2-binance-hl
title: 'Bv2 (живой код frab, параметры прода) на Binance 2019–2026: спот и контракт BTC, ETH, SOL, AVAX,
  часы (второй этап: hyperliquid)'
code_ref: qlab.strategies.live.bv2:LiveBv2
params:
  coins:
  - BTC
  - ETH
  - SOL
  - AVAX
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage:
    BTC: 3.0
    ETH: 2.0
    SOL: 1.5
    AVAX: 1.5
  default_leverage: 1.0
  maint_margin_rate:
    BTC: 0.0125
    ETH: 0.02
    SOL: 0.025
    AVAX: 0.05
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper
data:
  source: hyperliquid
  interval: 1h
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-10-28'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - SOL
  - SOL-SPOT
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-binance) on hyperliquid''s own perpetual contracts listed at each bar; nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
noise_universe: held
measure_hedge_timing: true
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2025-06-01'
params_fit_from: '2023-06-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-binance): funding-rate-arbitrage/research/strategy_b_v2/REPORT.md,
  «Результаты»: «| | обучение 2023-06—2025-05 | проверка 2025-06—2026-05 | вперёд 2026-06—09 |» -- the
  parameters were fitted on 2023-06 … 2025-05 and the following year only checked against rules declared
  before («Дальше подкручивать по проверочному году нельзя»). The coin list BTC/ETH/SOL/AVAX comes from
  the same research («только монеты HL»). Committed later in frab commits f2a0e3f, bd470b0, 4b7fced, 58ed2c5
  (2026-09-13) with two changes not fitted on the check year: the margin model (execution realism, REPORT.md
  «Маржа по-честному», compared on the training years) and carry off (REPORT.md «Как читать честно», 5:
  it duplicates FRAB''s positions). Owner, 2026-10-04: «разделять backtest and forward test».

  '
