# Stage 2 of gen-funding-tail-rebound-memon (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-funding-tail-rebound-memon-hl
title: 'Отскок после необычной ставки финансирования: покупать монеты, у которых ставка сегодня среди
  самых низких 10% за свои же 180 суток, продавать в короткую — среди самых высоких 10%, пересмотр каждый
  день (второй этап: hyperliquid)'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: funding_tail
    history_window_days: 180
    tail_fraction: 0.1
  portfolio:
    block: time_series_sign
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 1
  min_history_days: 180
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-11-05'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- The paper tests only Bitcoin (BTCUSDT); this spec applies the rule to every Binance USDT perpetual coin,
  which the authors name as future work.
- The paper finds an effect only after extremely low funding (buying) and none after extremely high funding;
  this spec also sells short the coins in the high tail, a side with no evidence in the paper.
- The paper looks at each 8-hour funding payment and 24-hour returns from 15-minute prices; this spec
  works on daily candles, where one candle equals the 24-hour horizon.
- The paper measures average returns after events without costs, leverage or liquidations and does not
  claim a profitable strategy; the stand adds costs and judges the strategy.
- The paper's sample ends 2026-08-10, so part of this spec's history repeats the period on which the number
  was obtained.
- The paper requires at least 300 past values besides the 180-day history; the block requires only the
  full 180 days of daily funding.
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-funding-tail-rebound-memon) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $10.
- 'Judged from 2025-06-30: the first day hyperliquid has the 1 coins the portfolio rule needs at once
  (snapshot 00e480a48cc30f49933027a681800b6da6f3d521a2d69edc276a2291b6b42878); the days before are warm-up
  with no book.'
