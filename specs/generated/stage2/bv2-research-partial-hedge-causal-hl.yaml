execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of bv2-research-partial-hedge: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the declared lists of night/own_numbers.yaml); the data is Binance''s
  history, a proxy for binance''s market, with the original''s costs and minimum leg.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-research-partial-hedge-causal) on hyperliquid''s own perpetual contracts listed at each
  bar; nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
noise_universe: held
measure_hedge_timing: false
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2019-11-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-research-partial-hedge-causal): The wrapper''s first
  causal choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up
  read from the parameters is 1 days (carry_exit_hours = 24), so the book can first trade on 2019-09-09;
  a candidate is eligible only after one whole month re-tuning period, so the first re-tuning after 2019-09-09
  is 2019-10-01 and the first choice is made at the one after it, 2019-11-01. This is warm-up arithmetic
  read generically from the parameters (every day, hour, window and lookback number, whatever the strategy
  does with it), not a result. If the strategy needs more than the parameters show (enough instruments
  listed on Binance, a signal that waits for history), the true first choice is later and the days before
  it are judged as flat days. The grid is the whole declared list of each open parameter (partial_hedge_share)
  from night/own_numbers.yaml, 2 candidates. What this does not prove: the lists were declared in night/own_numbers.yaml
  (version 2026-10-26.2) before this twin ran; what was seen of the history when they were declared is
  not recorded, so the choice is only as honest as the lists are (the spec''s own date for its numbers:
  2025-06-01).'
