# Stage 2 of bv2-research-partial-hedge-causal (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: bv2-research-partial-hedge-causal-hl
title: 'Bv2: в боковике страховать половину, на падении целиком (выбор до отреза), Binance: числа выбирает
  код раз в месяц только по прошлому, история Binance с 2019 (второй этап: hyperliquid)'
