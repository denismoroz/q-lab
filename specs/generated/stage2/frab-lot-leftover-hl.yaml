params_fixed_at: '2019-12-01'
params_fixed_evidence: 'Inherited from stage 1 (frab-lot-leftover): The wrapper''s first causal choice
  (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up read from
  the parameters is 30 days (cap_min_hold_hours = 720), so the book can first trade on 2019-10-08; a candidate
  is eligible only after one whole month re-tuning period, so the first re-tuning after 2019-10-08 is
  2019-11-01 and the first choice is made at the one after it, 2019-12-01. This is warm-up arithmetic
  read generically from the parameters (every day, hour, window and lookback number, whatever the strategy
  does with it), not a result. If the strategy needs more than the parameters show (enough instruments
  listed on Binance, a signal that waits for history), the true first choice is later and the days before
  it are judged as flat days. The grid is the idea''s declared lists (leftover_lots, leftover_hedged),
  4 candidates. What this does not prove: the lists were declared with the idea before its check ran;
  what was seen of the history when they were declared is not recorded, so the choice is only as honest
  as the lists are (the spec''s own date for its numbers: 2026-11-02). The instrument list is not point-in-time
  before 2026-06-01. The twin trades only the 10 columns AVAX, AVAX-SPOT, BTC, BTC-SPOT, ETH, ETH-SPOT,
  HYPE, HYPE-SPOT, SOL, SOL-SPOT (data.instruments of frab-lot-leftover) (hourly candles of every Binance
  perpetual take hours; these take about 4 minutes). A list chosen by hand and applied to history from
  2019-09-08 knows which coins existed and survived, which the days before it was chosen did not; a coin
  Binance listed later has no candles before its listing day and enters then. The earliest documented
  day the list existed is 2026-06-01 (data.honest_from of frab-lot-leftover), so the twin is judged only
  from that day (`judged_from` = `instruments_chosen_at` = 2026-06-01): the history before it is warm-up
  for the code''s monthly choice (more data to choose with), not judged, and from that day the stand counts
  the list as point-in-time (docs/FIT_VS_FORWARD.md).'
judged_from: '2026-06-01'
