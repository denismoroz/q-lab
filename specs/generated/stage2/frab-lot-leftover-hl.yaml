    taker_fee_bps: 7.5
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1h
  include_spot: false
  spot_prices: own
  start: '2025-01-01'
  end: '2026-11-05'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - HYPE
  - HYPE-SPOT
