params:
  inner_code_ref: qlab.strategies.agent.lot_leftover:LotLeftover
  base_params:
    leftover_lots: 0
    leftover_hedged: 0
    entry_threshold_apr: 0.1
    phase2_exit_threshold: -0.1
    base_min_hold_hours: 24
    cap_min_hold_hours: 720
    safety_mult: 5
    signal_window_hours: 8
    concurrency_cap: 5
    budget_cap_usdc: 120
