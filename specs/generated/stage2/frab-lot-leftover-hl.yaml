  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
unexpressed_mechanisms:
- The lot table is today's szDecimals applied to the whole history, so a lot that changed over time is
  not modelled (the card accepts this).
- The covered leftover is a short contract of exactly the leftover's size; the live engine's slightly
  larger short (HYPE 0.21 against 0.20 bought) is not modelled.
- The leftover is re-read each hour, so the harness books a very small turnover cost on its drift that
  the live account does not pay.
differs_from_source:
- 'One check of frab-lot-leftover: the numbers it trades are chosen by code, every month, from returns
  realised before the choice (the lists declared in cards/frab-lot-leftover.yaml); the data is Binance''s
  history, a proxy for hyperliquid''s market, judged for Binance itself: Binance''s costs and minimum
  leg and Binance''s facts about execution (docs/VENUE_SPLIT.md).'
- '2 named instrument(s) are not listed on Binance and are not traded: PURR, PURR-SPOT.'
- 'The twin trades only 10 named columns (AVAX, AVAX-SPOT, BTC, BTC-SPOT, ETH, ETH-SPOT, HYPE, HYPE-SPOT,
  SOL, SOL-SPOT), the data.instruments of frab-lot-leftover, not the whole market: the list was chosen
  by 2026-06-01 and would know which coins survived if applied to the history before it (survivorship),
  so the twin is judged only from 2026-06-01 (judged_from = instruments_chosen_at); the days from 2019-09-08
  are warm-up for the choice (docs/RETUNE.md, docs/FIT_VS_FORWARD.md).'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (frab-lot-leftover) on hyperliquid''s own perpetual contracts listed at each bar; nothing was
  refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- Judged from 2026-06-01, the day the instrument list was known (instruments_chosen_at); the days before
  it are warm-up.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'HYPE-SPOT is the hyperliquid spot token resolved from the live listing, not one of the lab''s verified
  tokens (src/qlab/data/sources/hyperliquid.py fetch_spot_meta: the spot token named HYPE or UHYPE in
  the live spotMeta; kept only on bars where its price is within frab''s 3% of the perp (src/qlab/data/snapshot.py
  spot_is_another_asset)).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
noise_universe: panel
measure_hedge_timing: false
