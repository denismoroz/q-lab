# Stage 2 of frab-lot-leftover (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: frab-lot-leftover-hl
title: 'Стенд FRAB с остатком монеты после округления до лота биржи (Hyperliquid, с 2026-06-01): числа
  выбирает код один раз, на первых 2/3 данных, история Binance с 2019 (второй этап: hyperliquid)'
