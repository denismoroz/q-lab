params_fixed_at: '2026-05-23'
params_fixed_evidence: 'Inherited from stage 1 (frab-lot-leftover): The numbers are chosen once by code
  (qlab.strategies.retune, refit_every: once, choose_at: split; docs/RETUNE.md), at the stand''s cut:
  the first day of the last third of the judged window (rules 2026-11-04.1; owner 2026-11-04: «все стратегии
  должны проходить проверку вперед по 2/3 и 1/3 правилу»), by the after-cost Sharpe each value realised
  on the strategy''s own money before that day, and held to the end. The stand puts the day in for the
  window it runs on, so this date is the cut of the spec''s own window (2019-09-08..2026-11-02): 2026-05-23.
  The data starts 2019-09-08; the longest warm-up read from the parameters is 30 days (cap_min_hold_hours
  = 720), so the book can first trade on 2019-10-08. The grid is the idea''s declared lists (leftover_lots,
  leftover_hedged), 4 candidates. What this does not prove: the lists were declared with the idea before
  its check ran; what was seen of the history when they were declared is not recorded, so the choice is
  only as honest as the lists are (the spec''s own date for its numbers: 2026-11-02). The twin trades
  only the 10 columns AVAX, AVAX-SPOT, BTC, BTC-SPOT, ETH, ETH-SPOT, HYPE, HYPE-SPOT, SOL, SOL-SPOT (data.instruments
  of frab-lot-leftover) (hourly candles of every Binance perpetual take hours; these take about 4 minutes).
  Every coin of the list was knowable as a pick on the days it is judged: listed for 30 days and among
  the venue''s top 10 perpetuals by trailing traded value, looking only at earlier days (night/knowable_coins.yaml:
  top 10 of the venue''s perpetuals by the mean daily traded value of the previous 30 days, binance candles
  in data/raw); Монета HYPE вошла в первой десятке по обороту на Binance только 2025-07-01 (до этого её
  нельзя было выбрать, не зная будущего): оценка идёт с этого дня, раньше — разгон. The list is knowable
  only from 2025-07-01, so the twin is judged from that day (`judged_from` = `instruments_chosen_at` =
  2025-07-01): the history before it is warm-up for the code''s monthly choice, not judged..'
judged_from: '2025-07-01'
