# Stage 2 of gen-lowvol-ltw-weekly (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-lowvol-ltw-weekly-hl
title: 'Спокойные монеты против дёрганых на Binance: пятая часть самых ровных против пятой части самых
  резких, пересмотр раз в неделю (второй этап: hyperliquid)'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: low_vol
    window_days: 7
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-10-31'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- The paper weights coins by market capitalization; this spec uses equal weights.
- The paper's prices are composite across 200+ venues and its sample is 1,707 coins, not Binance USDT
  perpetuals.
- The paper keeps only coins with at least 30 daily observations as a whole-sample filter, not as an admission
  rule on each date; the block applies it on each date.
- The paper found no significant effect (t = -1.237), so this run reproduces a negative result.
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-lowvol-ltw-weekly) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $10.
- 'Judged from 2025-01-30: the first day hyperliquid has the 5 coins the portfolio rule needs at once
  (snapshot 33c1837936081c87510b759e35ce3ad302064f08708c8b0a4ba62ed0996cd89d); the days before are warm-up
  with no book.'
noise_universe: panel
measure_hedge_timing: false
