# Stage 2 of gen-tsmom-classic-moskowitz (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-tsmom-classic-moskowitz-hl
title: 'Каждая монета по своему знаку: купить, если за прошлый срок (от месяца до четырёх лет) выросла,
  продать, если упала, пересмотр раз в месяц: числа выбирает код один раз, на первых 2/3 данных, история
  Binance с 2019 (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.blocks:Composed
  base_params:
    universe:
      rule: all
    signal:
      block: momentum
      lookback_days: 365
    portfolio:
      block: time_series_sign
    sizing:
      block: equal
      gross: 1.0
    rebalance_days: 30
    min_history_days: 365
  grid:
    signal.lookback_days:
      lookback_days=365:
        signal.lookback_days: 365
      lookback_days=30:
        signal.lookback_days: 30
      lookback_days=90:
        signal.lookback_days: 90
      lookback_days=180:
        signal.lookback_days: 180
      lookback_days=270:
        signal.lookback_days: 270
      lookback_days=720:
        signal.lookback_days: 720
      lookback_days=1080:
        signal.lookback_days: 1080
      lookback_days=1440:
        signal.lookback_days: 1440
  refit_every: once
  choose_at: split
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5.0
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-11-04'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- Moskowitz, Ooi and Pedersen trade 58 futures of commodities, currencies, equity indices and bonds; this
  spec applies the sign rule to every Binance USDT perpetual.
- The paper scales each position to a common volatility (exponentially weighted, 40% a year); this spec
  uses equal shares because the catalogue gives no usable volatility-window or daily-target number.
- The paper has no funding and no perpetual-contract costs; the stand charges both.
- The paper is a secondary source, not tested on cryptocurrencies.
- 'One check of gen-tsmom-classic-moskowitz: the numbers it trades are chosen by code, once, at the cut
  of the window at its last third, from returns realised on the first 2/3, and held on the last third
  (the lists declared in docs/MECHANISMS.md, mechanism classic-ts-momentum, row signal.lookback_days:
  365, 30, 90, 180, 270, 720, 1080, 1440 (Moskowitz, Ooi, Pedersen 2012)); the data is Binance''s history,
  a proxy for binance''s market, judged for Binance itself: Binance''s costs and minimum leg and Binance''s
  facts about execution (docs/VENUE_SPLIT.md).'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml, its minimum leg is Binance''s (venues/binance.yaml, per contract
  where Binance states it), and the facts about execution (venue_supported, atomic_execution) are Binance''s:
  a run that passes every rule routes needs-infrastructure because the lab has no Binance order adapter.
  Text above that speaks of the original''s or Hyperliquid''s costs and minimum leg describes the spec
  as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-tsmom-classic-moskowitz) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2024-06-14'
params_fixed_evidence: 'Inherited from stage 1 (gen-tsmom-classic-moskowitz): The numbers are chosen once
  by code (qlab.strategies.retune, refit_every: once, choose_at: split; docs/RETUNE.md), at the stand''s
  cut: the first day of the last third of the judged window (rules 2026-11-04.1; owner 2026-11-04: «все
  стратегии должны проходить проверку вперед по 2/3 и 1/3 правилу»), by the after-cost Sharpe each value
  realised on the strategy''s own money before that day, and held to the end. The stand puts the day in
  for the window it runs on, so this date is the cut of the spec''s own window (2019-09-08..2026-11-01):
  2024-06-14. The data starts 2019-09-08; the longest warm-up read from the parameters is 1440 days (signal.lookback_days
  = 1440), so the book can first trade on 2023-08-18. The grid is the idea''s declared lists (signal.lookback_days),
  8 candidates. What this does not prove: the lists were declared with the idea before its check ran;
  what was seen of the history when they were declared is not recorded, so the choice is only as honest
  as the lists are.'
