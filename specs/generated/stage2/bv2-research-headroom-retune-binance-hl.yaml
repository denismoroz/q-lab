# Stage 2 of bv2-research-headroom-retune-binance (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: bv2-research-headroom-retune-binance-hl
title: 'Bv2 на истории Binance 2023–2026, запас пула маржи 1.0 или 1.5 выбирает код раз в месяц по прошлому
  (эксперимент исследователя 2026-10-25) (второй этап: hyperliquid)'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.live.bv2:LiveBv2
  base_params:
    coins:
    - BTC
    - ETH
    - SOL
    - AVAX
    capital_usd: 257.0
    spot_share: 0.5
    hedge_threshold: 0.0
    sticky_exit_hours: 12
    ratchet_threshold: 0.5
    carry_enabled: false
    carry_fraction: 0.6
    carry_entry_apr: 0.1
    carry_exit_hours: 24
    slippage: 0.0005
    min_order_usd: 10.0
    margin_enabled: true
    short_leverage:
      BTC: 3.0
      ETH: 2.0
      SOL: 1.5
      AVAX: 1.5
    default_leverage: 1.0
    maint_margin_rate:
      BTC: 0.0125
      ETH: 0.02
      SOL: 0.025
      AVAX: 0.05
    default_maint_margin_rate: 0.05
    margin_buffer: 0.1
    rebalance_at_im_share: 0.5
    mode: paper
  grid:
    headroom:
      b2:
        hedge_margin_headroom: 1.0
      b2_cold:
        hedge_margin_headroom: 1.5
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5.25
    slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1h
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-09-20'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - SOL
  - SOL-SPOT
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
execution_venue: hyperliquid
unexpressed_mechanisms: []
differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-research-headroom-retune-binance) on hyperliquid''s own perpetual contracts listed at each
  bar; nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
noise_universe: held
measure_hedge_timing: true
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2023-07-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-research-headroom-retune-binance): The wrapper''s
  first causal choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2023-04-28, and the live
  engine''s 788 warm-up hours (HISTORY_BARS + WARMUP_BARS, qlab.strategies.live.bv2; specs/bv2-binance.yaml)
  put the fresh book''s first day at 2023-06-01; a candidate is eligible after one whole monthly re-tuning
  period, so the first choice is made at the 2023-07-01 refit. Warm-up arithmetic, not a result. The grid
  was declared by the researcher on 2026-10-25: the margin-pool headroom that production runs in two instances
  (1.0 in b2, 1.5 in b2_cold), the same grid as bv2-research-headroom-retune; that trial''s result (paper,
  trial 72695) was known when this one was declared, so the choice of this experiment is in-sample, the
  wrapper''s choices inside it are not.

  '
