differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (trend-research-flat-choice-hl) on binance''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are binance's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'The idea was born on Hyperliquid (trend-research-flat-choice-hl''s own data is Hyperliquid''s); this
  is its binance verdict, judged independently (docs/VENUE_SPLIT.md; owner, 2026-11-05: «почему вот эта
  стратегия не тестировалась на бинансе?»). The data starts with binance''s archive on 2019-09-08, not
  on Hyperliquid''s first day; numbers inside the parameters (a wrapper''s scoring costs, its grid) are
  stage 1''s, unchanged, and a wrapper that chooses by code chooses again on this data. The facts about
  execution are this venue''s: the lab has no order adapter here, so a pass is needs-infrastructure.'
- The minimum leg is binance's own, $5 (venues/binance.yaml), not stage 1's $10.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2025-08-01'
params_fixed_evidence: 'Inherited from stage 1 (trend-research-flat-choice-hl): The outer wrapper''s first
  causal choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2025-01-01, where the whole
  book exists; the inner weekly Retune makes its first choice on 2025-06-09 (specs/trend-retune-weekly.yaml:
  the live engine''s warm-up of 151 daily closes plus one whole weekly re-tuning period); an outer candidate
  is eligible after one whole monthly re-tuning period, so the 2025-07-01 refit has none and the first
  choice is made at the 2025-08-01 refit. Warm-up arithmetic, not a result. The grid was declared by the
  researcher on 2026-10-26: fix designed on the data before 2026-09-14 (data/research/trend-2026-10-26.md);
  hypothesis: trend''s losses sit on flat days, so a past-only monthly choice to hold nothing on days
  the detector calls flat keeps its return and cuts its drawdowns. The drawdown evidence covered Hyperliquid
  up to 2026-09-13 (trend-live) and 2026-02-23 (trend-retune-weekly), so only 2026-09-14 .. 2026-10-25
  is data the grid''s design did not see: the result is preliminary.

  '
