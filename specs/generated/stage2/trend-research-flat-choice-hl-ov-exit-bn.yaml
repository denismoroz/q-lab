differs_from_source:
- 'Overlay variant of trend-research-flat-choice-hl (qlab.overlay_variants, docs/OVERLAYS.md): the same
  strategy with gradual_exit applied to its target weights; the strategy''s own numbers are untouched.
  The numbers of the overlays are chosen by code every month from the past only.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (trend-research-flat-choice-hl-ov-exit) on binance''s own perpetual contracts listed at each
  bar; nothing was refitted.'
- The costs are binance's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'The idea was born on Hyperliquid (trend-research-flat-choice-hl-ov-exit''s own data is Hyperliquid''s);
  this is its binance verdict, judged independently (docs/VENUE_SPLIT.md; owner, 2026-11-05: «почему вот
  эта стратегия не тестировалась на бинансе?»). The data starts with binance''s archive on 2019-09-08,
  not on Hyperliquid''s first day; numbers inside the parameters (a wrapper''s scoring costs, its grid)
  are stage 1''s, unchanged, and a wrapper that chooses by code chooses again on this data. The facts
  about execution are this venue''s: the lab has no order adapter here, so a pass is needs-infrastructure.'
- The minimum leg is binance's own, $5 (venues/binance.yaml), not stage 1's $10.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2025-10-01'
params_fixed_evidence: 'Inherited from stage 1 (trend-research-flat-choice-hl-ov-exit): The wrapper''s
  first causal choice (qlab.strategies.retune, docs/RETUNE.md): the base can first trade on 2025-08-01;
  the longest warm-up of the overlay family (gradual_exit) is 0 days, so the overlay can first act on
  2025-08-01; a candidate is eligible only after one whole month re-tuning period, so the first re-tuning
  after 2025-08-01 is 2025-09-01 and the first choice is made at the one after it, 2025-10-01. The family
  is declared whole in docs/OVERLAYS.md before any run: 4 candidates, none chosen by looking at the data
  it is judged on. What this does not prove: the family itself (which overlays and which settings are
  offered) was written by people who had seen the market.'
