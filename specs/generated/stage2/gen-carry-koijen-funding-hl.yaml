# Stage 2 of gen-carry-koijen-funding (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-carry-koijen-funding-hl
title: 'Перенос по ставке финансирования: покупать монеты с самой низкой средней ставкой за год, продавать
  с самой высокой, пересмотр раз в месяц (второй этап: hyperliquid)'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: funding
    window_days: 360
  portfolio:
    block: long_short_fraction
    fraction: 0.3
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 30
  min_history_days: 360
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-10-30'
  min_daily_volume_usd: 1000000.0
costs:
