  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- The paper does not test cryptocurrencies; this spec carries its result over to Binance USDT perpetuals.
- The paper's carry is computed from futures prices and interest rates; here it is minus the average funding
  rate, an assumption.
- The paper's main portfolio weights assets by carry rank; this spec uses equal weights in the top and
  bottom 30%, which the paper gives only as a robustness check.
- The paper's pnl is price change plus carry as here, but the stand does not separate the mechanical funding
  payment from price prediction.
- The paper's numbers come from the NBER working paper; the journal version may differ.
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-carry-koijen-funding) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $10.
- 'Judged from 2026-07-23: the first day hyperliquid has the 4 coins the portfolio rule needs at once
  (snapshot 28dfb67cb8ccbb062b7d64b0b02a24a790494f951c83a39a2f823444d3fac90b); the days before are warm-up
  with no book.'
