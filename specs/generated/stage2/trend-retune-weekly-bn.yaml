differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (trend-retune-weekly) on binance''s own perpetual contracts listed at each bar; nothing was
  refitted.'
- The costs are binance's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- 'The idea was born on Hyperliquid (trend-retune-weekly''s own data is Hyperliquid''s); this is its binance
  verdict, judged independently (docs/VENUE_SPLIT.md; owner, 2026-11-05: «почему вот эта стратегия не
  тестировалась на бинансе?»). The data starts with binance''s archive on 2019-09-08, not on Hyperliquid''s
  first day; numbers inside the parameters (a wrapper''s scoring costs, its grid) are stage 1''s, unchanged,
  and a wrapper that chooses by code chooses again on this data. The facts about execution are this venue''s:
  the lab has no order adapter here, so a pass is needs-infrastructure.'
- The minimum leg is binance's own, $5 (venues/binance.yaml), not stage 1's $10.
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2025-06-09'
params_fixed_evidence: 'Inherited from stage 1 (trend-retune-weekly): The wrapper''s first causal choice
  (qlab.strategies.retune): the inner strategy''s warm-up of 151 daily closes from 2025-01-01 plus one
  whole re-tuning period -- warm-up arithmetic, not a result. Grid values come from sources: lookbacks
  30/60/90/120 and their ensemble from frab research/trend_following (2026-09-14); the market-cap universe
  rule declared 2026-10-02 (q-lab f7577f4), the volume rule 2026-09-22 (c6bf6a7). Both rules'' fixed results
  were known when this grid was declared on 2026-10-02: that is the part of the grid that stays in-sample.

  '
