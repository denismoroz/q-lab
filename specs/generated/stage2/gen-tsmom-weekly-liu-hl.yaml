# Stage 2 of gen-tsmom-weekly-liu (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: gen-tsmom-weekly-liu-hl
title: 'Каждая монета по своему знаку: купить, если за прошлую неделю выросла, продать, если упала, пересмотр
  раз в неделю (второй этап: hyperliquid)'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: momentum
    lookback_days: 7
  portfolio:
    block: time_series_sign
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: hyperliquid
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2025-01-01'
  end: '2026-11-02'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- The paper tests bitcoin (and weaker ripple and ethereum) on its own; this spec applies the sign rule
  to every Binance USDT perpetual.
- The paper measures predictive regressions and weekly-return quintiles of one coin, not a traded sign
  portfolio with equal shares.
- The paper has no costs and no funding; the stand charges both.
- The paper's sample filter of 30 daily observations is a whole-sample filter, not an admission rule on
  each date; the block applies it on each date.
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (gen-tsmom-weekly-liu) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $10.
- 'Judged from 2025-01-30: the first day hyperliquid has the 1 coins the portfolio rule needs at once
  (snapshot 0175a1f353bd4524d50b342066e8128618324408a281a57f08961db5dccf3583); the days before are warm-up
  with no book.'
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2024-06-12'
params_fixed_evidence: 'Inherited from stage 1 (gen-tsmom-weekly-liu): named by code: the start of the
  last third of the window'
judged_from: '2025-01-30'
