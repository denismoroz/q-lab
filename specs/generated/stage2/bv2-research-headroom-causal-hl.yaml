params_fixed_at: '2019-11-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-research-headroom-causal): The wrapper''s first causal
  choice (qlab.strategies.retune, docs/RETUNE.md): the data starts 2019-09-08; the longest warm-up read
  from the parameters is 1 days (carry_exit_hours = 24), so the book can first trade on 2019-09-09; a
  candidate is eligible only after one whole month re-tuning period, so the first re-tuning after 2019-09-09
  is 2019-10-01 and the first choice is made at the one after it, 2019-11-01. This is warm-up arithmetic
  read generically from the parameters (every day, hour, window and lookback number, whatever the strategy
  does with it), not a result. If the strategy needs more than the parameters show (enough instruments
  listed on Binance, a signal that waits for history), the true first choice is later and the days before
  it are judged as flat days. The grid is two candidates declared whole: the numbers of strategy-b-v2
  unchanged, and the numbers of bv2-research-headroom (hedge_margin_headroom). What this does not prove:
  the experiment''s numbers were chosen by hand, looking at hyperliquid data up to 2026-10-03 (its window
  starts 2025-01-01): the same market on Binance from 2025-01-01 to 2026-10-03 is in-sample for the grid
  (it may have been seen), while the days before 2025-01-01 and after 2026-10-03 were not (the spec''s
  own date for its numbers: 2026-10-03). The instrument list is not point-in-time before 2025-06-01. The
  twin trades only the 8 columns BTC-SPOT, ETH-SPOT, SOL-SPOT, AVAX-SPOT, BTC, ETH, SOL, AVAX (required_instruments
  of bv2-research-headroom) (hourly candles of every Binance perpetual take hours; these take about 3
  minutes). A list chosen by hand and applied to history from 2019-09-08 knows which coins existed and
  survived, which the days before it was chosen did not; a coin Binance listed later has no candles before
  its listing day and enters then. The earliest documented day the list existed is 2025-06-01 (params_fixed_at
  of strategy-b-v2), so the twin is judged only from that day (`judged_from` = `instruments_chosen_at`
  = 2025-06-01): the history before it is warm-up for the code''s monthly choice (more data to choose
  with), not judged, and from that day the stand counts the list as point-in-time (docs/FIT_VS_FORWARD.md).'
judged_from: '2025-06-01'
