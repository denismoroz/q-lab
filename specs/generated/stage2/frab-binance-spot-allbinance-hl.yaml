    request)'
  transfers: 'docs/FRAB_BINANCE_SPOT.md (with free instant transfers there is nothing to batch: cash on
    the spot wallet goes to the margin first)'
  batch_share: 'docs/FRAB_BINANCE_SPOT.md (0: no batching, transfers are free)'
  idle_share: 'docs/FRAB_BINANCE_SPOT.md (1: idle margin is never withdrawn, transfers are free)'
  entry_parity_tolerance: funding-rate-arbitrage/src/frab/coin_discovery.py (SPOT_PERP_PARITY_TOLERANCE
    = 0.03, frab's own tolerance between a spot token and its perp before trading)
  max_wait_hours: 'docs/FRAB_BINANCE_SPOT.md (a declared parameter: the live engine waits on missing data
