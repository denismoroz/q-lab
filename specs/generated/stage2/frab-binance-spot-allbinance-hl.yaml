  leverage: 'docs/FRAB_BINANCE_SPOT.md (empty: the coin registry''s values are Hyperliquid''s; every coin
    is sized at the table''s 20x)'
  min_leg_notional: 'venues/hyperliquid.yaml min_leg_notional_usd: 10, the venue''s own minimum order
