# Stage 2 of frab-binance-spot-allbinance (qlab.pipeline.stage2, docs/TWO_STAGE.md): made by code from
# the stage 1 spec. The parameter values are stage 1's, untouched; do not edit by hand.
idea_id: frab-binance-spot-allbinance-hl
title: 'FRAB — обе ноги на Binance (спот и короткий контракт), общий бюджет 1000 долларов, четыре места
  (второй этап: hyperliquid)'
code_ref: qlab.strategies.live.frab_binance_spot:LiveFrabAllBinance
params:
  entry_threshold_apr: 0.1
  phase2_exit_threshold: -0.1
  base_min_hold_hours: 24
  cap_min_hold_hours: 720
  safety_mult: 5
  signal_window_hours: 8
  concurrency_cap: 4
  budget_cap_usdc: 1000
  margin_buffer_factor: 3
  phase1_negative_patience: 24
  phase1_breakeven_cap_hours: 720
  neg_stop_threshold_apr: -0.15
  neg_stop_patience_hours: 6
  phase2_giveback_fee_mult: 1.0
  spot_taker_fee: 0.001
  perp_taker_fee: 0.0005
  transfer_delay_hours: 0
  binance_withdrawal_fee_usdc: 0
  binance_withdrawal_min_usdc: 0
  hl_withdrawal_fee_usdc: 0
  top_up_trigger: 2.0
  healthy_ratio: 3.0
  maintenance_over_initial: 0.5
  leverage_table: seed/venue_facts/2026-10-25-binance_um_margin.csv
  transfers: batched
  batch_share: 0
  idle_share: 1
  entry_parity_tolerance: 0.03
  max_wait_hours: 24
  universe: all_paired
  leverage: {}
data:
  source: hyperliquid
  interval: 1h
  include_spot: true
  spot_prices: own
  start: '2026-03-08'
  end: '2026-10-30'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
unexpressed_mechanisms: []
differs_from_source:
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (frab-binance-spot-allbinance) on hyperliquid''s own perpetual contracts listed at each bar;
  nothing was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- A coin is traded on a day only with at least $1,000,000 of daily volume, the floor hyperliquid's live
  engine uses; stage 1 had no floor.
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $50.
noise_universe: held
measure_hedge_timing: false
params_fixed_at: '2026-10-10'
params_fixed_evidence: 'Inherited from stage 1 (frab-binance-spot-allbinance): funding-rate-arbitrage
  commit a0f5b5e (2026-10-10), «fix(two-phase): выход из POST только когда отданный фандинг покрыл комиссии
  круга» -- the last change to the decision functions this strategy calls (see specs/frab-live.yaml).
  The money parameters (fees, margin thresholds) are the published and live values of 2026-10-25, cited
  one by one, and were not fitted to the data. The total budget (1000) is the owner''s choice of 2026-10-25,
  «блин 90$ это вот очем а? на текущем Frab - так получилось. если нужно 300-400-1000 - давай считать
  на них.»: a size to be tried, not a parameter fitted to data, so params_fixed_at stays the decision
  rule''s date. The venue (all on Binance) is the owner''s variant of 2026-10-25, «да, добавляй вариант
  всё на binance».

  '
