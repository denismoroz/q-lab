differs_from_source:
- 'the perp is Binance''s, not Hyperliquid''s: Hyperliquid listed fewer coins early, so a coin can be
  held here on a date it could not yet be hedged there'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
- 'Stage 2 of the evaluation (docs/TWO_STAGE.md): the same mechanism and the same parameter values as
  stage 1 (bv2-research-top10-pool) on hyperliquid''s own perpetual contracts listed at each bar; nothing
  was refitted.'
- The costs are hyperliquid's (published base-tier taker fee, frab's slippage estimate), not stage 1's.
- '40 instrument(s) of stage 1 are not listed on hyperliquid and are not traded: ADA-SPOT, ARB-SPOT, ASTER-SPOT,
  BCH-SPOT, BNB-SPOT, BOME-SPOT, DEXE, DEXE-SPOT, DOGE-SPOT, EDU, EDU-SPOT, FET-SPOT, GAS-SPOT, HIFI,
  HIFI-SPOT, LINK-SPOT, LTC-SPOT, MATIC, MATIC-SPOT, NEAR-SPOT, NEIRO-SPOT, NOT-SPOT, OP-SPOT, ORDI-SPOT,
  PAXG-SPOT, PENGU-SPOT, PEOPLE-SPOT, RNDR, RNDR-SPOT, SEI-SPOT, SUI-SPOT, TAO-SPOT, TON-SPOT, TRB-SPOT,
  TRX-SPOT, UNI-SPOT, WIF-SPOT, WLD-SPOT, XLM-SPOT, XRP-SPOT.'
- 'Of those, listed by the venue but with no candle in the window, so treated as not listed: MATIC (delisted,
  with no daily candle between 2025-01-01 and 2026-10-30); RNDR (delisted, with no daily candle between
  2025-01-01 and 2026-10-30); WLD-SPOT (the spot market @224 has no daily candle between 2025-01-01 and
  2026-10-30).'
- The minimum leg is hyperliquid's own, $10 (venues/hyperliquid.yaml), not stage 1's $5.
- 'AVAX-SPOT is hyperliquid''s UAVAX/USDC spot token (docs/TASKS.md line 638 (spotMeta read 2026-09-22):
  AVAX is UAVAX (@306), bridge_safe in production''s coin_registry then; but funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and docs/TASKS.md line 670 counts its bars
  at 21.3% of the window: the lab''s price-parity check (src/qlab/data/snapshot.py spot_is_another_asset)
  keeps only the bars where it is 1:1).'
- 'BTC-SPOT is hyperliquid''s UBTC/USDC spot token (docs/TASKS.md line 635 (spotMeta read 2026-09-22):
  BTC is UBTC (@142), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe).'
- 'ENA-SPOT is the hyperliquid spot token resolved from the live listing, not one of the lab''s verified
  tokens (src/qlab/data/sources/hyperliquid.py fetch_spot_meta: the spot token named ENA or UENA in the
  live spotMeta; kept only on bars where its price is within frab''s 3% of the perp (src/qlab/data/snapshot.py
  spot_is_another_asset)).'
- 'ETH-SPOT is hyperliquid''s UETH/USDC spot token (docs/TASKS.md line 636 (spotMeta read 2026-09-22):
  ETH is UETH (@151), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'SOL-SPOT is hyperliquid''s USOL/USDC spot token (docs/TASKS.md line 637 (spotMeta read 2026-09-22):
  SOL is USOL (@156), the token production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
  line 13).'
- 'TRUMP-SPOT is the hyperliquid spot token resolved from the live listing, not one of the lab''s verified
  tokens (src/qlab/data/sources/hyperliquid.py fetch_spot_meta: the spot token named TRUMP or UTRUMP in
  the live spotMeta; kept only on bars where its price is within frab''s 3% of the perp (src/qlab/data/snapshot.py
  spot_is_another_asset)).'
- 'XPL-SPOT is the hyperliquid spot token resolved from the live listing, not one of the lab''s verified
  tokens (src/qlab/data/sources/hyperliquid.py fetch_spot_meta: the spot token named XPL or UXPL in the
  live spotMeta; kept only on bars where its price is within frab''s 3% of the perp (src/qlab/data/snapshot.py
  spot_is_another_asset)).'
- 'ZEC-SPOT is the hyperliquid spot token resolved from the live listing, not one of the lab''s verified
  tokens (src/qlab/data/sources/hyperliquid.py fetch_spot_meta: the spot token named ZEC or UZEC in the
  live spotMeta; kept only on bars where its price is within frab''s 3% of the perp (src/qlab/data/snapshot.py
  spot_is_another_asset)).'
noise_universe: held
measure_hedge_timing: false
params_fixed_at: '2025-08-02'
params_fit_from: '2023-06-01'
params_fixed_evidence: 'Inherited from stage 1 (bv2-research-top10-pool): declared by the researcher on
  2026-10-30: fix designed on the data before 2025-08-02; ten coins chosen monthly by trailing spot volume
  spread each coin''s whipsaw over the book, and one margin pool removes the partial hedges of separate
  pools, so the book''s falls should be no deeper than a separate-pool ten-coin book while it keeps the
  protection on falling days. The design rests on the «выбор» (2023-06 .. 2025-05) columns of docs/BV2_MARGIN.md:
  pool 1.5 drawdown -7.9% against -8.9%, 0 partial hedges against 20, and of docs/BV2_BASKETS.md, where
  the ten-coin book is worse than the four production coins before the cut (+25.0% and -8.9% against +36.3%
  and -6.4%), so the experiment answers the owner''s question and is not expected to beat them. Headroom
  1.5 is b2_cold''s, the owner''s cold-wallet book. Disclosed: the researcher has read the «вперёд» columns
  of both documents, which overlap this spec''s forward stretch; they were not used to choose the fix
  or a number. The candidate list keeps a small look-ahead (coins at least 4 of 175 weeks in the top ten
  over the whole window, docs/BV2_BASKETS.md); a list built by code is idea-0007.

  '
