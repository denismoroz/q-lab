# mechanism: crypto-xs-momentum
idea_id: gen-xsmom-liu-equal-weekly
title: 'Недельное продолжение движения монет на Binance: пятая часть лучших против пятой части худших, равные доли, срок оценки 1–4 недели'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: momentum
    lookback_days: 7
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-11-03'
costs:
  taker_fee_bps: 5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- The paper weights coins by market capitalization (value-weighted); this spec uses equal shares.
- The paper's prices are composite across many venues (more than 200 exchanges), not Binance USDT perpetuals.
- The paper keeps only coins with a capitalization of at least one million dollars; the blocks have no capitalization filter.
- The paper's 30-day filter is a whole-sample filter in the review work, not an admission rule on each date; the block applies it on each date.
- The paper has no costs and no funding; the stand charges both.
