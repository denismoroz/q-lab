noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- Grobys et al. pick the 30 largest coins by market capitalization at the end of the previous December; the block picks the 30 coins with the highest average dollar turnover.
- Ficura defines the liquid group by thresholds (capitalization of at least 50 million dollars and weekly turnover of at least 5 million), not by a coin count.
- The papers sort at the end of a calendar week, and Grobys et al. skip the last day between formation and holding; the block measures the price change up to the current candle inclusive.
- The result of Grobys et al. on the full sample is not significant and rests on one coin in one week of December 2020.
- The papers use composite prices across venues, not Binance USDT perpetuals.
params_fixed_at: '2024-01-01'
params_fixed_evidence: Grobys, Kolari, Sandretto, Shahzad, Aijo 2025 (docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum) use weekly data from 2016-01 to 2023-12, the latest sample end among the sources (Ficura 2017-06 to 2022-12, Begusic and Kostanjcar 2015 to January 2019); the day after is 2024-01-01.
