# mechanism: crypto-xs-momentum
idea_id: gen-xsmom-borri-capweight
title: 'Недельное продолжение движения монет на Binance: пятая часть лучших против пятой части худших, веса по рыночной стоимости'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: momentum
    lookback_days: 14
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: cap_weight
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-10-24'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- The paper's prices are composite across many venues (CoinGecko), not Binance USDT perpetuals.
- The paper keeps only coins with at least 30 daily observations as a whole-sample filter, not as an admission rule on each date; the block applies it on each date.
- Market-cap weights come from weekly CoinMarketCap snapshots of the 200 largest coins, so a coin outside them gets weight 0, unlike the paper's full coin list.
- The paper's sample includes coins that disappeared from the market; the Binance panel holds only contracts the archive lists.
params_fixed_at: '2025-09-07'
