# mechanism: classic-ts-momentum
idea_id: gen-tsmom-classic-moskowitz
title: 'Каждая монета по своему знаку: купить, если за прошлый срок (от месяца до четырёх лет) выросла, продать, если упала, пересмотр раз в месяц'
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: momentum
    lookback_days: 365
  portfolio:
    block: time_series_sign
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 30
  min_history_days: 365
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-11-01'
costs:
  taker_fee_bps: 5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
differs_from_source:
- Moskowitz, Ooi and Pedersen trade 58 futures of commodities, currencies, equity indices and bonds; this spec applies the sign rule to every Binance USDT perpetual.
- The paper scales each position to a common volatility (exponentially weighted, 40% a year); this spec uses equal shares because the catalogue gives no usable volatility-window or daily-target number.
- The paper has no funding and no perpetual-contract costs; the stand charges both.
- The paper is a secondary source, not tested on cryptocurrencies.
