# Live trend code on the 25 most traded coins AMONG THOSE ALREADY 151 DAYS OLD,
# as of each bar.
#
# Owner, 2026-10-02: "да, прогони с правилом 151 дня". The question: how much
# of the hand-written list's +12.14%/yr is explained by a rule that could have
# been written in January 2025 -- "trade only coins that have lived long
# enough" -- rather than by choosing the list in September 2026.
#
# Identical to `specs/trend-live-top25.yaml` except one switch,
# `top_k_requires_history: true`: the ranking skips coins that do not yet
# hold `min_history_days` (151) daily closes. In top25 such coins could take
# a slot and then receive weight 0 from the live code (too young to trade),
# leaving the book below 25 legs. No new number is introduced: 151 is the live
# engine's own `min_history_days`, 25 is the live list's length.
#
# History is counted inside the panel (from 2025-01-01). From 2025-06-01 on,
# every coin listed before 2025 has its 151 closes, so the count then agrees
# with the coin's true age on the venue; before that nobody trades, exactly
# as for the hand-written list on the same panel.

idea_id: trend-live-top25-seasoned
title: "[151 дней] Trend (живой код) — 25 самых торгуемых монет на каждом баре (point-in-time аналог живого списка)"
code_ref: "qlab.strategies.live.trend:LiveTrendTSMOMEnsemble"

# When the parameters and the coin list were last chosen (docs/FIT_VS_FORWARD.md):
# data before this date is the selection period, from it on the forward test.
params_fixed_at: 2026-10-02
params_fixed_evidence: >
  params as specs/trend-live.yaml (frab, 2026-09-14); the 151-day rule was written on 2026-10-02 (q-lab 92e764f), after both top-25 results were known

params:
  # null -> every discovered instrument is a candidate; the per-bar ranking
  # below, not a hand-written list, decides which 25 are traded when.
  coins: null
  top_k_by_volume: 25
  # Rank only coins already holding min_history_days closes (see header).
  top_k_requires_history: true
  capital_usd: 3000.0
  lookbacks: [30, 60, 90, 120]
  vol_window: 30
  vol_target_daily: 0.02
  leverage_cap: 3.0
  risk_scale: 0.2
  book_vol_target_ann: 0.14
  book_vol_window_days: 60
  book_vol_min_days: 20
  book_vol_scale_min: 0.25
  book_vol_scale_max: 2.0
  book_vol_prior_ann: 0.30
  min_history_days: 151

data:
  source: hyperliquid
  interval: "1d"
  start: 2025-01-01
  end: 2026-09-20

costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9

min_leg_notional: 10.0
simultaneous_legs: 1

# Calls frab's own trend code bar by bar, book volatility targeting
# included (`qlab.strategies.live.trend`). Its one documented fidelity gap --
# the equity fed to book_vol_scale excludes trading costs -- is a small
# deterministic drag inside an expressed mechanism, not a missing mechanism.
unexpressed_mechanisms: []

# How the source says the strategy behaves in each BTC regime (docs/REGIMES.md),
# declared before the run; nothing is claimed for the flat regime, the source
# says nothing about it.
regime_claim:
  bull: earns
  bear: earns

# Where every number and choice comes from (docs/SOURCES.md); checked
# before any run starts.
