# Betting against beta across the whole `xyz` HIP-3 deployment on Hyperliquid.
# Written 2026-10-01 and committed BEFORE its first run: every number below is
# fixed before any result was seen (docs/PLAN.md, M4 -- the commit is the
# timestamp).
#
# This is the NEIGHBOUR of cards/xyz-equity-bab.yaml, not that card. The paper
# ranks securities "in an asset class"; the card's idea is BAB on stocks. The
# venue publishes no asset class per instrument, and its 129 instruments mix
# single stocks, ETFs (some leveraged), indices, commodities, FX and contracts
# on private companies -- so restricting to stocks would be a classification
# made by us. This spec makes none: it ranks the whole deployment, which is a
# different strategy and therefore a different idea. specs/xyz-equity-bab.yaml
# records why the card's own version is not evaluable yet.

idea_id: xyz-deployment-bab
title: "Betting against beta across every instrument of the xyz HIP-3 deployment"
code_ref: "qlab.strategies.bab:BettingAgainstBeta"

# Every value is the source's, see qlab.strategies.bab's docstring for the
# verbatim quotes and for why beta estimation follows the 2010 working paper
# (NBER w16601) while portfolio construction follows the 2014 published one.
params:
  # The deployment's own index, and the only proxy with enough history: the
  # alternative, xyz:SP500, had 189 daily bars on 2026-09-22, below the
  # paper's 200-observation minimum (cards/xyz-equity-bab.yaml, legs).
  market: "xyz:XYZ100"
  window_bars: 365        # "1-year rolling windows" of daily data; xyz trades every day
  min_observations: 200   # "require at least 200 observations"
  dimson_lags: 5          # "lags up to K = 5 trading days"
  shrink_weight: 0.5      # "we set w = 0.5 and beta_XS = 1"
  shrink_target: 1.0

data:
  source: hyperliquid-xyz
  interval: "1d"
  # The deployment's first daily candle is 2025-10-13 (xyz:XYZ100); the window
  # starts a little earlier so nothing listed at launch is cut off.
  start: 2025-10-01
  end: 2026-09-30

costs:
  # docs.trade.xyz/perpetuals/mechanics/fees: "Standard fees for all HIP-3
  # assets are currently 2x the usual fees on validator-operated perp markets".
  # The usual taker q-lab uses for Hyperliquid perps is 3.5 bps
  # (funding-rate-arbitrage/src/frab/constants.py, PERP_TAKER = 0.00035; the
  # same figure every other spec here uses), so 7.0 bps. Many xyz instruments
  # report growthMode "enabled" (fees cut by >= 90% per the same page), but
  # the API gives only today's mode, not its history -- so the standard rate
  # is used throughout, an upper bound on cost, not an estimate.
  taker_fee_bps: 7.0
  # Same slippage figure as the main-market specs (SCREENING.md: ~4.4 bps per
  # leg = 3.5 taker + 0.9). xyz books are thinner, so this is a lower bound.
  slippage_bps: 0.9

min_leg_notional: 10.0    # venues/hyperliquid-xyz.yaml
# A portfolio, not a pair: a partly filled rebalance mis-sizes the book but
# leaves no leg uncovered (cards/xyz-equity-bab.yaml, execution.note).
simultaneous_legs: 1

# The implementation expresses the whole method of this spec's own idea.
unexpressed_mechanisms: []

# Where every number and choice comes from (docs/SOURCES.md); checked
# before any run starts.
sources:
  "market": "docs/STAGE3_XYZ_BAB.md (xyz:XYZ100, the deployment's own index)"
  "window_bars": "derived: 365 * 1; «1-year rolling windows» of daily bars (src/qlab/strategies/bab.py), and xyz trades every calendar day"
  "min_observations": "src/qlab/strategies/bab.py docstring (verbatim quotes from the source paper, NBER w16601 / https://econpapers.repec.org/RePEc:eee:jfinec:v:111:y:2014:i:1:p:1-25)"
  "dimson_lags": "src/qlab/strategies/bab.py docstring (verbatim quotes from the source paper, NBER w16601 / https://econpapers.repec.org/RePEc:eee:jfinec:v:111:y:2014:i:1:p:1-25)"
  "shrink_weight": "src/qlab/strategies/bab.py docstring (verbatim quotes from the source paper, NBER w16601 / https://econpapers.repec.org/RePEc:eee:jfinec:v:111:y:2014:i:1:p:1-25)"
  "shrink_target": "src/qlab/strategies/bab.py docstring (verbatim quotes from the source paper, NBER w16601 / https://econpapers.repec.org/RePEc:eee:jfinec:v:111:y:2014:i:1:p:1-25)"
  "costs.taker_fee_bps": "derived: 0.00070 * 10000; HIP-3 taker at the standard spot rate, funding-rate-arbitrage/src/frab/constants.py SPOT_TAKER"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»"
  "min_leg_notional": "funding-rate-arbitrage/src/frab/strategy/trend/params.py (TrendParams defaults; 25-coin DEFAULT_COINS), min_order_usd: HL's own minimum order"
