# Live trend (25 largest by market cap) on Binance 2019-09 .. 2026-09, trading only
# in the regimes its source says it earns in -- bull and bear -- and flat in the
# flat regime (owner, 2026-10-02: «в стратегию детект режима — можно встроить?»).
#
# The regime is the one a strategy may KNOW at each bar (qlab.regimes.causal_labels:
# BTC's 30-day return against terciles of the days before it), not the hindsight
# labels used to describe results.
#
# Declared on 2026-10-02 before any run of trend on Binance data. Honest reading:
# 2019-09 .. 2024-12 is data on which nobody saw trend's per-regime behaviour; 2025-26
# overlaps the Hyperliquid window where its loss on flat days was seen, so the two
# parts are reported apart (docs/REGIMES.md). Compared with trend-binance-cap, the
# same strategy ungated.

idea_id: trend-binance-cap-gated
title: Trend по капитализации на Binance 2019–2026, торгует только на росте и падении (определитель режима
  только по прошлому)
code_ref: qlab.strategies.regime_gate:RegimeGate
params:
