# Live trend, 25 largest coins by market cap, on Binance's whole history (2019-09 .. 2026-09) -- the long-history
# check of specs/trend-live-top25-cap.yaml (owner, 2026-10-02: «длинная история с Binance», order 2-1-3).
#
# Why Binance: Hyperliquid's history starts in 2023 and our judged window
# (2025-01 .. 2026-09) holds no bull market like 2020-2021 (docs/REGIMES.md).
# Binance's USDT perpetuals cover 2019-09 on, and the universe is complete:
# the public data archive lists every contract ever listed, delisted ones
# included (qlab.data.sources.binance). Binance is a DATA proxy here: the
# strategy would trade on Hyperliquid, so costs and the minimum order are
# Hyperliquid's; funding is Binance's own (8-hourly). The route's venue facts
# are Binance's (no adapter), so a pass reads "needs infrastructure" -- the
# point of this run is the regime breakdown, not deployment.
#
# Declared on 2026-10-02 before any run on this data, together with
# trend-binance-cap, trend-binance-volume and trend-binance-retune-weekly.

