# frab's own basket of ten, chosen from today's open interest (docs/BV2_BASKETS.md): the survivors' basket the old research used.
# Generated by scripts/research/bv2_owner_ideas_specs.py -- edit the grid there.
# A MEASUREMENT for the owner (docs/BV2_BASKETS.md, docs/BV2_MARGIN.md), not a verdict: the
# researcher makes the real experiments with fit and forward discipline. Binance spot and
# perps are a DATA proxy (hourly, with bar highs); costs stay Hyperliquid's, as in
# specs/bv2-binance.yaml. The fit/forward split below is the baseline's own, kept so every
# variant is read on the same two stretches; the mechanisms' numbers were declared on
# 2026-10-25 and fitted to nothing.

idea_id: bv2-m-fixed10
title: "Bv2 на корзине из 10 монет, выбранной заранее (как у frab)"
code_ref: "qlab.strategies.live.bv2:LiveBv2"
params_fit_from: 2023-06-01
params_fixed_at: 2025-06-01
params_fixed_evidence: >
  funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение 2023-06—2025-05 |
  проверка 2025-06—2026-05 | вперёд 2026-06—09 |» -- the book's own parameters were fitted on 2023-06 … 2025-05;
  the same dates as specs/bv2-binance.yaml, so the variants read on its two stretches. The mechanism
  parameters (coin list rule, pool, top-up delay, deposits) are declared 2026-10-25 and fitted to no window.
params:
  coins: ["BTC", "ETH", "SOL", "AVAX", "XRP", "NEAR", "AAVE", "DOGE", "LINK", "UNI"]
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {"BTC": 3.0, "ETH": 2.0, "SOL": 1.5, "AVAX": 1.5}
  default_leverage: 1.5
  maint_margin_rate: {"BTC": 0.0125, "ETH": 0.02, "SOL": 0.025, "AVAX": 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.5
  rebalance_at_im_share: 0.5
  mode: "paper"

data:
  source: binance
  interval: "1h"
  start: 2023-04-28
  end: 2026-09-20
  instruments: ["AAVE", "AAVE-SPOT", "AVAX", "AVAX-SPOT", "BTC", "BTC-SPOT", "DOGE", "DOGE-SPOT", "ETH", "ETH-SPOT", "LINK", "LINK-SPOT", "NEAR", "NEAR-SPOT", "SOL", "SOL-SPOT", "UNI", "UNI-SPOT", "XRP", "XRP-SPOT"]

costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9

min_leg_notional: 10.0
simultaneous_legs: 2
# Binance is the DATA proxy; orders would go to Hyperliquid, whose costs and minimum leg this spec
# already uses, so the venue facts (adapter, uncovered-leg recovery) are Hyperliquid's
# (StrategySpec.execution_venue, docs/VENUES.md section 9). No number changes.
execution_venue: hyperliquid

noise_universe: held
measure_hedge_timing: false
unexpressed_mechanisms: []
differs_from_source:
  - "Binance data stands in for Hyperliquid's: spot and perp from Binance, costs from Hyperliquid"
required_instruments: ["AAVE", "AAVE-SPOT", "AVAX", "AVAX-SPOT", "BTC", "BTC-SPOT", "DOGE", "DOGE-SPOT", "ETH", "ETH-SPOT", "LINK", "LINK-SPOT", "NEAR", "NEAR-SPOT", "SOL", "SOL-SPOT", "UNI", "UNI-SPOT", "XRP", "XRP-SPOT"]
regime_claim:
  bull: earns
  bear: beats_market

