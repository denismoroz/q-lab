# Top-ups that arrive late, at a small reserve.
# Generated by scripts/research/bv2_owner_ideas_specs.py -- edit the grid there.
# A MEASUREMENT for the owner (docs/BV2_BASKETS.md, docs/BV2_MARGIN.md), not a verdict: the
# researcher makes the real experiments with fit and forward discipline. Binance spot and
# perps are a DATA proxy (hourly, with bar highs); costs stay Hyperliquid's, as in
# specs/bv2-binance.yaml. The fit/forward split below is the baseline's own, kept so every
# variant is read on the same two stretches; the mechanisms' numbers were declared on
# 2026-10-25 and fitted to nothing.

idea_id: bv2-m-top10-h01-apart-d6
title: "10 самых ликвидных, пулы по монетам, запас 0.1, доливка с кошелька приходит через 6 ч"
code_ref: "qlab.strategies.live.bv2:LiveBv2"
params_fit_from: 2023-06-01
params_fixed_at: 2025-06-01
params_fixed_evidence: >
  funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение 2023-06—2025-05 |
  проверка 2025-06—2026-05 | вперёд 2026-06—09 |» -- the book's own parameters were fitted on 2023-06 … 2025-05;
  the same dates as specs/bv2-binance.yaml, so the variants read on its two stretches. The mechanism
  parameters (coin list rule, pool, top-up delay, deposits) are declared 2026-10-25 and fitted to no window.
params:
  universe: {"rule": "top_liquid", "n": 10, "rebalance": "monthly", "by": "spot_dollar_volume", "window_days": 30, "candidates": ["BNB", "BTC", "ETH", "SOL", "XRP", "DOGE", "SUI", "TRX", "ADA", "ZEC", "WIF", "ARB", "LTC", "MATIC", "AVAX", "LINK", "WLD", "BOME", "ENA", "TRUMP", "NEAR", "NOT", "ORDI", "PAXG", "BCH", "ASTER", "TAO", "OP", "PEOPLE", "NEIRO", "TON", "XLM", "TRB", "FET", "HIFI", "SEI", "DEXE", "EDU", "GAS", "PENGU", "RNDR", "UNI", "XPL"]}
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {"BTC": 3.0, "ETH": 2.0, "SOL": 1.5, "AVAX": 1.5}
  default_leverage: 1.5
  maint_margin_rate: {"BTC": 0.0125, "ETH": 0.02, "SOL": 0.025, "AVAX": 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 0.1
  rebalance_at_im_share: 0.5
  mode: "paper"
  topup_delay_hours: 6

data:
  source: binance
  interval: "1h"
  start: 2023-04-28
  end: 2026-09-20
  instruments: ["ADA", "ADA-SPOT", "ARB", "ARB-SPOT", "ASTER", "ASTER-SPOT", "AVAX", "AVAX-SPOT", "BCH", "BCH-SPOT", "BNB", "BNB-SPOT", "BOME", "BOME-SPOT", "BTC", "BTC-SPOT", "DEXE", "DEXE-SPOT", "DOGE", "DOGE-SPOT", "EDU", "EDU-SPOT", "ENA", "ENA-SPOT", "ETH", "ETH-SPOT", "FET", "FET-SPOT", "GAS", "GAS-SPOT", "HIFI", "HIFI-SPOT", "LINK", "LINK-SPOT", "LTC", "LTC-SPOT", "MATIC", "MATIC-SPOT", "NEAR", "NEAR-SPOT", "NEIRO", "NEIRO-SPOT", "NOT", "NOT-SPOT", "OP", "OP-SPOT", "ORDI", "ORDI-SPOT", "PAXG", "PAXG-SPOT", "PENGU", "PENGU-SPOT", "PEOPLE", "PEOPLE-SPOT", "RNDR", "RNDR-SPOT", "SEI", "SEI-SPOT", "SOL", "SOL-SPOT", "SUI", "SUI-SPOT", "TAO", "TAO-SPOT", "TON", "TON-SPOT", "TRB", "TRB-SPOT", "TRUMP", "TRUMP-SPOT", "TRX", "TRX-SPOT", "UNI", "UNI-SPOT", "WIF", "WIF-SPOT", "WLD", "WLD-SPOT", "XLM", "XLM-SPOT", "XPL", "XPL-SPOT", "XRP", "XRP-SPOT", "ZEC", "ZEC-SPOT"]

costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9

min_leg_notional: 10.0
simultaneous_legs: 2

noise_universe: held
measure_hedge_timing: false
unexpressed_mechanisms: []
differs_from_source:
  - "the perp is Binance's, not Hyperliquid's: Hyperliquid listed fewer coins early, so a coin can be held here on a date it could not yet be hedged there"
regime_claim:
  bull: earns
  bear: beats_market

