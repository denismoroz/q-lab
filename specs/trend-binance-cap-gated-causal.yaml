# Causal twin of trend-binance-cap-gated (qlab twin, src/qlab/twin.py): its numbers are chosen
# by code, from the past only, on Binance's history (docs/RETUNE.md). Written by
# code, not by hand.
idea_id: trend-binance-cap-gated-causal
title: 'Trend по капитализации на Binance 2019–2026, торгует только на росте и падении (определитель режима
  только по прошлому): числа выбирает код раз в месяц только по прошлому, история Binance с 2019'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.regime_gate:RegimeGate
  base_params:
    inner_code_ref: qlab.strategies.live.trend:LiveTrendTSMOMEnsemble
    inner_params:
      coins: null
      top_k_by_market_cap: 25
      exclude_tags:
      - stablecoin
      top_k_requires_history: true
      capital_usd: 3000.0
      lookbacks:
      - 30
      - 60
      - 90
      - 120
      vol_window: 30
      vol_target_daily: 0.02
      leverage_cap: 3.0
      risk_scale: 0.2
      book_vol_target_ann: 0.14
      book_vol_window_days: 60
      book_vol_min_days: 20
      book_vol_scale_min: 0.25
      book_vol_scale_max: 2.0
      book_vol_prior_ann: 0.3
      min_history_days: 151
  grid:
    gate:
      always:
        trade_in:
        - bull
        - flat
        - bear
      only_bull_bear:
        trade_in:
        - bull
        - bear
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5
    slippage_bps: 0.9
data:
  source: binance
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2019-09-08'
  end: '2026-09-20'
costs:
  taker_fee_bps: 5
  slippage_bps: 0.9
min_leg_notional: 5
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 3000
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of trend-binance-cap-gated: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the base trend-binance-cap against its regime-gated experiment);
  the data is Binance''s history, a proxy for binance''s market, with the original''s costs and minimum
  leg.'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml, its minimum leg is Binance''s (venues/binance.yaml, per contract
  where Binance states it), and the facts about execution (venue_supported, atomic_execution) are Binance''s:
  a run that passes every rule routes needs-infrastructure because the lab has no Binance order adapter.
  Text above that speaks of the original''s or Hyperliquid''s costs and minimum leg describes the spec
  as it was before that day.'
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-04-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  data starts 2019-09-08; the longest warm-up read from the parameters is 151 days (inner_params.min_history_days
  = 151), so the book can first trade on 2020-02-06; a candidate is eligible only after one whole month
  re-tuning period, so the first re-tuning after 2020-02-06 is 2020-03-01 and the first choice is made
  at the one after it, 2020-04-01. This is warm-up arithmetic read generically from the parameters (every
  day, hour, window and lookback number, whatever the strategy does with it), not a result. If the strategy
  needs more than the parameters show (enough instruments listed on Binance, a signal that waits for history),
  the true first choice is later and the days before it are judged as flat days. The grid is two candidates
  declared whole: the book of trend-binance-cap traded in every regime (always), and held only in bull,
  bear (trend-binance-cap-gated). What this does not prove: the experiment''s own data was already Binance''s:
  2019-09-08 .. 2026-10-02 may have been seen when its numbers were chosen, so that stretch is in-sample
  for the grid and the twin adds only the days before 2019-09-08 (the spec''s own date for its numbers:
  2026-10-02).'
