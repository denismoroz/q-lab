# Bv2 on Binance's long history (2019-09 .. 2026-09): the flat-regime leg of the
# regime switch (allocations/trend-bv2-by-regime.yaml; owner, 2026-10-02:
# «переключение между стратегиями по режиму — делай»). Same live frab book and
# production parameters as specs/bv2-live.yaml; Binance is a DATA proxy (spot and
# perps, hourly, with bar highs); until 2026-10-30 the costs stayed Hyperliquid's, now they are
# Binance's (see below). The four coins are the
# production book's own list, hence an explicit instrument list. Declared on
# 2026-10-02 before any run on this data.

idea_id: bv2-binance
title: 'Bv2 (живой код frab, параметры прода) на Binance 2019–2026: спот и контракт BTC, ETH, SOL, AVAX,
  часы'
code_ref: qlab.strategies.live.bv2:LiveBv2
params_fit_from: 2023-06-01
params_fixed_at: 2025-06-01
params_fixed_evidence: >
  funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение 2023-06—2025-05 | проверка 2025-06—2026-05 | вперёд 2026-06—09 |»
  -- the parameters were fitted on 2023-06 … 2025-05 and the following year only checked against
  rules declared before («Дальше подкручивать по проверочному году нельзя»). The coin list
  BTC/ETH/SOL/AVAX comes from the same research («только монеты HL»). Committed later in frab
  commits f2a0e3f, bd470b0, 4b7fced, 58ed2c5 (2026-09-13) with two changes not fitted on the check
  year: the margin model (execution realism, REPORT.md «Маржа по-честному», compared on the
  training years) and carry off (REPORT.md «Как читать честно», 5: it duplicates FRAB's positions).
  Owner, 2026-10-04: «разделять backtest and forward test».
params:
  coins:
  - BTC
  - ETH
  - SOL
  - AVAX
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage:
    BTC: 3.0
    ETH: 2.0
    SOL: 1.5
    AVAX: 1.5
  default_leverage: 1.0
  maint_margin_rate:
    BTC: 0.0125
    ETH: 0.02
    SOL: 0.025
    AVAX: 0.05
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper
data:
  source: binance
  interval: 1h
  # A fresh book at the start of the fitting window, as production creates
  # one: frab sizes each coin's position in dollars once, at creation, and
  # does not compound (book.py CoinBook.new; the ratchet sells growth above
  # 1.5x). Started in 2019 the book held ~15% of its equity in the market by
  # 2025 and its percentages were diluted fourfold -- the "+2.0% forward" read
  # as decay by the researcher and the assessor (docs/HEDGE_TIMING.md,
  # 2026-10-24). 788 hours before 2023-06-01 (the live engine's
  # HISTORY_BARS + WARMUP_BARS, qlab.strategies.live.bv2) so the book starts
  # by the window's first day. The 2019-2023 run is recorded in
  # docs/FIT_VS_FORWARD.md (trial 19811).
  start: '2023-04-28'
  end: '2026-09-20'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - SOL
  - SOL-SPOT
costs:
  taker_fee_bps: 7.5
  slippage_bps: 0.9
min_leg_notional: 5
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 257
simultaneous_legs: 2
# Judged for Binance itself (venue split, 2026-10-30, docs/VENUE_SPLIT.md): there is no
# `execution_venue`, so the facts about execution (adapter, uncovered-leg recovery) are Binance's
# and a pass routes needs-infrastructure; costs are the binance row of night/costs.yaml (the mean
# of the perpetual's and the spot's fee for a two-leg book) and the minimum leg is Binance's. Until
# 2026-10-30 this spec was a proxy for Hyperliquid (execution_venue: hyperliquid, Hyperliquid's
# costs of 5.25 + 0.9 bp and minimum leg 10): Hyperliquid's own verdict is its second stage.

# Random books for the noise bar trade only the coins this book holds
# (StrategySpec.noise_universe): the coin list is fixed, the question is the
# book's decisions on it. With the whole panel, a random book on strategy-b-v2
# moved its weights onto Hyperliquid memecoins and made +212% a year
# (docs/HEDGE_TIMING.md, 2026-10-24).
differs_from_source:
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml (the two-leg mean of the perpetual''s and the spot''s fee), its
  minimum leg is Binance''s (venues/binance.yaml, per contract where Binance states it), and the facts
  about execution (venue_supported, atomic_execution) are Binance''s: a run that passes every rule routes
  needs-infrastructure because the lab has no Binance order adapter. Text above that speaks of the original''s
  or Hyperliquid''s costs and minimum leg describes the spec as it was before that day.'
noise_universe: held

# Whether the book picks WHEN to hedge better than chance (docs/HEDGE_TIMING.md).
measure_hedge_timing: true
unexpressed_mechanisms: []
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
regime_claim:
  bull: earns
  bear: beats_market
sources:
  strategy_capital_usd: 'the spec''s own parameter capital_usd = 257: seed/prod_params/2026-10-02-b2.json
    (frab.db strategies.params_json, read-only export)'
  costs.taker_fee_bps: 'derived: (5.0 + 10.0) / 2; the perpetual''s 5 bps is the number above, Binance
    spot''s taker for a regular user is 0.100% (10 bps), the Fees page https://www.binance.com/en/fee/schedule
    (read 2026-10-25, recorded at docs/FRAB_BINANCE_SPOT.md line 57; the BNB discount to 0.075% is not
    applied, it needs BNB on the account); the mean is how docs/FRAB_BINANCE_SPOT.md line 114 blends the
    two legs'
  costs.slippage_bps: 'derived: 4.4 - 3.5; docs/FRAB_BINANCE_SPOT.md line 58: Binance has no measurement
    of its own, the value measured for Hyperliquid (funding-rate-arbitrage/research/SCREENING.md line
    32) is used and marked unmeasured'
  min_leg_notional: 'venues/binance.yaml min_leg_notional_usd: 5.0, Binance USDT-M futures'' MIN_NOTIONAL
    of the ordinary contract (exchangeInfo read 2026-10-30, 516 of 522 contracts); BTC (50) and five contracts
    (20) differ and are read per contract (min_leg_notional_by_instrument, seed/venue_facts/2026-10-30-binance_um_min_notional.csv)'
  coins: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  capital_usd: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  spot_share: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  hedge_threshold: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  sticky_exit_hours: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  ratchet_threshold: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  carry_enabled: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  carry_fraction: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  carry_entry_apr: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  carry_exit_hours: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  slippage: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  min_order_usd: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  margin_enabled: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  short_leverage: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  default_leverage: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  maint_margin_rate: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  default_maint_margin_rate: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only
    export)
  margin_buffer: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
  hedge_margin_headroom: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only
    export)
  rebalance_at_im_share: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only
