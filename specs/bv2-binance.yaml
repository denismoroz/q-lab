# Bv2 on Binance's long history (2019-09 .. 2026-09): the flat-regime leg of the
# regime switch (allocations/trend-bv2-by-regime.yaml; owner, 2026-10-02:
# «переключение между стратегиями по режиму — делай»). Same live frab book and
# production parameters as specs/bv2-live.yaml; Binance is a DATA proxy (spot and
# perps, hourly, with bar highs), costs stay Hyperliquid's. The four coins are the
# production book's own list, hence an explicit instrument list. Declared on
# 2026-10-02 before any run on this data.

idea_id: bv2-binance
title: 'Bv2 (живой код frab, параметры прода) на Binance 2019–2026: спот и контракт BTC, ETH, SOL, AVAX,
  часы'
code_ref: qlab.strategies.live.bv2:LiveBv2
params_fit_from: 2023-06-01
params_fixed_at: 2025-06-01
params_fixed_evidence: >
  funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение 2023-06—2025-05 | проверка 2025-06—2026-05 | вперёд 2026-06—09 |»
  -- the parameters were fitted on 2023-06 … 2025-05 and the following year only checked against
  rules declared before («Дальше подкручивать по проверочному году нельзя»). The coin list
  BTC/ETH/SOL/AVAX comes from the same research («только монеты HL»). Committed later in frab
  commits f2a0e3f, bd470b0, 4b7fced, 58ed2c5 (2026-09-13) with two changes not fitted on the check
  year: the margin model (execution realism, REPORT.md «Маржа по-честному», compared on the
  training years) and carry off (REPORT.md «Как читать честно», 5: it duplicates FRAB's positions).
  Owner, 2026-10-04: «разделять backtest and forward test».
params:
  coins:
  - BTC
  - ETH
  - SOL
  - AVAX
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage:
    BTC: 3.0
    ETH: 2.0
    SOL: 1.5
    AVAX: 1.5
  default_leverage: 1.0
  maint_margin_rate:
    BTC: 0.0125
    ETH: 0.02
    SOL: 0.025
    AVAX: 0.05
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper
data:
  source: binance
  interval: 1h
  start: '2019-09-08'
  end: '2026-09-20'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - SOL
  - SOL-SPOT
costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
unexpressed_mechanisms: []
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
regime_claim:
  bull: earns
  bear: beats_market
sources:
  costs.taker_fee_bps: 'derived: (7.0 + 3.5) / 2; spot taker 0.00070 and perp taker 0.00035 in funding-rate-arbitrage/src/frab/constants.py,
    both legs move by the same amount'
  costs.slippage_bps: 'derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4
