# docs/TASKS.md T39: two levels -- the market's direction, then a model for trend
# trained on trend's own 30-day outcome. Declared 2026-10-04 before level 2 was built.
idea_id: trend-t39-meta
title: Trend по капитализации на Binance 2019–2026, торгует, когда модель второго уровня ждёт заработка
