# docs/TASKS.md T39: Bv2, the book's rule decides, a level-2 model vetoes its false alarms.
# Declared 2026-10-04 before the filter was built; the base params keep their fit window.
idea_id: bv2-t39-false-alarm-filter
title: 'Bv2 на Binance: страховку решает правило книги, модель второго уровня отменяет ложные тревоги
  (мета-разметка)'
code_ref: qlab.strategies.live.bv2:LiveBv2
params_fit_from: 2023-06-01
params_fixed_at: 2025-06-01
params_fixed_evidence: 'funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение
  2023-06—2025-05 | проверка 2025-06—2026-05 | вперёд 2026-06—09 |» -- the parameters were fitted on 2023-06
  … 2025-05 and the following year only checked against rules declared before («Дальше подкручивать по
  проверочному году нельзя»). The coin list BTC/ETH/SOL/AVAX comes from the same research («только монеты
  HL»). Committed later in frab commits f2a0e3f, bd470b0, 4b7fced, 58ed2c5 (2026-09-13) with two changes
  not fitted on the check year: the margin model (execution realism, REPORT.md «Маржа по-честному», compared
  on the training years) and carry off (REPORT.md «Как читать честно», 5: it duplicates FRAB''s positions).
  Owner, 2026-10-04: «разделять backtest and forward test».

  The false-alarm filter declared 2026-10-04 before it was built or any run with it; level 1''s feature
  set was chosen on 2020-04..2023-12, so the forward test from 2025-06 is free of every choice here.

  '
