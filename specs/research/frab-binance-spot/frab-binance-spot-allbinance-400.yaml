# FRAB's live decisions with BOTH legs on Binance: the spot on its spot market, the short on its
# USDⓈ-M futures. Written 2026-10-25 after the owner's «да, добавляй вариант всё на binance»
# (the variant of frab-binance-spot with no money crossing between venues). A VARIANT of
# specs/frab-binance-spot.yaml (its own family): same decisions, same signal, same slots, but
# on Binance's funding, Binance's fees, and Binance's margin rules. Total budget 400, four slots.
#
# Funding on Binance is paid every 8 hours (some contracts 4 or 1): the panel carries each
# settlement on its bar and zero between, so the mean of the last 8 hourly values times 8760
# is the annualised rate frab's engine reads (qlab.strategies.live.frab_binance_spot).
# Plain margin mode (spot is not collateral for the short); Portfolio Margin is a what-if.
# docs/FRAB_BINANCE_SPOT.md holds every number's source and what is simplified.

idea_id: frab-binance-spot-allbinance-400
title: "FRAB — обе ноги на Binance (спот и короткий контракт), общий бюджет 400 долларов, четыре места"
code_ref: "qlab.strategies.live.frab_binance_spot:LiveFrabAllBinance"

params_fixed_at: 2026-10-10
params_fixed_evidence: >
  funding-rate-arbitrage commit a0f5b5e (2026-10-10), «fix(two-phase): выход из POST только когда
  отданный фандинг покрыл комиссии круга» -- the last change to the decision functions this
  strategy calls (see specs/frab-live.yaml). The money parameters (fees, margin thresholds) are the
  published and live values of 2026-10-25, cited one by one, and were not fitted to the data.
  The total budget (400) is the owner's choice of 2026-10-25, «блин 90$ это вот очем а? на текущем Frab -
  так получилось. если нужно 300-400-1000 - давай считать на них.»: a size to be tried, not a parameter
  fitted to data, so params_fixed_at stays the decision rule's date. The venue (all on Binance) is the
  owner's variant of 2026-10-25, «да, добавляй вариант всё на binance».

params:
  entry_threshold_apr: 0.1
  phase2_exit_threshold: -0.1
  base_min_hold_hours: 24
  cap_min_hold_hours: 720
  safety_mult: 5
  signal_window_hours: 8
  concurrency_cap: 4
  budget_cap_usdc: 400
  margin_buffer_factor: 3
  phase1_negative_patience: 24
  phase1_breakeven_cap_hours: 720
  neg_stop_threshold_apr: -0.15
  neg_stop_patience_hours: 6
  phase2_giveback_fee_mult: 1.0
  # Money on one venue (docs/FRAB_BINANCE_SPOT.md): internal wallet transfers free and instant
  spot_taker_fee: 0.001          # Binance spot taker, Regular User
  perp_taker_fee: 0.0005         # Binance USDⓈ-M futures taker, Regular User
  transfer_delay_hours: 0
  binance_withdrawal_fee_usdc: 0
  binance_withdrawal_min_usdc: 0
  hl_withdrawal_fee_usdc: 0
  top_up_trigger: 2.0
  healthy_ratio: 3.0
  maintenance_over_initial: 0.5
  leverage_table: seed/venue_facts/2026-10-25-binance_um_margin.csv
  transfers: batched             # with free instant transfers: cash first, spot only if none is left
  batch_share: 0
  idle_share: 1
  entry_parity_tolerance: 0.03  # frab's parity rule between spot and perp, at entry
  max_wait_hours: 24            # a held pair untradeable for longer is closed (declared)
  universe: all_paired
  leverage: {}

data:
  source: binance            # perp closes, bar highs, funding, spot closes: all Binance
  interval: "1h"
  include_spot: true
  spot_prices: own
  start: 2026-03-08          # the bars the Hyperliquid runs have (its 5000-candle cap)
  end: 2026-10-24

costs:
  taker_fee_bps: 7.5
  slippage_bps: 0.9

min_leg_notional: 50.0
simultaneous_legs: 2
unexpressed_mechanisms: []
noise_universe: held

sources:
  "entry_threshold_apr": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "phase2_exit_threshold": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "base_min_hold_hours": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "cap_min_hold_hours": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "safety_mult": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "signal_window_hours": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "concurrency_cap": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "budget_cap_usdc": "владелец 2026-10-25: «блин 90$ это вот очем а? на текущем Frab - так получилось. если нужно 300-400-1000 - давай считать на них.» Total budget; the slot count stays the live 4."
  "margin_buffer_factor": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "phase1_negative_patience": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "phase1_breakeven_cap_hours": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "neg_stop_threshold_apr": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "neg_stop_patience_hours": "seed/prod_params/2026-10-24-two_phase.json (frab.db strategies.params_json id 1, read-only)"
  "phase2_giveback_fee_mult": "funding-rate-arbitrage/src/frab/strategy/two_phase/params.py (TwoPhaseParams default; not in the live params_json)"
  "spot_taker_fee": "docs/FRAB_BINANCE_SPOT.md; https://www.binance.com/en/fee/schedule (Regular User, taker 0.100%, read 2026-10-25)"
  "perp_taker_fee": "docs/FRAB_BINANCE_SPOT.md; https://www.binance.com/en/support/articles/360033544231 (USDⓈ-M Futures, Regular User taker 0.05%, an example in the article; the live table https://www.binance.com/en/fee/futureFee could not be read, read 2026-10-25)"
  "transfer_delay_hours": "docs/FRAB_BINANCE_SPOT.md (a declared assumption: transfers between a user's own Binance spot and futures wallets are instant; Binance's own pages name no delay and no fee)"
  "binance_withdrawal_fee_usdc": "docs/FRAB_BINANCE_SPOT.md (a declared assumption: no fee for a transfer between one's own wallets on Binance; not confirmed by Binance's pages)"
  "binance_withdrawal_min_usdc": "docs/FRAB_BINANCE_SPOT.md (a declared assumption: no minimum for a transfer between one's own wallets)"
  "hl_withdrawal_fee_usdc": "docs/FRAB_BINANCE_SPOT.md (not used: no money leaves Binance)"
  "top_up_trigger": "funding-rate-arbitrage/src/frab/settings.py (MarginSettings default; a prod override is not visible from q-lab)"
  "healthy_ratio": "funding-rate-arbitrage/src/frab/settings.py (MarginSettings default; a prod override is not visible from q-lab)"
  "maintenance_over_initial": "derived: 2.5 / 5; Binance exchangeInfo, maintMarginPercent 2.5 over requiredMarginPercent 5.0 for every symbol (seed/venue_facts/2026-10-25-binance_um_margin.csv, read 2026-10-25)"
  "leverage_table": "seed/venue_facts/2026-10-25-binance_um_margin.csv (Binance exchangeInfo: requiredMarginPercent 5.0 as 20x, the same flat value for every symbol; per-symbol brackets are only served to a signed request)"
  "transfers": "docs/FRAB_BINANCE_SPOT.md (with free instant transfers there is nothing to batch: cash on the spot wallet goes to the margin first)"
  "batch_share": "docs/FRAB_BINANCE_SPOT.md (0: no batching, transfers are free)"
  "idle_share": "docs/FRAB_BINANCE_SPOT.md (1: idle margin is never withdrawn, transfers are free)"
  "entry_parity_tolerance": "funding-rate-arbitrage/src/frab/coin_discovery.py (SPOT_PERP_PARITY_TOLERANCE = 0.03, frab's own tolerance between a spot token and its perp before trading)"
  "max_wait_hours": "docs/FRAB_BINANCE_SPOT.md (a declared parameter: the live engine waits on missing data without a bound, which on a delisted pair holds a slot for ever; a day is declared, nothing sourced)"
  "universe": "docs/FRAB_BINANCE_SPOT.md (every coin with a Binance USDⓈ-M perpetual and a Binance USDT spot pair, delisted included; the owner's variant, 2026-10-25: «вариант всё на binance»)"
  "leverage": "docs/FRAB_BINANCE_SPOT.md (empty: the coin registry's values are Hyperliquid's; every coin is sized at the table's 20x)"
  "costs.taker_fee_bps": "derived: (5 + 10) / 2; Binance futures taker 0.05% and spot taker 0.100% (docs/FRAB_BINANCE_SPOT.md), both legs move by the same amount"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»; measured for Hyperliquid only, the same value is used here (unmeasured, docs/FRAB_BINANCE_SPOT.md)"
  "min_leg_notional": "venues/binance.yaml (min_leg_notional_usd: 50.0, Binance USDT-margined futures)"
