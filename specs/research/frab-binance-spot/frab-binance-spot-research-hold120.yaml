# Researcher's fix of 2026-10-28 for frab-binance-spot (docs/research/frab-binance-spot-2026-10-28.md).
# One of two fixes declared together before either ran (with frab-binance-spot-research-entry30);
# both are reported as a set.
#
# The copy of specs/research/frab-binance-spot/frab-binance-spot-300.yaml with ONE change:
# base_min_hold_hours 24 -> 120. Everything else, the owner's 300 budget and the four slots
# included, is verbatim.
#
# The loss it targets (drawdown evidence before the cut, data/research/frab-binance-spot-2026-10-28.md):
# at the 300 budget the flat-market days lose (selection period: flat +2.7% a year with a -1.85%
# fall, against +8.4% and -0.64% at the 1000 budget with the same decisions). In a flat market the
# rates of the small coins flip often, so a position may be closed after a day and its slot refilled,
# and every such rotation pays Binance's spot taker and a flat transfer fee. A five-day floor on the
# hold lets the exit rule act only after the position has had time to earn its round trip. The value
# is frab's own earlier hold floor, not fitted here.

idea_id: frab-binance-spot-research-hold120
title: "FRAB со спотом на Binance и контрактом на Hyperliquid, бюджет 300: держать позицию не меньше пяти суток, а не одних, чтобы реже платить за смену монет"
code_ref: "qlab.strategies.live.frab_binance_spot:LiveFrabBinanceSpot"

params_fixed_at: 2026-10-10
params_fixed_evidence: >
  declared by the researcher on 2026-10-28: fix designed on the data before 2026-10-10; at the 300
  budget the flat-market days lose because positions rotate after a day when small coins' rates flip,
  and each rotation pays the Binance spot taker and a flat transfer fee, so a five-day floor on the hold
  cuts the rotations. The 120 hours is frab's own earlier hold floor
  (research/portfolio_margin_sweep_expanded.py, «Config B — live prod : entry=0.10, exit=-0.10,
  min_hold=120h», and «Config A — research baseline» with the same 120h), not fitted here. The data
  after 2026-10-10 is the fix's forward test.

params:
  # frab's decision parameters: the live instance, verbatim, except the hold floor
  entry_threshold_apr: 0.1
  phase2_exit_threshold: -0.1
  base_min_hold_hours: 120      # THE FIX: was 24 (live); frab's earlier live and research floor
  cap_min_hold_hours: 720
  safety_mult: 5
  signal_window_hours: 8
  concurrency_cap: 4
  budget_cap_usdc: 300
  margin_buffer_factor: 3
  phase1_negative_patience: 24
  phase1_breakeven_cap_hours: 720
  neg_stop_threshold_apr: -0.15
  neg_stop_patience_hours: 6
  phase2_giveback_fee_mult: 1.0
  # Money on two venues (docs/FRAB_BINANCE_SPOT.md)
  spot_taker_fee: 0.001          # Binance spot taker, Regular User
  perp_taker_fee: 0.00045        # Hyperliquid perp taker, tier 0
  transfer_delay_hours: 1        # a top-up reaches Hyperliquid one bar after it is sent
  binance_withdrawal_fee_usdc: 0.4
  binance_withdrawal_min_usdc: 3
  hl_withdrawal_fee_usdc: 1
  top_up_trigger: 2.0
  healthy_ratio: 3.0
  maintenance_over_initial: 0.5
  leverage_table: seed/venue_facts/2026-10-25-hl_max_leverage.csv
  transfers: batched
  batch_share: 0.1      # a transfer moves at least a tenth of the budget (declared)
  idle_share: 0.25      # idle money on Hyperliquid above a quarter of the budget goes home (declared)
  entry_parity_tolerance: 0.03  # frab's parity rule between spot and perp, at entry
  max_wait_hours: 24            # a held pair untradeable for longer is closed (declared)
  universe: all_paired
  leverage: {AVAX: 3, BTC: 40, ETH: 25, HYPE: 10, PURR: 3, SOL: 20}

data:
  source: hyperliquid        # perp closes, bar highs, hourly funding
  spot_source: binance       # spot closes (USDT pair, re-quoted in USDC)
  interval: "1h"
  include_spot: true
  spot_prices: own
  start: 2025-01-01
  end: 2026-10-24

costs:
  taker_fee_bps: 7.25
  slippage_bps: 0.9

min_leg_notional: 10.0
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 300
simultaneous_legs: 2

unexpressed_mechanisms: []

noise_universe: held

