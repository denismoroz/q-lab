# FRAB's live decisions with the spot leg on Binance and the short on Hyperliquid.
# Written 2026-10-25, committed before its first run. Owner, 2026-10-25: «можно в
# qlab запусить frab на более чем 4-5 монетах. я знаю что HL ограничен в количестве
# spot pairs. я бы хотел прогнать вариант когда спот открывается на binance а
# хеджируется на HL. - поидее это новая стратегия.»
#
# A NEW strategy, not a FRAB variant: its own code
# (qlab.strategies.live.frab_binance_spot), so the registry's families do not fold it
# under `frab`, and its own place among the strategies in night/limits.yaml. The
# decisions are frab's own two-phase functions, with the live params of
# specs/frab-live.yaml (same four slots; the TOTAL budget is the owner's, below); what differs is the money:
# spot on Binance priced in USDC, perp and funding on Hyperliquid, margin for the
# short held separately on Hyperliquid and topped up from the spot's gains at a
# flat transfer fee. Every number below is cited in docs/FRAB_BINANCE_SPOT.md.
#
# VARIANT of specs/frab-binance-spot.yaml, written 2026-10-25: the same strategy on the
# five coins of the live FRAB that Binance lists (AVAX, BTC, ETH, HYPE, SOL; PURR has
# no Binance spot pair). Same data block, same money rules, same live params; only the
# universe differs. Against the HL-spot controls on the same five coins it measures the
# effect of the venue; against the all-paired spec, the effect of more coins.

idea_id: frab-binance-spot-five-coins
title: "FRAB со спотом на Binance и коротким контрактом на Hyperliquid, только пять монет живого FRAB (шестая, PURR, на Binance не торгуется): отделяет действие площадки от действия числа монет"
code_ref: "qlab.strategies.live.frab_binance_spot:LiveFrabBinanceSpot"

# Same decision rule as specs/frab-live.yaml, so same fixing date. The venue and
# margin parameters were chosen on 2026-10-25 from published fee schedules and
# Hyperliquid's margining rules, not fitted to data.
params_fixed_at: 2026-10-10
params_fixed_evidence: >
  funding-rate-arbitrage commit a0f5b5e (2026-10-10), «fix(two-phase): выход из POST только когда
  отданный фандинг покрыл комиссии круга» -- the last change to the decision functions this
  strategy calls (see specs/frab-live.yaml). The money parameters below (fees, transfer fees,
  margin thresholds) are the published and live values of 2026-10-25, cited one by one, and
  were not fitted to the data.
  The total budget (1000) is the owner's choice of 2026-10-25, «блин 90$ это вот очем а? на текущем Frab -
  так получилось. если нужно 300-400-1000 - давай считать на них.»: a size to be tried (300, 400 and 1000, four slots
  each), not a parameter fitted to data, so params_fixed_at stays the decision rule's date.
  The money-handling policy (`transfers: batched`) is the owner's wording of 2026-10-25, «а если без вывода спота.
  просто купили - продали. оставили там USDC. вывод когда наберется сумма либо реинвестирование», a rule of operation
  chosen from his words, not fitted to data.

params:
  # frab's decision parameters: the live instance, verbatim, as in specs/frab-live.yaml
  entry_threshold_apr: 0.1
  phase2_exit_threshold: -0.1
  base_min_hold_hours: 24
  cap_min_hold_hours: 720
  safety_mult: 5
  signal_window_hours: 8
  concurrency_cap: 4
  budget_cap_usdc: 1000
  margin_buffer_factor: 3
  phase1_negative_patience: 24
  phase1_breakeven_cap_hours: 720
  neg_stop_threshold_apr: -0.15
  neg_stop_patience_hours: 6
  phase2_giveback_fee_mult: 1.0
  # Money on two venues (docs/FRAB_BINANCE_SPOT.md)
  spot_taker_fee: 0.001          # Binance spot taker, Regular User
  perp_taker_fee: 0.00045        # Hyperliquid perp taker, tier 0
  transfer_delay_hours: 1        # a top-up reaches Hyperliquid one bar after it is sent
  binance_withdrawal_fee_usdc: 0.4
  binance_withdrawal_min_usdc: 3
  hl_withdrawal_fee_usdc: 1
  top_up_trigger: 2.0
  healthy_ratio: 3.0
  maintenance_over_initial: 0.5
  leverage_table: seed/venue_facts/2026-10-25-hl_max_leverage.csv
  # How money moves between the venues (qlab.strategies.live.frab_binance_spot.TRANSFERS):
  # batched = each venue keeps its own money (the owner, 2026-10-25); a transfer happens only
  # when the Hyperliquid margin ratio falls below the top-up threshold, when its free margin
  # cannot cover an entry, or when money idle there exceeds `idle_share` of the budget.
  # The two other policies (on_close, when_needed) are measured in docs/FRAB_BINANCE_SPOT.md.
  transfers: batched
  batch_share: 0.1      # a transfer moves at least a tenth of the budget (declared)
  idle_share: 0.25      # idle money on Hyperliquid above a quarter of the budget goes home (declared)
  entry_parity_tolerance: 0.03  # frab's parity rule between spot and perp, at entry
  max_wait_hours: 24            # a held pair untradeable for longer is closed (declared)
  universe: [AVAX, BTC, ETH, HYPE, SOL]
  # The coin registry's values for the coins it has; every other coin is sized at
  # its Hyperliquid max leverage from the table above.
  leverage: {AVAX: 3, BTC: 40, ETH: 25, HYPE: 10, PURR: 3, SOL: 20}

data:
  source: hyperliquid        # perp closes, bar highs, hourly funding
  spot_source: binance       # spot closes (USDT pair, re-quoted in USDC)
  interval: "1h"
  include_spot: true
  spot_prices: own
  start: 2025-01-01
  end: 2026-10-24

# Blended: both legs open and close together, so a turnover pays the Binance spot
# taker and the Hyperliquid perp taker in equal parts.
costs:
  taker_fee_bps: 7.25
  slippage_bps: 0.9

min_leg_notional: 10.0
simultaneous_legs: 2

# Transfers, the margin account and the liquidation check are expressed; what is
# simplified is listed in the module docstring and in docs/FRAB_BINANCE_SPOT.md.
unexpressed_mechanisms: []

noise_universe: held

sources:
