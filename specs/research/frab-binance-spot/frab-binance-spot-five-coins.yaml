  "binance_withdrawal_min_usdc": "seed/venue_facts/2026-10-25-binance_usdc_arbitrum_withdrawal.json (Binance public fee table, USDC on Arbitrum One, read 2026-10-25)"
  "hl_withdrawal_fee_usdc": "docs/FRAB_BINANCE_SPOT.md; https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/exchange-endpoint ($1 fee for withdrawing, read 2026-10-25)"
  "top_up_trigger": "funding-rate-arbitrage/src/frab/settings.py (MarginSettings default; a prod override is not visible from q-lab)"
