# Trend with monthly re-tuning, switched off when the market is flat
# (docs/research/trend-2026-10-25.md, hypothesis 2).
#
# Copy of specs/trend-retune-monthly.yaml wrapped in RegimeGate; the inner
# Retune spec is unchanged. The only change is the gate: trade in bull and
# bear, hold nothing in flat. The idea comes from the registry's regime
# breakdown of trend-retune-monthly (trial 75308): flat days are 48% of its
# forward test and earn nothing there. The idea was formed after seeing those
# days, so they are in-sample for it: it is fixed today and its forward test
# starts today.

idea_id: trend-research-skip-flat
title: 'Trend с перенастройкой раз в месяц, без торговли в боковике'
code_ref: qlab.strategies.regime_gate:RegimeGate
params_fixed_at: 2026-10-25
params_fixed_evidence: >
  declared by the researcher on 2026-10-25: trend's edge lives in bull and
  bear markets and is lost in flat ones, so holding nothing on days the
  past-only detector calls flat keeps the return and cuts the drawdown.
  Formed after seeing the regime breakdown of trend-retune-monthly (trial
  75308), so everything up to 2026-10-25 is in-sample for the gate.
params:
  trade_in:
  - bull
  - bear
  inner_code_ref: qlab.strategies.retune:Retune
  inner_params:
    inner_code_ref: qlab.strategies.live.trend:LiveTrendTSMOMEnsemble
    base_params:
      coins: null
      capital_usd: 3000.0
      lookbacks:
      - 30
      - 60
      - 90
      - 120
      vol_window: 30
      vol_target_daily: 0.02
      leverage_cap: 3.0
      risk_scale: 0.2
      book_vol_target_ann: 0.14
      book_vol_window_days: 60
      book_vol_min_days: 20
      book_vol_scale_min: 0.25
      book_vol_scale_max: 2.0
      book_vol_prior_ann: 0.3
      min_history_days: 151
      top_k_requires_history: true
    grid:
      universe:
        cap:
          top_k_by_market_cap: 25
          exclude_tags:
          - stablecoin
        volume:
          top_k_by_volume: 25
      lookbacks:
        ens:
          lookbacks:
          - 30
          - 60
          - 90
          - 120
        l30:
          lookbacks:
          - 30
        l60:
          lookbacks:
          - 60
        l90:
          lookbacks:
          - 90
        l120:
          lookbacks:
          - 120
    refit_every: M
    window: expanding
    objective: sharpe_net
    score_costs:
      taker_fee_bps: 3.5
      slippage_bps: 0.9
data:
  source: hyperliquid
  interval: 1d
  start: '2025-01-01'
  end: '2026-09-20'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
unexpressed_mechanisms: []

regime_claim:
  bull: earns
  bear: earns

sources:
  "code_ref": "src/qlab/strategies/regime_gate.py (existing wrapper; default detector)"
  "trade_in": "data/research/trend-2026-10-25.md, trend-retune-monthly trial 75308: regime_flat_sharpe -0.1459 on 232 of 480 days, regime_bull_sharpe 1.405, regime_bear_sharpe 1.29"
  "inner_code_ref": "specs/trend-retune-monthly.yaml (unchanged)"
  "inner_params": "specs/trend-retune-monthly.yaml params, unchanged; their sources are listed there"
  "costs.differs_from_table": "3.5 + 0.9 bp are not the hyperliquid row of night/costs.yaml (4.5 + 0.9 bp); numbers recorded before the table (2026-10-29) and kept, as cited at costs.taker_fee_bps: funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.taker_fee_bps": "funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»"
  "min_leg_notional": "funding-rate-arbitrage/src/frab/strategy/trend/params.py (TrendParams defaults), min_order_usd: HL's own minimum order"
  "regime_claim.bull": "funding-rate-arbitrage/research/trend_following/FINDINGS.md: «2021 +65%», «2022 +5%»"
  "regime_claim.bear": "funding-rate-arbitrage/research/trend_following/FINDINGS.md: «Медвежий 2022-й впервые в выборке: книга в плюсе, но слабом — заявка на «crisis alpha» подтверждается едва»"
