# Bv3's coins chosen by code, not by the researcher (owner, 2026-11-04, «да, делай оба»;
# docs/IDEA_STANDARD.md, «Монеты: сужать молча нельзя»).
#
# Why this spec exists. The first Bv3 check (specs/research/bv3/bv3-research-fast-release.yaml)
# runs on BTC and ETH only. The owner never asked for two coins: the production Bv2 book holds
# BTC, ETH, SOL and AVAX (specs/bv2-live.yaml), and the researcher cut the list to two because it
# built the experiment on its own earlier two-coin experiment (bv2-research-btceth), whose reason
# («SOL and AVAX are the coins that whipsaw the hedge») was a guess nobody had measured. Here the
# coins are chosen by CODE: each day, the K coins with the largest 30-day traded value on Binance,
# among the coins that have both a perpetual and a spot market. K is a declared choice (2, 4, 6),
# which code picks every month from the past only, so the guess about SOL and AVAX is tested
# instead of taken on faith: if a small K wins, the data said so.
#
# What is the same as bv3-research-fast-release: the mechanism (the block
# qlab.strategies.agent.fast_release_gate: the slow rule of the live book decides whether the coin
# is falling, the coin's own return over the last fast_window_hours bars releases the hedge as soon
# as it is above zero), the production Bv2 numbers, Binance's history from the start of the data.
#
# What is different:
#   1. The coins. `params.universe` is the rule {top_liquid, n = K, rebalance = every day,
#      by = the perpetual's traded value, window_days = 30}: the same definition as
#      qlab.knowable_coins (a coin competes after it has been listed for the whole 30 days; the
#      rank reads the earlier days only, never the day itself). Only the coins whose perpetual AND
#      spot both have a price that day can open a book, because the book holds the spot; a coin
#      that is in the first K by the perpetual's value but has no spot leg is skipped and the next
#      coin takes its place, and the run counts such coin-days (counts["universe_top_without_spot"]).
#      A coin that leaves the first K has its hedge bought back and its spot sold at the next
#      rebalance (qlab.strategies.live._bv2_mechanisms, `_leave`), at the book's own costs, and its
#      money is split among the coins that join.
#   2. The list of candidates is every coin that was EVER among the first 6 by the 30-day traded
#      value of Binance's perpetuals and has a spot candle file in the lab's cache: 70 coins,
#      made by code on 2026-11-04 (qlab.top_coins.coins_ever_in_top(read_daily_value(
#      data/raw/binance/1d), k=6, window_days=30, among=<coins with a cached Binance spot file>)).
#      It is not a list somebody picked: K = 2 and 4 are inside K = 6, so no coin that could
#      rank is missing, and no future knowledge enters (the rank on a day reads earlier days only).
#      Coins whose spot candles exist only for part of the history are held only for that part;
#      `data.spot_prices: own` prices the spot leg at the spot market's own closes.
#   3. The money. K is a choice, so the book's money cannot be K x 64.25: it would change with the
#      thing being chosen and the candidates would not be comparable. The strategy works on the
#      money of the production Bv2 book, 257 (specs/bv2-live.yaml: 4 coins x 64.25), split equally
#      among the K coins held; every percent is of 257. With K = 4 it is exactly the production
#      per-coin money; with K = 2 each coin has 128.5; with K = 6, 42.8 (the hedge of the smallest
#      position, half of 42.8 = 21, is above the 10-dollar minimum order).
#   4. Leverage and maintenance margin: the values production gives BTC, ETH, SOL and AVAX; every
#      other coin takes the production defaults (leverage 1.0, maintenance 0.05).
#   5. sticky_exit_hours is fixed at 0, not a choice: with K (3 values) and fast_window_hours (2) the
#      product is 6, and a third axis (0 or 12) would make 12 variants, above the 8 the lab allows
#      one spec (night/own_numbers.yaml, max_candidates), each of which is a trial the verdict is
#      deflated by. 0 is the owner's "lifted more often" read literally, the reading
#      bv3-research-fast-release already tests together with 12; 12 can be a next experiment.
#   6. measure_hedge_timing is off: the coins change over time, and a shifted-hedge measure of
#      the held coins has no single coin set to shift (the timing of this mechanism is judged by
#      the verdict and the noise bar).
#
# Heavy data: 140 columns of hourly candles from 2019 (70 coins, perpetual and spot) is more than
# the night's limit (night/twins.yaml, max_hourly_instruments 40), so the night does not fetch it
# by itself; it is run by hand (`qlab twins run --only bv3-research-topk-coins --allow-heavy`) or
# after the limit is raised by the owner.

idea_id: bv3-research-topk-coins
title: "Bv3: монеты выбирает код — каждый день первые K по обороту за 30 дней на Binance (K = 2, 4, 6), страховку снимают по росту монеты за 12 или 24 часа"
code_ref: "qlab.strategies.agent.fast_release_gate:FastReleaseGate"

plain_title: "Страховка, которую снимают на отскоке, и монеты, которые выбирает код, а не человек"
plain_summary: >-
  Владелец не просил держать Bv3 на двух монетах: боевая книга Bv2 держит четыре (BTC, ETH, SOL,
  AVAX). Исследователь сам сузил список до двух, опираясь на своё прежнее предположение, что SOL и
  AVAX «дёргают» страховку, — но это предположение никто не проверял. Здесь монеты выбирает код:
  каждый день он берёт первые K монет по обороту за последние 30 дней на бирже Binance (оборот —
  сколько денег в монете прошло через торги), только из тех, у кого есть и обычный рынок, и
  бессрочный контракт (ставка на цену монеты без даты окончания). Число K — одно из трёх: 2, 4
  или 6; каждый месяц код сам выбирает лучшее по прошлому. Деньги стратегии те же, что у боевой
  Bv2, — 257 долларов, поровну между теми монетами, которые держим. Монета, которая вышла из
  первых K, продаётся вместе со страховкой при следующей перестановке. Страховка включается, когда
  монета падает две и четыре недели подряд, а снимается, как только сама монета выросла за
  последние 12 или 24 часа. Выберет код малое K — значит, догадка про SOL и AVAX была верна;
  выберет большое — значит, нет. Риск: у монет из хвоста списка (новых и мелких) слабее рынок,
  шире разрыв цены и дороже вход и выход, а частые перестановки стоят комиссий.

