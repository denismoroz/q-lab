  # market's own close, not the perp's price (docs/SPOT_PRICES.md).
  spot_prices: own
  source: binance
  interval: "1h"
  start: 2019-09-08
  end: 2026-10-30
  instruments: ["1000BONK", "1000BONK-SPOT", "1000LUNC", "1000LUNC-SPOT", "1000PEPE", "1000PEPE-SPOT", "1000SHIB", "1000SHIB-SPOT", "ADA", "ADA-SPOT", "APE", "APE-SPOT", "APT", "APT-SPOT", "ARB", "ARB-SPOT", "ARPA", "ARPA-SPOT", "ATOM", "ATOM-SPOT", "AVAX", "AVAX-SPOT", "AXS", "AXS-SPOT", "BAND", "BAND-SPOT", "BANK", "BANK-SPOT", "BCH", "BCH-SPOT", "BNB", "BNB-SPOT", "BTC", "BTC-SPOT", "CFX", "CFX-SPOT", "CHZ", "CHZ-SPOT", "CYBER", "CYBER-SPOT", "DOGE", "DOGE-SPOT", "DOGS", "DOGS-SPOT", "DOT", "DOT-SPOT", "ENA", "ENA-SPOT", "ETC", "ETC-SPOT", "ETH", "ETH-SPOT", "FIL", "FIL-SPOT", "FTM", "FTM-SPOT", "GALA", "GALA-SPOT", "GAS", "GAS-SPOT", "GMT", "GMT-SPOT", "HYPE", "HYPE-SPOT", "LINK", "LINK-SPOT", "LPT", "LPT-SPOT", "LRC", "LRC-SPOT", "LTC", "LTC-SPOT", "LUNA", "LUNA-SPOT", "MANA", "MANA-SPOT", "MASK", "MASK-SPOT", "MATIC", "MATIC-SPOT", "NEAR", "NEAR-SPOT", "NEIRO", "NEIRO-SPOT", "NOT", "NOT-SPOT", "OP", "OP-SPOT", "ORDI", "ORDI-SPOT", "PEOPLE", "PEOPLE-SPOT", "RARE", "RARE-SPOT", "RUNE", "RUNE-SPOT", "SAND", "SAND-SPOT", "SOL", "SOL-SPOT", "SUI", "SUI-SPOT", "SUSHI", "SUSHI-SPOT", "SXP", "SXP-SPOT", "TAO", "TAO-SPOT", "TON", "TON-SPOT", "TRB", "TRB-SPOT", "TRUMP", "TRUMP-SPOT", "TRX", "TRX-SPOT", "UNI", "UNI-SPOT", "VET", "VET-SPOT", "WIF", "WIF-SPOT", "WLD", "WLD-SPOT", "WLFI", "WLFI-SPOT", "XLM", "XLM-SPOT", "XPL", "XPL-SPOT", "XRP", "XRP-SPOT", "XTZ", "XTZ-SPOT", "YFI", "YFI-SPOT", "ZEC", "ZEC-SPOT", "ZIL", "ZIL-SPOT"]

costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9

min_leg_notional: 10.0
# The strategy's own money: the production Bv2 book's 257 (4 coins x 64.25), the base of every
# percent, split equally among the K coins held (see the header, item 3).
strategy_capital_usd: 257.0
simultaneous_legs: 2
# Binance is the DATA proxy; orders would go to Hyperliquid (as the base; docs/VENUES.md section 9).
execution_venue: hyperliquid

# Random books for the noise bar trade only the coins this book ever holds (docs/HEDGE_TIMING.md).
noise_universe: held

measure_hedge_timing: false

unexpressed_mechanisms: []

required_instruments: null

regime_claim:
  bull: earns
  bear: beats_market

# The lists the one check chooses among, every month from the past only (docs/ONE_CHECK.md):
# 3 x 2 = 6 variants, each a trial of its own.
choice:
  axes:
    universe.n: [2, 4, 6]
    fast_window_hours: [12, 24]
  source: "docs/IDEA_STANDARD.md, cards/bv2-fast-release-by-own-trend.yaml"

