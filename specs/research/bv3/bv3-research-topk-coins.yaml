  fast_window_hours: 12
  fast_entry: 0
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 0
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {BTC: 3.0, ETH: 2.0, SOL: 1.5, AVAX: 1.5}
  default_leverage: 1.0
  maint_margin_rate: {BTC: 0.0125, ETH: 0.02, SOL: 0.025, AVAX: 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper

data:
