# Researcher's experiment (docs/research/bv2-2026-10-30.md, section 5): the owner's main idea,
# the ten most liquid coins hedged on Hyperliquid, in its cold-wallet form with one margin pool.
#
# Copy of specs/bv2-owner-ideas/bv2-m-top10-h15-pool.yaml. That measurement and bv2-m-top10 have no
# routed trial in the registry, so the owner's idea has no verdict. What differs from the copy:
# the idea_id and title, the fixation day the code names for this window, and the
# strategy_capital_usd field the ladder compares the needed capital with. No number of the
# book, the coin rule or the pool changes.

idea_id: bv2-research-top10-pool
title: "Bv2 на 10 самых ликвидных монетах, общий залог, запас 1.5, список каждый месяц по прошлому обороту (эксперимент исследователя 30.10)"
code_ref: "qlab.strategies.live.bv2:LiveBv2"
params_fit_from: 2023-06-01
params_fixed_at: 2025-08-02
params_fixed_evidence: >
  declared by the researcher on 2026-10-30: fix designed on the data before 2025-08-02; ten coins
  chosen monthly by trailing spot volume spread each coin's whipsaw over the book, and one margin
  pool removes the partial hedges of separate pools, so the book's falls should be no deeper than
  a separate-pool ten-coin book while it keeps the protection on falling days. The design rests on
  the «выбор» (2023-06 .. 2025-05) columns of docs/BV2_MARGIN.md: pool 1.5 drawdown -7.9% against
  -8.9%, 0 partial hedges against 20, and of docs/BV2_BASKETS.md, where the ten-coin book is worse
  than the four production coins before the cut (+25.0% and -8.9% against +36.3% and -6.4%), so
  the experiment answers the owner's question and is not expected to beat them. Headroom 1.5 is
  b2_cold's, the owner's cold-wallet book. Disclosed: the researcher has read the «вперёд» columns
  of both documents, which overlap this spec's forward stretch; they were not used to choose the
  fix or a number. The candidate list keeps a small look-ahead (coins at least 4 of 175 weeks in
  the top ten over the whole window, docs/BV2_BASKETS.md); a list built by code is idea-0007.
params:
  universe: {"rule": "top_liquid", "n": 10, "rebalance": "monthly", "by": "spot_dollar_volume", "window_days": 30, "candidates": ["BNB", "BTC", "ETH", "SOL", "XRP", "DOGE", "SUI", "TRX", "ADA", "ZEC", "WIF", "ARB", "LTC", "MATIC", "AVAX", "LINK", "WLD", "BOME", "ENA", "TRUMP", "NEAR", "NOT", "ORDI", "PAXG", "BCH", "ASTER", "TAO", "OP", "PEOPLE", "NEIRO", "TON", "XLM", "TRB", "FET", "HIFI", "SEI", "DEXE", "EDU", "GAS", "PENGU", "RNDR", "UNI", "XPL"]}
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {"BTC": 3.0, "ETH": 2.0, "SOL": 1.5, "AVAX": 1.5}
  default_leverage: 1.5
  maint_margin_rate: {"BTC": 0.0125, "ETH": 0.02, "SOL": 0.025, "AVAX": 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.5
  rebalance_at_im_share: 0.5
  mode: "paper"
  shared_margin: true

data:
  source: binance
  interval: "1h"
  start: 2023-04-28
  end: 2026-09-20
  instruments: ["ADA", "ADA-SPOT", "ARB", "ARB-SPOT", "ASTER", "ASTER-SPOT", "AVAX", "AVAX-SPOT", "BCH", "BCH-SPOT", "BNB", "BNB-SPOT", "BOME", "BOME-SPOT", "BTC", "BTC-SPOT", "DEXE", "DEXE-SPOT", "DOGE", "DOGE-SPOT", "EDU", "EDU-SPOT", "ENA", "ENA-SPOT", "ETH", "ETH-SPOT", "FET", "FET-SPOT", "GAS", "GAS-SPOT", "HIFI", "HIFI-SPOT", "LINK", "LINK-SPOT", "LTC", "LTC-SPOT", "MATIC", "MATIC-SPOT", "NEAR", "NEAR-SPOT", "NEIRO", "NEIRO-SPOT", "NOT", "NOT-SPOT", "OP", "OP-SPOT", "ORDI", "ORDI-SPOT", "PAXG", "PAXG-SPOT", "PENGU", "PENGU-SPOT", "PEOPLE", "PEOPLE-SPOT", "RNDR", "RNDR-SPOT", "SEI", "SEI-SPOT", "SOL", "SOL-SPOT", "SUI", "SUI-SPOT", "TAO", "TAO-SPOT", "TON", "TON-SPOT", "TRB", "TRB-SPOT", "TRUMP", "TRUMP-SPOT", "TRX", "TRX-SPOT", "UNI", "UNI-SPOT", "WIF", "WIF-SPOT", "WLD", "WLD-SPOT", "XLM", "XLM-SPOT", "XPL", "XPL-SPOT", "XRP", "XRP-SPOT", "ZEC", "ZEC-SPOT"]

costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9

min_leg_notional: 10.0
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 257
simultaneous_legs: 2
# Binance is the DATA proxy; orders would go to Hyperliquid, whose costs and minimum leg this spec
# already uses, so the venue facts (adapter, uncovered-leg recovery) are Hyperliquid's
# (StrategySpec.execution_venue, docs/VENUES.md section 9). No number changes.
execution_venue: hyperliquid

noise_universe: held
measure_hedge_timing: false
unexpressed_mechanisms: []
differs_from_source:
  - "the perp is Binance's, not Hyperliquid's: Hyperliquid listed fewer coins early, so a coin can be held here on a date it could not yet be hedged there"
regime_claim:
  bull: earns
  bear: beats_market

