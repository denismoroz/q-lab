# Owner, 2026-10-29: «сливай и ставь опыт на стенде» -- the graded hedge the programmer added to frab
# (request 2026-10-26-1, merged as frab 02cfd7d): the researcher's memo docs/research/bv2-2026-10-26.md,
# section 5 item 4, «hedge a part by the strength of the signal», never tested. The hedged share of
# the spot is the mean over the 14- and 30-day windows of how far each return is below the hedge
# threshold, as a share of graded_hedge_depth (capped at 1); one window down opens a partial hedge
# (owner, 2026-10-29: «да включать»). graded_hedge_depth 0 is today's on/off hedge (the base).
# Its open parameter is chosen by code on the data before the cut and judged after it
# (qlab.own_numbers, docs/OWN_NUMBERS.md); every value is a trial.
# THE ONLY CHANGES against specs/research/bv2/bv2-research-partial-hedge.yaml: graded_hedge_depth in
# place of the half-or-whole sideways share (the two are alternatives in frab), and data to
# 2026-10-28. Same live frab book and production parameters as specs/bv2-live.yaml; Binance is a
# DATA proxy, costs stay Hyperliquid's.

idea_id: bv2-research-graded-hedge
title: 'Bv2: страховать долю монет по силе сигнала (глубина выбирается до отреза), Binance'
code_ref: qlab.strategies.live.bv2:LiveBv2
params_fixed_at: 2025-06-01
params_fixed_evidence: >
  funding-rate-arbitrage/research/strategy_b_v2/REPORT.md, «Результаты»: «| | обучение 2023-06—2025-05 | проверка 2025-06—2026-05 | вперёд 2026-06—09 |»
  -- the parameters were fitted on 2023-06 … 2025-05 and the following year only checked against
  rules declared before («Дальше подкручивать по проверочному году нельзя»). The coin list
  BTC/ETH/SOL/AVAX comes from the same research («только монеты HL»). Committed later in frab
  commits f2a0e3f, bd470b0, 4b7fced, 58ed2c5 (2026-09-13) with two changes not fitted on the check
  year: the margin model (execution realism, REPORT.md «Маржа по-честному», compared on the
  training years) and carry off (REPORT.md «Как читать честно», 5: it duplicates FRAB's positions).
  Owner, 2026-10-04: «разделять backtest and forward test».
params:
  coins:
  - BTC
  - ETH
  - SOL
  - AVAX
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage:
    BTC: 3.0
    ETH: 2.0
    SOL: 1.5
    AVAX: 1.5
  default_leverage: 1.0
  maint_margin_rate:
    BTC: 0.0125
    ETH: 0.02
    SOL: 0.025
    AVAX: 0.05
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper
  graded_hedge_depth: [0.05, 0.1, 0.2]
data:
  source: binance
  interval: 1h
  # A fresh book at the start of the fitting window, as production creates
  # one: frab sizes each coin's position in dollars once, at creation, and
  # does not compound (book.py CoinBook.new; the ratchet sells growth above
  # 1.5x). Started in 2019 the book held ~15% of its equity in the market by
  # 2025 and its percentages were diluted fourfold -- the "+2.0% forward" read
  # as decay by the researcher and the assessor (docs/HEDGE_TIMING.md,
  # 2026-10-24). 788 hours before 2023-06-01 (the live engine's
  # HISTORY_BARS + WARMUP_BARS, qlab.strategies.live.bv2) so the book starts
  # by the window's first day. The 2019-2023 run is recorded in
  # docs/FIT_VS_FORWARD.md (trial 19811).
  start: '2023-04-28'
  end: '2026-10-28'
  instruments:
  - AVAX
  - AVAX-SPOT
  - BTC
  - BTC-SPOT
  - ETH
  - ETH-SPOT
  - SOL
  - SOL-SPOT
costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 2
# Binance is the DATA proxy; orders would go to Hyperliquid, whose costs and minimum leg this spec
# already uses, so the venue facts (adapter, uncovered-leg recovery) are Hyperliquid's
# (StrategySpec.execution_venue, docs/VENUES.md section 9). No number changes.
execution_venue: hyperliquid

# Random books for the noise bar trade only the coins this book holds
# (StrategySpec.noise_universe): the coin list is fixed, the question is the
# book's decisions on it. With the whole panel, a random book on strategy-b-v2
# moved its weights onto Hyperliquid memecoins and made +212% a year
# (docs/HEDGE_TIMING.md, 2026-10-24).
noise_universe: held

# Whether the book picks WHEN to hedge better than chance (docs/HEDGE_TIMING.md).
measure_hedge_timing: false
unexpressed_mechanisms: []
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
regime_claim:
  bull: earns
  bear: beats_market
sources:
  graded_hedge_depth: 'night/own_numbers.yaml 2026-10-29.1, the declared list for graded_hedge_depth; owner 2026-10-29: «сливай и ставь опыт на стенде»'
  costs.taker_fee_bps: 'derived: (7.0 + 3.5) / 2; spot taker 0.00070 and perp taker 0.00035 in funding-rate-arbitrage/src/frab/constants.py,
    both legs move by the same amount'
  costs.slippage_bps: 'derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4
    б.п. на ногу (taker 3.5 + проскальзывание)»'
  min_leg_notional: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export),
    min_order_usd
  coins: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)
