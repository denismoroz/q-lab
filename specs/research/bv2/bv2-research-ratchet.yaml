# Researcher's experiment (docs/research/bv2-2026-10-03.md, hypothesis 3): if the hedge is
# structurally late -- and frab's own limits study measured how late (median 12% below the
# 60-day high at switch-on) -- then the lever that does not require predicting the turn is
# to carry less unhedged spot into it. The ratchet sells spot growth back to target; at 0.25
# it does so twice as often as at the production 0.50.
#
# Copy of specs/bv2-live.yaml -- same live frab book, same production `b2` parameters, same
# data, same costs. ONE number differs: ratchet_threshold 0.5 -> 0.25, a value of the grid
# frab declared before its run (LIMITS.md §1, «храповик 0.25/0.5/1.0»), where all 36
# combinations gave +33…52% a year on data the rules were not chosen on.

idea_id: bv2-research-ratchet
title: "Bv2 как на проде, но храповик срабатывает при +25%, а не +50% (эксперимент исследователя 3)"
code_ref: "qlab.strategies.live.bv2:LiveBv2"

params_fixed_at: 2026-10-03
params_fixed_evidence: >
  declared by the researcher on 2026-10-03: the hedge switches on when the price is already far below the high, so the cheapest remedy is to hold less unhedged spot into the fall -- a tighter ratchet, from the grid frab declared before its own run

params:
  coins: [BTC, ETH, SOL, AVAX]
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  # THE ONLY CHANGE against specs/bv2-live.yaml.
  ratchet_threshold: 0.25
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {BTC: 3.0, ETH: 2.0, SOL: 1.5, AVAX: 1.5}
  default_leverage: 1.0
  maint_margin_rate: {BTC: 0.0125, ETH: 0.02, SOL: 0.025, AVAX: 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper

data:
  source: hyperliquid
  interval: "1h"
  include_spot: true
  start: 2025-01-01
  end: 2026-10-01

costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9

min_leg_notional: 10.0
simultaneous_legs: 2

unexpressed_mechanisms: []

required_instruments: [BTC-SPOT, ETH-SPOT, SOL-SPOT, AVAX-SPOT, BTC, ETH, SOL, AVAX]

regime_claim:
  bull: earns
  bear: beats_market

sources:
  "costs.taker_fee_bps": "derived: (7.0 + 3.5) / 2; spot taker 0.00070 and perp taker 0.00035 in funding-rate-arbitrage/src/frab/constants.py, both legs move by the same amount"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»"
  "min_leg_notional": "seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export), min_order_usd"
  "coins": "seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)"
  "capital_usd": "seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)"
