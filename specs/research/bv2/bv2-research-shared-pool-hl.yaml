# Researcher's experiment (docs/research/bv2-2026-10-26.md, fix 1 on the venue it would trade on):
# one HL margin pool for all four coins instead of one pool per coin -- the owner's «трюк с FRAB
# с плечем и страховкой» (night/research.yaml, strategies.bv2.owner_ideas; docs/BV2_MARGIN.md,
# direction 1, handed to the researcher by the owner: «давай»).
#
# Copy of specs/bv2-live.yaml (the production b2 book, headroom 1.0, on Hyperliquid).
# THE ONLY CHANGES: shared_margin: true; the fixed date is the drawdown evidence's cut; the data
# runs to 2026-10-25 so the stretch after the cut exists. The same fix on Binance's long history is
# specs/research/bv2/bv2-research-shared-pool.yaml; this one exists because only on Hyperliquid can
# the stand measure the legs' simultaneous execution and so give a route, and because the book's
# whole four-coin history here is short (UAVAX spot from 2026-05-06): the result is preliminary.

idea_id: bv2-research-shared-pool-hl
title: "Bv2 как на проде (запас 1.0), но залог один на все четыре монеты, Hyperliquid (эксперимент исследователя 26.10, исправление 1)"
code_ref: "qlab.strategies.live.bv2:LiveBv2"

params_fixed_at: 2026-08-28
params_fixed_evidence: >
  declared by the researcher on 2026-10-26: fix designed on the data before 2026-08-28; with one
  pool for all coins a hedge that turns on after its spot grew above target (the ratchet lets it
  reach 1.5x while a 1.0 pool reserves margin for 1.0x) is opened in full from the other coins'
  idle margin, so less spot falls unhedged and the flat-market losses of 2026-07 .. 2026-08 (the
  evidence file data/research/bv2-2026-10-26.md, section of
  specs/research/bv2/bv2-research-headroom-retune.yaml: flat -2.1% over 58 days, worst month
  2026-07 -2.3%, drawdown 2026-07-06 -> 2026-08-18 -3.0%) are shallower. The cut is that
  section's. Nothing else changes: the headroom stays production's 1.0.

params:
  coins: [BTC, ETH, SOL, AVAX]
  capital_usd: 257.0
  spot_share: 0.5
  hedge_threshold: 0.0
  sticky_exit_hours: 12
  ratchet_threshold: 0.5
  carry_enabled: false
  carry_fraction: 0.6
  carry_entry_apr: 0.1
  carry_exit_hours: 24
  slippage: 0.0005
  min_order_usd: 10.0
  margin_enabled: true
  short_leverage: {BTC: 3.0, ETH: 2.0, SOL: 1.5, AVAX: 1.5}
  default_leverage: 1.0
  maint_margin_rate: {BTC: 0.0125, ETH: 0.02, SOL: 0.025, AVAX: 0.05}
  default_maint_margin_rate: 0.05
  margin_buffer: 0.1
  hedge_margin_headroom: 1.0
  rebalance_at_im_share: 0.5
  mode: paper
  # THE ONLY PARAMETER CHANGE against specs/bv2-live.yaml.
  shared_margin: true

data:
  source: hyperliquid
  # The live book counts its windows in hourly bars (14d = 336, 30d = 720).
  interval: "1h"
  include_spot: true
  start: 2025-01-01
  end: 2026-10-25

costs:
  taker_fee_bps: 5.25
  slippage_bps: 0.9

min_leg_notional: 10.0
# The strategy's own money, the base of every percent and the sum step 4 of the ladder
# compares the capital a run needed with (docs/LADDER.md; cited in sources).
strategy_capital_usd: 257
simultaneous_legs: 2

noise_universe: held

measure_hedge_timing: true

unexpressed_mechanisms: []

required_instruments: [BTC-SPOT, ETH-SPOT, SOL-SPOT, AVAX-SPOT, BTC, ETH, SOL, AVAX]

regime_claim:
  bull: earns
  bear: beats_market

sources:
  "strategy_capital_usd": "the spec's own parameter capital_usd = 257: seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json, read-only export)"
  "costs.differs_from_table": "5.25 + 0.9 bp are not the hyperliquid row of night/costs.yaml (4.5 + 0.9 bp); numbers recorded before the table (2026-10-29) and kept, as cited at costs.taker_fee_bps: derived: (7.0 + 3.5) / 2; spot taker 0.00070 and perp taker 0.00035 in funding-rate-arbitrage/src/frab/constants.py, both legs move by the same amount"
  "costs.taker_fee_bps": "derived: (7.0 + 3.5) / 2; spot taker 0.00070 and perp taker 0.00035 in funding-rate-arbitrage/src/frab/constants.py, both legs move by the same amount"
