unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of bv2-research-partial-hedge: the numbers it trades are chosen by code, every month, from
  returns realised before the choice (the declared lists of night/own_numbers.yaml); the data is Binance''s
  history, a proxy for binance''s market, with the original''s costs and minimum leg.'
- 'The twin trades only 8 named columns (AVAX, AVAX-SPOT, BTC, BTC-SPOT, ETH, ETH-SPOT, SOL, SOL-SPOT),
  the data.instruments of bv2-research-partial-hedge, not the whole market: the list was chosen by 2025-06-01
  and would know which coins survived if applied to the history before it (survivorship), so the twin
  is judged only from 2025-06-01 (judged_from = instruments_chosen_at); the days from 2019-09-08 are warm-up
  for the choice (docs/RETUNE.md, docs/FIT_VS_FORWARD.md).'
noise_universe: held
measure_hedge_timing: false
required_instruments:
- BTC-SPOT
- ETH-SPOT
- SOL-SPOT
- AVAX-SPOT
- BTC
- ETH
- SOL
- AVAX
params_fixed_at: '2019-11-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  data starts 2019-09-08; the longest warm-up read from the parameters is 1 days (carry_exit_hours = 24),
  so the book can first trade on 2019-09-09; a candidate is eligible only after one whole month re-tuning
  period, so the first re-tuning after 2019-09-09 is 2019-10-01 and the first choice is made at the one
  after it, 2019-11-01. This is warm-up arithmetic read generically from the parameters (every day, hour,
  window and lookback number, whatever the strategy does with it), not a result. If the strategy needs
  more than the parameters show (enough instruments listed on Binance, a signal that waits for history),
  the true first choice is later and the days before it are judged as flat days. The grid is the whole
  declared list of each open parameter (partial_hedge_share) from night/own_numbers.yaml, 2 candidates.
  What this does not prove: the lists were declared in night/own_numbers.yaml (version 2026-10-26.2) before
  this twin ran; what was seen of the history when they were declared is not recorded, so the choice is
  only as honest as the lists are (the spec''s own date for its numbers: 2025-06-01). The instrument list
  is not point-in-time before 2025-06-01. The twin trades only the 8 columns AVAX, AVAX-SPOT, BTC, BTC-SPOT,
  ETH, ETH-SPOT, SOL, SOL-SPOT (data.instruments of bv2-research-partial-hedge) (hourly candles of every
  Binance perpetual take hours; these take about 3 minutes). A list chosen by hand and applied to history
  from 2019-09-08 knows which coins existed and survived, which the days before it was chosen did not;
  a coin Binance listed later has no candles before its listing day and enters then. The earliest documented
  day the list existed is 2025-06-01 (params_fixed_at of bv2-research-partial-hedge), so the twin is judged
  only from that day (`judged_from` = `instruments_chosen_at` = 2025-06-01): the history before it is
  warm-up for the code''s monthly choice (more data to choose with), not judged, and from that day the
  stand counts the list as point-in-time (docs/FIT_VS_FORWARD.md).'
judged_from: '2025-06-01'
