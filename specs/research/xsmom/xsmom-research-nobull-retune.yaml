# Researcher's fix of 2026-10-26 for XSMOM (docs/research/xsmom-2026-10-26.md, hypothesis 1),
# tested on Binance's long history. One of two experiments declared together before either ran
# (with xsmom-research-nobull); both are reported as a set.
#
# The fix of xsmom-research-nobull -- hold nothing on days the past-only detector calls a bull
# market -- offered to the Retune wrapper next to the unchanged book, instead of imposed. Every
# month the wrapper keeps whichever of the two had the better Sharpe after costs on the returns
# realised BEFORE that month, so every day from its first choice is a forward test
# (docs/RETUNE.md). Grid of two, declared whole:
#
#   always    -- trade_in bull, flat, bear: the 20-leg book of specs/xsmom-honest-20legs.yaml
#   skip_bull -- trade_in flat, bear: the fix
#
# Why Binance: the fix was designed on Hyperliquid 2025-01 .. 2026-06, where the stand judges it
# on 97 days only. Binance from 2019-09 holds the 2020-2021 bull market and the 2022 bear that
# nobody looked at for this fix (docs/REGIMES.md: our Hyperliquid window holds no bull market
# like 2020-2021). Binance is a DATA proxy, as in specs/trend-binance-cap.yaml: costs and the
# minimum leg stay the live engine's Hyperliquid ones, funding is Binance's own.

idea_id: xsmom-research-nobull-retune
title: "XSMOM, 20 ног, на истории Binance 2019–2026: торговать ли в растущем рынке, решает код раз в месяц только по прошлому"
code_ref: qlab.strategies.retune:Retune

params_fixed_at: 2020-03-01
params_fixed_evidence: >
  The wrapper's first causal choice (qlab.strategies.retune, docs/RETUNE.md): the data starts
  2019-09-08 with BTC alone; a long/short book needs two scored contracts, and the second,
  ETH, is listed on 2019-11-27 (docs/FRAB_LIVE.md: «ETH с 27 ноября 2019»); its 60-day longest
  lookback is complete on 2020-01-26, the first Thursday rebalance after it is 2020-01-30 (the
  BTC detector is known from November 2019); a candidate is eligible after one whole monthly
  re-tuning period, so the first choice is made at the 2020-03-01 refit. Warm-up arithmetic, not
  a result. If other contracts were scored earlier the true first choice is earlier and this date
  only drops forward days; the book reaches its full 20 legs only once Binance lists enough
  contracts, and trades a thinner, smaller book until then (the live engine's effective_k,
  docs/XSMOM_T21.md). The grid was declared by the researcher on 2026-10-26 from the Hyperliquid
  drawdown evidence before 2026-06-15 (data/research/xsmom-2026-10-26.md): Binance 2020-03 ..
  2024-12 was not seen by it; 2025-01 .. 2026-06 is the period it was designed on (other venue,
  same market), so that part of the forward test is in-sample for the grid.

selects_causally: true

params:
  inner_code_ref: qlab.strategies.regime_gate:RegimeGate
  base_params:
    inner_code_ref: qlab.strategies.xsmom:XsmomCrossSectionalMomentum
    inner_params:
      universe: null
      lookbacks_days: [14, 21, 30, 45, 60]
      rebalance_days: 7
      anchor_dow: 3
      n_positions: 20
  grid:
    gate:
      always:
        trade_in: [bull, flat, bear]
      skip_bull:
        trade_in: [flat, bear]
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 3.5
    slippage_bps: 0.9

data:
  source: binance
  interval: "1d"
  start: '2019-09-08'
  end: '2026-09-20'

costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9

min_leg_notional: 12.0
simultaneous_legs: 1

unexpressed_mechanisms: []

sources:
  "code_ref": "src/qlab/strategies/retune.py (existing wrapper)"
  "inner_code_ref": "src/qlab/strategies/regime_gate.py (existing wrapper; default detector direction_terciles)"
  "base_params": "specs/xsmom-honest-20legs.yaml params, unchanged; their own sources are listed there"
  "grid.gate.always": "specs/xsmom-honest-20legs.yaml: the unchanged book, every regime traded"
  "grid.gate.skip_bull": "data/research/xsmom-2026-10-26.md, drawdown evidence before the cut: bull -2.3% over 92 days (xsmom-honest-20legs, BTC +90.0%), -5.6% over 68 days (xsmom), -8.7% over 92 days (xsmom-frozen-universe); flat +32.0% and bear +12.7% for xsmom-honest-20legs"
  "refit_every": "владелец 2026-10-02: «раз в неделю/день или месяц» (docs/RETUNE.md); monthly, as the detector reads 30 days of BTC"
  "window": "docs/RETUNE.md (expanding window: no number introduced)"
  "objective": "docs/RETUNE.md (Sharpe after costs)"
  "score_costs": "specs/xsmom-honest-20legs.yaml costs: the spec's own costs (docs/RETUNE.md: scores use the spec's costs)"
  "data.start": "docs/VENUES.md: Binance USDT perpetuals, «свечи с 2019-09-08 (первый день в архиве лаборатории)»"
  "data.end": "specs/xsmom-honest-20legs.yaml (the same window end)"
  "costs.differs_from_table": "3.5 + 0.9 bp are not the binance row of night/costs.yaml (5 + 0.9 bp); numbers recorded before the table (2026-10-29) and kept, as cited at costs.taker_fee_bps: funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.taker_fee_bps": "funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»"
  "min_leg_notional": "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py: _MIN_LEG = 12.0"
