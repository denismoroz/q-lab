# Causal twin of xsmom-research-liq1m (qlab twin, src/qlab/twin.py): its numbers are chosen
# by code, from the past only, on Binance's history (docs/RETUNE.md). Written by
# code, not by hand.
idea_id: xsmom-research-liq1m-causal
title: 'XSMOM, честный универс, 20 ног: брать в книгу только монеты с оборотом от $1 млн за прошлые сутки
  (порог живого движка): числа выбирает код раз в месяц только по прошлому, история Binance с 2019'
code_ref: qlab.strategies.retune:Retune
params:
  inner_code_ref: qlab.strategies.xsmom:XsmomCrossSectionalMomentum
  base_params:
    universe: null
    lookbacks_days:
    - 14
    - 21
    - 30
    - 45
    - 60
    rebalance_days: 1
    anchor_dow: 3
    n_positions: 20
  grid:
    rebalance_days:
      rebalance_days=1:
        rebalance_days: 1
      rebalance_days=7:
        rebalance_days: 7
  refit_every: M
  window: expanding
  objective: sharpe_net
  score_costs:
    taker_fee_bps: 5
    slippage_bps: 0.9
data:
  source: binance
  interval: 1d
  include_spot: false
  spot_prices: perp
  start: '2019-09-08'
  end: '2026-09-20'
  min_daily_volume_usd: 1000000.0
costs:
  taker_fee_bps: 5
  slippage_bps: 0.9
min_leg_notional: 5
# The strategy's own money, the base of every percent and the sum step 4 of the ladder compares
# the capital a run needed with (docs/LADDER.md, docs/CAPITAL_BASE.md; cited in sources).
strategy_capital_usd: 500
simultaneous_legs: 1
unexpressed_mechanisms: []
differs_from_source:
- 'Causal twin of xsmom-research-liq1m: the numbers it trades are chosen by code, every month, from returns
  realised before the choice (the declared lists of night/own_numbers.yaml); the data is Binance''s history,
  a proxy for hyperliquid''s market, with the original''s costs and minimum leg.'
- 'Venue split (2026-10-30, docs/VENUE_SPLIT.md): this spec is judged for Binance itself. Its costs are
  the binance row of night/costs.yaml, its minimum leg is Binance''s (venues/binance.yaml, per contract
  where Binance states it), and the facts about execution (venue_supported, atomic_execution) are Binance''s:
  a run that passes every rule routes needs-infrastructure because the lab has no Binance order adapter.
  Text above that speaks of the original''s or Hyperliquid''s costs and minimum leg describes the spec
  as it was before that day.'
noise_universe: panel
measure_hedge_timing: false
params_fixed_at: '2020-01-01'
params_fixed_evidence: 'The wrapper''s first causal choice (qlab.strategies.retune, docs/RETUNE.md): the
  data starts 2019-09-08; the longest warm-up read from the parameters is 60 days (lookbacks_days = 60),
  so the book can first trade on 2019-11-07; a candidate is eligible only after one whole month re-tuning
  period, so the first re-tuning after 2019-11-07 is 2019-12-01 and the first choice is made at the one
  after it, 2020-01-01. This is warm-up arithmetic read generically from the parameters (every day, hour,
  window and lookback number, whatever the strategy does with it), not a result. If the strategy needs
  more than the parameters show (enough instruments listed on Binance, a signal that waits for history),
  the true first choice is later and the days before it are judged as flat days. The grid is the whole
  declared list of each open parameter (rebalance_days) from night/own_numbers.yaml, 2 candidates. What
  this does not prove: the lists were declared in night/own_numbers.yaml (version 2026-10-26.2) before
  this twin ran; what was seen of the history when they were declared is not recorded, so the choice is
  only as honest as the lists are (the spec''s own date for its numbers: 2026-06-15).'
sources:
  "strategy_capital_usd": "owner 2026-10-30: «от 500» (the owner, asked what money XSMOM runs on; the strategy's own money for these research ideas is 500)"
  code_ref: src/qlab/strategies/retune.py (existing wrapper)
  refit_every: 'docs/RETUNE.md: re-tuned every month; the owner 2026-10-02 named «раз в неделю/день или
    месяц»'
  window: 'docs/RETUNE.md (expanding window: no number introduced)'
  objective: docs/RETUNE.md (Sharpe after costs)
  data.start: 'docs/VENUES.md: Binance USDT perpetuals, «свечи с 2019-09-08 (первый день в архиве лаборатории)»'
  data.end: 'specs/research/xsmom/xsmom-research-liq1m.yaml: the same window end'
  base_params.lookbacks_days: funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (XsmomParams defaults)
  base_params.anchor_dow: funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (XsmomParams defaults)
  base_params.n_positions: 'derived: (32 // 3) * 2; the live auto-tercile on the 32-coin DEFAULT_XSMOM_UNIVERSE,
    docs/XSMOM_T21.md'
  base_params.rebalance_days: 'night/own_numbers.yaml (version 2026-10-26.2): the declared list for each
    of rebalance_days; owner 2026-10-26: own numbers chosen on data before the cut'
  inner_code_ref: 'src/qlab/strategies/xsmom.py: the code of the spec'
  grid: 'night/own_numbers.yaml (version 2026-10-26.2): the declared list for each of rebalance_days;
    owner 2026-10-26: own numbers chosen on data before the cut'
  score_costs.taker_fee_bps: 'docs/FRAB_BINANCE_SPOT.md line 113: Binance USDⓈ-M perpetual taker, a regular
    user, 0.0500% (5 bps), https://www.binance.com/en/support/articles/360033544231 (read 2026-10-25;
    the live table https://www.binance.com/en/fee/futureFee could not be read, the article gives the rate
    as its example)'
  costs.taker_fee_bps: 'docs/FRAB_BINANCE_SPOT.md line 113: Binance USDⓈ-M perpetual taker, a regular
    user, 0.0500% (5 bps), https://www.binance.com/en/support/articles/360033544231 (read 2026-10-25;
    the live table https://www.binance.com/en/fee/futureFee could not be read, the article gives the rate
    as its example)'
  score_costs.slippage_bps: 'derived: 4.4 - 3.5; docs/FRAB_BINANCE_SPOT.md line 58: Binance has no measurement
    of its own, the value measured for Hyperliquid (funding-rate-arbitrage/research/SCREENING.md line
    32) is used and marked unmeasured'
  costs.slippage_bps: 'derived: 4.4 - 3.5; docs/FRAB_BINANCE_SPOT.md line 58: Binance has no measurement
    of its own, the value measured for Hyperliquid (funding-rate-arbitrage/research/SCREENING.md line
    32) is used and marked unmeasured'
  min_leg_notional: 'venues/binance.yaml min_leg_notional_usd: 5.0, Binance USDT-M futures'' MIN_NOTIONAL
    of the ordinary contract (exchangeInfo read 2026-10-30, 516 of 522 contracts); BTC (50) and five contracts
    (20) differ and are read per contract (min_leg_notional_by_instrument, seed/venue_facts/2026-10-30-binance_um_min_notional.csv)'
selects_causally: true
