# Researcher's fix of 2026-10-29 for XSMOM (docs/research/xsmom-2026-10-29.md, hypothesis 1).
# The only experiment declared that day; reported alone.
#
# The copy of specs/xsmom-honest-20legs.yaml; the strategy, its params, the window and the costs are
# verbatim. The only change: data.min_daily_volume_usd, the live engine's own liquidity floor, so a
# coin is a candidate on a bar only when its trailing 24h of USD volume, observed strictly before
# that bar, was at least $1M (qlab.data.snapshot._liquidity_eligible_mask; point-in-time, unlike the
# frozen 32-coin list, which was picked in June 2026 from coins that had survived).
#
# The loss it targets (drawdown evidence before the cut 2026-06-15, data/research/xsmom-2026-10-29.md):
# the two deepest drawdowns of the 20-leg book on all coins are -27.5% (2025-03-10 -> 2025-03-24) and
# -31.9% (2025-11-04 -> 2026-01-06, not recovered by the cut). The same 20-leg book on the 32 liquid
# coins of the live engine fell -5.8% (2025-03-13 -> 2025-03-27) and -12.5% (2025-12-18 -> 2026-01-28)
# over the same weeks: same breadth, same signal, only the candidate pool differs. Most of those two
# drawdowns fell on flat and bear days (worst fall inside flat -17.2%, inside bear -18.2%, inside bull
# -13.5%), so the bull-market gate already on the stand (xsmom-research-nobull) does not reach them.
# The frozen list mixes liquidity with hindsight; this run keeps the liquidity and drops the hindsight.
#
# Judged on Hyperliquid after 2026-06-15: a preliminary result (the held-out part is short). No grid:
# one number, taken from the live engine, not chosen among others.

idea_id: xsmom-research-liq1m
title: "XSMOM, честный универс, 20 ног: брать в книгу только монеты с оборотом от $1 млн за прошлые сутки (порог живого движка)"
code_ref: "qlab.strategies.xsmom:XsmomCrossSectionalMomentum"

params_fixed_at: 2026-06-15
params_fixed_evidence: >
  declared by the researcher on 2026-10-29: fix designed on the data before 2026-06-15; the two
  deepest drawdowns of the 20-leg book on all coins (-27.5% in March 2025, -31.9% in November 2025 -
  January 2026, data/research/xsmom-2026-10-29.md) were four and two and a half times shallower on the
  liquid 32-coin list at the same breadth (-5.8%, -12.5%), so admitting a coin only when its trailing
  24h volume before the bar cleared the live engine's $1M floor should cut those drawdowns without the
  frozen list's hindsight. The data after 2026-06-15 is the fix's forward test.

params:
  universe: null
  lookbacks_days: [14, 21, 30, 45, 60]
  rebalance_days: 7
  anchor_dow: 3
  n_positions: 20

data:
  source: hyperliquid
  interval: "1d"
  start: 2025-01-01
  end: 2026-09-20
  min_daily_volume_usd: 1000000.0

costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9

min_leg_notional: 12.0
simultaneous_legs: 1

unexpressed_mechanisms: []

sources:
  "params": "specs/xsmom-honest-20legs.yaml params, unchanged; their own sources are listed there"
  "lookbacks_days": "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (XsmomParams defaults)"
  "rebalance_days": "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (XsmomParams defaults)"
  "anchor_dow": "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (XsmomParams defaults)"
  "n_positions": "derived: (32 // 3) * 2; the live auto-tercile on the 32-coin DEFAULT_XSMOM_UNIVERSE, docs/XSMOM_T21.md"
  "data.min_daily_volume_usd": "funding-rate-arbitrage/research/cross_sectional/crypto/cryptodata.py line 39, MIN_VOL_USD = 1_000_000, \">= $1M 24h notional volume on HL\": the floor the live engine selects coins by"
  "data.end": "specs/xsmom-honest-20legs.yaml (the same window end)"
  "costs.differs_from_table": "3.5 + 0.9 bp are not the hyperliquid row of night/costs.yaml (4.5 + 0.9 bp); numbers recorded before the table (2026-10-29) and kept, as cited at costs.taker_fee_bps: funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.taker_fee_bps": "funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»"
  "costs.slippage_bps": "derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»"
  "min_leg_notional": "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py: _MIN_LEG = 12.0"
