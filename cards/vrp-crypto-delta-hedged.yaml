    - "Ни один из найденных источников не задаёт торгуемого правила: страйк, срок, частота переката и правило дельта-хеджирования отсутствуют. Реализовать кандидата означает придумать их — то есть внести в спек содержание, которого в источнике нет."
    - "Аннотация ключевой работы (SSRN 7046559) недоступна (HTTP 403); утверждения по ней стоят на названии и поисковой выдаче."
    - "Короткая гамма без ограничителя: это единственный кандидат из пяти, у которого убыток по построению не ограничен размером позиции."
  note: >-
