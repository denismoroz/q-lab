  legs: 2
  atomic_required: false
  venue: >-
    Опционная нога — Deribit (обе работы используют данные Deribit: DVOL для
    BTC/ETH и поверхность подразумеваемой волатильности). Хеджирующая нога —
    перп; на Hyperliquid она исполнима, опционная нога — нет.
  min_leg_notional_usd: null
  quote: null
  note: >-
    Минимальный размер опционного контракта Deribit в найденных источниках
    отсутствует, поэтому поле null. Опционов на Hyperliquid в документации
    площадки не описано: перечислены перпы, спот, HIP-3 (перпы деплойеров) и
    HIP-4 (prediction markets). Это вывод из ОТСУТСТВИЯ упоминания, а не
    процитированное утверждение — требует отдельной проверки, если карточку
    будут двигать дальше.

death:
  how: >-
    Схождение подразумеваемой волатильности к реализованной. В отличие от многих
    кандидатов, смерть здесь имеет вторую форму, которая не выглядит смертью:
    премия может оставаться положительной в среднем, но её распределение таково,
    что редкий крах забирает накопленное за годы. Именно это утверждает второй
    источник, называя её crash-conditional и не harvestable carry.
  visible_in_advance: true
  observable: >-
    Скользящий спред «подразумеваемая минус реализованная волатильность» по
    DVOL — публикуемый ряд. Он показывает затухание САМОГО ДРАЙВЕРА заранее.
    Но он НЕ показывает заранее момент реализации хвоста: второй режим смерти
    (крах) по обоим источникам не предсказуем из этой же величины, а связан с
    ней обратно — премия ниже как раз в высоковолатильных состояниях.
  quote:
    text: >-
      "The premium is large and positive but is a downside premium: put-side
      model-free variance is overpriced, call-side underpriced."
    source: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7046559
  note: >-
    Эта цитата получена из поисковой выдачи по работе, а не со страницы
    первоисточника (SSRN вернул 403). Помечена как непроверенная по
    первоисточнику.

