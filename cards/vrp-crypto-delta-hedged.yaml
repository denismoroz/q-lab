sizing:
  rule: null
  binding_constraint: "маржа под короткую опционную позицию; минимальный размер контракта площадки"
  quote: null
  note: >-
    Правила размера в источниках нет. Ни минимальный размер контракта Deribit,
    ни требования маржи под короткую вегу в найденных источниках не приведены.

protection:
  crash: null
  pump: null
  costs: null
  structural: false
  note: >-
    ХВОСТЫ НЕ ЗАКРЫТЫ, и здесь это не молчание источника, а прямое утверждение
    второго источника: премия за вариансу описана как «downside,
    crash-conditional risk premium» и как компенсация за систематический хвост,
    а НЕ как собираемый carry. То есть доход этой конструкции по построению
    равен плате за принятый хвост — закрыть хвост, сохранив доход, нельзя, это
    один и тот же объект. Дельта-хеджирование перпом закрывает ПЕРВЫЙ момент
    (направление), но не второй: короткая гамма остаётся, и убыток растёт с
    квадратом движения. Первый источник добавляет второй слой: премия НИЖЕ в
    состояниях высокой волатильности, то есть страховой взнос падает именно
    тогда, когда вероятность выплаты растёт. Это прямая противоположность
    конструкции FRAB, где оба хвоста закрыты ногами и доход от хвостов не зависит.
  quote:
    text: >-
      "A Downside, Crash-Conditional Risk Premium, Not Harvestable Carry"
      (название работы) ... "In high-volatility states, the BP attributable to
      positive and negative returns is more balanced, and the BVRP is lower."
    source: https://arxiv.org/abs/2410.15195

