# Карточка кандидата M2.5. Схема: cards/SCHEMA.md.
# Цитаты из англоязычных источников приведены дословно и не переводятся.

idea_id: vrp-crypto-delta-hedged
title: "Премия за страховку, которую платит покупатель выпуклости: дельта-хеджированная продажа вариансы в крипте"
found_at: 2026-09-22

sources:
  - url: https://arxiv.org/abs/2410.15195
    title: "Risk Premia in the Bitcoin Market (Almeida, Grith, Miftachov)"
    published: 2024-10
  - url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7046559
    title: "The Variance Risk Premium Across Markets and Regimes: A Downside, Crash-Conditional Risk Premium, Not Harvestable Carry (Shehzad Ahmed)"
    published: 2026-06

driver:
  who_pays: >-
    Покупатель опциона, то есть тот, кто платит за выпуклость и за защиту от
    хвоста. В крипте это преимущественно покупатель пута: по второму источнику
    пут-сторона модельно-свободной вариансы переоценена, колл-сторона недооценена.
  why: >-
    Подразумеваемая волатильность систематически превышает последующую
    реализованную — разница и есть плата за перенос риска второго момента.
    Первый источник измеряет её на биткойне и сравнивает с S&P 500: биткойн
    заметно волатильнее и несёт БОЛЬШУЮ премию за вариансу, чем индекс акций.
  kill_condition: >-
    Схождение подразумеваемой и реализованной волатильности: приход достаточного
    капитала, продающего опционы, либо структурный рост реализованной
    волатильности до уровня подразумеваемой. Отдельно — режимная смерть: по
    первому источнику премия за вариансу НИЖЕ в состояниях высокой волатильности,
    то есть она сжимается ровно тогда, когда риск реализуется.
  observable: >-
    Спред «DVOL (или подразумеваемая волатильность по поверхности) минус
    последующая реализованная волатильность того же горизонта» — прямо
    наблюдаемая величина, считается ежедневно и не требует PnL стратегии.
  quote:
    text: >-
      "We analyze the first and second moment risk premia in the Bitcoin market
      based on options and realized returns and contrast them to the premia
      embedded in the main US stock index market. First, Bitcoin is much more
      volatile and has a higher variance risk premium than the S&P 500. ...
      Further, applying a novel clustering algorithm to a collection of estimated
      Bitcoin option-implied risk-neutral densities, we find that risk premia
      vary over time as a function of two distinct market volatility regimes.
      The low-volatility regime implies a relatively high share of BP
      attributable to positive returns and a high Bitcoin Variance Risk Premium
      (BVRP). In high-volatility states, the BP attributable to positive and
      negative returns is more balanced, and the BVRP is lower. These results
      suggest Bitcoin investors are more concerned about variance and upside risk
      in a low-volatility regime."
    source: https://arxiv.org/abs/2410.15195

