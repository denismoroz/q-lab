idea_id: hip4-longshot-outcome
title: 'Продажа лотерейных билетов: ставки против маловероятных событий на рынках исходов Hyperliquid'
found_at: 2026-09-22

plain_summary: >-
  На Hyperliquid есть рынки исходов (HIP-4): контракт стоит от 0 до 1 доллара и
  в день расчёта платит $1, если событие случилось, и $0, если нет. Цена
  контракта — это то, как рынок оценивает вероятность события. Давно известно,
  что маловероятные события люди переоценивают: за шанс на большой выигрыш
  платят больше честной цены. По 588 миллионам сделок на Polymarket покупки
  дешевле 10 центов в среднем теряли 19.3 цента на каждый доллар, а покупки
  дороже 90 центов зарабатывали 0.83 цента. Что делаем: регулярно занимаем
  сторону «не случится» в дешёвых контрактах. Условный пример: продаём «да» по 8
  центов, то есть вносим 92 цента залога; если событие не случилось, а так
  бывает в большинстве случаев, получаем 8 центов; если случилось — теряем 92.
  Максимальный убыток известен в момент входа и равен залогу: займа и
  принудительного закрытия здесь нет, и позиция сама закрывается в известную
  дату. Где теряем: прибыль маленькая и частая, убыток редкий, но сразу на весь
  залог; несколько неудач подряд съедают много мелких выигрышей. В спорте этот
  перекос в данных вообще не найден, то есть работает он не везде. Главное
  ограничение — размер рынков. Замер 2026-09-22: по 229 рынкам около $392 тысяч
  оборота в сутки, самый крупный — $57 тысяч. Замер 2026-10-25: рынков 359,
  оборот около $1.0 миллиона в сутки; самый крупный — $1.56 миллиона за 8
  суток, но все 123 рынка вида «цена будет выше или ниже такой-то» (то есть
  крипта, где перекос на Polymarket устойчив) вместе дали всего $62 тысячи за
  8 суток, а 63% оборота — спорт, где перекоса не нашли. На $15 тысяч это
  помещается, на $100 тысяч уже тесно. Вопрос про опционы снят решением
  владельца 2026-10-25 (опционы допустимы на доступных площадках), но
  появился другой: условия площадки закрывают рынки исходов для «определённых
  юрисдикций» из списка, который она сама назначает и не публикует
  (`docs/OUTCOME_MARKETS.md`).

