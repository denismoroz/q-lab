# Карточка кандидата M2.5. Схема: cards/SCHEMA.md.
# Прогон 2026-09-22.2 — ограничения владельца применены ПЕРВЫМ фильтром
# (docs/SEARCH_CONSTRAINTS.md), а не после отбора.
# Цитаты из англоязычных источников приведены дословно и не переводятся
# (CLAUDE.md: перевод цитаты делает её недостоверной).

idea_id: hip4-longshot-outcome
title: "Премия, которую платит покупатель лотерейного билета: продажа маловероятных исходов на HIP-4 outcome-рынках Hyperliquid"
found_at: 2026-09-22

sources:
  - url: https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-improvement-proposals-hips/hip-4-outcome-markets
    title: "HIP-4: Outcome markets — Hyperliquid Docs"
    published: null
  - url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/contract-specifications
    title: "Contract specifications — Hyperliquid Docs (раздел Recurring outcomes)"
    published: null
  - url: https://arxiv.org/abs/2609.12878
    title: "The Favorite-Longshot Bias in Prediction Markets: Evidence from Polymarket (Marcos Cardozo, José Ignacio Rivero-Wildemauwe)"
    published: 2026-09
  - url: https://docs.trade.xyz/overview/relationship-to-hyperliquid
    title: "Relationship to Hyperliquid — trade[XYZ] Docs"
    published: null
  - url: "собственный запрос к https://api.hyperliquid.xyz/info (outcomeMeta + candleSnapshot), 2026-09-22"
    title: "Замер ликвидности всех 229 живых outcome-рынков HL"
    published: 2026-09

driver:
  who_pays: >-
    Покупатель контракта на маловероятный исход. Не «рынок вообще», а конкретная
    сторона сделки: тот, кто платит 5-10 центов за доллар выплаты, потому что ему
    нужна выпуклая ставка, а не правильная вероятность. Противоположную сторону —
    продажу лотерейного билета — берёт тот, кто согласен на маленькую частую
    прибыль против редкого крупного убытка.
  why: >-
    Устойчивое расхождение цены контракта и частоты исхода: контракты на
    маловероятные события систематически дороже своей вероятности, на почти
    достоверные — дешевле. Это старейший из зафиксированных эффектов ставочных
    рынков (favorite-longshot bias). Источник измеряет его на 588 млн сделок
    Polymarket и получает величину в центах на доллар, а не в виде «в среднем
    положительно».
  kill_condition: >-
    Исчезновение перекоса: цены нижних корзин начинают совпадать с реализованной
    частотой исходов. Второй, независимый путь — не рыночный: перекос остаётся,
    но исчезает сам рынок. Источник прямо показывает, что величина эффекта
    зависит от того, как группировать контракты, и что в спорте он ОТСУТСТВУЕТ,
    то есть «продавать лонгшоты» как правило не переносится между категориями
    автоматически.
  observable: >-
    Средняя доходность покупок по ценовым корзинам (<10 центов, 10-90, >=90) на
    скользящем окне — величина, считаемая из собственного журнала расчётов и из
    свечей outcome-рынков, независимо от PnL стратегии. Затухание видно как
    схождение доходности нижней корзины к нулю.
  quote:
    text: >-
      "In observed transaction flows, purchases below 10 cents lose 19.3 cents
      per dollar, while purchases at or above 90 cents earn 0.83 cents. How
      contracts are grouped changes the result: longshots lose 6.3 cents per
      dollar when each contract is weighted equally but gain 4.1 cents when
      related contracts are first grouped by parent event; the two-sided pattern
      is robust in Crypto and Politics but surprisingly absent in Sports."
    source: https://arxiv.org/abs/2609.12878

signal:
  entry: >-
    Продажа стороны Yes (что на HL тождественно покупке стороны No по цене 1-p)
    в корзине контрактов, чья цена ниже порога. Порог в источнике назван только
    как граница отчётной корзины (10 центов), а не как торговое правило: правила
    входа в источнике НЕТ, есть измерение доходности корзин.
  exit: >-
    Расчёт контракта. Выхода по цене нет и он не нужен: позиция гасится
    автоматически в известный заранее момент. Досрочный выход возможен через
    книгу, но не требуется конструкцией.
  data_needed:
    - "outcomeMeta (список живых исходов, sideSpecs, описание и срок)"
    - "свечи outcome-рынка по коину #<encoding>, encoding = 10*outcome + side"
    - "settleFraction по истёкшим рынкам (ряд фактических расчётов)"
  timeframe: >-
    От суток до недель. Нижняя граница — рекуррентный бинарный рынок на BTC,
    который расчётом идёт ежедневно в 06:00 UTC; верхняя — спортивные турниры и
    макро-исходы со сроком в недели.
  quote:
    text: >-
      "The first market is a recurring binary outcome that settles daily at
      06:00 UTC to the BTC mark price on HyperCore mark prices."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-improvement-proposals-hips/hip-4-outcome-markets

sizing:
  rule: >-
    Равный вес по контрактам, каждая позиция полностью обеспечена: проданная
    сторона требует внести обеспечение в размере максимальной выплаты. Правила
    размера в источниках нет — это следствие конструкции контракта, а не
    процитированное правило.
  binding_constraint: >-
    Ёмкость отдельного рынка. Замерено 2026-09-22 собственным запросом: суммарно
    по всем 229 живым исходам ~$392k оборота в сутки, из них ЛИШЬ ТРИ рынка
    прошли $100k за семь суток. Самый крупный (бинарный на xyz:CL) —
    $57k/сутки. Это и есть ограничение: не капитал владельца, а размер рынка.
  quote:
    text: >-
      "Outcomes are fully collateralized contracts that settle within a fixed
      range."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-improvement-proposals-hips/hip-4-outcome-markets

protection:
  crash: >-
    Структурная, ПЕРВОГО из четырёх сортов по docs/SEARCH_CONSTRAINTS.md в
    варианте «жёсткий предел»: максимальный убыток известен в момент входа и
    равен внесённому обеспечению. Контракт полностью обеспечен и рассчитывается
    внутри фиксированного диапазона, плеча и ликвидаций у примитива нет вовсе.
    Это не фильтр-предсказатель, а конструкция: никакое движение рынка не может
    сделать убыток больше обеспечения.
  pump: >-
    Тем же механизмом и симметрично: выплата ограничена сверху единицей.
    Направление движения конструкции безразлично.
  costs: >-
    Сейчас — полная, но по решению площадки, а не по конструкции: комиссии на
    outcome-рынках обнулены на время тестирования. Это параметр, который
    площадка может изменить в любой момент, и закладывать его в оценку эджа
    нельзя.
  structural: true
  note: >-
    Из четырёх сортов структурной защиты здесь применены ДВА: ограниченная по
    конструкции выплата и ограниченное время в позиции (дата расчёта известна
    при входе). Третьей ноги нет и она не нужна — у бинарного контракта нет
    непрерывного ценового хвоста, который надо было бы гасить. ВАЖНАЯ ОГОВОРКА:
    ограниченность убытка не означает его малости. Продавец лонгшота по
    построению получает маленькую частую прибыль и редкий убыток размером во всё
    обеспечение позиции; серия таких убытков ограничена только числом позиций,
    а не механизмом. Второе: HIP-4 — это НЕ опционы (плеча и ликвидаций нет), но
    документация площадки сама называет примитив "bounded options-like
    instruments", и это стоит вынести владельцу отдельно, потому что пункт 3
    ограничений (docs/SEARCH_CONSTRAINTS.md) сформулирован про опционы.
  quote:
    text: >-
      "Outcomes bring non-linearity, dated contracts, and an alternative form of
      derivative trading that does not involve leverage or liquidations." ...
      "Fees are currently zero for outcome markets for initial testing."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/hyperliquid-improvement-proposals-hips/hip-4-outcome-markets

execution:
  legs: 1
  atomic_required: false
  venue: >-
    Hyperliquid HyperCore, примитив HIP-4. Живые деплойеры по замеру
    2026-09-22: `out` (98 исходов), `txyz` (71), `skew` (52), плюс 8
    рекуррентных исходов самого протокола без деплойера.
  min_leg_notional_usd: 10.0
  quote:
    text: >-
      "Order must have minimum value of $10."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/exchange-endpoint
  note: >-
    $10 взят из примера ответа об ошибке в документации exchange-эндпоинта, то
    есть это общий минимум ордера на площадке, а НЕ процитированная спецификация
    именно outcome-рынков. Отдельного минимума для HIP-4 в документации нет.
    Книги Yes и No одного исхода объединены («an order to buy Yes at price p is
    equivalent to an order to sell No at price 1-p»), поэтому продажа и покупка
    противоположной стороны — одна и та же операция, и вторая нога не нужна.

death:
  how: >-
    Два независимых пути. (1) Рыночный: перекос выучивается, цены нижних корзин
    сходятся к реализованной частоте. Источник уже показывает, что этому пути
    нельзя доверять по аналогии: эффект есть в Crypto и Politics и отсутствует в
    Sports, то есть категория решает. (2) Площадочный, и он здесь быстрее:
    рынок исчезает. HIP-4 запущен в 2026 году, оборот тонкий, а истёкший
    контракт не возобновляется сам — живут только рекуррентные серии и то, что
    деплойер решит выпустить заново.
  visible_in_advance: true
  observable: >-
    Доходность нижней ценовой корзины на скользящем окне (эдж) и суточный оборот
    по outcome-рынкам (жив ли рынок). Обе величины считаются из свободного API
    и падают раньше, чем PnL.
  quote:
    text: >-
      "the two-sided pattern is robust in Crypto and Politics but surprisingly
      absent in Sports"
    source: https://arxiv.org/abs/2609.12878
  note: >-
    Это цитата про ПЕРЕНОСИМОСТЬ эффекта между категориями, а не про его
    затухание во времени. Приведена именно как ограничение: свидетельство
    собрано на Polymarket, а не на HIP-4, и переносить его на HL без
    собственного измерения нельзя.

feasibility:
  data_free: true
  data_source: >-
    Hyperliquid /info, бесплатно и без ключа: `outcomeMeta` даёт список исходов,
    `candleSnapshot` по коину `#<encoding>` даёт свечи. Проверено собственным
    запросом 2026-09-22 — оба типа запроса отвечают, свечи возвращаются.
    ЧЕГО НЕТ: ряда фактических расчётов (settleFraction) по УЖЕ ИСТЁКШИМ
    рынкам — `outcomeMeta` возвращает только живые, и историю исходов
    придётся собирать вперёд.
  venue_supported: true
  min_capital_order_of_magnitude_usd: 100
  blockers:
    - "Ёмкость. Замер 2026-09-22: ~$392k/сутки суммарно по ВСЕМ 229 рынкам; крупнейший рынок $57k/сутки. Для $15k сегодня это тесно, для горизонта $100-120k — кандидат не масштабируется без роста самих рынков."
    - "Истории расчётов нет: outcomeMeta отдаёт только живые исходы, поэтому бэктест FLB на данных самого HL невозможен без форвардного сбора. Свидетельство эффекта взято с Polymarket и на HL не проверено."
    - "Стенд q-lab позиционный и непрерывный по цене: дискретный расчёт (позиция гасится в 0 или 1 в назначенный момент) в интерфейсе стратегии сейчас не выражается. Это блокировка НАШИМ стендом, а не доступом владельца."
    - "Категорийность эффекта: по источнику он есть в Crypto и Politics и отсутствует в Sports, а на HL по обороту спорт — крупнейшая категория (~$1.47M из $2.75M за 7 суток)."
  owner_can_open:
    all_legs_reachable: true
    unreachable_legs: []
  legs:
    - what: "бинарный исход на цену xyz:CL (порог 83.196, расчёт 2026-09-29 21:00) — крупнейший outcome-рынок HL по обороту"
      venue: "Hyperliquid HIP-4, деплойер `out`, коин #12300"
      instrument: "outcome 1230, сторона Yes"
      last_traded: 2026-09-22
      daily_volume_usd: 57430
      bars_available: 25
    - what: "priceTouch: коснётся ли HYPE $100 к 2026-10-01 — второй по обороту"
      venue: "Hyperliquid HIP-4, деплойер `out`, коин #12090"
      instrument: "outcome 1209, сторона Yes"
      last_traded: 2026-09-22
      daily_volume_usd: 39854
      bars_available: 25
    - what: "спортивный исход: Arsenal — участник турнира (крупнейший спортивный рынок)"
      venue: "Hyperliquid HIP-4, деплойер `out`, коин #14730"
      instrument: "outcome 1473, сторона Yes"
      last_traded: 2026-09-22
      daily_volume_usd: 24900
      bars_available: 19
    - what: "макро-исход: повышение ставки (policyRateIncrease)"
      venue: "Hyperliquid HIP-4, деплойер `out`, коин #36020"
      instrument: "outcome 3602, сторона Yes"
      last_traded: 2026-09-22
      daily_volume_usd: 13493
      bars_available: 7
    - what: "рекуррентный бинарный исход протокола на цену BTC, расчёт 2026-09-23 06:00"
      venue: "Hyperliquid HIP-4, без деплойера (протокольная серия), коин #48050"
      instrument: "outcome 4805, сторона Yes"
      last_traded: 2026-09-22
      daily_volume_usd: 58764
      bars_available: 1
  legs_note: >-
    Замер 2026-09-22 по всем 229 живым исходам: оборот был у 137, больше $10k за
    семь суток — у 48, больше $100k за семь суток — у ТРЁХ. Суммарно
    ~$2.75M за неделю (~$392k/сутки). Публичные агрегаторы называют для HIP-4
    ~$46M за 30 дней (~$1.5M/сутки) — вчетверо больше моего замера; расхождение
    не объяснено (возможно, считаются обе стороны книги либо более широкий
    список рынков), и в карточку взято СВОЁ число, а не чужое.

prior:
  graveyard_matches: []
  note: >-
    Ни один из одиннадцати драйверов кладбища не про ставочный рынок: там
    funding, моментум, тренд, кэрри, анлоки, он-чейн выручка, коинтеграция и
    три варианта реверсии. Ближайший по ФОРМЕ (а не по драйверу) — token-unlock:
    событие с известной заранее датой. Но там платит механическое давление
    продаж, а здесь — систематическая переплата за маловероятный исход, и
    хвост закрыт конструкцией контракта, а не хеджем.
