# Карточка написана агентом-карточником (idea-0006, 2026-11-05) из идеи входящих, дословно — в поле idea_source. Поля carder: — для реализатора и проверяющего.
# Вердикт по идее вынесет стенд, не агент.
idea_id: bv2-fast-entry-third-window
found_at: '2026-11-05'
title: Страховка Bv2 с третьим, коротким окном в несколько дней, которое умеет только включать страховку
  при резком падении посреди роста, а снимает её прежнее правило 14 и 30 дней
plain_summary: 'Bv2 держит монеты (здесь BTC и ETH) и страхует их от падения: продаёт на бирже бессрочный
  контракт (ставку на цену монеты без даты окончания) на ту же сумму, так что падение цены гасится. Сейчас
  страховка включается, когда доход монеты за 14 дней и за 30 дней не выше нуля, то есть тогда, когда
  падение уже длится недели. Если цена резко обваливается посреди роста, оба длинных дохода остаются выше
  нуля ещё много дней, и страховки нет. Владелец предлагает третье, короткое окно в несколько дней: если
  монета потеряла за эти дни заметно, страховка включается сразу. Снимает страховку, как и сейчас, только
  правило 14 и 30 дней, то есть короткое окно само её не выключает и не добавляет лишних включений и выключений
  в боковике (это одно из прочтений, другое проверяется рядом: короткое окно может и придерживать страховку).
  Условный пример для окна в 3 дня: монета росла два месяца, за три дня упала на 6%; медленное правило
  молчит и ещё неделю не включится, а новое включает страховку на второй день и сохраняет остаток падения.
  Где теряем: падение оказалось короткой встряской, цена вернулась, а мы заплатили комиссию и потерю на
  цене при исполнении заявки за вход и выход. Почему может не работать: в боковике короткие падения случаются
  часто и почти все возвращаются, а похожие входы по коротким и средним окнам и по просадке от максимума
  уже пробовали, и ни один не обошёл нынешнее правило.'
sources:
- url: ideas/inbox.yaml#idea-0006
  title: Идея исследователя idea-0006 от 2026-10-28 (третье короткое окно только на включение страховки
    Bv2)
  published: 2026-10
- url: cards/bv2-fast-release-by-own-trend.yaml
  title: 'Соседняя карточка того же блока: там короткий срок снимает страховку, здесь он её только включает'
  published: 2026-10
driver:
  who_pays: 'Те, кто держит монету и не успел продать, пока цена резко падает: их потерю в первые дни
    обвала забирает тот, кто продал контракт раньше.'
  why: Резкое падение цены часто продолжается несколько дней подряд, а длинные окна 14 и 30 дней реагируют
    на него с опозданием, потому что до этого монета росла. Короткое окно ловит начало движения.
  kill_condition: 'Резкие падения посреди роста перестают продолжаться: цена после просадки за несколько
    дней чаще возвращается вверх, чем идёт ниже.'
  observable: Доля включений страховки по короткому окну, после которых за следующие 72 часа цена монеты
    оказалась выше цены включения; если она больше половины, плата перестала приходить.
prior:
  graveyard_matches:
  - bv2-research-short-window
  - bv2-research-btceth
  note: Опыт bv2-research-short-window менял само короткое окно двухоконного сигнала (3, 7, 14 или 30
    дней), и это окно отвечало и за включение, и за снятие. Здесь два прежних окна (14 и 30 дней) остаются
    как есть и отвечают за снятие, а третье окно только добавляет условие включения, снять страховку оно
    не может.
carder:
  hypothesis_ru: Если к правилу Bv2 добавить третье короткое окно, которое только включает страховку при
    падении за несколько дней, а снимает её прежнее правило, то годовой доход после издержек на BTC и
    ETH с 2019 года будет выше, чем у Bv2 без третьего окна, а глубина просадки не вырастет заметнее.
    Гипотеза ложна, если доход не выше базы или число включений и выключений в боковике съедает выигрыш.
  readings_ru:
  - Третье окно включает страховку при любом падении за его срок, то есть когда доход монеты за это окно
    не выше нуля.
  - Третье окно включает страховку только при резком падении, то есть когда монета потеряла за его срок
    не меньше заданной доли; мелкие спады оно не замечает, и в боковике лишних включений меньше.
  - 'Страховку снимает только прежнее правило 14 и 30 дней (защёлка: как кнопка с фиксацией, включил и
    держится, пока не отпустят другим сигналом): короткое окно её включило, и она держится, пока прежнее
    правило сначала не включится, а потом не выключится, плюс липкий выход.'
  - 'Короткое окно держит страховку, пока само включено («или» с прежним правилом): страховка уходит,
    когда молчат оба и прошли 12 часов липкого выхода.'
  baseline:
    spec: specs/research/bv2/bv2-research-btceth.yaml
    why_ru: Это Bv2 на BTC и ETH на Binance с 2019 года с часовыми свечами и теми же издержками; новое
      третье окно добавляется поверх, поэтому разница между вариантами только в нём.
  vs_tried:
  - id: qlab-t39-ml-regime-hedge
    difference_ru: 'Там модель определяла режим рынка и включала страховку по нему, а выигрыша не было.
      Здесь нет модели и режима: одно правило по доходу самой монеты за несколько дней, добавленное к
      прежнему.'
  - id: qlab-t39-false-alarm-filter
    difference_ru: 'Там модель отменяла ложные тревоги, добавить страховку она не могла. Здесь наоборот:
      новое окно только добавляет страховку, ничего не отменяет.'
  - id: bv2-stop-5-10
    difference_ru: Там страховку снимали, если цена ушла на 5% или 10% выше точки включения. Здесь снятие
      не меняется, а порог в 5% относится к падению монеты за несколько дней и служит условием включения.
  - id: bv2-sig-momentum-sign
    difference_ru: 'Там перебирали знаки доходов за 3-30 дней как условия страховки, в том числе «или».
      Честно: вариант этой карточки с порогом 0.0 и «или» (читаем «прежний сигнал ИЛИ доход за 3 или 7
      дней не выше нуля») совпадает с тем «или», то есть повторяет его, он оставлен в сетке как контрольная
      точка. Новое здесь только два: порог 5% (падение глубже нуля) и вариант-защёлка, где страховку,
      включённую коротким окном, снимает лишь прежнее правило; при «или» такого различия нет, потому что
      итог «или» падает, только когда молчат оба входа.'
  - id: qlab-bv2-short-window
    difference_ru: Там код выбирал единственное короткое окно сигнала вместо прежнего, и оно же снимало
      страховку. Здесь прежние окна 14 и 30 дней остаются, третье окно добавлено сверху. При «или» короткое
      окно удерживает страховку, пока само включено, так что снимает её не только прежнее правило; чисто
      «только включает» это вариант-защёлка. Вариант с порогом 0.0 и «или» близок к уже пробованному.
  - id: bv2-sig-drawdown-from-peak
    difference_ru: Там страховка включалась по падению от недавнего максимума на заданную долю и заменяла
      сигнал. Здесь падение считается за фиксированное окно дней и добавляется к прежнему сигналу.
  - id: bv2-sig-donchian
    difference_ru: Там страховка при цене ниже минимума за N дней, заменяющая сигнал. Здесь решает доход
      за окно, и это дополнение к прежнему сигналу, а не замена.
  - id: bv2-sig-hyst
    difference_ru: Там вход при падении за 30 дней ниже -5% и выход при 30-дневном доходе не ниже нуля,
      то есть меняли оба конца. Здесь вход добавляется коротким окном, выход остаётся прежним.
  - id: bv2-sticky-exit
    difference_ru: 'Липкий выход на 12 часов принят и остаётся без изменений: он работает поверх объединённого
      сигнала. Новое окно меняет только условие «страховка нужна».'
  - id: bv2-ens3-horizon-ensemble
    difference_ru: Там три пары окон, каждая страхует свою треть книги. Здесь одно решение для всей монеты,
      а короткое окно одно и страхует целиком.
  - id: bv2-sig-min-hold
    difference_ru: Там минимальное удержание и запрет повторного входа. Здесь запрета нет, страховка может
      вернуться сразу, как условие снова выполнено.
  - id: bv2-daily-signal
    difference_ru: Там сигнал читали раз в сутки вместо раза в час. Здесь сигнал читается каждый час,
      как в Bv2.
  grid:
  - param: fast_entry_window_days
    values:
    - 0
    - 3
    - 7
    meaning_ru: За сколько последних дней считать доход монеты в третьем окне («несколько дней» из идеи);
      ноль значит третье окно выключено, это и есть база Bv2.
    source_ru: Объявленный список short_window_days из night/own_numbers.yaml (3, 7, 14, 30); взяты две
      короткие точки, 14 и 30 уже заняты прежними окнами; ноль объявлен здесь как значение «блок выключен».
  - param: fast_entry_drop
    values:
    - 0.0
    - 0.05
    meaning_ru: 'Насколько монета должна потерять за окно, чтобы включить страховку: 0.0 значит доход
      не выше нуля, 0.05 значит падение не меньше 5%.'
    source_ru: 0.0 равно порогу hedge_threshold книги; 0.05 первое значение объявленного списка graded_hedge_depth
      из night/own_numbers.yaml; два значения передают два прочтения слов «резкое падение».
  - param: fast_entry_latch
    values:
    - 0
    - 1
    meaning_ru: 'Как страховка снимается: ноль значит «или» с прежним правилом (короткое окно держит страховку,
      пока само включено), единица значит защёлку (включённую коротким окном страховку снимает только
      прежнее правило).'
    source_ru: 'Два значения передают два прочтения слов «умеет только включать»; это переключатель, а
      не число из списка. Всего 3 на 2 на 2, то есть 12 вариантов, первый (окно 0, порог 0.0, ноль) равен
      базе. Честно: при окне 0 порог 0.05 и значение 1 ничего не меняют, поэтому четыре варианта с окном
      0 повторяют базу; они оставлены ради ровной сетки.'
  data:
    venue: binance
    interval: 1h
    start: 2019-09-08
    coins: &id001
    - BTC
    - ETH
    hand_picked: true
    honest_from: 2025-06-01
    honest_why_ru: 'Список BTC и ETH выбран с оглядкой на то, кто выжил: в базовом исследовании SOL и
      AVAX убраны как мешавшие страховке, а выбор пары делался, когда 2025–26 годы уже были видны. Судим
      с 2025-06-01, как двойники Bv2 в docs/RETUNE.md. Это слабая честность, результат читать как предварительный.'
  new_block:
    name: fast_entry_third_window
    params:
    - name: fast_entry_window_days
      meaning_ru: Сколько последних дней считать доход монеты в третьем окне.
    - name: fast_entry_drop
      meaning_ru: Доля падения за это окно, при которой страховка включается; 0.0 значит доход не выше
        нуля.
    - name: fast_entry_latch
      meaning_ru: 'Ноль: итог «или» прежнего и короткого сигналов. Единица: защёлка, короткий сигнал включает,
        а снимает прежнее правило.'
    rule_ru: 'Блок считает для каждой монеты и каждого часа сигнал «страховка нужна» и подаёт его в Bv2
      вместо исходного. Читает часовые цены закрытия этой же монеты, только до закрытой свечи этого часа,
      будущего не видит. Шаг 1: берётся нынешний сигнал Bv2 по этой монете, то есть страховка нужна, пока
      доход за 14 дней или за 30 дней не выше нуля; этот сигнал не меняется. Шаг 2: считается доход монеты
      за последние fast_entry_window_days суток (цена закрытия сейчас делить на цену закрытия столько
      суток назад, минус единица); при fast_entry_window_days равном 0 блок выключен и итог равен прежнему
      сигналу. Шаг 3: короткий сигнал включён, если доход не выше минус fast_entry_drop. Если истории
      для окна ещё мало, короткий сигнал выключен. Шаг 4: при fast_entry_latch равном 0 итоговый сигнал
      «страховка нужна» равен «прежний сигнал ИЛИ короткий сигнал». При fast_entry_latch равном 1 (защёлка):
      когда короткий сигнал включается, а прежний молчит, ставится метка; пока метка стоит, итог «нужна»;
      метка снимается, когда прежний сигнал после этого включился и снова выключился; пока метки нет,
      итог равен «прежний ИЛИ короткий». Пример: прежнее правило молчит, падение за 3 дня ставит метку,
      через неделю прежнее правило включается, потом выключается, и метка снимается. Риск: если падение
      было короткой встряской и прежнее правило так и не включится, метка и страховка держатся неопределённо
      долго; срока у метки нет. Шаг 5: итоговый сигнал идёт дальше в Bv2, где липкий выход (страховка
      снимается, только когда «не нужна» держится подряд 12 часов, то есть выход с задержкой против частых
      включений и выключений) работает поверх без изменений. При «или» короткое окно удерживает страховку,
      пока само включено; она уходит, когда прежнее правило и короткий сигнал оба молчат и прошли 12 часов
      липкого выхода. Размер страховки, залог, продажа выросшей части монеты по порогу книги, издержки
      и запас маржи остаются как в базе. Новых монет блок не добавляет и на BTC для других монет не смотрит.'
