    так и не включится, метка и страховка держатся неопределённо долго; срока у метки нет. Шаг 5: итоговый
    сигнал идёт дальше в Bv2, где липкий выход (страховка снимается, только когда «не нужна» держится
    подряд 12 часов, то есть выход с задержкой против частых включений и выключений) работает поверх без
    изменений. При «или» короткое окно удерживает страховку, пока само включено; она уходит, когда прежнее
    правило и короткий сигнал оба молчат и прошли 12 часов липкого выхода. Размер страховки, залог, продажа
    выросшей части монеты по порогу книги, издержки и запас маржи остаются как в базе. Новых монет блок
    не добавляет и на BTC для других монет не смотрит.'
