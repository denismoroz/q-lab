# Карточка написана агентом-карточником (idea-0001, 2026-10-28) из идеи входящих, дословно — в поле idea_source. Поля carder: — для реализатора и проверяющего.
# Вердикт по идее вынесет стенд, не агент.
idea_id: bv2-fast-release-by-own-trend
found_at: '2026-10-28'
title: 'Страховка Bv2, которую быстрее снимают, когда сама монета уже растёт на коротком отрезке, а включают
  по-прежнему по медленному правилу: зарабатывает на том, что страховка меньше стоит в отскоках'
plain_summary: 'Bv2 держит монету (BTC и ETH) и, когда она падает, ставит страховку: продаёт на бирже
  контракт на ту же сумму, чтобы падение цены отыгрывалось. Страховка не бесплатна: за каждое включение
  и выключение платятся комиссия и потеря на цене при исполнении заявки, вместе около 0.06% с каждой сделки
  (5.25 и 0.9 базисных пункта по спеку; базисный пункт это сотая доля процента), а в отскоках цены страховка
  отнимает часть роста. Владелец (идея idea-0001) заметил, что окна времени вложены друг в друга как матрёшки:
  чем короче окно, тем больше колебаний. Значит медленное окно (дни) хорошо говорит, что общий ход вниз,
  но слишком долго держит страховку, когда внутри суток монета уже развернулась вверх. Что делаем: включение
  страховки остаётся по нынешнему правилу книги (доход монеты за 14 или за 30 дней не выше нуля), а снимаем
  её раньше, когда доход этой же монеты за последние 12 или 24 часа выше нуля; в падение она вернётся,
  когда короткий доход снова станет не выше нуля. Условный пример: монета падала 10 дней, страховка включена,
  за сутки монета выросла на 3%; нынешнее правило ждёт, пока вырастет и медленный доход, и недополучает
  эти 3%, а новое снимет страховку в тот же день. Где теряем: если отскок оказался ложным и цена пошла
  вниз дальше, мы остались без страховки в падении, а лишние включения и выключения съедают комиссиями
  то, что выиграно. Почему может не работать: похожие вещи уже пробовали (читать сигнал раз в сутки, окна
  от 3 дней, сочетания знаков дохода) и ни одна не обошла нынешнее правило; новое тут одно, окна короче
  трёх суток, и на данных, которые были известны до подбора монет, оно может не дать ничего. «Брать тренд
  по самой монете, а не по BTC» в Bv2 уже так и устроено, это не новое.'
sources:
- url: ideas/inbox.yaml#idea-0001
  title: 'Идея владельца idea-0001 от 2026-10-27 («bv2 защита, bv3 доход: страховка снимается чаще, по
    разным таймфреймам»)'
  published: 2026-10
- url: docs/RETUNE.md
  title: 'Как судить двойника, у которого список монет подобран вручную: только с дня, когда список был
    известен'
  published: 2026-10
driver:
  who_pays: 'Те, кто продаёт на падении и покупает на отскоке: на коротком отскоке цена возвращается быстрее,
    чем успевает развернуться медленное правило, и держащий страховку платит за это упущенным ростом.'
  why: Цена на короткие сроки колеблется сильнее, чем на длинные (по словам владельца, окна как матрёшки),
    и многие отскоки внутри падения заканчиваются за часы; страховка, снятая в начале отскока, не теряет
    его рост.
  kill_condition: 'Отскоки внутри падения перестают держаться: цена после суточного роста в падении чаще
    возвращается вниз, чем продолжает расти.'
  observable: Доля снятий страховки по короткому росту, после которых за следующие 72 часа монета упала
    ниже цены снятия; если она больше половины, плата перестала приходить.
prior:
  graveyard_matches:
  - bv2-t39-false-alarm-filter
  - bv2-t39-hedge-on-bear
  - bv2-research-btceth
  note: Захороненные идеи решали, включать ли страховку, по режиму рынка или модели; здесь включение не
    меняется, меняется только быстрота снятия, по доходу самой монеты за 12 и 24 часа, чего в списке проверенного
    нет.
carder:
  readings_ru:
  - 'Короткий срок только снимает страховку: включение остаётся по медленному правилу, а когда короткий
    доход монеты выше нуля, страховка снимается раньше.'
  - 'Короткий срок и включает страховку, и снимает её: тренд даёт медленное правило, а момент включения
    и снятия задаёт только короткий доход монеты, даже когда медленное правило ещё не показывает падения.'
  hypothesis_ru: Если снимать страховку Bv2, когда доход монеты за 12 или 24 часа выше нуля (первое прочтение
    идеи), а в другом варианте (второе прочтение) ещё и включать её по короткому доходу не выше нуля,
    то на отрезке после дня, когда список монет был известен, годовой доход после издержек будет выше,
    чем у Bv2 без быстрого снятия, а глубина просадки не вырастет заметнее. Гипотеза ложна, если доход
    не выше базы или просадка глубже на тех же данных.
  baseline:
    spec: specs/research/bv2/bv2-research-btceth.yaml
    why_ru: Это Bv2 на BTC и ETH на Binance с 2019 года с часовыми свечами, теми же издержками и тем же
      липким выходом на 12 часов; новая деталь добавляется поверх, поэтому разница между вариантами только
      в быстром снятии. Список из двух монет подобран с оглядкой на то, кто выжил (спек сам говорит, что
      SOL и AVAX убраны как мешавшие), поэтому судим его только с даты honest_from.
  vs_tried:
  - id: bv2-volscale-vol-managed
    difference_ru: Там страховка росла вместе с волатильностью и держалась и тогда, когда основное правило
      молчит. Здесь страховки в молчании правила нет вовсе, а включённая страховка только снимается раньше
      по знаку короткого дохода той же монеты; волатильность не используется.
  - id: qlab-signal-search-review-gaps
    difference_ru: 'Из списка непроверенного берётся близкое к «сколько страховать», но у нас доля всегда
      целая: либо вся, либо ноль. От VOLSCALE и от частичной страховки отличается тем, что решает знак
      короткого дохода, а не размер риска.'
  - id: qlab-t39-models-and-features
    difference_ru: Там искали модели и признаки для определителя режима, среди них младшие таймфреймы,
      чтобы решить, включать ли страховку. Здесь нет модели и режима; правило из двух знаков дохода, а
      включение остаётся прежним, меняется только снятие.
  - id: bv2-sig-momentum-sign
    difference_ru: 'Там перебирали знаки дохода за 3–30 дней, включая «и» и «или». Наше окно 12 и 24 часа
      короче самого короткого из перебранных (3 дня). Правило то же самое, сочетание знаков дохода через
      «и» (медленный доход не выше нуля и короткий доход не выше нуля), а новое здесь только окно из-за
      пределов перебранного: 12 и 24 часа, оба короче 3 дней, самого короткого окна из уже перебранных.
      В вариантах с fast_entry равным нулю короткое окно служит только для снятия, а не для входа.'
  - id: qlab-bv2-short-window
    difference_ru: Там окно входа в страховку брали 3, 7, 14 или 30 дней и выбирал код. Здесь значения
      12 и 24 часа в эту сетку не входят, и они не заменяют окно входа, а добавляются к нему как отдельное
      условие снятия; сетка у нас без выбора кода между окнами входа.
  - id: bv2-sticky-exit
    difference_ru: 'Липкий выход (страховка снимается, когда «не нужна» держится 12 часов подряд) уже
      принят и остаётся без изменений во всех вариантах, включая базу. Новое условие не заменяет его:
      оно меняет само «не нужна» (добавляет «короткий доход выше нуля»), а 12 часов подряд считаются поверх
      него.'
  - id: bv2-daily-signal
    difference_ru: Там сигнал читали раз в сутки вместо раза в час и получили хуже везде. У нас сигнал
      читается каждый час, как в Bv2, а суточный доход служит только условием снятия.
  - id: bv2-sig-btc-down-filter
    difference_ru: 'Там страховали альты только когда падал BTC. У нас BTC не участвует: для каждой монеты
      считается её собственный короткий доход; медленное правило Bv2 уже смотрит на саму монету.'
  - id: bv2-ens3-horizon-ensemble
    difference_ru: Там три пары окон, каждая страхует треть книги, все окна от 7 дней. У нас одно решение
      целиком, медленное окно включает, короткое снимает, и короче 3 дней.
  - id: bv2-sig-min-hold
    difference_ru: 'Там минимальное удержание страховки плюс запрет повторного входа и страховка не могла
      вернуться на 3–7 дней. У нас запрета нет: как только короткий доход снова не выше нуля и медленное
      правило по-прежнему требует страховки, она возвращается в тот же час.'
  - id: bv2-staged24
    difference_ru: Там половина страховки сразу, вторая через 24 часа при удержании сигнала, то есть вход
      по частям. У нас вход целый и прежний, 24 часа служат окном дохода для снятия.
  - id: bv2-btc-eth-only
    difference_ru: Это набор монет базы, а не идея; он уже испытан как Bv2 на BTC и ETH и ждёт проверки
      вперёд. Мы его берём как данные и судим только после даты, когда он был известен.
  grid:
  - param: fast_window_hours
    values:
    - 0
    - 12
    - 24
    meaning_ru: Сколько последних часов считать короткий доход монеты для снятия страховки; ноль значит
      «быстрого снятия нет», то есть Bv2 как в спеке (первый вариант совпадает со спеком).
    source_ru: 'Круглые значения, выбранные здесь до любого прогона, без оглядки на результат: 12 часов
      равно липкому выходу спека, 24 часа это сутки, оба короче самого короткого окна уже проверенного
      (3 дня).'
  - param: fast_entry
    values:
    - 0
    - 1
    meaning_ru: 'Ноль: короткий доход только снимает страховку, включение остаётся по медленному правилу
      (первое прочтение идеи). Единица: страховкой управляет только короткий доход монеты, она включена,
      когда он не выше нуля, и снята, когда выше нуля, а медленное правило не участвует (второе прочтение).
      При fast_window_hours равном нулю этот параметр ничего не меняет.'
    source_ru: 'Два значения, названные здесь до любого прогона: переключатель между двумя прочтениями
      идеи, не подбираемое число.'
  data:
    venue: binance
    interval: 1h
    start: 2019-09-08
    coins: &id001
    - BTC
    - ETH
    hand_picked: true
    honest_from: 2025-06-01
    honest_why_ru: 'Список BTC и ETH выбран с оглядкой на то, кто выжил, а исследование frab его выбора
      видело и 2025–26 годы. Берём 2025-06-01: так же судятся двойники Bv2 в docs/RETUNE.md (день, когда
      закончилось окно подбора параметров книги). Это слабая честность, и результат надо читать как предварительный.'
  new_block:
    name: fast_release_gate
    params:
    - name: fast_window_hours
      meaning_ru: Сколько последних часовых свечей считать доход монеты для быстрого снятия страховки;
        ноль выключает блок.
    - name: fast_entry
      meaning_ru: 'Ноль: короткий доход только снимает страховку; единица: он же и включает её, а медленное
        правило не участвует.'
    rule_ru: 'Блок считает для каждой монеты и каждого часа сигнал снятия. Читает часовые цены закрытия
      этой же монеты (спот: обычная покупка самой монеты на Binance, не контракт), только до закрытой
      свечи этого часа, будущего не видит. Шаг 1: берётся нынешний сигнал Bv2 «страховка нужна» по этой
      монете (доход за 14 или за 30 дней не выше нуля), он не меняется. Шаг 2: если fast_window_hours
      равно нулю, блок возвращает сигнал Bv2 как есть. Шаг 3: иначе считается доход монеты за последние
      fast_window_hours часов (цена закрытия сейчас делить на цену закрытия fast_window_hours часов назад,
      минус единица). Шаг 4: если он выше нуля, сигнал «страховка нужна» для этого часа считается снятым,
      даже при падении по медленному правилу; если не выше нуля, сигнал остаётся как у Bv2. Если fast_entry
      равен единице, шаги 1 и 4 заменяются так: сигнал «страховка нужна» равен условию «короткий доход
      не выше нуля», медленное правило не смотрится (так короткий срок и включает, и снимает страховку).
      Шаг 5: полученный сигнал подаётся дальше в Bv2 вместо исходного: липкий выход (страховка снимается,
      только когда «не нужна» держится подряд sticky_exit_hours часов, сейчас 12) работает поверх него
      без изменений. Страховка это короткая продажа контракта на ту же сумму; размер, залог, продажа выросшей
      части монеты по порогу книги, издержки (комиссия и потеря на цене при исполнении заявки) и запас
      маржи остаются как в базе. Залог это деньги, замороженные на бирже под проданный контракт, чтобы
      его не закрыли принудительно; запас маржи (параметр спека hedge_margin_headroom) это во сколько
      раз выросшую монету должен покрывать залог: при 1.5 залога хватает на страховку монеты, выросшей
      в полтора раза, при 1.0 только на текущий размер. Когда сигнал снова «нужна», страховка включается
      в тот же час, без запрета повторного входа. Блок не добавляет монет и не смотрит на BTC для других
      монет.'
