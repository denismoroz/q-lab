prior:
  graveyard_matches: []
  note: >-
    По драйверу совпадений нет: среди одиннадцати драйверов кладбища нет ни
    одного про ограничение на плечо. Ближайшие по ФОРМЕ, но не по драйверу, —
    cross-sectional-momentum (та же конструкция dollar-neutral long/short, но
    драйвер ценовой моментум) и indices-gold-trend (те же классы активов, но
    драйвер тренд и направленная позиция). Существенно другое обстоятельство,
    и формулировать его надо точно: indices-gold-trend похоронен НЕ за доступ,
    а за затухание сигнала (Sharpe +0.07 во второй половине выборки) — но в той
    же записи кладбища класс индексов и металлов назван «ближайший
    недоступный-в-крипте макро-класс», и вот ЭТО перестало быть верным. Класс
    активов оказался внутри доступного контура, не потому что мы что-то
    обошли, а потому что площадка его завела. Это и есть новый вопрос: не
    «зарабатывает ли BAB» (на это ответ известен и он старый), а «доживает ли
    известный эффект до исполнения на годовалом деплое с удвоенными костами».
