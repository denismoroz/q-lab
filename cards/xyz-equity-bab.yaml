    `xyz:<TICKER>` — дневные свечи. Проверено собственным запросом 2026-09-22 по
    всем 289 инструментам девяти деплоев. Никаких фундаментальных данных
    (прибыль, баланс, календарь отчётностей) кандидату НЕ требуется: бета
    считается из цен.
