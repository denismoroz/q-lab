driver:
  who_pays: >-
    Те, кто ставит на рост цены монеты через бессрочный контракт Hyperliquid и
    платит за это ставку финансирования тем, кто ставит на падение. Мы — на
    стороне падения, но защищены купленной монетой.
  why: >-
    Желающих ставить на рост на рынках монет обычно больше, чем желающих
    ставить на падение, и разницу выравнивает эта плата.
  kill_condition: >-
    Ставка финансирования перестаёт быть заметно положительной, или комиссий и
    платы за переводы между площадками становится больше, чем платы по
    контракту за время жизни позиции.
  observable: >-
    Средняя ставка финансирования по монетам универса (в годовых) и доля часов,
    когда она выше порога входа 10% в год; для переводов — число пополнений
    залога на позицию.
  quote:
    text: "signal: the mean of the last `signal_window_hours` hourly funding rates,"
    source: src/qlab/strategies/live/frab.py
  note: >-
    Пересказ: сигнал — среднее последних восьми часовых ставок, пересчитанное
    на год. Это тот же сигнал, что у живого FRAB.

signal:
  entry: >-
    Как у живого FRAB: монета без позиции, у которой сглаженная ставка выше 10%
    в год; сильнейшие занимают свободные места (их четыре, бюджет 90 долларов).
    Монета допустима на данном часе, только если в этот час торговались и её
    контракт на Hyperliquid, и её спотовая пара на Binance.
  exit: >-
    Как у живого FRAB: двухфазное правило. Пока заработанная плата по контракту не
    покрыла комиссии круга, позиция в первой фазе и выходит при затяжных
    отрицательных ставках; после этого — во второй фазе и выходит, когда ставка
    ниже -10% в год и отданное от пика покрыло комиссии круга.
  data_needed:
    - "часовые цены, максимумы и ставки финансирования контрактов Hyperliquid"
    - "часовые цены спотовых пар Binance к USDT и курс USDC к USDT"
  timeframe: "часовые свечи"
  quote:
    text: "- each hour, in the live order (`on_hour_tick`): funding accrues on open"
    source: src/qlab/strategies/live/frab.py
  note: >-
    Пересказ: каждый час, в живом порядке: сначала начисляется плата по
    открытым позициям, потом проверяются выходы, потом входы.

sizing:
  rule: >-
    Как у живого FRAB: место — одна четвёртая бюджета; часть места идёт на
    покупку монеты на Binance, остальное — залог на Hyperliquid, причём
    доля залога тем больше, чем ниже предельное плечо монеты у Hyperliquid
    (плечо — во сколько раз позиция может быть больше залога). Если залога
    не хватает, часть позиции продаётся и деньги идут на пополнение.
  binding_constraint: "слоты (четыре места), минимальная нога (10 долларов у Hyperliquid) и плата за переводы"
  quote:
    text: "slot = self.budget_cap_usdc / self.concurrency_cap"
    source: funding-rate-arbitrage/src/frab/strategy/two_phase/params.py
  note: >-
    Пересказ: место равно бюджету, делённому на число мест.

protection:
  crash: >-
    Монета куплена, контракт продан в том же количестве: падение цены монеты
    возмещается выигрышем на контракте.
  pump: >-
    Рост цены съедает залог на Hyperliquid; защита — пополнение залога из
    прибыли по купленной монете на Binance. Между отправкой денег и их
    приходом залог уязвим; стенд задаёт эту задержку явно (один час) и проверяет
    ликвидацию по максимуму каждого часа. Принудительная продажа контракта
    биржей при нехватке залога оставляет монету без страховки.
  costs: >-
    Комиссии круга входят в правило выхода (выход из второй фазы только когда
    отданное от пика покрыло комиссии); плату за переводы правило не учитывает,
    она платится сверху.
  structural: true
  note: >-
    Защита от падения — конструкция (монета против контракта). Защита от роста
    держится на деньгах, которые надо успеть перевести между двумя площадками.
  quote:
    text: "Cross positions are liquidated when the account value (including unrealized pnl) is less than the *maintenance margin* times the total open notional position."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/margining

execution:
  legs: 2
  atomic_required: true
  venue: "Hyperliquid (контракт) и Binance (монета)"
  min_leg_notional_usd: 10
  note: >-
    Две ноги на разных площадках. У frab сейчас есть исполнение только на
    Hyperliquid; для Binance нужен отдельный клиент и откат при сбое одной ноги
    между площадками. q-lab ордеров не ставит, исполнение — работа на стороне frab.
  quote:
    text: "There is a $1 fee for withdrawing at the time of this writing and withdrawals take approximately 5 minutes to finalize."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/exchange-endpoint

death:
  how: >-
    Плата по контракту упадёт ниже суммы комиссий двух площадок и платы за
    переводы; или Binance закроет доступ владельцу (условия площадки изменятся);
    или пара «контракт-монета» разойдётся так, что залог не успеют пополнить.
  visible_in_advance: true
  observable: >-
    Доля монет универса, у которых ставка выше порога входа; число пополнений
    залога на позицию; расхождение цены монеты на двух площадках.
  quote:
    text: "Hyperliquid perp taker 0.045% and Binance spot taker 0.100%"
    source: docs/FRAB_BINANCE_SPOT.md
  note: >-
    Пересказ: комиссия контракта на Hyperliquid 0.045%, комиссия покупки монеты
    на Binance 0.100% (базовые уровни).

feasibility:
  data_free: true
  data_source: >-
    Публичные интерфейсы Hyperliquid (свечи, ставки) и Binance (свечи спота,
    курс USDCUSDT; список закрытых пар — публичный архив data.binance.vision).
  # Здесь «поддерживается» значит: обе площадки доступны владельцу, а исполнение
  # на перпе уже есть у frab. Отсутствие клиента Binance в frab записано в
  # blockers, а не снимает карточку: стенд сам пишет это числом (venue_supported = 0).
  venue_supported: true
  min_capital_order_of_magnitude_usd: 100
  blockers:
    - "в frab нет клиента Binance и отката при сбое одной ноги между площадками"
    - "плата за переводы 1.4 доллара на круг делает малый бюджет (90 долларов) неокупаемым — проверяется стендом, а не принимается на веру"
  owner_can_open:
    all_legs_reachable: true
    unreachable_legs: []
  legs:
    - what: "короткий бессрочный контракт на BTC (самый ликвидный из универса)"
      venue: "Hyperliquid"
      instrument: "BTC"
      last_traded: 2026-10-25
      daily_volume_usd: 1543891855
      bars_available: 5000
    - what: "покупка BTC за USDT на споте"
      venue: "Binance"
      instrument: "BTCUSDT"
      last_traded: 2026-10-25
      daily_volume_usd: 546820131
      bars_available: null
    - what: "остальные монеты универса (пары на обеих площадках)"
      venue: "Hyperliquid и Binance"
      instrument: "по одной паре на монету"
      last_traded: null
      daily_volume_usd: null
      bars_available: null
  note: >-
    Объём снят 2026-10-25 публичными запросами (Hyperliquid: dayNtlVlm; Binance:
    ticker/24hr). Для остальных монет ликвидность по ногам не проверена; стенд
    ограничивает каждую пару часами, когда обе ноги торговались, но глубину рынка
    он не измеряет.

prior:
  graveyard_matches: [frab]
  note: >-
    Тот же драйвер, что у живого FRAB (плата по контракту против купленной
    монеты), и решения те же. Вопрос другой: не «зарабатывает ли FRAB на шести
    монетах Hyperliquid», а «сохраняется ли заработок, если взять все монеты
    с парами на двух площадках и заплатить за разнесение денег».
