# Карточка по схеме cards/SCHEMA.md. Написана 2026-10-25 по идее владельца:
# «можно в qlab запусить frab на более чем 4-5 монетах. я знаю что HL ограничен в
# количестве spot pairs. я бы хотел прогнать вариант когда спот открывается на
# binance а хеджируется на HL. - поидее это новая стратегия.»
# Решения о входе и выходе — те же, что у живого FRAB; новое — где лежат деньги.
# Цитаты из кода и документов приведены дословно и не переводятся; рядом — пересказ.

idea_id: frab-binance-spot
title: 'Покупать монету на бирже Binance и в тот же момент продавать такую же на бессрочном контракте Hyperliquid, чтобы получать плату по контракту — на всех монетах, которые есть на обеих площадках'
found_at: 2026-10-25

plain_summary: >-
  Стратегия зарабатывает на одном платеже. На бирже Hyperliquid есть «бессрочный
  контракт» — ставка на цену монеты без даты окончания. Чтобы цена контракта
  не уходила от цены самой монеты, участники раз в час платят друг другу
  «ставку финансирования»: когда на контракт больше желающих ставить на рост,
  тот, кто ставит на падение, получает деньги каждый час. Мы продаём контракт
  на падение и одновременно покупаем столько же самой монеты (покупка монеты
  за деньги называется «спотом»). Если цена вырастет, потеря на контракте
  равна прибыли на монете, если упадёт — наоборот, так что цена не важна, а
  часовая плата остаётся нам. Пример: монета платит 20% в год; на 22 доллара
  позиции это примерно 37 центов в месяц; комиссии покупки и продажи на обеих
  площадках на круг около 6 центов, а переводы денег между площадками ещё
  1.4 доллара. Отличие от живого FRAB в том, где лежит монета: у живого FRAB её
  покупают тоже на Hyperliquid, но спотовых пар там мало, и стратегия
  ограничена шестью монетами, из которых одновременно можно держать четыре.
  Здесь монету покупают на Binance, где пар на сотни монет, а контракт
  продают на Hyperliquid. Цена этого — три новые заботы. Первая: комиссия
  покупки на Binance выше (0.100% против 0.070% на споте Hyperliquid). Вторая:
  монеты с Binance нельзя положить в залог на Hyperliquid, поэтому под
  продажу контракта лежит отдельная сумма в долларовой монете USDC; когда цена монеты
  растёт, контракт теряет, залог тает, и его пополняют, продавая часть монеты
  на Binance и переводя деньги на Hyperliquid; каждый перевод стоит
  фиксированную плату (0.4 доллара с Binance, 1 доллар с Hyperliquid). Третья:
  цены двух площадок немного расходятся (доли процента), и это расхождение
  становится доходом или убытком. Где теряем: при малом бюджете фиксированная
  плата за переводы съедает доход; когда цена резко растёт, залог приходится
  пополнять и позиция уменьшается. Почему может перестать работать: плата по
  контракту может стать отрицательной или упасть ниже комиссий, как у любой
  стратегии на этом платеже.

