    title: 'Решение владельца от 2026-10-27: Bv2 — защита, Bv3 — доход, страховка снимается чаще, по разным срокам'
    published: 2026-10
  - url: ../funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md
    title: 'Пределы Bv2: разделы 6–9 — пять исследований сигнала страховки (около 45 вариантов), доля ложных тревог, переключение по режиму'
    published: 2026-09
  - url: docs/BV2_SIGNAL_SEARCH_REVIEW.md
    title: 'Как искали сигнал страховки и где не искали (разбор владельца 2026-10-24)'
    published: 2026-10
  - url: docs/ONE_CHECK.md
    title: 'Одна идея — одна проверка: список значений объявляется заранее'
    published: 2026-11

driver:
  who_pays: >-
    Те, кто продаёт монету на падении и покупает на отскоке: на коротком отскоке цена возвращается
    быстрее, чем успевает развернуться медленное правило, и держащий страховку платит за это
    упущенным ростом.
  why: >-
    Цена на короткие сроки колеблется сильнее, чем на длинные, и многие отскоки внутри падения
    заканчиваются за часы; страховка, снятая в начале отскока, не теряет его рост. Это слова
    владельца, а не измерение: проверка и нужна, чтобы увидеть, остаётся ли выигрыш после комиссий
    и ложных тревог.
  kill_condition: >-
    Отскоки внутри падения перестают держаться: после короткого роста цена чаще возвращается вниз,
    чем растёт дальше, или комиссии за частые включения съедают выигрыш.
  observable: >-
    Доля снятий страховки по короткому росту, после которых за следующие трое суток монета упала
    ниже цены снятия; если она больше половины, плата перестала приходить.
  quote:
    text: "в качестве основы по тренду брать не биткоин а монету на которой работать"
    source: ideas/inbox.yaml#idea-0001
  note: >-
    Пересказ: тренд (общий ход цены в одну сторону) определять по той монете, которой торгуем, а
    не по BTC.

signal:
  entry: >-
    Включение страховки по короткому сроку, когда длинный срок той же монеты говорит «вниз».
    Какие сроки и как именно, решает исследователь в опытах, а не эта карточка.
  exit: >-
    Снятие страховки чаще, чем у Bv2: по короткому сроку, а не после двенадцати часов подряд
    «не нужна» по медленному правилу.
  data_needed:
    - "часовые цены монет Binance (с 2019 года) и Hyperliquid (последние пять тысяч часов)"
    - "ставки финансирования для издержек страховки"
  timeframe: "часовые свечи; сроки сигнала — из объявленного списка"
  note: >-
    В карточке нет чисел сроков намеренно: числа выбирает код по прошлому на объявленном списке
    (docs/ONE_CHECK.md), а не человек и не агент.

prior:
  graveyard_matches: [strategy-b-v2]
  note: >-
    Bv3 — не повтор Bv2: у Bv2 вопрос «когда включать страховку» решён правилом по доходу за
    14 и 30 дней, и пять исследований frab не нашли лучше. Новое у Bv3 ровно два: несколько
    сроков одновременно (длинный даёт ход, короткий даёт момент) и ход по самой монете. Опыт,
    который отличается от вариантов Bv2 только числом, к Bv3 не относится.

feasibility:
  data_free: true
  data_source: >-
    Публичные интерфейсы Binance (свечи, история с 2019 года) и Hyperliquid (свечи, ставки);
    страховка исполняется там же, где у Bv2.
  venue_supported: true
  owner_can_open:
    all_legs_reachable: true
    unreachable_legs: []
  note: >-
    Исполнение Bv3 — то же, что у Bv2 (покупка монеты и короткий контракт на Hyperliquid);
    q-lab ордеров не ставит, исполнение — работа на стороне frab.
