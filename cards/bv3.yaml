# Корневая карточка Bv3 по схеме cards/SCHEMA.md. Написана 2026-11-03 по решению владельца от
# 2026-10-27 (ideas/inbox.yaml, idea-0001), дословно:
# «bv2 можно оставить как защита. bv3 - доход. новая стратегия где страховка снимается чаще, по
# разным таймфреймам. ведь таймфреймы они как матрешки - чем ниже тем больше колебаний. если
# рассмотреть варианты определения тренда по более высокому таймфрейму а включать по более
# низкому... в качестве основы по тренду брать не биткоин а монету на которой работать - вот такие
# идеи». Владелец, 2026-11-03: «да, делай все четыре».
#
# Это карточка ЦЕЛОГО направления, а не одного опыта: по ней в реестре появляется идея `bv3`, под
# которой стоят варианты исследователя (`bv3-research-*`, они считаются местами Bv3, а не Bv2).
# Опытов здесь нет и спеков нет: их по ночам пишет исследователь (night/research.yaml, `bv3`).
# Узкое прочтение той же мысли (страховку снимают быстрее по росту самой монеты за сутки) уже
# лежит отдельной карточкой cards/bv2-fast-release-by-own-trend.yaml.

idea_id: bv3
title: 'Bv3: та же монета со страховкой, которую снимают чаще и по нескольким срокам — доходная сестра Bv2, а не защита'
found_at: 2026-10-27

plain_summary: >-
  Bv3 — это Bv2 с другой целью. Bv2 держит монеты (BTC, ETH, SOL, AVAX) и, когда они падают,
  включает страховку: продаёт ту же монету на тот же размер на бессрочном контракте (ставка на
  цену монеты без даты окончания), так что падение цены гасится. Владелец решил, что Bv2 остаётся
  защитой, а Bv3 должна приносить доход: страховку надо снимать чаще, чтобы не терять рост
  отскоков. Идея владельца про сроки такая: сроки смотрят на цену как матрёшки, чем короче срок
  (час, сутки, неделя — это и есть «таймфрейм», окно, за которое смотрят на цену), тем больше
  колебаний. Поэтому общий ход вниз можно определять по длинному сроку, а страховку включать и
  снимать по короткому. И ещё: ход определять не по BTC, а по той монете, которой торгуем. Пример:
  монета неделю падала, длинный срок говорит «вниз», страховка стоит; за сутки монета выросла на
  3%, короткий срок говорит «вверх» — Bv2 ждёт, пока развернётся медленное правило, а Bv3 снимает
  страховку в тот же день и берёт этот рост. Где теряем: отскок оказался ложным, цена пошла вниз
  дальше, а страховки уже нет; частые включения и снятия стоят комиссий. Это главное препятствие, и
  оно уже известно: исследования frab (около 45 вариантов сигнала для включения страховки) не
  нашли ни одного, который обошёл бы действующее правило; доля ложных тревог оставалась 60–75% что
  бы сигнал ни читал, а то, что выигрывает в боковике, проигрывает в тренде. Поэтому планка у Bv3
  высокая: каждый опыт — одна идея с одной проверкой, весь список значений объявлен заранее.
  Почему может не работать: короткий срок ловит шум так же, как настоящий разворот.

sources:
