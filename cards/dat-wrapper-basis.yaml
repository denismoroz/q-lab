    заведомо глубже, ограничение здесь моё, а не площадки. У ног xyz:MSTR и
    xyz:BMNR числа — настоящая длина ряда: инструменты моложе.

prior:
  graveyard_matches: []
  note: >-
    По драйверу совпадений с одиннадцатью драйверами кладбища нет: там нет ни
    одного про премию за форму владения активом. Ближайший по ФОРМЕ —
    sector-pair-cointegration (две ноги, торгуется спред), но там драйвер —
    общие фундаментальные факторы сектора, и он эмпирически отсутствует;
    здесь спред имеет названный механизм создания и гашения (аккретивная
    эмиссия), а не предполагаемую стационарность. Новый вопрос отличается ещё
    и тем, что стал исполнимым только что: акция-обёртка появилась на
    Hyperliquid как HIP-3 перп, то есть обе ноги впервые оказались на одной
    доступной владельцу площадке.
