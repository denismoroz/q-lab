driver:
  who_pays: >-
    Инвестор, которому прямое владение токеном закрыто или дорого — налогом,
    мандатом или отсутствием доступа — и который покупает ту же экспозицию через
    акционерную обёртку. Он переплачивает: рыночная стоимость компании
    оказывается выше стоимости токенов на её балансе. Разницу (mNAV выше
    единицы) получает тот, кто способен держать обе стороны.
  why: >-
    Пока mNAV выше единицы, у компании есть механизм, который эту премию и
    создаёт, и гасит: выпуск акций по цене выше стоимости активов увеличивает
    количество токенов на акцию, то есть выгоден держателю. Именно из-за этого
    премия — не случайная ошибка цены, а предмет активной эмиссии, и именно
    поэтому она обязана в итоге сжиматься: чем больше выпущено, тем меньше
    дефицит упаковки. Источник ставит вопрос прямо и не находит рационального
    ответа на него.
  kill_condition: >-
    Исчезновение дефицита упаковки: появление дешёвого прямого доступа к активу
    и размножение самих обёрток. НАСТУПИЛО ПО ФАКТУ — 2026-06-27 enterprise
    mNAV крупнейшей из них (Strategy) опустился ниже единицы, то есть премия не
    просто сжалась, а перевернулась в дисконт. Это не прогноз: это
    зафиксированное событие, и оно означает, что кандидат в своей основной
    форме (продажа премии) СЕЙЧАС не имеет входа.
  observable: >-
    Сам mNAV — отношение enterprise value к стоимости токенов на балансе.
    Публикуемая величина, считается ежедневно из числа акций, долга и размера
    казны, и показывает затухание драйвера напрямую, без всякого PnL.
  quote:
    text: >-
      "There are also tax and other hurdles that prevent investors from buying
      tokens directly. For example, in Japan holding Bitcoin can be less tax
      efficient than stock ownership." ... "Why overpay for fractional ownership
      of crypto-tokens via an intermediary, when either through direct ownership
      or some other intermediary, as should be possible in a competitive market,
      the same exposure can be obtained cheaper?"
    source: https://arxiv.org/html/2507.14910v2

signal:
  entry: >-
    Короткая нога в перпе на акцию-обёртку (xyz:MSTR) против длинной ноги в
    перпе на её актив (BTC), в пропорции, уравнивающей долларовую экспозицию к
    активу, когда mNAV выше порога. Порога в источниках НЕТ: они описывают
    механизм и фиксируют уровни, но не задают торгового правила. Симметричный
    вход (длинная обёртка против короткого актива при mNAV ниже единицы)
    источниками тоже не описан, и обоснование у него другое — обратный выкуп
    вместо эмиссии.
  exit: >-
    Возврат mNAV к порогу. Правила выхода в источниках нет.
  data_needed:
    - "дневные свечи xyz:MSTR и BTC (HL /info, бесплатно)"
    - "дневные свечи xyz:BMNR и ETH (вторая пара)"
    - "ряд mNAV: размер казны в токенах, число акций, долг и префы — ВНЕ Hyperliquid, источник в q-lab отсутствует"
  timeframe: >-
    Недели-месяцы. Ни один источник горизонта не называет; оценка выведена из
    скорости, с которой описанное сжатие происходило (mNAV Strategy прошёл путь
    от премии к дисконту за месяцы, а не за дни), и является нашей, а не
    процитированной.
  quote:
    text: >-
      "mNAV, which is the ratio of enterprise value ... to the value of the
      crypto-tokens held. If this is above one issuing equity to purchase
      further tokens is value accretive."
    source: https://arxiv.org/html/2507.14910v2

sizing:
  rule: >-
    Ноги уравниваются по долларовой экспозиции к активу. Но коэффициент не равен
    единице и не наблюдаем прямо: акция несёт не только токены, но и долг,
    префы, операционный бизнес и собственное плечо, поэтому её чувствительность
    к цене актива приходится ОЦЕНИВАТЬ. Это оценка, а не конструкция, и в ней —
    главная слабость размера.
  binding_constraint: >-
    Ёмкость ноги-обёртки и режим маржи. Оборот xyz:MSTR — $18.2M/сутки (средний
    за семь суток к 2026-09-22), xyz:BMNR — $0.77M/сутки; ноги-активы (BTC
    $2.77B, ETH $1.38B) не ограничивают ничего. Дополнительно: MSTR и BMNR
    работают в режиме Normal Isolated, то есть маржа этой ноги не общая с
    остальным счётом.
  quote:
    text: >-
      "MSTR ... Max Leverage 10x ... Margin Mode Normal Isolated ... Funding
      Rate Multiplier 0.5"
    source: https://docs.trade.xyz/perpetuals/specifications-and-schedules/specification-index

protection:
  crash: >-
    Структурная, ПЕРВОГО из четырёх сортов по docs/SEARCH_CONSTRAINTS.md: обе
    ноги на одной площадке, и цена базового актива гасится между ними — ровно
    так же, как спот гасит перп-шорт в FRAB. Обвал BTC не является риском этой
    конструкции: он одновременно уменьшает и стоимость казны (короткая нога в
    акции дорожает в нашу пользу), и цену длинной ноги.
  pump: >-
    Тем же механизмом и симметрично.
  costs: null
  structural: true
  note: >-
    Защита закрывает ЦЕНУ АКТИВА, но не ПРЕМИЮ, а торгуется здесь именно премия
    — то есть незакрытым остаётся ровно то, ради чего позиция открывается. И у
    этого остатка хвост есть: премия может расширяться дольше, чем хватит
    маржи, а связь «цена акции — цена токена» опосредована долгом и эмиссией и
    потому оценивается, а не задана. Против костов защиты нет, и это не общая
    фраза, а названный источником факт: обёртки на крипто-активы ПРЯМО
    исключены из growth mode, поэтому нога xyz:MSTR платит стандартные ставки
    HIP-3 — 0.090% тейкером и 0.030% мейкером, вдвое выше обычного перпа HL,
    тогда как нога BTC платит обычные. Асимметрия костов между ногами — это
    находка карточки: у FRAB обе ноги в одном тарифе, здесь нет.
  quote:
    text: >-
      "The following are not eligible for growth mode: ... Perps on vehicles or
      wrappers that hold primarily crypto assets (e.g. MSTR)"
    source: https://docs.trade.xyz/perpetuals/mechanics/fees

execution:
  legs: 2
  atomic_required: false
  venue: >-
    Hyperliquid: нога-обёртка в деплое HIP-3 `xyz` (xyz:MSTR, xyz:BMNR), нога-
    актив на основном перп-рынке HL (BTC, ETH). Один счёт, один движок.
  min_leg_notional_usd: 10.0
  quote:
    text: >-
      "Order must have minimum value of $10."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/exchange-endpoint
  note: >-
    Атомарность не требуется (обе ноги ставятся последовательно, как в живом
    frab), но у площадки её и нет: venues/hyperliquid.yaml,
    supports_atomic_multileg: false. Существенная разница с FRAB: там обе ноги
    в одном режиме маржи, здесь нога-обёртка изолированная, а нога-актив — нет,
    поэтому прибыль одной ноги НЕ поддерживает маржу другой. Сессии тоже разные:
    xyz:MSTR имеет внешнюю сессию «24/5, from Sunday 8:00 PM ET to Friday 8:00
    PM ET», BTC — круглосуточно.

death:
  how: >-
    Драйвер умирает от исчезновения дефицита упаковки, и это уже произошло:
    прямой доступ к активу подешевел (спотовые ETF), а число обёрток выросло.
    Вторая форма смерти — не про эдж, а про инструмент: деплойер HIP-3 может
    снять рынок, и тогда закрывается не позиция, а вся нога. Третья: сама
    компания-обёртка при длительном дисконте перестаёт выпускать акции, и
    механизм, который премию гасил, останавливается — тогда дисконт может
    держаться сколь угодно долго, не будучи ошибкой.
  visible_in_advance: true
  observable: >-
    mNAV — публикуемый ежедневный ряд, прямо показывающий, есть ли ещё что
    собирать. Плюс суточный оборот по xyz:MSTR (жив ли инструмент).
  quote:
    text: >-
      "Strategy's (MSTR) enterprise multiple to net asset value (mNAV) has
      officially fallen below 1."
    source: https://www.coindesk.com/markets/2026/06/27/strategy-s-valuation-has-fallen-below-the-value-of-its-bitcoin-holdings
  note: >-
    Эта цитата получена из содержимого страницы CoinDesk через выборку
    инструментом, а не из печатного оригинала; заголовок и дата совпали с
    поисковой выдачей. Уровни mNAV, называемые другими вторичными источниками
    (0.62 к 13 июля, 0.68 к 3 августа), в карточку НЕ взяты: они не проверены по
    первоисточнику.

feasibility:
  data_free: false
  data_source: >-
    Цены обеих ног — Hyperliquid /info, бесплатно и без ключа (проверено
    2026-09-22). Но сигнал строится не на ценах, а на mNAV, а для него нужны
    размер казны в токенах, число акций, долг и префы — ряд, которого нет ни в
    HL, ни в q-lab (src/qlab/data/sources/ содержит только hyperliquid и
    binance). Без этого ряда кандидат не считается: на одних ценах mNAV не
    восстанавливается, потому что казна и число акций меняются независимо.
  venue_supported: true
  min_capital_order_of_magnitude_usd: 1000
  blockers:
    - "Входа сейчас нет: драйвер в своей основной форме (продажа премии) умер — mNAV Strategy ниже единицы с 2026-06-27. Обратная форма источниками не обоснована."
    - "Ряда mNAV в бесплатном контуре нет; собирать его придётся из корпоративной отчётности, то есть это платный либо ручной источник."
    - "История ног короткая и неравная: xyz:MSTR 295 дневных баров (с 2025-12-02), xyz:BMNR — 19 баров (с 2026-09-04). Вторая пара по сути не имеет истории вовсе."
    - "Асимметрия костов: нога-обёртка исключена из growth mode и платит 0.090%/0.030%, нога-актив платит обычный тариф HL."
    - "Разные режимы маржи (Normal Isolated против общей) и разные сессии: ноги не поддерживают друг друга ни маржой, ни временем торгов."
