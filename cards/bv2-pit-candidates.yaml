# Карточка написана агентом-карточником (idea-0007, 2026-11-06) из идеи входящих, дословно — в поле idea_source. Поля carder: — для реализатора и проверяющего.
# Вердикт по идее вынесет стенд, не агент.
idea_id: bv2-pit-candidates
found_at: '2026-11-06'
title: Страховка Bv2 на 10 самых ликвидных монетах, где список кандидатов строит код по данным на дату
  пересмотра, а не задан вручную
plain_summary: 'Эта идея не про новый источник дохода, а про честность проверки уже известной. Книга Bv2
  держит монеты на споте (обычная покупка монеты за доллары) и страхует их короткой позицией по бессрочному
  контракту (контракт без срока, который следует за ценой монеты), когда цена падает. Она зарабатывает
  на том, что в росте и в боковике монеты остаются в руках, а в падении страховка срезает убыток. Прошлый
  опыт с десяткой самых ликвидных монет (bv2-research-top10-pool) брал десятку из списка в 43 монеты,
  который составили вручную, глядя на всю историю: монета попадала в список, если была в первой десятке
  хотя бы 4 недели из 175. Это небольшой взгляд в будущее. Теперь список строит код. На каждую дату пересмотра
  (первое число месяца) он берёт все монеты, у которых уже есть и спот, и контракт и накоплена нужная
  история цен, затем из них берёт десять с самым большим оборотом за последние 30 дней. Пример (выдуманный
  для пояснения, не измеренный): допустим, на 1 марта 2024 года подходят 60 монет с контрактом и спотом,
  из них 12 торгуются меньше 30 дней и отсеяны, а из оставшихся десять самых оборотистых получают равные
  доли. Проигрывает идея там же, где и раньше: широкая корзина хуже четырёх крупных монет (+25.0% в год
  против +35.6% на окне выбора), потому что мелкие монеты чаще дают ложные тревоги. Она может перестать
  работать, если новые монеты будут сразу выходить и на спот, и на контракты, или если оборот всё сильнее
  соберётся в двух-трёх монетах.'
sources:
- url: ideas/inbox.yaml#idea-0007
  title: 'Идея исследователя: список кандидатов для десятки строит код, а не рука'
  published: null
- url: docs/BV2_BASKETS.md
  title: 'Откуда список кандидатов: 43 монеты, отобранные по всей истории'
  published: null
- url: specs/research/bv2/bv2-research-top10-pool.yaml
  title: Опыт с десяткой монет, в шапке которого сказано, что список от кода это idea-0007
  published: null
driver:
  who_pays: 'Те, кто ищет защиту от падения цены монеты и готов платить за неё: продавцы, закрывающие
    позицию в падении, и участники, платящие ставку финансирования (регулярная плата между покупателями
    и продавцами контракта) держателям короткой стороны.'
  why: Страховка по контракту срабатывает в затяжных падениях, а в боковике и росте монета остаётся в
    руках. Список кандидатов, построенный кодом, нужен не для дохода, а чтобы убрать взгляд в будущее
    и узнать, сколько от результата десятки было именно от удачного списка.
  kill_condition: Исчезает, если доход десятки из списка кода равен нулю или ниже, чем у десятки из ручного
    списка, и вперёд тоже, то есть всё преимущество было в подборе монет. Вердикт стенда выносится по
    десятке из списка кода самой по себе, по общим правилам и на деньгах стратегии; сравнение с десяткой
    из ручного списка служит пояснением, а не условием вердикта.
  observable: Доля месяцев, в которых десятка из ручного списка отличается от десятки из списка кода,
    и разница в доходности этих двух десяток на деньгах стратегии (это сравнение двух книг, вердикт по
    нему не выносится).
prior:
  graveyard_matches:
  - bv2-research-top10-pool
  - bv2-research-top10-pool-hl
  - bv2-research-btceth
  note: 'Прошлые опыты отвечали на вопрос, хороша ли десятка самых ликвидных монет, на списке, составленном
    вручную с небольшим взглядом в будущее. Новый вопрос другой: остаётся ли результат десятки, если список
    строит только код по данным на дату пересмотра. Правило десятки, залог, запас пула и страховка те
    же.'
carder:
  hypothesis_ru: Если список кандидатов строит код по данным на дату пересмотра (спот и контракт уже есть,
    история накоплена), то десятка самых ликвидных монет даёт доход на деньгах стратегии не хуже, чем
    на ручном списке в 43 монеты. Гипотеза ложна, если на списке от кода доход заметно ниже или просадка
    глубже, чем у ручной.
  readings_ru:
  - Нужная история означает только то, что хватает дней для окна оборота в 30 дней, чтобы монету можно
    было расставить по обороту.
  - Нужная история длиннее и покрывает окна сигнала страховки (до 60 дней), чтобы страховка по монете
    сразу считалась честно.
  - Контракт должен существовать на той же бирже, что и спот (Binance), как в панели стенда.
  - Контракт должен существовать на Hyperliquid, где книга Bv2 страхует в проде, так что монету, которую
    там нельзя застраховать, брать нельзя.
  baseline:
    spec: specs/research/bv2/bv2-research-top10-pool.yaml
    why_ru: Это та же десятка с тем же общим залогом и запасом 1.5; отличается только список кандидатов,
      а в шапке спека прямо сказано, что список от кода это idea-0007.
  vs_tried:
  - id: qlab-bv2-top10-liquid-list
    difference_ru: 'Там список кандидатов был составлен вручную, поэтому результат нельзя было отделить
      от удачного подбора; здесь кандидатов строит код на каждую дату, и каждому кандидату нужны и спот,
      и контракт, и история. Мощность проверки, чтобы увидеть разницу между ручным списком и списком кода,
      заранее не измерена: в записи этого опыта сказано, что на тех данных варианты неразличимы, поэтому
      разницу в доходности двух десяток стенд сравнивает с собственным шумом (ряд noise_cap_*), а не с
      нулём; если десятки почти всегда совпадают, ответ будет «различить нельзя», а не «список не важен».'
  - id: bv2-fixed-slow-windows-30-60
    difference_ru: Там сравнивались окна сигнала, выбранные задним числом; здесь окна сигнала не меняются,
      меняется только способ составить список монет.
  - id: qlab-regime-detector-btc30
    difference_ru: Там определялся режим рынка по BTC; здесь режим не определяется, меняется только состав
      монет.
  - id: bv2-basket-10-20-coins
    difference_ru: Там монеты ранжировали по сегодняшнему открытому интересу, с выжившими; здесь на каждую
      дату смотрятся только данные до неё, включая монеты, которых потом не стало.
  - id: bv2-basket-10-rolling-windows
    difference_ru: Там десять монет были заданы заранее (четыре плюс шесть); здесь состав десятки каждый
      месяц решает оборот среди монет, прошедших проверку наличия спота, контракта и истории.
  grid:
  - param: min_history_days
    values:
    - 30
    - 90
    meaning_ru: Сколько дней цен спота и контракта должно быть накоплено на дату пересмотра, чтобы монета
      попала в список кандидатов.
    source_ru: 'Круглые значения, выбранные здесь до любого прогона, результаты не смотрелись: 30 равно
      окну оборота спека, 90 покрывает самое длинное окно сигнала страховки с запасом.'
  - param: perp_must_exist_on
    values:
    - binance
    - hyperliquid
    meaning_ru: 'На какой бирже должен быть бессрочный контракт монеты на дату пересмотра: на той же,
      где спот (Binance), или на Hyperliquid, где книга Bv2 страхует в проде.'
    source_ru: Два прочтения слов идеи «есть бессрочный контракт»; значения названы по биржам, число не
      выбиралось.
  data:
    venue: binance
    interval: 1h
    start: 2023-04-28
    coin_rule_ru: 'На каждое первое число месяца код берёт все монеты, у которых на эту дату в данных
      уже есть спот и бессрочный контракт с историей не короче min_history_days (контракт на бирже по
      значению perp_must_exist_on), и берёт из них десять с наибольшим долларовым оборотом спота за предыдущие
      30 дней. Смотрятся только данные до даты пересмотра, закрытые контракты и снятые монеты остаются
      в выборке. Откуда берётся «контракт есть»: при binance это цены бессрочного контракта Binance из
      той же панели, страховка идёт по нему, как в базовом спеке. При hyperliquid наличие контракта, его
      история в днях и сама страховка считаются по ценам бессрочного контракта Hyperliquid из данных стенда,
      на которых идут вторые этапы с суффиксом _hl; спот при этом остаётся спотом Binance. Дата появления
      контракта на Hyperliquid берётся как дата его первой цены в этих данных (отдельного списка листингов
      нет). Оба варианта проверки истории (min_history_days) применяются к контракту выбранной биржи и
      к споту. Если данных Hyperliquid короче, чем у Binance, вариант hyperliquid судится только на датах,
      где эти данные есть. Начало data.start перенято из базового спека (опыт десятки начинался с этого
      дня); для широкой панели начало истории заранее не проверено: у BTC и ETH история Binance идёт с
      2019, у остальных монет раньше первой цены монеты в панели список не строится, и стенд берёт самую
      раннюю дату, на которую панель есть, а не день записи идеи.'
    hand_picked: false
  new_block:
    name: pit_candidates
    params:
    - name: min_history_days
      meaning_ru: Минимум дней истории спота и контракта у монеты на дату пересмотра.
    - name: perp_must_exist_on
      meaning_ru: 'Биржа, на которой на дату пересмотра должен существовать бессрочный контракт монеты:
        binance или hyperliquid.'
    rule_ru: 'Блок заменяет поле candidates правила top_liquid в параметрах universe базового спека. Вместо
      заранее заданного списка из 43 монет блок на каждую дату пересмотра (первый час первого числа месяца)
      составляет список так. Шаг 1: взять все инструменты панели, у которых есть и спот (инструмент с
      суффиксом -SPOT), и бессрочный контракт на бирже perp_must_exist_on. Шаг 2: оставить только те,
      у которых на дату пересмотра есть не меньше min_history_days полных суток цен и спота, и контракта;
      монету, у которой первая цена позже, чем дата пересмотра минус min_history_days, не брать. Шаг 3:
      из оставшихся посчитать долларовый оборот спота за 30 суток до даты пересмотра (window_days базового
      спека) и взять n самых оборотистых (n = 10 из базового спека); при равенстве оборота берётся монета,
      стоящая раньше по алфавиту. Шаг 4: если подходящих монет меньше n, берутся все подходящие, доли
      делятся поровну между ними, а не добираются деньгами. Особые случаи. (а) Монета есть в панели, но
      в окне истории пропущены сутки: такие сутки не считаются, и монета не проходит проверку истории,
      пока полных суток не набрано min_history_days. (б) Монета, вышедшая из десятки на новом пересмотре,
      закрывается по правилам выхода базового спека на этом пересмотре; вошедшая открывается по правилу
      входа базового спека. (в) Контракт закрыт или монета снята посреди месяца: позиция закрывается по
      последней цене, а место остаётся пустым до следующего пересмотра, замены посреди месяца нет. (г)
      Оборот спота равен нулю или не посчитан за часть 30 суток: монета в очередь по обороту не попадает.
      (д) Если на первое число первого месяца данных подходящих монет нет, первым пересмотром считается
      первое число месяца, где хотя бы одна монета проходит проверку; до него книга не торгует. Остальные
      правила (вход в позицию, залог, общий пул, храповик, страховка) берутся из базового спека без изменений.
      Данные после даты пересмотра блок не читает. Панель должна содержать все монеты, у которых есть
      спот и контракт в окне данных, а не только 43 монеты ручного списка, поэтому для этого опыта список
      instruments расширяется до всех монет с контрактом и спотом.'
