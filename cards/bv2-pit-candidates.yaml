    данных Hyperliquid короче, чем у Binance, вариант hyperliquid судится только на датах, где эти данные
    есть. Начало data.start перенято из базового спека (опыт десятки начинался с этого дня); для широкой
    панели начало истории заранее не проверено: у BTC и ETH история Binance идёт с 2019, у остальных монет
    раньше первой цены монеты в панели список не строится, и стенд берёт самую раннюю дату, на которую
    панель есть, а не день записи идеи.'
