driver:
  who_pays: >-
    Сама площадка — из будущего предложения своего токена (баллы, конвертируемые
    в эмиссию при TGE) или из бюджета деплойера. Конечный плательщик —
    будущий держатель токена, чья доля размывается. Это единственный кандидат
    из пяти, где плательщик не участник рынка.
  why: >-
    Новой площадке нужна глубина книги ДО того, как появится органический поток:
    без глубины не приходят тейкеры, без тейкеров не приходят мейкеры.
    Площадка разрывает этот круг, покупая котировки за собственную эмиссию.
    Lighter платит не за объём как таковой: книга сэмплируется в случайные
    моменты, и баллы начисляются пропорционально доле предоставленной
    ликвидности в заданных порогах глубины и удалённости от мида.
  kill_condition: >-
    Окончание программы. Это не рыночное событие, а решение площадки: сезон
    заканчивается, TGE происходит, эмиссия на единицу объёма падает ниже
    стоимости несения инвентаря. Дополнительно — разводнение: чем больше
    мейкеров в программе, тем меньше доля каждого при том же бюджете.
  observable: >-
    Публикуемый график начислений и объявления о сезонах; собственная доля в
    сэмплируемой ликвидности; отношение «начислено баллов на доллар средненочного
    инвентаря» — считается напрямую и падает раньше, чем становится убыточным.
  quote:
    text: >-
      "score = volume + max(0, (volume - 2.5B) x 0.25)"
    source: https://docs.lighter.xyz/points-program/market-makers
  quote_venue:
    text: >-
      "On Hyperliquid, fees are entirely directed to the community (HLP, the
      assistance fund, and deployers)."
    source: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees
  note: >-
    Важное различие внутри драйвера, видное из двух цитат: ребейт Hyperliquid
    (-0.001% / -0.002% / -0.003% на ступенях >0.5% / >1.5% / >3.0% maker-объёма
    площадки) финансируется комиссиями тейкеров, то есть это перераспределение
    внутри рынка. Баллы Lighter и Ventuals финансируются будущим предложением
    токена. Драйвер этой карточки — ВТОРОЕ; ступени HL приведены как контрастный
    случай и как оценка того, сколько стоит та же услуга без эмиссии.

signal:
  entry: >-
    Котировать с двух сторон внутри тех порогов глубины и удалённости от мида,
    по которым площадка сэмплирует книгу. Для Lighter метрики оцениваются
    раздельно по бид- и аск-стороне, порядка 6-10 метрик на рынок с равным
    весом; веса рынков пересчитываются ежечасно.
  exit: >-
    Выход задан календарём программы, а не рынком: конец сезона. У Lighter
    баллы за ликвидность считаются ежедневно с дневным множителем по
    волатильности и с полом, гарантирующим каждому дню не менее 8.33% недельных
    баллов за ликвидность; агрегация — недельная.
  data_needed:
    - "публикуемые правила и пороги программы (глубина, удалённость от мида, веса рынков)"
    - "собственная книга заявок и собственный поток филлов"
    - "цена токена площадки или её оценка — без неё доход в баллах не переводится в доллары"
  timeframe: "недельные сезоны начислений; сэмплирование книги — в случайные моменты, веса рынков — ежечасно"
  quote:
    text: >-
      "The system uses random order book sampling intervals. For each market,
      approximately 6-10 metrics are evaluated equally, assessed separately for
      bid and ask sides." ... "these thresholds will depend on the market"
    source: https://docs.lighter.xyz/points-program/market-makers

sizing:
  rule: >-
    Размер задаётся порогами самой программы: чтобы попасть в метрику, надо
    стоять внутри заданной глубины на заданном удалении. Пример документации
    для BTC — категории глубины $300k, $1M, $3M, $10M, $30M и удалённости
    0.5, 1, 2, 4, 10 б.п. от мида; документация прямо оговаривает, что пороги
    зависят от рынка и фактические параметры могут отличаться.
  binding_constraint: >-
    Пороги глубины программы. Ниже нижнего порога вознаграждения нет вовсе —
    это не «меньше дохода», а ноль, что делает ёмкость снизу жёсткой.
  quote:
    text: >-
      "An illustrative example for BTC shows depth categories of $300k, $1M,
      $3M, $10M, and $30M, plus spread distances of 0.5 bps, 1 bps, 2 bps,
      4 bps, and 10 bps."
    source: https://docs.lighter.xyz/points-program/market-makers

protection:
  crash: >-
    Структурно — у самого ДОХОДА: начисление зависит от присутствия в книге, а
    не от направления цены, поэтому источник дохода не имеет собственных хвостов.
    Но инвентарь, набранный при котировании, хвосты имеет, и против него
    защиты в источниках НЕ ОПИСАНО НИКАКОЙ — ни ноги, ни лимита, ни правила
    сведения к нулю.
  pump: >-
    То же самое симметрично: начисление безразлично к направлению, инвентарь — нет.
  costs: >-
    Частично и структурно: на площадках, покупающих ликвидность, мейкерская
    ставка обнулена или отрицательна. Paradex по вторичному источнику берёт
    3 б.п. с тейкера и 0 б.п. с мейкера; growth mode деплойера HIP-3 срезает
    комиссии на 90% и более.
  structural: true
  note: >-
    Разделение здесь важнее обычного: защищён ИСТОЧНИК ДОХОДА (он не зависит от
    цены), но не ПОЗИЦИЯ (инвентарь зависит). Ни один источник не говорит, что
    делать с инвентарём — это молчание, а не решённый вопрос. Отдельный, не
    рыночный хвост: доход номинирован в баллах, курс которых на момент
    начисления неизвестен, а конверсия в токен — обещание площадки, а не
    обязательство. Величина этого хвоста не измеряется ни одной из наблюдаемых
    величин до TGE.
  quote:
    text: >-
      "trade.xyz's Growth Mode may reduce these fees by 90% or more."
    source: https://hyperliquidguide.com/guides/trading/equity-perps-guide

execution:
  legs: 1
  atomic_required: false
  venue: >-
    Перп-DEX с действующей программой: Lighter (документация процитирована),
    Ventuals как HIP-3 деплойер, Paradex. На самой Hyperliquid аналог —
    ребейт-ступени, а не эмиссия.
  min_leg_notional_usd: null
  quote:
    text: >-
      "Ventuals rewards maker activities via a points system to incentivise
      liquidity."
    source: https://crypto.com/en/research/equity-commodity-perps-jan-2026
  note: >-
    Минимального размера заявки ни на одной из этих площадок в источниках нет.
    Одна нога, если инвентарь не хеджируется; две, если хеджируется на HL — но
    этот вариант в источниках не описан.

death:
  how: >-
    Программа заканчивается. Это ЕДИНСТВЕННЫЙ кандидат из пяти, чья смерть
    назначена заранее и опубликована: сезоны имеют даты, TGE происходит один
    раз, после него бюджет либо исчезает, либо становится обычным ребейтом,
    финансируемым тейкерами. Вторая форма — разводнение внутри неизменного
    бюджета по мере прихода мейкеров.
  visible_in_advance: true
  observable: >-
    Объявления о сезонах и график начислений (публикуются площадкой);
    «баллов на доллар инвентаря в неделю» — своя метрика, падает по мере
    разводнения; факт TGE. Затухание видно не по PnL, а по календарю.
  quote:
    text: >-
      "Points are distributed proportionally to user scores." ... "Volume scores
      calculate weekly; liquidity points calculate daily with weekly aggregation."
    source: https://docs.lighter.xyz/points-program/market-makers

feasibility:
  data_free: true
  data_source: >-
    Правила программ публикуются в документации площадок бесплатно. Но
    исторических данных для БЭКТЕСТА этого кандидата не существует в принципе:
    начисление зависит от того, стояли ли ВЫ в книге в случайный момент
    сэмплирования — величина, которой нет ни в каком историческом ряду.
    Проверить можно только вперёд, живыми деньгами.
  venue_supported: false
  min_capital_order_of_magnitude_usd: 100000
  blockers:
    - "Бэктест невозможен по конструкции: вознаграждение — функция вашего присутствия в книге в моменты случайного сэмплирования, а не функция рыночного ряда. Это ставит кандидата вне того, что стенд q-lab умеет оценивать."
    - "Мейкерская ступень Lighter начинается с недельного объёма порядка 2.5B — вне горизонта капитала ($120k). Ликвидностные пороги глубины в примере для BTC начинаются с $300k — тоже выше горизонта; на мелких рынках пороги ниже, но их значения в источниках не приведены."
    - "Ребейт-ступень Hyperliquid (>0.5% всего maker-объёма площадки) недостижима при этом капитале — доступный на HL вариант этого драйвера отсутствует."
    - "Доход номинирован в баллах с неизвестным курсом и без обязательства конверсии; оценить его в долларах до TGE нельзя."
    - "Требует постоянно живого процесса котирования на новой площадке — инфраструктура вне периметра frab/q-lab."
  note: >-
    min_capital_order_of_magnitude_usd — оценка q-lab по процитированным порогам
    программ, не цитата.

prior:
  graveyard_matches: []
  note: >-
    Совпадений по драйверу нет и быть не может: во всех одиннадцати
    похороненных драйверах платит участник рынка (лонг с плечом, продавец
    анлока, проигравшая сторона тренда). Здесь платит эмитент токена площадки
    из будущего предложения. Это ближайший к источнику 4 из docs/PLAN.md
    («изменения структуры рынка — единственный источник, который не иссякает»)
    кандидат в наборе: он существует ровно потому, что запускаются новые
    площадки, и умирает ровно тогда, когда конкретная площадка перестаёт быть
    новой.
