driver:
  who_pays: >-
    Заявлено: те, кто слишком медленно реагирует на тренд (поведенческий
    эффект, как его описывает seed/graveyard.yaml). На деле аудит показывает
    обратное: платит сама стратегия. Купленная половина
    книги состоит из монет, на рост которых уже ставит толпа, и за это
    постоянно платит ставку финансирования (около −4.65% в год на живой книге).
  why: >-
    Монеты, лучшие за последние недели, в среднем ещё несколько недель
    обгоняют худших (пересказ описания драйвера в seed/graveyard.yaml). Автор аудита
    называет это «структурно анти-carry» (carry — доход или расход от самого
    удержания позиции, здесь платежи по финансированию): перекос, на котором
    строится сигнал, совпадает с перекосом, за который приходится платить.
  kill_condition: >-
    Рынок переходит к отрицательной связи недельных доходностей (победители
    недели проигрывают в следующую), либо сделка переполняется (платёж по
    финансированию съедает всю премию), либо тот же сигнал арбитражируется.
    Платёж по финансированию уже съел её на живой книге.
  observable: >-
    Скользящий годовой Шарп книги «верхняя треть купить, нижняя продать» на
    перпах Hyperliquid и платежи по финансированию, которые платит купленная
    половина (скрипт weekly_attrib.py в funding-rate-arbitrage).
  quote:
    text: "уже выросло — ровно те перпы, где толпа в лонге и платит funding."
    source: funding-rate-arbitrage/research/xsmom_live_recon/AUDIT_2026_09.md

signal:
  entry: >-
    Раз в неделю по четвергам по закрытию дня. Для каждой монеты из списка и
    для каждого из пяти окон (14, 21, 30, 45, 60 дней) считается рост цены, а
    затем во сколько раз он выше или ниже среднего по всему списку (в долях
    разброса). Пять таких оценок усредняются; если у монеты нет истории хотя
    бы на одно из окон, оценки у неё нет и она не участвует. Монеты
    сортируются по этой итоговой оценке: верхние k покупаются, нижние k
    продаются в короткую. По умолчанию k равно трети списка (32 монеты дают 10
    на сторону), но живая книга держала по 8 на сторону; почему задали 8, в
    источниках не сказано.
  exit: >-
    Отдельного выхода нет. При пересборке монета, которая осталась в той же
    половине, не трогается; которая выпала из очереди — закрывается;
    которая перешла из верха в низ или наоборот — закрывается и открывается
    заново с другой стороны. Закрытие по залогу отдельно — в разделе защиты.
  data_needed: [дневные цены закрытия 32 монет, ставка финансирования бессрочных контрактов (для учёта платежей)]
  timeframe: дневные свечи; окна 14/21/30/45/60 дней; пересборка раз в 7 дней по четвергам
  quote:
    text: "Mirrors research momentum_ensemble: per lookback, momentum = close[t]/close[t-lb]-1,"
    source: funding-rate-arbitrage/src/frab/strategy/xsmom/evaluators/signal.py

sizing:
  rule: >-
    Сумма делится поровну между покупками и продажами, а внутри стороны —
    поровну между ногами. Часть бюджета не вкладывается: резерв — большее из
    8% бюджета и $20. Бюджет по умолчанию $1000; живая книга держала около
    $241 суммарно на 16 позиций. Плечо 1, то есть позиции открываются без
    заёмных денег.
  binding_constraint: >-
    Минимальная нога: код требует $12 на ногу (биржевой минимум $10 плюс запас
    на проскальзывание); если книга слишком мала, число ног уменьшается. По
    расчётам q-lab: 20 ног требуют около $240 капитала, а 148 ног (честный
    список из 222 монет) — около $1 776.
  quote:
    text: "Budget is split equally across both sides: ``budget_cap / 2`` per side,"
    source: funding-rate-arbitrage/src/frab/strategy/xsmom/params.py

protection:
  crash: >-
    Общее падение рынка в книге гасится тем, что покупки и продажи равны по
    сумме: что теряют купленные монеты, отыгрывают проданные. От ситуации,
    когда лидеры падают сильнее отстающих (обвал самого сигнала), защиты нет:
    именно так книга потеряла −11.19%.
  pump: >-
    Для проданных в короткую монет, резко выросших в цене, есть только
    часовой сторож залога: если по счёту залог на пределе, он закрывает
    самую слабую позицию. Отдельного запаса на скачок нет.
  costs: null
  structural: false
  note: >-
    Равенство покупок и продаж — конструкция, но она закрывает только движение
    всего рынка. Убыток живой торговли пришёл из другого места: сигнал выбрал
    то, что потом упало («Убыток целиком «модельный»: сигнал выбрал то, что
    упало»). От платежей по финансированию в источнике защиты нет вовсе: это
    постоянная утечка, и аудит называет её структурной.
  quote:
    text: "      - When account triggers close, the weakest position (lowest virtual_ratio)"
    source: funding-rate-arbitrage/src/frab/strategy/xsmom/protection/margin_watchdog.py

execution:
  legs: 16
  atomic_required: false
  venue: >-
    Hyperliquid, бессрочные контракты 32 монет (список заморожен 2026-06-12, 34
    монеты, после запуска убраны HMSTR и TON). Одна площадка, ноги открываются
    по очереди, одна позиция за шаг.
  min_leg_notional_usd: 12.0
  quote:
    text: "        _MIN_LEG = 12.0  # HL ~$10 min order + slippage buffer"
    source: funding-rate-arbitrage/src/frab/strategy/xsmom/params.py

death:
  how: >-
    Умерла: остановлена владельцем в промежутке между 12 и 20 сентября 2026
    (точная дата не названа). Причина — ложное открытие: отбирали по
    единственному признаку (мало связана с FRAB — другой стратегией лаборатории,
    которая зарабатывает на ставке финансирования; это устное заявление
    владельца 2026-09-20), сочли прибыльной, а прибыли не было с самого
    начала. Не было видно, потому что расчёт на прошлых данных (бэктест) не
    учитывал платежи по финансированию, считал только монеты, дожившие до
    сегодняшнего дня, и брал удачное окно.
  visible_in_advance: true
  observable: >-
    Шарп на честных данных: с мёртвыми монетами 0.76, с платежами по
    финансированию около 0.53. Эти поправки можно было сделать до запуска.
  quote:
    text: "**Реальное ожидание было завышено ~3.4×.** Не на проценты — в разы."
    source: funding-rate-arbitrage/research/xsmom_live_recon/AUDIT_2026_09.md

feasibility:
  data_free: true
  data_source: >-
    Дневные свечи и ставки финансирования Hyperliquid (бесплатно, без ключа).
    Честный список (222 монеты, включая снятые) собирает q-lab; замороженный
    список из 32 монет даёт искажение выжившими.
  venue_supported: true
  min_capital_order_of_magnitude_usd: 240
  blockers:
    - >-
      Прибыли на честных данных нет. Честный список (222 монеты, 148 ног):
      +1.55% в год, Шарп 0.193, хуже лучшего из 200 случайных книг. Замороженный
      список из 32 монет: +10.96% в год, но в нём остались только монеты,
      дожившие до сегодняшнего дня (искажение выжившими), и правило честного
      списка его отвергает (docs/XSMOM_T21.md).
    - >-
      Контрольный прогон на честном списке с 20 ногами проходит все правила
      (+32.17% в год, Шарп 1.042), но десять лучших дней из 627 несут весь
      результат, книга состоит из монет-шуток (мемкоинов) с сильными
      колебаниями, а случайные книги такой же формы проходят те же правила в
      23.5% случаев (47 из 200, калибровочный отчёт) и в 26% при перекалибровке
      под эту книгу (docs/XSMOM_T21.md). Вывод оттуда: не отличимо от удачи, а
      не «доказанная прибыль».
    - >-
      Платежи по финансированию структурно против книги: −4.65% в год на живой
      книге, 13 отрицательных недель из 13 (AUDIT_2026_09.md, раздел 3.1).
    - >-
      Число ног в источниках расходится: по умолчанию 20 при 32 монетах (т.е.
      10 на сторону), живая книга и аудит — по 8 на сторону.
  owner_can_open:
    all_legs_reachable: true
    unreachable_legs: []
  legs:
    - what: >-
        покупаемая половина: бессрочные контракты на 8 монет с лучшей оценкой
        (из замороженного списка в 32 монеты; в списке отбирали монеты с
        оборотом от $1 млн в сутки на 2026-06-12)
      venue: Hyperliquid
      instrument: бессрочные контракты 32 монет (AAVE, ADA, APT, ... ZRO; полный список в params.py)
      last_traded: null
      daily_volume_usd: null
      bars_available: null
    - what: >-
        продаваемая половина: бессрочные контракты на 8 монет с худшей оценкой
        (из того же списка)
      venue: Hyperliquid
      instrument: бессрочные контракты тех же 32 монет
      last_traded: null
      daily_volume_usd: null
      bars_available: null

prior:
  graveyard_matches: [cross-sectional-momentum, xsmom, xsmom-overlays]
  note: >-
    Это не новый кандидат, а карточка захороненной стратегии: идея xsmom в
    реестре имеет статус decayed с причиной false-discovery, драйвер —
    cross-sectional-momentum (seed/graveyard.yaml), надстройки xsmom-overlays
    отвергнуты. Ликвидность ног (последняя сделка, дневной оборот) в этот раз
    не проверялась запросом: стратегия остановлена, а расхождения по данным
    уже описаны выше. Воскресить идею можно только на данных, которых не было
    в момент отказа (CLAUDE.md); любая новая проверка должна идти на честном
    списке монет, с платежами по финансированию и с числом ног, назначенным
    до просмотра результатов.
