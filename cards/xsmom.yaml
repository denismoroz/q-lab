# Написана 2026-10-25 по коду frab (funding-rate-arbitrage/src/frab/strategy/xsmom/),
# по аудиту живой торговли (funding-rate-arbitrage/research/xsmom_live_recon/AUDIT_2026_09.md)
# и по разбору q-lab (docs/XSMOM_T21.md, docs/CALIBRATION_2026-09-21.1__xsmom-honest-20legs.md).
# Это стратегия, из-за которой q-lab существует: карточка описывает ЗАХОРОНЕННУЮ
# стратегию для справки, а не предлагает её. found_at — дата запуска в бой
# (seed/graveyard.yaml); дата, когда идею впервые нашли, в источниках не названа.
# Цитаты из кода и аудита приведены дословно и не переводятся; рядом — пересказ.

idea_id: xsmom
title: 'Покупать монеты, которые росли сильнее всех, и продавать те, что росли слабее всех: раз в неделю, на бессрочных контрактах Hyperliquid (остановлена: прибыли не было)'
found_at: 2026-06-15

plain_summary: >-
  Идея старая и простая: монеты, которые последние недели росли лучше остальных,
  в среднем ещё какое-то время продолжают обгонять отстающие. Стратегия берёт
  список из 32 монет и раз в неделю, по четвергам, ставит их в очередь: для
  каждой считает, насколько её рост за 14, 21, 30, 45 и 60 дней выше или ниже
  среднего по списку, и усредняет эти пять оценок. Верхнюю часть очереди она
  покупает (ставка на рост), нижнюю продаёт в короткую (продать то, чего нет,
  чтобы заработать на падении) через бессрочные контракты — это контракты без
  даты исполнения, цена которых привязана к цене монеты. Покупки и продажи
  равны по сумме, поэтому общее движение рынка в книге гасится: что теряет одна
  половина, то отыгрывает другая. Живая книга держала 16 позиций (их называют ногами), по 8 в
  каждую сторону, общей суммой около $241. Пример: если монета А выросла за два месяца
  на 40%, а монета Б упала на 20%, А окажется в начале очереди и будет куплена,
  Б окажется в конце и будет продана. Где теряем: бессрочный контракт требует
  регулярного платежа от тех, кто ставит на рост (он называется ставкой
  финансирования), а победители прошлых недель — как раз те монеты, на рост
  которых ставит толпа. Поэтому купленная половина всё время платит: аудит
  насчитал около −4.65% в год и 13 отрицательных недель из 13. Итог живой
  торговли с 15 июня по 12 сентября 2026: −11.19% за 13 недель. Исполнение тут
  ни при чём: модель на тех же данных дала те же −11.19%. Дело в самой идее:
  заявленный при запуске Шарп 1.80 (это отношение среднего дохода к размаху
  колебаний, чем выше, тем ровнее заработок) после трёх поправок — окно данных,
  мёртвые монеты, платежи по финансированию — упал примерно до 0.53. Владелец
  остановил стратегию в промежутке между 12 и 20 сентября 2026, причина —
  ложное открытие: прибыльной она не была никогда.

