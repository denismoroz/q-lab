# Карточка написана агентом-карточником (idea-0003, 2026-11-02) из идеи входящих, дословно — в поле idea_source. Поля carder: — для реализатора и проверяющего.
# Вердикт по идее вынесет стенд, не агент.
idea_id: frab-lot-leftover
found_at: '2026-11-02'
title: 'Стенд FRAB с остатком монеты после округления до лота биржи: сколько этот остаток стоит, когда
  он не прикрыт контрактом'
plain_summary: 'Стенд - это симулятор лаборатории, на котором мы прогоняем стратегии по истории цен. FRAB
  - стратегия, которая торгует на бирже Hyperliquid (ордера ставит не лаборатория, а отдельная программа).
  HYPE и PURR - названия монет на этой бирже. «Ряд денег стратегии» - кривая результата, посчитанная от
  суммы, выделенной стратегии (120 долларов), а не от остатка на счёте; «сверка живых денег» - сравнение
  этой кривой с тем, что реально произошло на живом счёте. Стратегия FRAB покупает монету на споте (обычная
  покупка за доллары) и одновременно продаёт такую же сумму бессрочным контрактом (ставка на цену без
  владения монетой), чтобы цена не влияла на результат, а доход давала плата по контракту, которую называют
  ставкой финансирования. Когда позицию закрывают, биржа продаёт монету только целыми «лотами» (минимальный
  шаг размера, например 0.00001 для BTC или 0.01 для HYPE), поэтому один лот монеты остаётся на счёте.
  Сейчас стенд считает, что позиция закрылась полностью, и этого остатка не видит. А на живом счёте остаток
  есть и двигается вместе с ценой. Если контракт под него не поставлен, остаток ничем не прикрыт и приносит
  то прибыль, то убыток. Пример: после закрытия остаётся 0.01 HYPE, а цена HYPE упала на 10 процентов;
  убыток по остатку составит десятую часть его цены, то есть копейки, но таких остатков несколько, и по
  сверке живого счёта они дают около 2 долларов при стратегии на 120 долларов. Мы добавляем в стенд остаток
  после закрытия и сравниваем два предположения: остаток прикрыт контрактом чуть большего размера (живой
  FRAB так прикрывает монету, пока позиция открыта; после закрытия, по его же документу, остаток не прикрыт,
  так что прикрытый остаток после закрытия здесь лишь возможный вариант, а не поведение живого FRAB) или
  не прикрыт (как написано в идее). Это проверка точности стенда, а не новый источник дохода: теряет здесь
  тот, у кого остаток растёт в цене против него или чей остаток накапливается от закрытия к закрытию.
  Результат может оказаться неотличимым от шума, и тогда остаток не стоит учитывать.'
sources:
- url: ideas/inbox.yaml#idea-0003
  title: Идея 0003 во входящих
  published: null
- url: docs/FRAB_LIVE.md
  title: Ряд денег стратегии FRAB и раздел про остатки монет
  published: 2026-10
driver:
  who_pays: 'Платит не рынок, а неточность учёта: остаток монеты после округления до лота остаётся у нас,
    и его цена двигается сама по себе.'
  why: Биржа продаёт спот только целыми лотами, поэтому после закрытия остаётся один лот монеты, и контракт
    под него либо отсутствует, либо подобран с запасом.
  kill_condition: 'Остаток перестаёт значить что-то для результата: лоты становятся ничтожными по сравнению
    с деньгами стратегии, или FRAB начинает докупать или допродавать остаток.'
  observable: Разница между рядом денег стратегии по стенду с остатком и без него, в долларах и в долях
    от денег стратегии (120 долларов).
prior:
  graveyard_matches: []
  note: 'В кладбище нет ни одной идеи про остатки от округления до лота: все записи FRAB касаются площадок,
    бюджета и числа мест. Вопрос здесь про точность самого стенда, а не про доходность новой стратегии.
    Три записи в сравнении ниже (vs_tried) лишь соседние: ни одна из них не покрывает учёт остатков на
    стенде, и различия с ними честные, но косвенные.'
carder:
  hypothesis_ru: Если учесть остаток в один лот после каждого закрытия, результат стенда FRAB на деньгах
    стратегии сдвинется примерно на 2-4 доллара из 120 (по сверке с живым счётом), и неприкрытый остаток
    сдвинет его сильнее, чем прикрытый контрактом. Гипотеза ложна, если сдвиг меньше шума стенда или если
    прикрытый и неприкрытый остатки дают один и тот же результат.
  readings_ru:
  - Остаток после закрытия не прикрыт контрактом и целиком двигается с ценой (так написано в идее).
  - 'Остаток прикрыт: живой FRAB ставит короткий контракт чуть больше покупки (у HYPE короткая нога 0.21
    при покупке 0.20), поэтому остаток двигается с ценой лишь частично.'
  baseline:
    spec: specs/frab-live.yaml
    why_ru: 'Это живая стратегия FRAB через решения самого frab: именно её сверяют с живым счётом, и именно
      в ней остаток сейчас не считается.'
  vs_tried:
  - id: bv2-btc-perp-hedge
    difference_ru: Там страховали монету контрактом на BTC по бете; здесь страховочный контракт тот же,
      что у FRAB, меняется только учёт остатка после закрытия, а не способ страховки.
  - id: qlab-signal-search-review-gaps
    difference_ru: Среди непроверенных направлений («издержки исполнения») лот прямо не назван; от VOLSCALE
      и частичной страховки отличается тем, что доля страховки не меняется по сигналу, а остаток возникает
      механически при каждом закрытии.
  - id: bv2-hedge-perp-vs-sell-spot
    difference_ru: Там сравнивали контракт и продажу спота того же размера; здесь продажа спота уже есть,
      а новое - остаток из-за округления до лота и его цена.
  grid:
  - param: leftover_lots
    values:
    - 0
    - 1
    meaning_ru: 'Сколько лотов монеты остаётся после закрытия позиции: 0 значит стенд как сейчас, 1 значит
      один лот, как на живом счёте.'
    source_ru: 'Из docs/FRAB_LIVE.md: «остаётся по одному лоту монеты»; ноль - это сам стенд без блока.'
  - param: leftover_hedged
    values:
    - 0
    - 1
    meaning_ru: 'Прикрыт ли остаток контрактом: 0 значит не прикрыт, 1 значит прикрыт запасом в короткой
      ноге. Второй параметр читается только при leftover_lots равном 1: при 0 остатка нет, и два из четырёх
      вариантов сетки совпадают; лишний вариант второй раз не прогоняется.'
    source_ru: 'Два прочтения идеи: «не прикрыт контрактом» в её словах и запас короткой ноги у HYPE в
      docs/FRAB_LIVE.md.'
  data:
    venue: hyperliquid
    interval: 1h
    start: 2025-01-01
    coins: &id001
    - AVAX
    - BTC
    - ETH
    - HYPE
    - PURR
    - SOL
    hand_picked: true
    honest_from: 2026-06-01
    honest_why_ru: Список монет живого FRAB последний раз менялся 2026-06-01, когда добавили HYPE и PURR
      (specs/frab-live.yaml); с этого дня список известен заранее.
  new_block:
    name: lot_leftover
    params:
    - name: leftover_lots
      meaning_ru: сколько лотов монеты остаётся после закрытия позиции
    - name: leftover_hedged
      meaning_ru: прикрыт ли остаток коротким контрактом
    rule_ru: 'Блок оборачивает позиции живого FRAB на стенде. При каждом закрытии позиции спот продаётся
      не целиком, а с округлением вниз до лота монеты, и остаётся leftover_lots лотов. Размер лота стенд
      берёт из таблицы лотов, которой в данных лаборатории пока нет: инженер собирает её один раз и кладёт
      версионируемым файлом data/lots.yaml с одной датой снимка на весь прогон. Таблица строится по сегодняшним
      szDecimals; для исторического прогона это допущение: лот монеты со временем мог измениться, и карточка
      считает такую неточность приемлемой. Лот равен 10 в степени минус szDecimals (число знаков размера,
      которое площадка Hyperliquid отдаёт в запросе информации): для спотовой монеты берётся szDecimals
      из spotMeta, а если там монеты нет, из meta по бессрочному контракту; так же поступает сам FRAB
      (src/frab/exchanges/hyperliquid/symbols.py, spot_sz_decimals и lot_size). Известные лоты из docs/FRAB_LIVE.md:
      BTC 0.00001, SOL 0.01, HYPE 0.01, AVAX 0.01. Для ETH и PURR в документах числа нет, и угадывать
      его нельзя: их тоже берут из запроса szDecimals и записывают в ту же таблицу вместе с датой снимка.
      Если лот какой-то монеты узнать не удалось, блок не пропускает монету молча, а останавливает прогон
      с ошибкой, чтобы проверка не сузилась незаметно. Остаток остаётся на счёте и оценивается по цене
      монеты на каждом часовом шаге до конца ряда; следующая позиция по той же монете его не продаёт и
      не докупает, поэтому остатки копятся: после N закрытий по монете лежит N лотов, а не сбрасывается
      один. При leftover_hedged равном 1 короткий контракт при закрытии закрывается не целиком, а остаётся
      на размер остатка, так что цена остатка гасится; при 0 контракт закрывается целиком и остаток двигается
      с ценой. Деньги остатка входят в ряд денег стратегии (120 долларов), а не в остаток счёта на бирже.
      Все остальные решения FRAB блок не меняет.'
