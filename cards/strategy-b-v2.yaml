# Карточка Strategy B v2 по схеме cards/SCHEMA.md.
# Написана 2026-10-24 по коду, который торгует на бумаге на проде
# (funding-rate-arbitrage/src/frab/strategy/b2/book.py и params.py), и по
# параметрам экземпляра b2 из базы прода (specs/bv2-live.yaml). Владелец,
# 2026-10-24: «еще бы в карточку описание метода как хеджирование включается
# по какому алгориму - ли я не вижу».
# Цитаты из кода приведены дословно и не переводятся; рядом — пересказ.

idea_id: strategy-b-v2
title: 'Держать BTC, ETH, SOL и AVAX, а на время падения страховать их встречной ставкой на понижение'
found_at: 2026-09-13

plain_summary: >-
  Стратегия держит четыре монеты — BTC, ETH, SOL и AVAX — и зарабатывает на
  том, что крупная крипта в долгую растёт. Чтобы не терять на падениях, она по
  каждой монете отдельно включает страховку: продаёт ту же монету на столько же
  на бессрочном контракте Hyperliquid. Пока страховка включена, рост и падение
  цены гасят друг друга, и монета ни приносит, ни отнимает. Когда включать,
  решает простое правило раз в час: страховка нужна всегда, КРОМЕ случая, когда
  монета выросла и за последние 14 дней, и за последние 30 дней. Выключается
  страховка не сразу: правило должно 12 часов подряд говорить «не нужна».
  Пример: BTC за 14 дней +3%, за 30 дней −2% — страховка включена; через неделю
  оба числа плюсовые — двенадцать часов спустя страховка снимается и BTC снова
  растёт вместе с рынком. Капитал на прод-бумаге $257, по $64 на монету; в саму
  монету идёт от 57% (SOL, AVAX) до 70% (BTC) этой суммы, остальное лежит
  деньгами в залог под страховку. Размер покупки задаётся в долларах один раз:
  если монета выросла в полтора раза сверх него, лишнее продаётся (храповик), а
  после падения, когда рынок снова пошёл вверх, монета докупается до размера.
  Где теряем: в боковике страховка то включается, то снимается, и каждая
  перестановка стоит комиссии; в резкий рост после падения страховка ещё
  включена и рост проходит мимо. Почему может перестать работать: правило
  смотрит только на прошлые 14 и 30 дней; если рынок начнёт разворачиваться
  быстрее, страховка будет опаздывать.

