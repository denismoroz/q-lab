driver:
  who_pays: >-
    Никто конкретно: доход — это рост самих монет в долгую, плата за то, что
    держатель терпит их колебания. Страховка не зарабатывает сама, она
    отрезает часть падений; плюсом к этому, пока она включена, стратегия
    получает или платит ставку финансирования бессрочного контракта —
    регулярный платёж между теми, кто ставит на рост, и теми, кто ставит на
    падение.
  why: >-
    Крупные монеты исторически растут быстрее, чем деньги на счёте, а падения у
    них идут полосами, которые видно по последним неделям.
  kill_condition: >-
    Монеты перестают расти в долгую, или падения перестают идти полосами
    (разворачиваются быстрее, чем за 14–30 дней).
  observable: >-
    Доход книги против простого держания тех же монет и против той же книги со
    страховкой в случайные моменты (docs/HEDGE_TIMING.md).
  quote:
    text: "B v2 = spot long + trend-timed perp hedge + funding carry on the idle cash reserve,"
    source: funding-rate-arbitrage/src/frab/strategy/b2/params.py

signal:
  entry: >-
    Страховка включается, если монета НЕ выросла одновременно за 14 и за 30
    дней. Раз в час, по закрытию часа, считаются два числа: цена сейчас к цене
    336 часов назад и к цене 720 часов назад. Если оба больше нуля (порог
    hedge_threshold = 0), страховка не нужна, иначе нужна. Решение исполняется
    на следующем часе. Пока нет 30 дней истории, страховки нет. Страховка
    открывается на всё количество монеты, которое лежит в книге, если хватает
    залога; не хватает — открывается часть, и это записывается.
  exit: >-
    Страховка снимается, когда правило 12 часов подряд говорит «не нужна»
    (sticky_exit_hours = 12). Один час «нужна» сбрасывает счёт.
  data_needed: [часовые цены монеты, ставка финансирования бессрочного контракта]
  timeframe: решение раз в час, окна 14 и 30 дней
  quote:
    text: "    # Hedge ON unless both 14d and 30d returns exceed this threshold."
    source: funding-rate-arbitrage/src/frab/strategy/b2/params.py

sizing:
  rule: >-
    Капитал делится поровну между четырьмя монетами ($257 → $64.25 на монету).
    Сколько из этого идёт в саму монету, считается так, чтобы залог под полную
    страховку и запас 10% помещались в остаток: BTC $44.83 (70%), ETH $40.16
    (62%), SOL и AVAX по $36.37 (57%). Размер задаётся в долларах при создании
    книги и дальше не растёт с прибылью: рост монеты сверх 1.5 размера
    продаётся (храповик, ratchet_threshold = 0.5), после снятой страховки
    монета докупается до размера, когда рост за 14 дней снова плюсовой.
  binding_constraint: >-
    Залог под страховку: плечо на короткой ставке — BTC 3, ETH 2, SOL и AVAX
    1.5; при нехватке страховка частичная.
  quote:
    text: "    # Sell spot back to its target when it grows above target * (1 + threshold)."
    source: funding-rate-arbitrage/src/frab/strategy/b2/params.py

protection:
  crash: >-
    Страховка на падение и есть защита: пока она включена, падение монеты
    гасится встречной ставкой. Но она включается по прошлым 14–30 дням, то есть
    с опозданием: первые дни резкого обвала проходят без неё.
  pump: >-
    Резкий рост цены опасен для встречной ставки: при нехватке залога её
    закроют принудительно. Защита — запас залога и доливка: когда потери на
    встречной ставке съедают половину залога, книга продаёт монету на сумму
    потери и уменьшает ставку на столько же (rebalance_at_im_share = 0.5).
  costs: >-
    Комиссии на каждую перестановку страховки; 12 часов задержки на выход
    уменьшают число лишних перестановок.
  structural: false
  note: >-
    Защита от падения — правило, которое угадывает по прошлому, а не
    конструкция: если правило ошибётся, защиты нет.
  quote:
    text: "    # Exit the hedge only after the signal has been OFF this many hours in a row."
    source: funding-rate-arbitrage/src/frab/strategy/b2/params.py

execution:
  legs: 2
  atomic_required: true
  venue: Hyperliquid (монета на споте и бессрочный контракт на неё)
  min_leg_notional_usd: 10.0
  quote:
    text: "    min_order_usd: float = 10.0"
    source: funding-rate-arbitrage/src/frab/strategy/b2/params.py

death:
  how: >-
    Монеты перестают расти в долгую, или рынок начинает разворачиваться быстрее,
    чем правило 14/30 дней успевает включить страховку.
  visible_in_advance: true
  observable: >-
    Проверка момента страховки (docs/HEDGE_TIMING.md) опускается к половине:
    страховка в случайные моменты работает так же.
  quote:
    text: "| **B v2** | **+42.8%/год, DD 7.2%** | **+2.0%, DD 6.3%** | **+5.7%, DD 3.0%** |"
    source: funding-rate-arbitrage/research/strategy_b_v2/REPORT.md

