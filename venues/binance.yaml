# Venue capability facts for Binance USDT-margined perpetual futures — q-lab
# task T13 (docs/TASKS.md). See venues/hyperliquid.yaml for the field-by-field
# format and rationale, and src/qlab/venues/derive.py for how these facts
# become preflight metrics.

id: binance
title: "Binance USDT-margined perpetual futures"

# ACCESS is a different fact from this file's `execution_adapter` (checked
# 2026-10-25): Binance's official "List of Prohibited Countries" (updated
# 5 January 2026, https://www.binance.com/en/about-legal/list-of-prohibited-countries)
# names United States; Canada, Netherlands; Cuba, North Korea, Iran, Crimea,
# so-called DPR and LPR -- not Belarus. Under the owner's rule
# (docs/SEARCH_CONSTRAINTS.md point 2) the venue is available. Nothing below
# says the venue is closed: `execution_adapter: false` only says WE have no
# order code for it. See docs/VENUES.md section 3.18.
#
# execution_adapter — no order-placing integration with Binance exists in
# either this repo or funding-rate-arbitrage; only a read-only market-data
# fetcher exists here.
#   - src/qlab/data/sources/binance.py module docstring: "Binance
#     USDT-margined perpetual futures fetcher — free public REST API, no
#     API key" — the whole module fetches candles/funding/exchangeInfo only
#     (`fetch_candles`, `fetch_funding`, `fetch_exchange_info`); it contains
#     no order-placement function.
#   - funding-rate-arbitrage/src/frab/exchanges/ contains a `hyperliquid/`
#     package only (client.py, exchange.py, actions/); no `binance/`
#     execution package exists anywhere in that tree.
#   - docs/PLAN.md: "Paper/live — на 10.8.0.5 через расширение frab" names
#     only the Hyperliquid-backed frab deployment; no Binance venue is live.
execution_adapter: false

# min_leg_notional_usd -- Binance USDT-M futures' own MIN_NOTIONAL filter of the ordinary contract,
# read from the exchange's public exchangeInfo endpoint.
#   - live query, 2026-10-30: `curl https://fapi.binance.com/fapi/v1/exchangeInfo`, every TRADING
#     perpetual quoted in USDT (522 contracts), filter {"filterType": "MIN_NOTIONAL", "notional": N}:
#     516 contracts have N = 5, five have N = 20 (ETH, BCH, LTC, ETC, LINK), one has N = 50 (BTC).
#     The whole table is seed/venue_facts/2026-10-30-binance_um_min_notional.csv.
#   - Until 2026-10-30 this file said 50.0 (the 2026-09-21 query of BTCUSDT alone). 50 is true of
#     BTCUSDT and of nothing else; used as the venue's number it would make every alt-coin book
#     look ten times dearer on Binance than it is. The venue's number is therefore the ordinary
#     contract's (5), and the six contracts that differ are `min_leg_notional_by_instrument`.
#   - The venue split (docs/VENUE_SPLIT.md, owner 2026-10-30): Binance is judged for itself, with
#     its own minimum leg, so this is a number the stand reads, no longer a field nobody consumed.
min_leg_notional_usd: 5.0

# min_leg_notional_by_instrument -- the contracts whose MIN_NOTIONAL is not the ordinary 5, keyed by
# the lab's column name (Binance's baseAsset). Source: the same table,
# seed/venue_facts/2026-10-30-binance_um_min_notional.csv (every row that is not 5). A book's
# minimum capital is the largest of "this contract's minimum / its smallest order's share of the
# money" over its contracts (qlab.harness.metrics.min_capital_usd, `floors`).
min_leg_notional_by_instrument:
  BTC: 50.0
  ETH: 20.0
  BCH: 20.0
  LTC: 20.0
  ETC: 20.0
  LINK: 20.0

# min_leg_notional_spot_usd -- Binance SPOT's NOTIONAL filter (minNotional) of the spot leg of a
# hedged book (a `<coin>-SPOT` column).
#   - live query, 2026-10-30: `curl 'https://api.binance.com/api/v3/exchangeInfo?symbols=[...]'`
#     for BTCUSDT, ETHUSDT, SOLUSDT, AVAXUSDT, LINKUSDT -> {"filterType": "NOTIONAL",
#     "minNotional": "5.00000000"} for all five. The rest of the spot list was not read: the
#     number is Binance's ordinary one and is marked as such.
min_leg_notional_spot_usd: 5.0

# free_public_data — the fetcher itself needs no key and returns candles and
# funding for free, but its own module docstring is explicit that a
# survivorship-free UNIVERSE (delisted symbols) cannot be built from it at
# all — a data-completeness problem, which is the SEPARATE
# `point_in_time_universe` rule (edge stage, rules/2026-09-20.1.yaml), not
# this field. This field only asks "is the data free and available going
# forward, not just historically" — and for an explicitly named instrument
# list, it is.
#   - src/qlab/data/sources/binance.py module docstring: "Binance does not
#     expose a historical *delisting* date for a symbol once it drops out
#     of ``exchangeInfo``" and "**A survivorship-free universe cannot be
#     built from Binance's free API at all.**"; the same docstring confirms
#     the klines/funding endpoints used are the ordinary free public REST
#     API, no key, same access model as Hyperliquid.
free_public_data: true

# supports_atomic_multileg -- false: a fact about OUR code, not about Binance's API. We have no order
# adapter for this venue (`execution_adapter: false` above), so nothing of ours places the legs of a
# hedged entry as one all-or-nothing unit, and no unwind of a stranded leg exists (the next field).
# Until 2026-10-30 this was left unset (null), and every two-leg book judged for Binance read
# `atomic_execution` as unknown and routed `needs-more-data` for ever, hiding the strategy rules'
# answer (the books only reached a route because they borrowed Hyperliquid's facts through
# `execution_venue`). With the venue split (docs/VENUE_SPLIT.md) a Binance verdict reads Binance's
# own facts; both missing capabilities are infrastructure rules, so a book that passes everything
# else routes `needs-infrastructure`, as the owner asked, and not a reject. What Binance's own
# batch-order API can do is not claimed here.
supports_atomic_multileg: false

# uncovered_leg_recovery -- left unset (null): no execution adapter means no recovery mechanism has
# ever been built or exercised here to name.
uncovered_leg_recovery: null
