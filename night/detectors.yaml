# Regime detectors and level-2 decisions rebuilt every night before the watch
# list (src/qlab/detector_builds.py, docs/REGIME_DETECT.md). Level 1 first:
# level 2 reads level 1's file. Names are the files specs read
# (`predictions:<name>`, `meta:<name>`, `hedge_by: {meta: <name>}`).
regimes: true            # BTC daily closes and the 30-day testing labels

level1:
  - {name: btc-returns-logistic, returns_only: true, window: 30}   # the favourite
  - {name: btc-returns-14d, returns_only: true, window: 14}
  - {name: btc-market-logistic, returns_only: false}                # first T39 specs

persistent:
  - {name: btc-returns-persist8, from: btc-returns-logistic, penalty: 8}

level2:
  - {kind: meta, name: trend-binance-cap, spec: specs/trend-binance-cap.yaml,
     level1: btc-returns-logistic}
  - {kind: meta, name: trend-binance-cap-14d, spec: specs/trend-binance-cap.yaml,
     level1: btc-returns-14d}
  - {kind: meta-hedge, name: bv2-hedge, spec: specs/bv2-binance.yaml,
     level1: btc-returns-logistic}
