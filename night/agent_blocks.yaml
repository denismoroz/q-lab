# Blocks the implementer agent has written (qlab.agent_blocks, docs/IMPLEMENTER.md).
# Written by code after the guards pass, never by the agent. A block is a strategy class whose
# every grid parameter is a key of the spec's `params`: another spec names it by `code_ref`.
blocks:
- name: lot_leftover
  code_ref: qlab.strategies.agent.lot_leftover:LotLeftover
  rule: 'Блок оборачивает позиции живого FRAB на стенде. При каждом закрытии позиции спот продаётся не
    целиком, а с округлением вниз до лота монеты, и остаётся leftover_lots лотов. Размер лота стенд берёт
    из таблицы лотов, которой в данных лаборатории пока нет: инженер собирает её один раз и кладёт версионируемым
    файлом data/lots.yaml с одной датой снимка на весь прогон. Таблица строится по сегодняшним szDecimals;
    для исторического прогона это допущение: лот монеты со временем мог измениться, и карточка считает
    такую неточность приемлемой. Лот равен 10 в степени минус szDecimals (число знаков размера, которое
    площадка Hyperliquid отдаёт в запросе информации): для спотовой монеты берётся szDecimals из spotMeta,
    а если там монеты нет, из meta по бессрочному контракту; так же поступает сам FRAB (src/frab/exchanges/hyperliquid/symbols.py,
    spot_sz_decimals и lot_size). Известные лоты из docs/FRAB_LIVE.md: BTC 0.00001, SOL 0.01, HYPE 0.01,
    AVAX 0.01. Для ETH и PURR в документах числа нет, и угадывать его нельзя: их тоже берут из запроса
    szDecimals и записывают в ту же таблицу вместе с датой снимка. Если лот какой-то монеты узнать не
    удалось, блок не пропускает монету молча, а останавливает прогон с ошибкой, чтобы проверка не сузилась
    незаметно. Остаток остаётся на счёте и оценивается по цене монеты на каждом часовом шаге до конца
    ряда; следующая позиция по той же монете его не продаёт и не докупает, поэтому остатки копятся: после
    N закрытий по монете лежит N лотов, а не сбрасывается один. При leftover_hedged равном 1 короткий
    контракт при закрытии закрывается не целиком, а остаётся на размер остатка, так что цена остатка гасится;
    при 0 контракт закрывается целиком и остаток двигается с ценой. Деньги остатка входят в ряд денег
    стратегии (120 долларов), а не в остаток счёта на бирже. Все остальные решения FRAB блок не меняет.'
  params:
  - name: leftover_lots
    meaning: сколько лотов монеты остаётся после закрытия позиции
  - name: leftover_hedged
    meaning: прикрыт ли остаток коротким контрактом
  cards:
  - cards/frab-lot-leftover.yaml
  specs:
  - specs/agent/frab-lot-leftover.yaml
  registered: '2026-11-03'
