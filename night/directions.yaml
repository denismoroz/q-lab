# ignore this file.
date: '2026-10-28'
memo: docs/research/director-2026-10-28.md
pending_owner_review: false
generator:
  prefer_mechanisms:
  - crypto-low-vol
  - crypto-ts-momentum
  pause_mechanisms:
  - id: crypto-short-term-reversal
    why: Эффект держится на малооборотных монетах, а блоки умеют отбирать только самые оборотистые, так
      что испытание проверяло бы пробел блоков, а не механизм.
researcher:
  frab:
    priority: high
    note: 'Живые деньги второй раз подряд ведут себя на краю того, что видел стенд: падение и дневные
      колебания больше, чем во всей его истории. Сначала найти, что стенд не учитывает в исполнении и
      издержках, сверив живые сделки со стендом за те же часы; это разбор стенда, а не подбор чисел под
      живые дни. Затем просьба владельца: децентрализованные биржи, где можно запускать стратегию.'
  bv2:
    priority: normal
    note: 'Выжившие ждут владельца, многие варианты ждут проверки вперёд; новых вариантов на уже отвеченные
      вопросы не заводить. Решение владельца: эта стратегия служит страховкой, а доход по нескольким таймфреймам
      идёт отдельной новой стратегией через ящик идей. Сначала свести для владельца, на какие его вопросы
      о страховке уже есть ответ среди выживших и ждущих, и работать только над вопросами без ответа.
      Список монет выбирать кодом и только по прошлому.'
  frab-binance-spot:
    priority: normal
    note: 'Владелец ждёт подтверждения исследователя. Ответить на один вопрос: остаётся ли прибыль после
      всех издержек на бюджетах владельца. Правило о поддержке площадки здесь говорит о нашем исполнении,
      а не об идее.'
  xsmom:
    priority: low
    note: 'Выжившие ждут владельца, новых вариантов не плодить. Если останется бюджет, проверить, переживает
      ли прибыль издержки и правило о капитале: родственник у генератора отвергнут именно по ним.'
  trend:
    priority: low
    note: 'Ответ даст время: книга, где монеты выбирает код, только начала проверку вперёд. Новых вариантов
      сигнала не заводить. Ответить владельцу, зачем стратегии такая большая книга, опираясь на правило
      о капитале.'
catalogue_requests:
- family: funding-and-basis
  look_for: Работы, где названы окно усреднения ставки финансирования и срок пересмотра в сутках, и работы,
    сравнивающие монеты между собой по ставке.
  why: Ни один из шести механизмов семейства не собирается, хотя для связки монета против контракта блок
    уже есть; на этом семействе работают живые деньги лаборатории.
- family: low-volatility
  look_for: Полные тексты работ, нашедших премию за спокойные монеты, с окнами и сроками в сутках.
  why: Собирается только версия из работы, где эффекта не нашли.
- family: reversal
  look_for: Работы о возврате цены среди крупных оборотистых монет и на бессрочных контрактах.
  why: Все источники каталога находят возврат только у малооборотных монет, поэтому единственный собираемый
    механизм на паузе.
- family: momentum
  look_for: Работы о продолжении движения на бессрочных контрактах с учётом издержек и платы за финансирование.
  why: Обе попытки генератора в семействе отвергнуты, в том числе по чистой прибыли и по капиталу, а источники
    каталога меряют доходность без издержек.
data_requests:
- what: История ставок финансирования и цен децентрализованных бирж бессрочных контрактов, кроме Hyperliquid,
    на одной сетке с имеющимися площадками.
  why: Владелец просит найти такие биржи для FRAB, а механизму разницы ставок между площадками нужна панель
    из двух площадок.
- what: Открытый интерес и объёмы принудительных закрытий по монетам на Hyperliquid и Binance; если истории
    нет, начать хранить её сейчас.
  why: Механизму о предупреждении обвала дохода от ставки нужны эти данные, а лаборатория их не хранит.
code_requests:
- repo: qlab
  what: 'Блок сигнала: положение текущей ставки финансирования монеты среди её собственной прошлой истории,
    и правило входа при выходе за порог и выхода при возврате.'
  why: Делает собираемым механизм резкого отскока ставки, единственный в семействе ставки финансирования,
    для которого числа в каталоге уже есть.
  strategy: null
- repo: qlab
  what: Панель из ставок и цен двух площадок и позиция контракт против контракта на разных площадках.
  why: Нужна механизму разницы ставок между площадками и просьбе владельца о децентрализованных биржах
    для FRAB.
  strategy: frab
- repo: qlab
  what: Блок отбора монет с наименьшим средним оборотом, зеркальный нынешнему отбору самых оборотистых.
  why: Без него механизм краткого возврата цены нельзя испытать в той форме, в какой его нашли источники,
    и он остаётся на паузе.
  strategy: null
