# because the notes below told every strategy not to open new variants or experiments. The bans
# are removed here by hand (the rest of each note stays); the director runs on its own cadence,
# and code (qlab.directions.ban_reason) now drops a note that forbids research as a whole. A
# question already answered may still be closed, through `repeats` (question + the file where it
# was answered), never a whole strategy.
researcher:
  frab:
    priority: high
    note: 'Живая книга снова вне того, что видел стенд: дневной разброс выше всех его отрезков. Закончить
      сверку живых сделок со стендом и назвать, чего стенд не учитывает; это разбор стенда, а не подбор
      чисел под живые дни. Если сверка закончена, перейти к просьбе владельца о децентрализованных биржах.'
  bv2:
    priority: normal
    note: Свести для владельца, на какие его вопросы о страховке уже есть ответ, и работать над оставшимися.
      Выживших различать по основаниям, а не по надстройкам.
  trend:
    priority: normal
    note: Ответить владельцу, зачем стратегии такая большая книга, опираясь на правило о капитале.
  frab-binance-spot:
    priority: normal
    note: 'Дать владельцу итоговый ответ из уже сделанного: остаётся ли прибыль после всех издержек на его
      бюджетах.'
  xsmom:
    priority: low
    note: Когда придёт ход, назвать, какие выжившие ещё живы и на какой базе стоят, и переживает ли прибыль
      издержки и правило о капитале.
catalogue_requests:
- family: reversal
  look_for: Работы о возврате цены на бессрочных контрактах и среди монет, которые реально торгуются на
    наших площадках; запись о том, как механизм собирается с отбором малооборотных монет.
  why: Блок появился, а каталог ведёт генератор к выборке, где эффекта нет, и механизм поэтому на паузе.
- family: funding-and-basis
  look_for: Работы с окном усреднения ставки и сроком пересмотра в сутках и работы, сравнивающие монеты
    между собой по ставке.
  why: На этом семействе стоят живые деньги, а из шести механизмов проверен один.
- family: momentum
  look_for: Работы о продолжении движения на бессрочных контрактах с учётом издержек, платы за финансирование
    и принудительных закрытий.
  why: Все попытки генератора получили отказ, а источники каталога часто меряют доходность без издержек.
- family: low-volatility
  look_for: Полные тексты работ, нашедших премию за спокойные монеты, с окнами и сроками в сутках.
  why: Собирается только версия из работы, где эффекта не нашли.
data_requests:
- what: Открытый интерес и объёмы принудительных закрытий по монетам на Hyperliquid и Binance; если истории
    нет, начать хранить её сейчас.
  why: Без них механизм предупреждения об обвале дохода от ставки не проверить.
- what: История ставок и цен децентрализованных бирж бессрочных контрактов на одной сетке с имеющимися
    площадками.
  why: Владелец просит найти такие биржи для FRAB.
- what: Перечень самых малооборотных монет с их оборотом и пометкой, есть ли у них контракт на наших площадках.
  why: Эффект возврата цены живёт на тихих монетах, и надо знать, достижимы ли они для нас, до траты испытания.
