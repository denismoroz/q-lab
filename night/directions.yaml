# The research director's directions (qlab.directions, docs/DIRECTOR.md).
# Written by CODE from the director agent's memo after validation -- do not edit the
# lists by hand (the next director run replaces them). The one hand edit that belongs
# to the owner: `pending_owner_review: false` once the first directions are reviewed
# (or `qlab director --approve`). While it is true the generator and the researcher
# ignore this file.
date: '2026-10-26'
memo: docs/research/director-2026-10-26.md
pending_owner_review: false
generator:
  prefer_mechanisms:
  - crypto-ts-momentum
  - crypto-low-vol
  pause_mechanisms:
  - id: crypto-short-term-reversal
    why: Эффект держится на мелких малооборотных монетах, а блоки умеют брать только оборотистые, среди
      которых источник возврата цены не находит, так что испытание проверяло бы пробел блоков, а не механизм.
researcher:
  bv2:
    priority: high
    note: 'Работать по вопросам владельца: как чаще включать и выключать страховку, можно ли страховать
      с плечом монеты из холодного кошелька, переносится ли сюда приём с плечом и запасом из FRAB. Выжившего
      варианта не дублировать, он ждёт решения владельца. Если вариант меняет список монет, выбирать список
      кодом и только по прошлому: правило честного списка монет здесь уже не пройдено.'
  frab:
    priority: normal
    note: 'Прежде новых вариантов понять, почему живые деньги ведут себя на краю того, что стенд видел
      у этой стратегии: доход ниже обычного, падение и дневные колебания больше, чем во всей истории стенда.
      Искать, что стенд не учитывает в исполнении и издержках; это разбор стенда, а не подбор параметров
      под живые дни. Затем просьба владельца: найти децентрализованные биржи, где можно запускать эту
      стратегию.'
  frab-binance-spot:
    priority: normal
    note: 'Новая стратегия по прямой просьбе владельца, опытов агента по ней ещё нет. Идти по пожеланиям
      владельца и считать деньги на бюджетах владельца, а не на бюджете живой стратегии. Правило о поддержке
      площадки может сработать из-за нашего исполнения: это вопрос к владельцу, а не довод против идеи.'
  trend:
    priority: low
    note: 'Главный вопрос стратегии сейчас решает время: книга, где монеты выбирает код, только начала
      копить проверку вперёд. Новые варианты сигнала не плодить. Ответить на вопрос владельца, зачем стратегии
      такая большая книга и можно ли покупать монеты понемногу, опираясь на правило о капитале.'
  xsmom:
    priority: low
    note: Работать в последнюю очередь. Опубликованный родственник этой стратегии у генератора, сравнение
      монет между собой, уже дважды получил отказ. Если работать, то над тем, остаётся ли прибыль после
      издержек.
catalogue_requests:
- family: funding-and-basis
  look_for: Работы, где монеты сравнивают между собой по ставке финансирования или где названы окно усреднения
    ставки и срок пересмотра в сутках; начать со статей, которые лента публикаций отметила 25 октября
    (перенос ставки между площадками, мёртвые зоны ставки).
  why: Генератор не может собрать ни одного из шести механизмов семейства, а единственная стратегия лаборатории
    на живых деньгах работает именно здесь.
- family: reversal
  look_for: Работы о возврате цены среди крупных оборотистых монет и на бессрочных контрактах.
  why: Все источники каталога находят возврат только у мелких малооборотных монет, которых среди торгуемых
    нами контрактов нет, поэтому единственный собираемый механизм семейства стоит на паузе.
- family: low-volatility
  look_for: Полные тексты работ, нашедших премию за спокойные монеты (Pyo и Jang, Kaya и Mostowfi), с
    окнами и сроками, которые переводятся в сутки.
  why: Собирается только версия из работы, где эффекта не нашли; положительные результаты известны лишь
    по аннотациям.
- family: momentum
  look_for: Работы, проверяющие продолжение движения на бессрочных контрактах с учётом издержек и платы
    за финансирование.
  why: Источники каталога меряют сводные цены без издержек, а обе попытки генератора в семействе получили
    отказ, в том числе по правилам о чистой прибыли и о капитале.
data_requests:
- what: История ставок финансирования и цен децентрализованных бирж бессрочных контрактов, кроме Hyperliquid,
    сведённая на одну сетку с уже имеющимися площадками.
  why: Владелец просит найти такие биржи для FRAB, а механизму разницы ставок между площадками нужна панель
    из двух площадок.
- what: Открытый интерес и объёмы принудительных закрытий по монетам на Hyperliquid и Binance; если истории
    взять негде, начать хранить их с сегодняшнего дня.
  why: Механизму о предупреждении обвала переноса нужны эти данные, а лаборатория их не хранит.
propose_close_family: []
problems: []
