# The researcher, every night, on the five strategies it works on: Bv2, trend, FRAB, XSMOM
# and FRAB with the spot on Binance (qlab.agents.researcher, docs/NIGHT.md).
#
# Owner, 2026-10-24: «мне не нравится вердикт агента - просто ждать - нужно
# думать как улучшить стратегию - это задача фреймворка».
#
# Owner, 2026-10-25: «я предлагаю статус ждет проверку вперед - для reserchera -
# игнорировать. а сформулировать так - 4 стратегии где он может работать. - если
# он по этим стратегиям может улучшить - отлично - пускай улучшает. ... данные
# есть - отлично - проверили - если данных мало - смотрим где стратегия плохо
# работает - основные просадки и их пытаемся исправить»; «четвёртая — XSMOM.
# исследователь запускается каждую ночь - я перешел на тариф Max».
#
# So "waiting for the forward test" is not a reason to stop, and the researcher runs
# every night inside the night's token budget (a strategy it did not finish because of a
# budget stop goes first on the next night). Per strategy it writes a memo and at most
# `max_experiments` experiment specs (fewer when the strategy's variant places are
# taken); the stand runs them. It is shown where the strategy lost money before a cut
# date (qlab.diagnose) and must judge a fix on the data after the cut. Each memo of a
# strategy is handed to the next run, so it builds on what was tried.

# `nightly` runs the stage every night; `weekly` only on the graveyard's Sunday (and the
# night after a budget stop left a strategy unfinished).
cadence: nightly

max_experiments: 2
focus: "я предлагаю статус ждет проверку вперед - для reserchera - игнорировать. а сформулировать так - 4 стратегии где он может работать. - если он по этим стратегиям может улучшить - отлично - пускай улучшает. я не совсем понимаю - статус - ждет проверку вперед - нужен ли он вообще - данные есть - отлично - проверили - если данных мало - смотрим где стратегия плохо работает - основные просадки и их пытаемся исправить... как тебе такая идея?"

strategies:
  bv2:
    ideas: [strategy-b-v2, bv2-binance, bv2-research-headroom, bv2-research-headroom-retune]
    # The owner's own ideas for this strategy, verbatim (qlab.night.owner_ideas_focus).
    # Context the researcher should read for this one: the hedge rule today decides on
    # 14- and 30-day returns once an hour and lifts the hedge after 12 hours in a row of
    # "not needed" (cards/strategy-b-v2.yaml); the timing test says Bv2 picks WHEN to hedge
    # better than chance (docs/HEDGE_TIMING.md); frab's own search over 45 hedge signals
    # is reviewed in docs/BV2_SIGNAL_SEARCH_REVIEW.md.
    owner_ideas:
      - "закинь идею для researcher подумать о том как включать/отключать хеджирование почаще. может использовать более мелкий тайфрейм как основной"
      # 2026-10-25, the owner on what Bv2 was meant to be (frab's earlier basket results and
      # what they lack: docs/BV2_BASKETS.md).
      - "основная идея это стратегии было - взять 10 самых ликвидных монет на рынке положить их в холодный кошелек и хеджировать через HL по необходимости. добавляя новые средства в монеты. можно ли использовать leverage для хеджирования?"
      # 2026-10-25, after the FRAB margin review (docs/BV2_MARGIN.md): the owner chose two
      # directions out of it -- one margin pool for all coins, and top-ups from the cold
      # wallet on demand -- with «давай».
      - "еще - можно ли трюк с FRAB с плечем и страховкой использовать на Bv2?"
    specs:
      - specs/bv2-live.yaml
      - specs/bv2-binance.yaml
      - specs/research/bv2/bv2-research-headroom-retune.yaml
    docs:
      - cards/strategy-b-v2.yaml
      - docs/HEDGE_TIMING.md
      - docs/BV2_SIGNAL_SEARCH_REVIEW.md
      - docs/RETUNE.md
      - docs/FIT_VS_FORWARD.md
      - docs/BV2_BASKETS.md
      - docs/BV2_MARGIN.md
  trend:
    ideas: [trend-tsmom-crypto, trend-live, trend-retune-weekly, trend-research-skip-flat]
    # The owner's own ideas, verbatim. Context: the paper trend book at $3000 executed 281
    # trades and skipped 701 adjustments under Hyperliquid's $10 minimum order
    # (data/paper/2026-10-25-afternoon/qx_trend_books.csv, `skipped_min_order`); the stand's
    # min_capital_usd for trend-retune-weekly is ~$8122. Hypotheses the owner agreed to
    # (2026-10-25, «да. добавляй»): fewer coins with bigger shares, or trade an adjustment
    # only when it clears the minimum order / rebalance less often -- each a variant that
    # must be judged on data the fix did not see.
    owner_ideas:
      - "еще я не совсем понимаю почему нужна такая огромная книга на 10к. можно же покупать монеты по-чуть чуть..."
    specs:
      - specs/trend-live.yaml
      - specs/trend-retune-weekly.yaml
      - specs/research/trend/trend-research-skip-flat.yaml
    docs:
      - docs/RETUNE.md
      - docs/REGIME_DETECT.md
      - docs/FIT_VS_FORWARD.md
  frab:
    ideas: [frab]
    # 2026-10-25: the owner asked for DEXes where FRAB could run. The researcher has no web
    # access, so the survey was made interactively (docs/FRAB_VENUES.md: access under the
    # owner's venue rule, spot-perp overlap, funding, fees, data and execution APIs).
    owner_ideas:
      - "resercher нужно дать задание поискать Dex где можно запускать frab"
    specs:
      - specs/frab-live.yaml
    docs:
      - docs/FRAB_LIVE.md
      - docs/FIT_VS_FORWARD.md
      - docs/FRAB_VENUES.md
  # Owner, 2026-10-25: «четвёртая — XSMOM». Cross-sectional momentum: the strategy that
  # caused q-lab to exist (docs/XSMOM_T21.md). Its three specs are the honest discovered
  # universe, the same with the live book's 20 legs, and the frozen 32-coin list; all on
  # Hyperliquid, whose history since 2023 is short, so a fix designed on its drawdowns is
  # preliminary unless the researcher also tests it on Binance (long history).
  xsmom:
    ideas: [xsmom, xsmom-honest-20legs, xsmom-frozen-universe]
    specs:
      - specs/xsmom.yaml
      - specs/xsmom-honest-20legs.yaml
      - specs/xsmom-frozen-universe.yaml
    docs:
      - docs/XSMOM_T21.md
      - docs/CALIBRATION_2026-09-21.1__xsmom-honest-20legs.md
      - docs/FIT_VS_FORWARD.md
      - ../funding-rate-arbitrage/research/xsmom_live_recon/AUDIT_2026_09.md
  # Owner, 2026-10-25: a NEW strategy, not a FRAB variant (its own code, so the registry's
  # families keep it apart from `frab`; its own place among the 6 in night/limits.yaml).
  # FRAB's live decisions with the spot bought on Binance and the short held on Hyperliquid,
  # on every coin that has a perp and a Binance USDT pair. Context the researcher should
  # read for it: the money moves between two venues at flat fees and the short's margin is
  # topped up from the spot's gains (docs/FRAB_BINANCE_SPOT.md lists every number's source and
  # what the stand simplifies); the comparison with FRAB live and the coin-count effect are
  # in the same document; the stand's data for it begins in March 2026 because Hyperliquid
  # serves only its last 5000 hourly candles, so a fix designed on its drawdowns is preliminary.
  frab-binance-spot:
    # The strategy, its five-coin variant, and the two HL-spot controls that the comparison in
    # docs/FRAB_BINANCE_SPOT.md is made against (they belong to the `frab` family in the registry).
    ideas: [frab-binance-spot, frab-binance-spot-five-coins, frab-live-own-spot,
            frab-live-own-spot-five-coins]
    owner_ideas:
      - "можно в qlab запусить frab на более чем 4-5 монетах. я знаю что HL ограничен в количестве spot pairs. я бы хотел прогнать вариант когда спот открывается на binance а хеджируется на HL. - поидее это новая стратегия."
    specs:
      - specs/frab-binance-spot.yaml
      - specs/research/frab-binance-spot/frab-binance-spot-five-coins.yaml
      - specs/research/frab/frab-live-own-spot.yaml
      - specs/research/frab/frab-live-own-spot-five-coins.yaml
    docs:
      - docs/FRAB_BINANCE_SPOT.md
      - docs/FRAB_LIVE.md
      - docs/VENUES.md
      - docs/FIT_VS_FORWARD.md
