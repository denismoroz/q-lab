# The second stage of the idea generator's evaluation (qlab.pipeline.stage2,
# docs/TWO_STAGE.md, T45).
#
# An idea the generator wrote is judged on Binance's long history first (stage 1,
# the spec as written). If it survives, the SAME mechanism with the SAME parameter
# values is built on Hyperliquid -- where q-lab's paper and live execution lives --
# and judged there, forward from the date the parameters were fixed (stage 2). It
# needs both to survive. Stage 2 is code only: it calls no agent and spends no
# tokens, so it sits outside the token budget guard by construction.
#
# Run by hand on one spec: `qlab stage2 specs/generated/<idea>.yaml --measure`.

enabled: true

venue: hyperliquid

# The first day of the Hyperliquid panel (stage 2 starts at the later of this and
# stage 1's start). The window every other Hyperliquid spec of the lab uses and the
# one whose daily snapshot is cached (docs/XSMOM_T21.md line 4: «тот же вызов, что и
# во всех прочих»; docs/T27_LIQUIDITY.md line 76). Daily candles with trades exist
# at the source from earlier (BTC: 2023-02-26, measured 2026-10-25 with
# candleSnapshot), so an earlier start would lengthen the test; that is the owner's
# decision, not the code's.
data_start: 2025-01-01

# Hyperliquid's costs, replacing Binance's (the numbers are not strategy parameters,
# nothing is refitted). Each number is cited where `source_problems` can find it.
costs:
  taker_fee_bps: 4.5
  slippage_bps: 0.9
  sources:
    costs.taker_fee_bps: >-
      docs/FRAB_BINANCE_SPOT.md line 42: Hyperliquid perpetual taker, base tier 0,
      0.045% (4.5 bps), the Fees table of
      https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees (read 2026-10-25);
      a book of a few thousand dollars trades at the base tier
    costs.slippage_bps: >-
      derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32,
      «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)» -- Hyperliquid's own cost
      estimate, whose slippage part is 0.9
    min_daily_volume_usd: >-
      funding-rate-arbitrage/research/cross_sectional/crypto/cryptodata.py line 39,
      MIN_VOL_USD = 1_000_000, ">= $1M 24h notional volume on HL": the floor the live
      engine selects coins by

# The execution venue's liquidity floor, for a strategy that picks its coins from the
# venue's whole listing (XSMOM, trend): stage 2 trades a coin on a day only if the live
# engine would pick it; it takes the stricter of this and stage 1's own floor. A named
# list (Bv2's coins and their spot tokens, FRAB's) is traded live whatever its volume,
# so it keeps stage 1's floor. Owner,
# 2026-10-28, «да, делай», on docs/research/xsmom-anomaly-2026-10-28.md: the XSMOM
# second stage made 88% of its money on coins under $1M a day (44% of its coin-days),
# which the live engine would not have traded; with the floor it falls from +41% to
# +10.7% a year.
min_daily_volume_usd: 1000000

# Spot legs. A book that holds spot against a perpetual (Bv2) names Binance's spot
# columns (BTC-SPOT); Hyperliquid names the same asset by its own token, most of them
# wrapped bridge tokens, and the lab's column for it is `<coin>-SPOT` too
# (qlab.data.sources.hyperliquid.fetch_spot_meta: the token named like the coin, else
# "U" + coin). Stage 2 maps `<coin>-SPOT` to that column when Hyperliquid lists it.
# The lab's panel then keeps the column only on bars where the spot price is within
# frab's 3% of its perp (qlab.data.snapshot.spot_is_another_asset); a token that is
# another asset never gets a bar. The tokens below are the ones the lab has verified
# against frab; any other coin is resolved from Hyperliquid's live spotMeta by the same
# rule, and says so in the stage 2 spec's notes.
spot_legs:
  BTC:
    token: UBTC
    source: >-
      docs/TASKS.md line 635 (spotMeta read 2026-09-22): BTC is UBTC (@142), the token
      production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
      line 13: UBTC, UETH, USOL are 1:1 with the perp, deep books, safe
  ETH:
    token: UETH
    source: >-
      docs/TASKS.md line 636 (spotMeta read 2026-09-22): ETH is UETH (@151), the token
      production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
      line 13
  SOL:
    token: USOL
    source: >-
      docs/TASKS.md line 637 (spotMeta read 2026-09-22): SOL is USOL (@156), the token
      production takes too; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
      line 13
  AVAX:
    token: UAVAX
    source: >-
      docs/TASKS.md line 638 (spotMeta read 2026-09-22): AVAX is UAVAX (@306), bridge_safe
      in production's coin_registry then; but
      funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py
      lines 14-15 audited it 2026-05-19 as not 1:1 with the perp, and
      docs/TASKS.md line 670 counts its bars at 21.3% of the window: the lab's price-parity
      check (src/qlab/data/snapshot.py spot_is_another_asset) keeps only the bars where it is 1:1

# Coins whose Binance spot leg has NO Hyperliquid counterpart, with the reason. A book
# that requires such a leg cannot be held on Hyperliquid: stage 2 is "not evaluable"
# for it, never a book with the leg quietly missing.
no_spot:
  LINK:
    source: >-
      Hyperliquid's only LINK spot token is LINK0, an EVM bridge with its own price
      discovery (not 1:1 with the perp; a -$3 incident in testing);
      funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py lines 16-18 and 25
      (BRIDGE_TOKEN_BLACKLIST); docs/TASKS.md line 639
  AAVE:
    source: >-
      Hyperliquid's only AAVE spot token is AAVE0, an EVM bridge with its own price
      discovery; funding-rate-arbitrage/src/frab/exchanges/hyperliquid/tokens.py lines
      16-18 and 25 (BRIDGE_TOKEN_BLACKLIST); docs/TASKS.md line 640

# Stage 1 routes that go on to stage 2: every strategy rule passed, or none failed
# yet. A stage 1 `reject` is final (the graveyard); the routes that decide nothing
# (not-evaluable, needs-more-data, error) have nothing to confirm.
#   paper, shelf          -- passed every rule on Binance
#   needs-infrastructure  -- passed every strategy rule; only Binance's missing
#                            order adapter failed (venues/binance.yaml), which is
#                            exactly what Hyperliquid, where the adapter is, settles
#   needs-forward         -- nothing is against it yet; forward data decides
stage1_survives:
  - paper
  - shelf
  - needs-infrastructure
  - needs-forward
