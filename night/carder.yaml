# The carder agent (qlab.agents.carder, docs/IDEAS.md). Owner, 2026-10-27: «задача фреймворка
# генерировать подобные идеи и проверять» -- an idea that needs NEW code reaches the stand
# without a person writing its card.
#
# One idea a night, in the search stage's share of the budget (the share CLAUDE.md cuts first),
# AFTER the implement stage has run: a card written tonight is implemented on the NEXT night's
# implement stage (the top of the cut order), not tonight at the cost of the stages behind it.
# At most one card of the carder waits for the implementer at a time (qlab.agents.carder,
# pending_cards): the next idea waits until that card is taken. Code checks the draft, a
# reviewer agent checks the meaning; a card that passes is moved to cards/ and queued in
# night/implement_queue.yaml. Nothing is committed or pushed. The owner closes an idea with
# `qlab idea reject ID --why ...` and puts a refused one back with `qlab idea retry ID`.
enabled: true
model: sonnet        # docs/PLAN.md: the agents that write run on sonnet
reviewer_model: sonnet
max_turns: 40
per_night: 1
max_attempts: 2      # an idea refused twice waits for the owner (status needs-owner)
nearest: 3           # tried.yaml entries nearest to the idea that the card must address
