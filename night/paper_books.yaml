# Which production paper book runs the same configuration as which stand idea
# (qlab.paper_check, docs/NIGHT.md). The night compares the two over ONE window:
# the stand's forward test. Owner, 2026-10-25: "на стенде минус, на paper в плюсе".
#
# Fields: `book` is the book's name on the production host; `spec` is the stand's
# spec (its params_fixed_at starts the stand's forward test); `paper_file` is the
# night's export in data/paper/<day>/; `strategy_id` picks the book inside the
# file; `sum_coins` is true when the file has one row per coin and the book's
# equity is their sum; `replay_file` is the stand's replay of that book
# (scripts/replay_*_paper.py --out); `label` is the Russian name shown in the report;
# `replay_block` names this book's block in the replay scripts' printed output
# ("book <id>" for Bv2, "trend"), which the paper rule (qlab.paper_rule, owner
# 2026-10-25: at least 4-6 weeks on paper) reads when the replay file is absent.
#
# `strategy_capital_usd` (every book, required; loading refuses a book without it) is the
# money AVAILABLE TO THE STRATEGY, the only base of any percent. Owner, 2026-10-25:
# «стратегия работает на 90 и должна считать все на 90 43 - это то что еще доступно на
# счету - оно не должно никак фигурировать в расчетах»; «нужно ставить различие - деньги на
# счету и деньги доступные для стратегии». Money on the exchange account (free cash that
# belongs to no position, deposits, withdrawals) is never a denominator.
#
# `live_books` below are books trading REAL money. They are read only by the
# decay detector (qlab.decay), not by the paper rule or the paper-vs-stand check,
# which are about paper. A live book declares `equity_from: strategy_pnl`: its equity is
# built by qlab.strategy_pnl as the strategy's capital plus the strategy's own result
# (funding, fees, trading of its legs), from raw rows exported read-only. Optional fields:
# `equity_column` (default `equity`) and `realised_from` (the date the realised period
# starts, default the book's first row); a live book needs `realised_from` so the night's
# export is bounded and cheap.
#
# Paper books: the book's equity already IS strategy money (the paper engine has no other),
# and `strategy_capital_usd` is the capital the production host created it with
# (strategies.params_json capital_usd). A test checks it against the first export row.
books:
  # Production `b2` (strategy id 3, hedge_margin_headroom 1.0): the stand's
  # strategy-b-v2 spec is this instance verbatim, every param sourced from
  # seed/prod_params/2026-10-02-b2.json (frab.db strategies.params_json).
  # Caveat: the stand's forward test starts at params_fixed_at 2025-06-01, the
  # paper book at 2026-09-13, so the two windows differ for this idea.
  strategy-b-v2:
    book: b2
    spec: specs/bv2-live.yaml
    label: "Bv2, запас 1.0"
    paper_file: b2_equity.csv
    strategy_id: 3
    sum_coins: true
    strategy_capital_usd: 257
    replay_file: replay_b2.csv
    replay_block: "book 3"

  # Production `b2_cold` (strategy id 4): differs from `b2` only in
  # hedge_margin_headroom 1.5, which is exactly what the research spec changes;
  # its value is sourced from seed/prod_params/2026-10-02-b2_cold.json. The spec's
  # params_fixed_at 2026-10-03 is the day the researcher declared the experiment.
  bv2-research-headroom:
    book: b2_cold
    spec: specs/research/bv2/bv2-research-headroom.yaml
    label: "Bv2, запас 1.5"
    paper_file: b2_equity.csv
    strategy_id: 4
    sum_coins: true
    strategy_capital_usd: 257
    replay_file: replay_b2.csv
    replay_block: "book 4"

  # Production `trend` (strategy id 5), paused 2026-10-25 13:18 UTC at the owner's request
  # («останови старую книгу trend»); its paper history stays checkable. trend-live runs frab's own TrendParams()
  # defaults, which is what the production book was created with on 2026-09-14
  # (the spec's params_fixed_at); params come from frab's params.py, see the spec.
  # Caveat: the stand's book runs on daily bars from 2025-01 and already held
  # positions at its fix date, the paper book started flat on hourly bars.
  trend-live:
    book: trend
    spec: specs/trend-live.yaml
    label: "Тренд"
    paper_file: trend_equity.csv
    strategy_id: 5
    sum_coins: false
    strategy_capital_usd: 3000
    replay_file: replay_trend.csv
    replay_block: "trend"

  # Production `b2_retune` (strategy id 8, frab 2a0d8b1/d26ce00, launched 2026-10-25 14:00
  # UTC; owner, 2026-10-25: «да, запускай b2_retune на paper»): the stand's
  # bv2-research-headroom-retune -- b2 and b2_cold as candidates, the better Sharpe so far
  # chosen at the first hour of every month. At launch the book replayed its history from the
  # first choice (2026-06-01); those rows are the stand's own arithmetic, not paper, so
  # `realised_from` (the launch hour) cuts them off for the paper rule, the paper-vs-stand
  # check and the decay detector. The replay matched the stand's choices at all 7 re-tunings.
  # No replay script exists for this book yet, so the paper rule reads its replay as unknown.
  bv2-research-headroom-retune:
    book: b2_retune
    spec: specs/research/bv2/bv2-research-headroom-retune.yaml
    label: "Bv2, запас выбирает код раз в месяц"
    paper_file: b2_equity.csv
    strategy_id: 8
    sum_coins: true
    strategy_capital_usd: 257
    realised_from: 2026-10-25T14:00:00+00:00

  # Production `trend_retune_3k` (strategy id 6, $3000, coins chosen weekly by code, from
  # 2026-10-25 13:00 UTC; owner: «замена на монеты которые выбирает код»): the stand's
  # trend-retune-weekly at the same capital. The book replayed only the CHOICES at launch,
  # not equity: its first row is its first paper hour. The $10 000 book (id 7) has no stand
  # spec of its own and is not checked here. No replay script exists for these books yet.
  trend-retune-weekly:
    book: trend_retune_3k
    spec: specs/trend-retune-weekly.yaml
    label: "Тренд, монеты выбирает код ($3000)"
    paper_file: trend_retune_equity.csv
    strategy_id: 6
    sum_coins: false
    strategy_capital_usd: 3000

live_books:
  # FRAB, production strategy id 1 (`two_phase`), real money. FRAB works on its own
  # Hyperliquid account, but only `budget_cap_usdc` (90, strategies.params_json) is the
  # strategy's money: the account also holds free USDC that belongs to no position
  # (about $43 on 2026-10-25) and takes deposits. So `strategy_capital_usd` is 90, and the
  # equity is that 90 plus the strategy's own result since `realised_from`, hourly
  # (qlab.strategy_pnl): funding on its perp legs, minus fees, plus the trading result of
  # its spot and perp legs, marked at the host's hourly prices. Account totals
  # (`equity_snapshots.total_equity`) are not used anywhere: a transfer would read as a
  # return and the free cash would be a base of the percent. If the budget in the database
  # is not this number, the night refuses to build the series until the owner aligns them.
  # The realised period starts on the day the decision rule last changed (frab a0f5b5e,
  # 2026-10-10), which is also the stand spec's params_fixed_at.
  frab:
    book: two_phase
    spec: specs/frab-live.yaml
    label: "FRAB"
    paper_file: frab_strategy_equity.csv
    equity_from: strategy_pnl
    equity_column: strategy_equity
    strategy_capital_usd: 90
    strategy_id: 1
    sum_coins: false
    realised_from: 2026-10-10
