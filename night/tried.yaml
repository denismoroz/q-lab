# What has already been tried (src/qlab/tried.py, docs/IDEAS.md): the prior-art registry the
# carder agent reads before it writes a card, so that nobody repeats a finished experiment.
#
# Owner, 2026-10-27: «задача фреймворка генерировать подобные идеи и проверять».
#
# One entry per tested variant (or family where the source does not list its variants). Each
# entry says where the experiment is written down and what came of it, with the numbers as THAT
# SOURCE writes them -- nothing is re-measured or rounded here. `what` and `result` are Russian,
# one line each; `where` is a file (q-lab's own, or funding-rate-arbitrage/..., read-only) and a
# section. The graveyard of the registry (rejected and retired ideas) is NOT copied: code reads
# it at run time.
#
# Seeded 2026-10-27 from frab's Bv2 hedge-signal research (research/strategy_b_v2/LIMITS.md
# sections 6-9, REPORT.md, hedge_signals.py, false_alarms.py, regime_switch.py, rolling_reopt.py,
# and research/GRAVEYARD_REVIEW_2026_09.md for the June variants those scripts list as "already
# tested") and from q-lab's own reviews: docs/BV2_SIGNAL_SEARCH_REVIEW.md, docs/REGIMES.md,
# docs/HEDGE_TIMING.md, docs/RETUNE.md and the researcher's Bv2 memos.
#
# An entry is a fact about a past experiment, not a verdict on a new idea. A new idea that
# resembles an entry is allowed when its card says what differs (`vs_tried`); the lab's own
# review of the 45 signal variants (docs/BV2_SIGNAL_SEARCH_REVIEW.md) found that they were
# compared with a rule fitted on the very window of the test, so a "no" here is evidence about
# that comparison, not a closed door.
version: "2026-10-27"

families:
  hedge-entry-signal: "когда включать страховку: правила по цене, шуму, ставкам и ширине рынка"
  hedge-entry-new-info: "когда включать страховку: сведения не из цены (поток сделок, акции, опционы)"
  hedge-entry-published: "сигналы из публикаций (ансамбль горизонтов, модель режимов, канальный выход, управление по шуму)"
  hedge-staging: "как входить в страховку и выходить из неё: по частям, стопы, раз в сутки, липкий выход, размер"
  parameter-refit: "перенастройка чисел правила по скользящему окну прошлого"
  regime-detection: "определение режима рынка (тренд или пила) заранее и переключение правила"
  basket-coins: "какие монеты держать: больше монет, другие монеты, веса"
  book-construction: "устройство книги: залог, плечо, ставка на простаивающие деньги, храповик, минимальный капитал"
  other-markets: "то же правило на других рынках"
  q-lab-checks: "проверки самого q-lab: момент страховки, переключение по режиму, опыты исследователя"

entries:
  # ---- hedge-entry-signal -------------------------------------------------------------
  - id: bv2-sig-momentum-sign
    family: hedge-entry-signal
    what: "знак доходности за 3–30 дней как условие страховки; варианты «или», «и», «два из трёх»"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — точка входа Strategy B (и перечень в шапке strategy_b_v2/false_alarms.py)"}
    result: "в июне перебрали больше десятка входов, ни один не обошёл нынешнее «доход за 14 или за 30 дней не выше нуля»"
  - id: bv2-sig-entry-timing-check
    family: hedge-entry-signal
    what: "проверка, что вход нынешнего правила не случаен: случайный вход, вход позже на 1, 3, 7 дней, идеальный вход"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — точка входа Strategy B, таблица"}
    result: "нынешнее правило +23.6% в год против +11.9% у случайного входа; на 1 день позже +21.9%, на 3 дня +19.3%, на 7 дней +22.3%; идеальный вход на 14 дней вперёд +66.5%"
  - id: bv2-sig-close-below-ma
    family: hedge-entry-signal
    what: "страховка, когда цена закрытия ниже скользящей средней"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/false_alarms.py, section: "шапка файла, список «Already tested and not repeated»"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-drawdown-from-peak
    family: hedge-entry-signal
    what: "страховка, когда цена упала от недавнего максимума на заданную долю"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/false_alarms.py, section: "шапка файла, список «Already tested and not repeated»"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-regime-filters-90-180
    family: hedge-entry-signal
    what: "фильтры режима по доходности за 90 и 180 дней"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/false_alarms.py, section: "шапка файла, список «Already tested and not repeated»"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-high-vol-filter
    family: hedge-entry-signal
    what: "страховка только при высокой волатильности"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/false_alarms.py, section: "шапка файла, список «Already tested and not repeated»"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-funding-premium-gates
    family: hedge-entry-signal
    what: "ставка финансирования и разница спот–контракт как условие или добавка к страховке"
    where: {file: funding-rate-arbitrage/research/backtest_b_signalsweep2.py, section: "шапка файла, семейства funding-gate, funding-add, premium/basis"}
    result: "в списке проверенного и не повторявшегося (шапка strategy_b_v2/false_alarms.py); отдельного числа в шапке нет"
  - id: bv2-sig-btc-down-filter
    family: hedge-entry-signal
    what: "страховка альтов только когда BTC в падении"
    where: {file: funding-rate-arbitrage/research/backtest_b_signalsweep2.py, section: "шапка файла, семейство «BTC market-gate»"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-donchian
    family: hedge-entry-signal
    what: "страховка, когда цена ниже минимума за N дней (канал Дончиана)"
    where: {file: funding-rate-arbitrage/research/backtest_b_signalsweep2.py, section: "шапка файла, семейство Donchian"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-cross-sectional-weakness
    family: hedge-entry-signal
    what: "страховать только самые слабые монеты корзины по рангу доходности за 30 дней"
    where: {file: funding-rate-arbitrage/research/backtest_b_signalsweep2.py, section: "шапка файла, семейство cross-sectional"}
    result: "в списке проверенного и не повторявшегося; отдельного числа в шапке нет"
  - id: bv2-sig-continuous-ratio
    family: hedge-entry-signal
    what: "непрерывная доля страховки вместо «включено или выключено»"
    where: {file: funding-rate-arbitrage/research/backtest_b_continuous.py, section: "файл целиком; перечень в шапке strategy_b_v2/false_alarms.py"}
    result: "в списке проверенного и не повторявшегося; числа лежат в backtest_b_continuous_results.csv и здесь не пересказаны"
  - id: bv2-sig-go-to-cash
    family: hedge-entry-signal
    what: "вместо короткой продажи уходить из монеты в деньги"
    where: {file: funding-rate-arbitrage/research/backtest_b_gotocash.py, section: "файл целиком; перечень в шапке strategy_b_v2/false_alarms.py"}
    result: "в списке проверенного и не повторявшегося; числа лежат в backtest_b_gotocash_results.csv и здесь не пересказаны"
  - id: bv2-sig-min-hold
    family: hedge-entry-signal
    what: "минимальное удержание страховки плюс запрет повторного входа (72/72 и 168/168 часов)"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B, абзац «Это не июньская ловушка»"}
    result: "убивал запрет повторного входа: страховка не могла вернуться на 3–7 дней"
  - id: bv2-sig-hyst
    family: hedge-entry-signal
    what: "гистерезис: вход при падении за 30 дней ниже −5%, выход при доходности за 30 дней не ниже 0%"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — четыре новых входа Strategy B и их комбинации"}
    result: "27.4% в год против 23.6%, но в медвежьей половине просадка глубже на всех 6 монетах (BTC −20 против −12); правило прохождения не прошёл"
  - id: bv2-sig-tstat
    family: hedge-entry-signal
    what: "падение за 30 дней, нормированное на волатильность, t меньше −1"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — четыре новых входа Strategy B и их комбинации"}
    result: "страхует лишь 10–15% времени, просадка 32–35%, около вдвое глубже; не прошёл"
  - id: bv2-sig-efficiency-ratio
    family: hedge-entry-signal
    what: "нынешний сигнал плюс чистота тренда по Кауфману (ER за 30 дней больше 0.3)"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — четыре новых входа Strategy B и их комбинации"}
    result: "страхует лишь 10–15% времени, просадка 32–35%; не прошёл"
  - id: bv2-sig-breadth
    family: hedge-entry-signal
    what: "страховка, когда не меньше двух третей монет корзины падают за 30 дней"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — четыре новых входа Strategy B и их комбинации"}
    result: "22.7% в год, просадка 19.4%, лучше нынешнего на 2 монетах из 6; не прошёл"
  - id: bv2-sig-combinations-of-four
    family: hedge-entry-signal
    what: "все пары из четырёх новых входов (HYST, TSTAT, ER, BREADTH) через «и» и «или», голосование «два из четырёх» и «три из четырёх»"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — четыре новых входа Strategy B и их комбинации"}
    result: "18 вариантов, ни один правило не прошёл; лучший HYST|ER 27.7% в год при просадке 16.9%"

  # ---- hedge-entry-new-info -----------------------------------------------------------
  - id: bv2-flow-taker-72h
    family: hedge-entry-new-info
    what: "новая страховка включается только если за 72 часа чистые продажи (поток сделок по инициатору)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§6 Можно ли сократить ложные тревоги, вариант FLOW"}
    result: "тревог на 20% меньше; проверка 2023-06 — 2026-09: +95% против +85% (BTC+ETH), +103% против +95% (4 монеты); в пиле на BTC+ETH +13.1% против +16.6%; правило не прошёл"
  - id: bv2-macro-vix
    family: hedge-entry-new-info
    what: "страховка ещё и тогда, когда VIX выше своего 80-го перцентиля за год"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8 Другие алгоритмы сигнала из публикаций, вариант MACRO"}
    result: "проверка +66% против +85% (BTC+ETH); в пиле +21.2% против +16.6%; не прошёл"
  - id: bv2-dvol-implied-vol
    family: hedge-entry-new-info
    what: "страховка ещё и при всплеске подразумеваемой волатильности опционов (Deribit DVOL, с 2021-03)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8 Другие алгоритмы сигнала из публикаций, вариант DVOL"}
    result: "проверка +60% против +85% (BTC+ETH), +51% против +95% (4 монеты); в пиле +21.6% против +16.6%; не прошёл"

  # ---- hedge-entry-published ----------------------------------------------------------
  - id: bv2-ens6-horizon-ensemble
    family: hedge-entry-published
    what: "шесть пар окон сразу, каждая страхует свою шестую часть книги (ансамбль горизонтов, AQR)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8, вариант ENS6"}
    result: "проверка +64% против +85% (BTC+ETH), просадка 12.3 против 10.0; не прошёл"
  - id: bv2-ens3-horizon-ensemble
    family: hedge-entry-published
    what: "три пары окон (7/20, 14/30, 30/60), каждая страхует треть книги"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8, вариант ENS3"}
    result: "проверка +72% против +85% (BTC+ETH), +88% против +95% (4 монеты); снизил просадку только на окне выбора; не прошёл"
  - id: bv2-jump-regime-model
    family: hedge-entry-published
    what: "статистическая модель с двумя режимами по дневным признакам, переобучение раз в месяц, страховка в «медвежьем» режиме (arXiv 2402.05272)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8, вариант JUMP"}
    result: "страхует 4 раза в год вместо 27, доля ложных тревог 30% в пиле; проверка +37% против +85%, просадка 14.0; не прошёл"
  - id: bv2-chandelier-exit
    family: hedge-entry-published
    what: "страховка, когда цена ниже 60-дневного максимума на три средних дневных диапазона (канал с поправкой на волатильность)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8, вариант CHAND"}
    result: "проверка +47% против +85%, просадка 34.9 (BTC+ETH); в пиле +26.5% против +16.6%; не прошёл"
  - id: bv2-volscale-vol-managed
    family: hedge-entry-published
    what: "когда основное правило молчит, держать частичную страховку тем большую, чем выше текущая волатильность (Moreira–Muir)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§8, вариант VOLSCALE"}
    result: "проверка +83% против +85% (BTC+ETH), +94% против +95%: вровень с нынешним правилом; не прошёл"

  # ---- hedge-staging ------------------------------------------------------------------
  - id: bv2-staged24
    family: hedge-staging
    what: "половина страховки сразу, вторая половина если сигнал держится 24 часа"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§6, вариант STAGED24"}
    result: "тревог на 15% меньше, ложных столько же; просадка на проверке хуже на 2–4 п.п."
  - id: bv2-staged-dd5
    family: hedge-staging
    what: "половина страховки сразу, вторая половина после ещё −5% от точки включения"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§6, вариант STAGED_DD5"}
    result: "комиссии −35%, но просадка на проверке хуже на 2–4 п.п."
  - id: bv2-stop-5-10
    family: hedge-staging
    what: "снять страховку, если цена ушла на 5% (или 10%) выше точки включения"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§6, варианты STOP5 и STOP10"}
    result: "эффекта нет"
  - id: bv2-daily-signal
    family: hedge-staging
    what: "читать сигнал раз в сутки вместо раза в час"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§6, вариант DAILY"}
    result: "тревог на 30% меньше, доля ложных на 5 п.п. ниже, но хуже везде"
  - id: bv2-sticky-exit
    family: hedge-staging
    what: "липкий выход: страховка снимается, только если правило «не нужна» держится 12 (в июне — 24) часа подряд"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B × 3 точки входа, и следующее дополнение про липкий выход"}
    result: "принято в Bv2: Calmar 1.39 → 2.12, просадка 17.0 → 12.6%; проверка вперёд подтвердила направление, величина намного меньше"
  - id: bv2-limit-orders
    family: hedge-staging
    what: "исполнение лимитными заявками вместо рыночных"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B, строка про лимитные ордера (июнь)"}
    result: "Calmar 1.61, лучше на 6 монетах из 6; известный рычаг"
  - id: bv2-partial-hedge-50
    family: hedge-staging
    what: "страховать 50% монет вместо 100%"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B × 3 точки входа"}
    result: "Calmar около 1.0 на всех входах: защиты вдвое меньше"
  - id: bv2-btc-perp-hedge
    family: hedge-staging
    what: "страховать монету контрактом на BTC с долей по скользящей бете за 90 дней"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B × 3 точки входа"}
    result: "Calmar 0.24–0.64, страховка теряет 9.6% в год: альты расходятся с BTC"
  - id: bv2-spot-75
    family: hedge-staging
    what: "75% капитала в споте, 25% деньгами"
    where: {file: funding-rate-arbitrage/research/GRAVEYARD_REVIEW_2026_09.md, section: "Дополнение 2026-09-13 — 4 идеи улучшения Strategy B × 3 точки входа"}
    result: "Calmar как у исходной, просадка выше: просто больше рынка"

  # ---- parameter-refit ----------------------------------------------------------------
  - id: bv2-refit-54-sets
    family: parameter-refit
    what: "пересчёт набора (окна сигнала × липкий выход × храповик, 54 набора) по последним 3–12 месяцам, 48 способов"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§7 Пересчёт параметров по скользящему окну"}
    result: "NO-GO: лучше фиксированного набора 0 из 48, лучше прода 3 из 48 (BTC+ETH); рейтинг набора «за окно назад» и «вперёд» не связаны (+0.01)"
  - id: bv2-refit-windows-only
    family: parameter-refit
    what: "пересчёт только пары окон сигнала (36 пар, короткое 3–30 × длинное 10–90 дней) по прошлому"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§7a Только окна сигнала"}
    result: "лучше 14/30 0 способов из 48; пара, лучшая за прошлое, в следующем месяце на 48-м перцентиле из 36"
  - id: bv2-fixed-slow-windows-30-60
    family: parameter-refit
    what: "фиксированные медленные окна 30/60 (выбраны на 2020–23)"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§7 и §9, строка «просто медленные окна 30/60 всегда»"}
    result: "проверка +94% / просадка 9.4 (BTC+ETH), в пиле +25.9%; сам отчёт: выбор задним числом, в 2022-м хуже на 13–14 п.п."
  - id: bv2-parameter-plateau
    family: parameter-refit
    what: "36 вариантов: окна 7/14, 14/30, 21/45, 30/60 × липкий выход 0/12/48 ч × храповик 0.25/0.5/1.0, на данных до 2023"
    where: {file: funding-rate-arbitrage/research/strategy_b_v2/LIMITS.md, section: "§1, подраздел «Параметры — плато, а не пик»"}
    result: "все дают +33…+52% в год при просадке 8–14%"

  # ---- regime-detection ---------------------------------------------------------------
