# Numbers taken from q-lab's own data when no paper gives them (qlab.own_numbers,
# docs/OWN_NUMBERS.md). Owner, 2026-10-26, on the rule proposed with these four limits:
# «Разрешить с этими четырьмя ограничениями ... откроются механизмы про фандинг. - еще я бы
# довавил правило - придумать свой механизм основываясь на идее».
#
# The four limits, as code applies them:
#   1. the list of values is declared HERE, before any run that uses it; a spec offers a
#      parameter's whole list, never a subset it picked;
#   2. the value is chosen by code on data BEFORE the cut only (qlab.strategies.retune,
#      refit_every: once);
#   3. the verdict is the stand's on data FROM the cut, which the choice never saw;
#   4. every value of the list is a trial of its own in the ledger (deflation counts it).
#
# Changing a list is a NEW version of this file, never an edit: bump `version` and say
# why in the commit. Values are round on purpose: a coarse grid is the one the data can
# afford; the windows and the rebalance are the examples the owner approved.
# 2026-10-26.2: two Bv2 lists (owner, 2026-10-26, «да, делай оба варианта» -- the hedge signal's
# short window and the partial hedge; frab 7304000 made both params). The short window takes the
# windows list above; the share of a sideways hedge is half or whole (whole = today's books).
# 2026-10-29.1: the Bv2 graded hedge (owner, 2026-10-29: «сливай и ставь опыт на стенде»; frab
# 02cfd7d made graded_hedge_depth a param): how far below the threshold a window's return must fall
# for that window to count in full: 5%, 10%, 20% are round depths across a dip, a correction and a
# fall of the 14/30-day returns (0, the on/off hedge production runs, is the base it is compared
# with, not a candidate: a list takes positive numbers only).
version: "2026-10-29.1"
lists:
  signal.window_days: [3, 7, 14, 30]
  signal.lookback_days: [3, 7, 14, 30]
  rebalance_days: [1, 7]
  portfolio.fraction: [0.1, 0.2, 0.3]
  portfolio.top_n: [3, 5, 10]
  universe.n: [20, 50]
  short_window_days: [3, 7, 14, 30]
  partial_hedge_share: [0.5, 1.0]
  graded_hedge_depth: [0.05, 0.1, 0.2]
# The most candidates one spec may offer (the product of its lists' lengths): each is a
# trial, and the more there are, the higher the bar the best of them has to clear.
max_candidates: 8
# Where the cut falls: the owner's split of the window, «поделить 2/3 и 1/3 ... оставшуюся 1/3
# для прогона вперед» (rules/2026-10-24.1.yaml, holdout_share 1/3) -- the value is chosen on
# the first two thirds, judged on the last third; later only if the spec's own sources were
# published later (params_fixed_at).
forward_share: 0.3333333333333333
