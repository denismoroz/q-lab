# The programmer agent (qlab.agents.programmer, docs/PROGRAMMER.md). Owner, 2026-10-26: «так
# нам нужен еще один агент - который будет дописывать код если нужно»; «будет дописывать код
# если руководитель посчитает что направление - следует проверить»; «да, делай
# агента-программиста».
#
# It takes code requests (the research director's `code_requests`, approved with its
# directions, or the owner's `qlab code request`), one a night, and writes them on a branch
# `agent/<id>` in a separate worktree. Code then checks the changed paths, runs the tests and
# asks a reviewer agent; a request that passes is committed ON ITS BRANCH and waits for the
# owner. Nothing reaches a main branch, and nothing is pushed, without `qlab code merge <id>`
# -- the owner's command.
enabled: true
model: sonnet        # docs/PLAN.md: the agents that write code run on sonnet
reviewer_model: sonnet
max_turns: 80        # the agent runs the tests itself as it works: that takes turns
per_night: 1
# Owner, 2026-10-28: «добавь в инструкцию доводить тесты до конца - если ошибка в них и в
# коде - не останавливаться после пары попыток». The first real request (2026-10-26-1) stopped
# after two attempts on the agent's OWN wrong test (its comment said the 30-day return was -5%,
# the prices it built gave 0%) because the agent could not run anything and each retry began
# from scratch. So: the agent runs the repository's test command itself (and nothing else in
# the shell); a failed check by code sends the same worktree back for up to `fix_rounds` fix
# passes inside one attempt; a retry edits the earlier attempt's worktree instead of
# recreating it; a request that failed `max_attempts` times waits for the owner.
max_attempts: 3
fix_rounds: 3
repos:
  frab:
    path: /Users/d/prj/funding-rate-arbitrage
    base: main
    # Only the pure strategy modules q-lab's stand runs (qlab.strategies.live._loader,
    # ALLOWED_MODULES, without frab.constants and FRAB's live signals) and their tests: frab
    # trades real money, and its engines, exchange and execution code are not the agent's.
    allowed:
      - src/frab/strategy/b2/params.py
      - src/frab/strategy/b2/book.py
      - src/frab/strategy/b2/retune.py
      - src/frab/strategy/b2/retune_history.py
      - src/frab/strategy/b2/retune_params.py
      - src/frab/strategy/b2/tests/*
      - src/frab/strategy/trend/params.py
      - src/frab/strategy/trend/signals.py
      - src/frab/strategy/trend/book.py
      - src/frab/strategy/trend/coin_selector.py
      - src/frab/strategy/trend/retune.py
      - src/frab/strategy/trend/retune_params.py
      - src/frab/strategy/trend/retune_book.py
      - src/frab/strategy/trend/tests/*
      - src/frab/strategy/xsmom/params.py
      - src/frab/strategy/xsmom/evaluators/signal.py
      - src/frab/strategy/xsmom/tests/*
    test_command: [uv, run, pytest, -q, -rs, -p, no:cacheprovider, src/frab/strategy]
    # Untracked data the tests read (gitignored, so a fresh worktree lacks it): linked from the
    # main checkout, read only. Without research/data the B2 parity tests skip themselves.
    link_ignored: [research/data]
    # Tests that prove the default behaviour unchanged: a skip of any of them fails the request.
    must_run: [test_book_parity.py, test_book_pool_parity.py]
    test_timeout_s: 1800
  qlab:
    path: .
    base: main
    # Strategy code and blocks, and since 2026-10-28 the stand's measurement and data code and
    # the anomaly checks: a fix or a new check proposed by the anomaly investigator
    # (docs/ANOMALIES.md) lives there. Owner, 2026-10-28: «да, расширь программисту папки».
    # What decides stays closed: the pipeline, the rules and the registry are never the
    # agent's to change. Nothing reaches main without the owner's `qlab code merge`.
    allowed:
      - src/qlab/strategies/*
      - src/qlab/harness/*
      - src/qlab/data/*
      - src/qlab/anomalies/*
      - docs/BLOCKS.md
      - docs/ANOMALIES.md
    test_command: [uv, run, pytest, -q, -p, no:cacheprovider, src/qlab]
    test_timeout_s: 1800
