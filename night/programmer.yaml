# The programmer agent (qlab.agents.programmer, docs/PROGRAMMER.md). Owner, 2026-10-26: «так
# нам нужен еще один агент - который будет дописывать код если нужно»; «будет дописывать код
# если руководитель посчитает что направление - следует проверить»; «да, делай
# агента-программиста».
#
# It takes code requests (the research director's `code_requests`, approved with its
# directions, or the owner's `qlab code request`), `per_night` of them a night (the ones that
# give the generator a new block first), and writes them on a branch `agent/<id>` in a separate
# worktree. Code then checks the changed paths, runs the tests and
# asks a reviewer agent; a request that passes is committed ON ITS BRANCH and waits for the
# owner. Nothing reaches a main branch, and nothing is pushed, without `qlab code merge <id>`
# -- the owner's command.
enabled: true
model: sonnet        # the WRITER (docs/PLAN.md: the agents that write code run on sonnet)
reviewer_model: sonnet
max_turns: 80        # the agent runs the tests itself as it works: that takes turns
# Owner, 2026-10-30: «переноси токены на программиста. или даже подключай 2 если нужно. может
# нужно сделать программиста 2х уровневым - опус делает план а sonnet - пишет. так как сейчас
# какаято- чехарда.» Of 58 ideas of the last run 55 were the researchers' variants of the same
# strategies, while new mechanisms waited for building blocks in this queue (10 requests, one a
# night) and one failed attempt spent 2.6M tokens. So: two levels (the PLANNER reads the request
# and the code, read only, and writes a plan; a question about a strategy's behaviour that
# nobody answered stops the request before a writing token is spent), two requests a night,
# the stage runs before the researcher, and the researcher works one strategy a night
# (night/research.yaml `rotation`).
planner_model: opus
planner_max_turns: 30
per_night: 2         # one after another: the tests and the budget guard's session are shared
# The programmer's share of what the night has left when the stage starts: each request may
# spend about this share divided among the requests of the night (qlab.night.programmer_stage).
# The rest is for the researcher, the cards and the search.
night_share: 0.5
# Owner, 2026-10-28: «добавь в инструкцию доводить тесты до конца - если ошибка в них и в
# коде - не останавливаться после пары попыток». The first real request (2026-10-26-1) stopped
# after two attempts on the agent's OWN wrong test because the agent could not run anything and
# each retry began from scratch. So: the agent runs the repository's test command itself (and
# nothing else in the shell), and a retry edits the earlier work's worktree instead of
# recreating it.
#
# Owner, 2026-10-31: «цикл программист/проверяющий - продолжать пока не заработает задача. но не
# более 7 итераций. программист должен иметь цель сделать работающий код». Before, a reviewer's
# remark ended a request as `blocked` for the owner: 2026-10-28-1 and 2026-10-28-2 had written
# working code and stopped on an empty leftover file, a reformatted import and a family missing
# from a list, 5.3M tokens. Now the writer, code's checks and the reviewer repeat in the SAME
# worktree until the checks pass and the reviewer accepts: at most this many iterations for a
# request, one iteration being one writer pass plus its checks and, when they pass, its review.
# An iteration the environment ended does not count; the same failure three times in a row stops
# the loop early (`blocked`); after the last iteration the request is `failed`, with the last
# remarks, for the owner (`qlab code retry`). The iterations share the request's part of the
# stage's allowance (`night_share`); when it runs out the request stops where it is, worktree
# and remarks kept, and the next night goes on.
max_iterations: 7
# What a worktree lacks that the tests read (2026-10-30, request 2026-10-28-1: 34 tests failed
# in its worktree and none because of its work). Worktrees live in data/programmer/worktrees, so
# the sibling repository the tests cite as `<checkout>/../funding-rate-arbitrage` is looked for
# there: a read-only link of that name. A repository's `prepare` commands run in each worktree
# before the tests (a migrated database: a worktree has none, tests open data/qlab.db).
siblings:
  funding-rate-arbitrage: /Users/d/prj/funding-rate-arbitrage
repos:
  frab:
    path: /Users/d/prj/funding-rate-arbitrage
    base: main
    # Only the pure strategy modules q-lab's stand runs (qlab.strategies.live._loader,
    # ALLOWED_MODULES, without frab.constants and FRAB's live signals) and their tests: frab
    # trades real money, and its engines, exchange and execution code are not the agent's.
    allowed:
      - src/frab/strategy/b2/params.py
      - src/frab/strategy/b2/book.py
      - src/frab/strategy/b2/retune.py
      - src/frab/strategy/b2/retune_history.py
      - src/frab/strategy/b2/retune_params.py
      - src/frab/strategy/b2/tests/*
      - src/frab/strategy/trend/params.py
      - src/frab/strategy/trend/signals.py
      - src/frab/strategy/trend/book.py
      - src/frab/strategy/trend/coin_selector.py
      - src/frab/strategy/trend/retune.py
      - src/frab/strategy/trend/retune_params.py
      - src/frab/strategy/trend/retune_book.py
      - src/frab/strategy/trend/tests/*
      - src/frab/strategy/xsmom/params.py
      - src/frab/strategy/xsmom/evaluators/signal.py
      - src/frab/strategy/xsmom/tests/*
    test_command: [uv, run, pytest, -q, -rs, -p, no:cacheprovider, src/frab/strategy]
    # Untracked data the tests read (gitignored, so a fresh worktree lacks it): linked from the
    # main checkout, read only. Without research/data the B2 parity tests skip themselves.
    link_ignored: [research/data]
    # Tests that prove the default behaviour unchanged: a skip of any of them fails the request.
    must_run: [test_book_parity.py, test_book_pool_parity.py]
    test_timeout_s: 1800
  qlab:
    path: .
    base: main
    # Strategy code and blocks, and since 2026-10-28 the stand's measurement and data code and
    # the anomaly checks: a fix or a new check proposed by the anomaly investigator
    # (docs/ANOMALIES.md) lives there. Owner, 2026-10-28: «да, расширь программисту папки».
    # What decides stays closed: the pipeline, the rules and the registry are never the
    # agent's to change. Nothing reaches main without the owner's `qlab code merge`.
    allowed:
      - src/qlab/strategies/*
      - src/qlab/harness/*
      - src/qlab/data/*
      - src/qlab/anomalies/*
      - docs/BLOCKS.md
      - docs/ANOMALIES.md
    test_command: [uv, run, pytest, -q, -p, no:cacheprovider, src/qlab]
    prepare:
      - [uv, run, qlab, init-db]
    test_timeout_s: 1800
