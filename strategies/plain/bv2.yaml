# Bv2 — монеты со страховкой от падения. Простое описание для страницы идеи (docs/PLAIN_PAGE.md).
# Текст написан один раз на семейство; числа вариантов подставляет код из спека ({...}).
id: bv2
title: "Bv2: монеты со страховкой от падения"
# Кому подходит: идея, у которой корень стратегии — один из roots, или чей код — один из code_refs.
roots: [strategy-b-v2]
code_refs:
  - qlab.strategies.live.bv2:LiveBv2
  - qlab.strategies.bv2:BStrategyV2
# Спек основной версии: с ним код сравнивает вариант («Чем этот вариант отличается»).
base_specs:
  LiveBv2: specs/bv2-live.yaml
  BStrategyV2: specs/bv2.yaml
# Как называют основную версию, когда выбирают между ней и вариантом.
base_name: "как на проде"
# Чем и когда проверено каждое предложение. Нужно, чтобы тот, кто меняет код, знал, что править в тексте.
checked_against:
  - "funding-rate-arbitrage/src/frab/strategy/b2/params.py (B2Params: окна 14 и 30 суток, sticky_exit_hours, ratchet_threshold, book_sizes: доля монеты из плеча и запаса залога)"
  - "funding-rate-arbitrage/src/frab/strategy/b2/book.py (signals_at: страховка включена, пока рост не подтверждён оба срока; step: открытие и снятие страховки, докупка после снятия, храповик, пополнение залога, ликвидация)"
  - "src/qlab/strategies/live/bv2.py (стенд ведёт настоящую книгу frab час за часом)"
  - "cards/strategy-b-v2.yaml (доля в монете от 57% до 70% при запасе 1.0; $257 на прод-бумаге)"
  - "night/paper_books.yaml (strategy_capital_usd: 257)"
facts_default:
  short_window: 14
  long_window: 30
  sticky_hours: 12
  ratchet_pct: 50
sentences:
  - >-
    Держит монеты {coins} и делит деньги между ними поровну: часть денег каждой монеты лежит в
    самой монете (на настройках прода — от 57% до 70%, зависит от плеча и запаса залога), остальное — доллары
    (USDC) на бирже Hyperliquid, это залог для страховки.
  - >-
    Страховка — это когда стратегия продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает)
    бессрочный контракт на ту же монету в том же размере, что у неё монет: цена монеты упала —
    убыток по монете гасится прибылью по контракту. Страховку она открывает, пока рост не подтверждён: если
    за последние {short_window} суток или за последние {long_window} суток цена монеты не выросла.
  - >-
    Страховку она снимает, когда монета выросла за оба срока, но не раньше чем сигнал промолчит
    {sticky_hours} часов подряд, чтобы не дёргаться туда-сюда. Если монета выросла больше чем на {ratchet_pct}% сверх плановой доли
    и страховки нет, лишнее продаёт; после снятия страховки, когда рост подтвердился, докупает монету до плановой доли.
  - >-
    Зарабатывает на росте монет и теряет меньше в падение; пока страховка открыта, получает (или платит)
    ставку финансирования — плату, которую участники бессрочных контрактов раз в час платят друг другу.
  - >-
    Рискует так: страховка включается с опозданием, в боковике её то включают, то снимают, и каждая смена стоит
    комиссий; а резкий взлёт цены съедает залог (тогда продают часть монеты и сокращают страховку, а если залога
    всё равно не хватает, биржа закрывает страховку принудительно).
