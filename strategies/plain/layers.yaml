# Обёртки над стратегией (перенастройка кодом, состояние рынка, надстройки, частота входа и выхода)
# простыми словами. Проверено по src/qlab/strategies/retune.py, regime_gate.py, cadence.py,
# overlays/ и docs/OVERLAYS.md, docs/RETUNE.md, docs/REGIMES.md.

retune:
  refit:
    M: "каждый месяц"
    W: "каждую неделю"
    D: "каждый день"
  objective:
    sharpe_net: "по Шарпу после комиссий (Шарп — средняя доходность, делённая на размах колебаний)"
    total_return_net: "по общей доходности после комиссий"
  window:
    expanding: "по всей истории до этого дня"

regime:
  states:
    bull: "рост"
    flat: "боковик"
    bear: "падение"
  detector_default: "состояние рынка определяется по изменению цены биткоина за 30 суток против его же прошлых значений (верхняя треть — рост, нижняя — падение, средняя — боковик)"

# Надстройки: что делает каждая и как называется её вариант в словах владельца.
overlays:
  market_gate:
    title: "не торгует в части состояний рынка"
  meta_gate:
    title: "торгует только в дни, когда обученная модель обещает прибыль"
  vol_target:
    title: "уменьшает книгу, когда результаты скачут сильнее обычного"
  own_results:
    title: "уменьшает книгу, когда недавние результаты плохие"
  gradual_entry:
    title: "набирает позицию частями"
  gradual_exit:
    title: "сокращает позицию частями"
