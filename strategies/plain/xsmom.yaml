# XSMOM — покупка лидеров роста и продажа отстающих среди монет.
# Простое описание для страницы идеи (docs/PLAIN_PAGE.md).
id: xsmom
title: "XSMOM: покупает лидеров роста, продаёт отстающих"
roots: [xsmom]
code_refs:
  - qlab.strategies.xsmom:XsmomCrossSectionalMomentum
base_specs:
  XsmomCrossSectionalMomentum: specs/xsmom.yaml
base_name: "как в основной версии"
checked_against:
  - "src/qlab/strategies/xsmom.py (модульная строка: оценка монеты — среднее из отклонений роста за каждый срок от среднего по списку; раз в неделю лучшие в покупку, худшие в короткую продажу, суммы равны)"
  - "funding-rate-arbitrage/src/frab/strategy/xsmom/params.py (lookbacks 14/21/30/45/60, rebalance_days 7, anchor_dow 3 — четверг, n_positions None — треть монет с каждой стороны)"
  - "cards/xsmom.yaml (plain_summary: живая книга около $241, убыток и его причина — покупаемая сторона платит ставку финансирования)"
facts_default: {}
money_fallback: "Живая книга работала примерно на $241 (по карточке стратегии); в этом описании сумма не задана."
sentences:
  - >-
    Идея простая: монеты, которые последние недели росли лучше остальных, в среднем ещё какое-то время продолжают
    обгонять отстающих. Стратегия берёт монеты ({xsmom_universe}) и {xsmom_rhythm} ставит их в очередь:
    для каждой считает, насколько её рост за {xsmom_lookbacks} суток выше или ниже среднего по списку, и усредняет эти оценки.
  - >-
    Верхнюю часть очереди покупает, нижнюю продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает):
    {xsmom_legs}. Покупки и продажи равны по сумме, поэтому общее движение рынка в книге гасится: что теряет одна половина,
    то отыгрывает другая.
  - >-
    Рискует так: победители прошлых недель — это монеты, на рост которых ставит толпа, а за такую ставку на бессрочном
    контракте платят (плата называется ставкой финансирования). Поэтому купленная половина всё время платит эту плату, и
    на живых деньгах стратегия потеряла 11,19% за 13 недель.
