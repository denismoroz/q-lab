# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: crypto-ts-momentum
title: "Каждая монета отдельно: выросла — покупаем, упала — продаём"
checked_against:
  - "docs/MECHANISMS.md, раздел crypto-ts-momentum, поле «Суть»"
sentences:
  - >-
    Каждую монету оценивают саму по себе, без сравнения с другими: если за прошлый срок цена выросла, монету
    покупают, если упала — продают в короткую (продают взятое взаймы, это выигрывает, если цена падает).
  - >-
    Это ставка на то, что движение цены в крипторынке продолжается ещё какое-то время; кто именно платит,
    источник не доказывает.
