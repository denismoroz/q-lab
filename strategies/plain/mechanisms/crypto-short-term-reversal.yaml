# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: crypto-short-term-reversal
title: "Откат вчерашних лидеров у мелких монет"
checked_against:
  - "docs/MECHANISMS.md, раздел crypto-short-term-reversal, поле «Суть»"
sentences:
  - >-
    У мелких и малоторгуемых монет вчерашний лидер на следующий день или неделю часто откатывается назад:
    покупают тех, кто вырос меньше всего, и продают в короткую (продают взятое взаймы) тех, кто вырос больше
    всего.
  - >-
    Авторы объясняют это малой ликвидностью: крупная сделка сдвигает цену, а потом она возвращается.
