id: classic-weekly-reversal
title: "Недельный откат акций (классическая работа)"
checked_against:
  - "docs/MECHANISMS.md, раздел classic-weekly-reversal, поле «Суть»"
sentences:
  - >-
    Акции, которые были лидерами недели, на следующей неделе в среднем откатываются, а аутсайдеры отскакивают:
    покупают аутсайдеров, продают в короткую (продают взятое взаймы) лидеров.
  - >-
    Платят те, кто в спешке продаёт и покупает после больших движений цены и готов уступить в цене ради
    немедленной сделки. Это работа не про криптовалюты.
