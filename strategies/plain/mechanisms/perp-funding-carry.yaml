# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: perp-funding-carry
title: "Заработок на плате по бессрочным контрактам"
checked_against:
  - "docs/MECHANISMS.md, раздел perp-funding-carry, поле «Суть»"
sentences:
  - >-
    Участники бессрочного контракта (контракта на монету без даты закрытия) периодически платят друг другу
    ставку финансирования; когда контракт торгуется дороже самой монеты, платят покупатели.
  - >-
    Продавая контракт в короткую (продавая взятое взаймы) и покупая саму монету, получают эти платежи и почти не
    рискуют общим движением цены. Платят те, кто с плечом ставит на рост.
