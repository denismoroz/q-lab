id: crypto-xs-momentum
title: "Покупка лидеров роста и продажа отстающих среди монет"
checked_against:
  - "docs/MECHANISMS.md, раздел crypto-xs-momentum, поле «Суть»"
sentences:
  - >-
    Каждую неделю покупают монеты, которые за последние 1–4 недели выросли сильнее всего, и продают в короткую
    (продают взятое взаймы, это выигрывает, если цена падает) те, что выросли слабее всего.
  - >-
    Зарабатывает на том, что монеты, ушедшие вверх, в среднем ещё какое-то время обгоняют отстающих; авторы
    причину не доказывают, одна из работ связывает эффект со «стадным» поведением инвесторов.
  - >-
    Покупки и продажи равны по сумме, поэтому общее движение рынка в книге гасится.
