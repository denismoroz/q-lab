# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: classic-carry
title: "Покупка активов с высоким переносом (классическая работа)"
checked_against:
  - "docs/MECHANISMS.md, раздел classic-carry, поле «Суть»"
sentences:
  - >-
    Перенос — доход, который получаешь, если цена не меняется. Работа показывает в девяти классах активов, что
    перенос предсказывает будущую доходность: покупка активов с высоким переносом и продажа в короткую (продажа
    взятого взаймы) с низким приносит прибыль.
  - >-
    У бессрочного контракта перенос покупателя — это минус ставка финансирования: когда ставка отрицательна,
    покупатель получает платёж. Это работа не про криптовалюты.
