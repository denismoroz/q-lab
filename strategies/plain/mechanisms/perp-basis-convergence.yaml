# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: perp-basis-convergence
title: "Сближение цены контракта и цены монеты"
checked_against:
  - "docs/MECHANISMS.md, раздел perp-basis-convergence, поле «Суть»"
sentences:
  - >-
    Цена бессрочного контракта иногда уходит от «справедливой» цены, которую выводит теория из ставки
    финансирования и правил биржи. Когда контракт дороже, продают контракт и покупают монету; когда дешевле —
    наоборот.
  - >-
    Позицию закрывают, когда отклонение впервые возвращается к нулю. Доход идёт главным образом от сближения цен
    и в меньшей части от платежей по ставке финансирования.
