id: crypto-vol-managed-momentum
title: "Покупка лидеров роста с размером по недавним колебаниям"
checked_against:
  - "docs/MECHANISMS.md, раздел crypto-vol-managed-momentum, поле «Суть»"
sentences:
  - >-
    Покупают лидеров роста и продают в короткую (продают взятое взаймы) отстающих, как в обычной стратегии
    продолжения движения, но размер позиций подгоняют под недавние колебания: когда они были сильными, позицию
    уменьшают, когда слабыми — увеличивают.
  - >-
    Цель — смягчить редкие обвалы продолжения движения; идея пришла из акций.
