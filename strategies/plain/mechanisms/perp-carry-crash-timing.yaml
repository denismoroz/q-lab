# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: perp-carry-crash-timing
title: "Не держать монету при очень высокой плате по контракту"
checked_against:
  - "docs/MECHANISMS.md, раздел perp-carry-crash-timing, поле «Суть»"
sentences:
  - >-
    Когда контракт торгуется заметно дороже самой монеты (у бессрочного контракта это высокая положительная
    ставка финансирования), цена монеты к концу срока контракта в среднем падает сильнее: при такой плате лучше её не держать в
    покупке.
  - >-
    Платят те, кто с плечом (в долг у биржи) покупает контракт по завышенной цене. Авторы проверяют связь
    уравнениями, а не торговым правилом, поэтому стенд собирает лишь приближение к их идее.
