id: outcome-complete-set-arbitrage
title: "Рынки исходов: цены взаимоисключающих исходов не дают 1 доллар"
checked_against:
  - "docs/MECHANISMS.md, раздел outcome-complete-set-arbitrage, поле «Суть»"
sentences:
  - >-
    На одно событие бывает несколько взаимоисключающих исходов, и сумма их цен «Да» должна быть равна 1 доллару.
    Если это не так, можно купить все исходы сразу и получить гарантированную разницу.
  - >-
    Платит тот, кто торопится и ставит заявку по несбалансированной цене; это не ставка на направление, а сделка
    из нескольких ног сразу, блоков для неё нет.
