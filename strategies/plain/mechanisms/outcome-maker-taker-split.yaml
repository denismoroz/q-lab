# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: outcome-maker-taker-split
title: "Рынки исходов: кто ставит заявку, а кто берёт чужую"
checked_against:
  - "docs/MECHANISMS.md, раздел outcome-maker-taker-split, поле «Суть»"
sentences:
  - >-
    На бирже часть участников выставляет заявки и ждёт, а часть берёт уже стоящие; потери от перекоса несут
    неравномерно: берущие чужую заявку теряют заметно больше выставляющих.
  - >-
    Поэтому продавать дешёвые контракты проще тому, кто сам ставит заявки; стенд заявки, ждущие исполнения, не
    моделирует, блоков для такой стратегии нет.
