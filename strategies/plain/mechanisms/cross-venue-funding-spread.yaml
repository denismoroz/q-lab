# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: cross-venue-funding-spread
title: "Разница платы по контракту на разных биржах"
checked_against:
  - "docs/MECHANISMS.md, раздел cross-venue-funding-spread, поле «Суть»"
sentences:
  - >-
    Одна и та же монета на разных биржах платит разную ставку финансирования (плату между участниками
    бессрочного контракта). Контракт продают в короткую там, где ставка выше, и покупают там, где ниже: движение
    цены гасится, остаётся разница ставок.
  - >-
    Крупные разницы встречаются, но после издержек и разворотов выигрышной остаётся лишь часть сделок.
