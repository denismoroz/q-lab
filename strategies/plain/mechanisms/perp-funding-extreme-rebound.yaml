# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: perp-funding-extreme-rebound
title: "Отскок после необычной платы по контракту"
checked_against:
  - "docs/MECHANISMS.md, раздел perp-funding-extreme-rebound, поле «Суть»"
sentences:
  - >-
    Ставку финансирования (плату между участниками бессрочного контракта) сравнивают не с нулём, а с её же
    прошлым: насколько она необычна для этой монеты. После необычно низкой ставки, когда рынок перекошен в
    короткие позиции, цена в следующие сутки в среднем растёт.
  - >-
    Причину авторы не доказывают: по их предположению, часть перекоса — временное давление на цену, которое
    потом рассасывается. Они прямо пишут, что прибыльную стратегию не доказывают, а источник слабый: журнал
    малоизвестный, инструмент один.
