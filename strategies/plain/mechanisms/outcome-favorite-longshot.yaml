# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: outcome-favorite-longshot
title: "Рынки исходов: переоценены маловероятные события"
checked_against:
  - "docs/MECHANISMS.md, раздел outcome-favorite-longshot, поле «Суть»"
sentences:
  - >-
    Контракт на рынке исходов стоит от 0 до 1 доллара и в день расчёта платит 1 доллар, если событие случилось,
    и ничего, если нет; цена — оценка вероятности.
  - >-
    Давно известно, что маловероятные исходы переоценены, а вероятные недооценены: за шанс на большой выигрыш
    платят больше честной цены. Получает продавец дешёвого контракта; блоков и данных для такой стратегии у
    лаборатории пока нет.
