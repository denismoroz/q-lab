# Простое описание механизма каталога (docs/MECHANISMS.md) для страницы идеи (docs/PLAIN_PAGE.md).
id: classic-ts-momentum
title: "Годовой тренд по каждому активу (классическая работа)"
checked_against:
  - "docs/MECHANISMS.md, раздел classic-ts-momentum, поле «Суть»"
sentences:
  - >-
    Для каждого актива смотрят, был ли его доход за последний год положительным: если да, покупают, если нет —
    продают в короткую (продают взятое взаймы); размер позиции подгоняют так, чтобы у каждого актива был
    одинаковый разброс.
  - >-
    Это работа не про криптовалюты, её числа взяты для проверки на монетах. Платят участники, которые страхуют
    риск и уступают выгоду тем, кто ставит на продолжение движения.
