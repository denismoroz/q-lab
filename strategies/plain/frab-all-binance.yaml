sentences:
  - >-
    Зарабатывает на той же плате между участниками бессрочных контрактов (ставке финансирования), что и FRAB:
    покупает монету за доллары и одновременно продаёт в короткую контракт на неё на столько же, поэтому цена
    монеты на результат почти не влияет.
  - >-
    Отличие: и монету, и контракт держит на одной площадке, Binance. Деньги между своими кошельками переводятся без
    платы и сразу, поэтому залог можно пополнять без потерь на переводах. Правила входа и выхода те же, что у FRAB:
    открывает, когда средняя ставка за {signal_hours} часов выше {entry_pct}% годовых, держит не больше {slots} пар сразу.
  - >-
    Рискует так: плата может стать отрицательной, на покупку и продажу уходят комиссии, а при резком взлёте цены залога
    может не хватить, и контракт закроют принудительно. Торговать на Binance лаборатория не умеет: подключения к нему нет.
