# Составная стратегия из блоков (docs/BLOCKS.md), простыми словами. Код собирает из этих фраз
# абзац «что делает именно эта версия», подставляя числа спека. Проверено по docs/BLOCKS.md и
# src/qlab/strategies/blocks/. Подстановки {…} — числа спека; доли в процентах пишет код
# ({tail_pct}, {fraction_pct}, {target_pct}).
#
# Блок, которого здесь нет, не прячется: страница напишет «блок X с параметрами …».

universe:
  all: "Выбирает из всех монет, которые торгуются на площадке."
  top_volume: "Выбирает из {n} монет с самым большим оборотом за последние {window_days} суток (оборот — сумма сделок в долларах)."
  bottom_volume: "Выбирает из {n} монет с самым малым оборотом за последние {window_days} суток (оборот — сумма сделок в долларах)."
  asset_class: "Выбирает из инструментов классов: {classes}."

signal:
  momentum: "Оценивает каждую монету по изменению цены за последние {lookback_days} суток: чем сильнее выросла, тем выше оценка."
  reversal: "Оценивает каждую монету по изменению цены за последние {lookback_days} суток с обратным знаком: чем сильнее выросла, тем ниже оценка (ставка на откат)."
  funding: "Оценивает каждую монету по ставке финансирования за последние {window_days} суток (ставка — плата между участниками бессрочного контракта): чем она выше, тем ниже оценка."
  funding_tail: "Сравнивает нынешнюю ставку финансирования монеты с её же ставками за предыдущие {history_window_days} суток (ставка — плата между участниками бессрочного контракта): необычно низкая (в нижних {tail_pct}% её собственной истории) — оценка плюс, необычно высокая (в верхних {tail_pct}%) — минус, иначе ноль."
  low_vol: "Оценивает каждую монету по тому, как спокойно она двигалась последние {window_days} суток: чем спокойнее, тем выше оценка."

portfolio:
  long_short: "Покупает {top_n} монет с лучшей оценкой и продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает) {top_n} с худшей; покупки и продажи равны по сумме, поэтому общее движение рынка в книге гасится."
  long_only: "Покупает {top_n} монет с лучшей оценкой, поровну; ничего не продаёт."
  long_short_quantile: "Делит монеты на {quantiles} равных групп по оценке, покупает верхнюю группу и продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает) нижнюю; покупки и продажи равны по сумме."
  long_only_quantile: "Делит монеты на {quantiles} равных групп по оценке и покупает верхнюю, поровну; ничего не продаёт."
  long_short_fraction: "Покупает лучшие {fraction_pct}% монет и продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает) худшие {fraction_pct}%; покупки и продажи равны по сумме."
  long_only_fraction: "Покупает лучшие {fraction_pct}% монет, поровну; ничего не продаёт."
  spot_perp_carry: "Для {top_n} монет с самой низкой оценкой покупает саму монету и одновременно продаёт в короткую (продаёт взятое взаймы) её бессрочный контракт на ту же сумму: цена монеты на результат не влияет, достаётся плата по ставке финансирования."
  time_series_sign: "Каждую монету оценивает отдельно, без сравнения с другими: покупает, если её оценка выше нуля, и продаёт в короткую (продаёт взятое взаймы, это выигрывает, если цена падает), если ниже; деньги делятся между монетами поровну."
  time_series_long: "Покупает монету, пока её оценка выше нуля, и выходит, как только оценка перестаёт быть положительной; продавать в короткую не умеет, деньги делятся между монетами поровну."

sizing:
  equal: "{gross_text}"
  cap_weight: "Монеты внутри каждой стороны берёт не поровну, а пропорционально рыночной стоимости (цена на число монет в обращении); {gross_text_lower}"
  vol_target: "Размер каждой монеты подгоняет так, чтобы она скакала в сутки примерно на {target_pct}% (чем нервнее монета, тем меньше доля); общее плечо не больше {leverage_cap} (плечо — во сколько раз сумма позиций больше денег)."

rebalance: "Набор монет пересматривает {rebalance_text}."
history: "Монету рассматривает, когда у неё накопилось не меньше {min_history_days} суток истории цен."
