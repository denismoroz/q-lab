    list_valued: true
  spot_columns:
    what: "в каких монетах держится стратегия"
    list_valued: true
  mom_short_days:
    what: "короткий срок, за который смотрят рост монеты, суток"
    unit: "сут."
  mom_long_days:
    what: "длинный срок, за который смотрят рост монеты, суток"
    unit: "сут."

