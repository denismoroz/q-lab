# Словарь параметров стратегий: что значит каждый параметр спека простыми словами.
# Его читает код (qlab.plain), когда пишет на странице идеи «Чем этот вариант отличается»
# и «Как выбраны числа». Подробности — docs/PLAIN_PAGE.md.
#
# Запись:
#   what:        что это за число, существительным («запас залога под страховку»)
#   unit:        единица, которая ставится после числа (необязательно)
#   default:     значение, которое действует, когда параметра в спеке нет (необязательно;
#                так сравниваются параметры, добавленные в код позже остальных)
#   when_true / when_false:   для «да/нет» — целая фраза про каждое значение
#   short_true / short_false: короткое имя значения («общий залог»), им называют варианты
#   tag:         короткое имя числового параметра («запас залога»); с числом оно попадает в
#                короткий заголовок страницы и в имя варианта («запас залога 1.5»)
#   list_valued: параметр по природе список (монеты, сроки). Список чисел под другим параметром —
#                это «число оставлено открытым», код выбирает из значений (docs/OWN_NUMBERS.md)
#   none_means:  что значит «не задано» (null) для этого параметра
#
# Параметр, которого здесь нет, всё равно показывается («параметр X: было A, стало B»), а тест
# test_plain_dictionary называет каждый такой параметр из спеков в specs/. Новый параметр блока
# или стратегии добавляют сюда в тот же день.
#
# Слова-жаргон (cards/SCHEMA.md, «Правила заполнения») здесь запрещены; тест проверяет их тем же
# списком, что и карточки.

params:
  # ---- Bv2: монеты со страховкой от падения (frab/strategy/b2/params.py) ----
  coins:
    what: "список монет"
    list_valued: true
    none_means: "список не задан, монеты выбирает правило отбора"
  capital_usd:
    what: "деньги стратегии в долларах"
  spot_share:
    what: "доля денег в самих монетах (работает, только когда расчёт залога выключен; иначе доля выходит из плеча и запаса залога)"
  hedge_threshold:
    what: "порог доходности монеты, до которого она считается не растущей и страховку держат"
  sticky_exit_hours:
    what: "сколько часов подряд сигнал должен молчать, прежде чем страховку снимут"
    unit: "ч"
  ratchet_threshold:
    what: "на сколько монета должна вырасти сверх плановой доли, прежде чем лишнее продадут (0.5 — на половину)"
  carry_enabled:
    what: "заработок на свободных деньгах"
    when_true: "свободные деньги ещё и зарабатывают на ставке финансирования"
    when_false: "свободные деньги лежат без дела, на ставке финансирования не зарабатывают"
    short_true: "со вторым заработком на свободных деньгах"
    short_false: "без заработка на свободных деньгах"
  carry_fraction:
    what: "размер заработка на свободных деньгах относительно позиции в монете (0.6 — шесть десятых от неё)"
  carry_entry_apr:
    what: "годовая ставка финансирования, выше которой запускают заработок на свободных деньгах"
  carry_exit_hours:
    what: "сколько часов подряд ставка должна быть отрицательной, чтобы этот заработок закрыли"
    unit: "ч"
  slippage:
    what: "запас на проскальзывание цены в заявке (доля от суммы)"
  min_order_usd:
    what: "наименьшая заявка в долларах"
  margin_enabled:
    what: "учёт залога"
    when_true: "залог под страховку считается по правилам биржи (его надо держать, его может не хватить)"
    when_false: "залог считается бесплатным и неограниченным"
    short_true: "с учётом залога"
    short_false: "без учёта залога"
  short_leverage:
    what: "плечо страховки по монетам (плечо — во сколько раз позиция больше залога под неё)"
  default_leverage:
    what: "плечо страховки у монеты, которой нет в списке плечей"
  maint_margin_rate:
    what: "доля позиции по монетам, ниже которой залог опускаться не должен, иначе биржа закроет страховку принудительно"
  default_maint_margin_rate:
    what: "такая же доля для монеты, которой нет в списке"
  margin_buffer:
    what: "запас денег на комиссии и пополнение залога (доля от суммы в монете)"
  hedge_margin_headroom:
    what: "запас залога под страховку (во сколько раз залога берут больше, чем нужно, если монета подрастёт)"
    tag: "запас залога"
    default: 1.0
  rebalance_at_im_share:
    what: "порог, при котором залог пополняют: когда убытки по страховке съели столько его доли (0.5 — половину), продают часть монеты и сокращают страховку на столько же"
  mode:
    what: "режим работы (бумажный: настоящие заявки не ставятся)"
  shared_margin:
    what: "залог под страховки"
    default: false
    when_true: "залог один общий на все монеты, а не у каждой свой: страховку одной монеты можно открыть целиком за счёт свободного залога других"
    when_false: "залог у каждой монеты свой"
    short_true: "общий залог"
    short_false: "у каждой монеты свой залог"
  topup_delay_hours:
    what: "сколько часов идёт пополнение залога (пока оно в пути, страховка может быть закрыта биржей принудительно)"
    tag: "пополнение залога, ч"
    default: 0
    unit: "ч"
  short_window_days:
    what: "короткий срок, за который смотрят рост монеты, суток"
    tag: "короткий срок, сут."
    default: 14
    unit: "сут."
  long_window_days:
    what: "длинный срок, за который смотрят рост монеты, суток"
    default: 30
    unit: "сут."
  partial_hedge_share:
    what: "какую долю монеты страхуют, когда сроки расходятся (один вырос, другой нет; 1 — целиком)"
    tag: "частичная страховка"
    default: 1.0
  fast_window_hours:
    what: "за сколько последних часов смотрят короткую доходность самой монеты, чтобы снимать страховку раньше (0 — выключено)"
    unit: "ч"
    tag: "раннее снятие страховки по своей монете"
    default: 0
  fast_entry:
    what: "кто включает страховку: 0 — короткая доходность только снимает её, 1 — она одна включает и снимает, медленное правило не участвует"
    default: 0
  graded_hedge_depth:
    what: "глубина падения, при которой страхуют всю монету (страхуют долю монеты по силе падения; 0 — выключено, страховка или есть вся, или нет)"
    tag: "страховка по силе падения"
    default: 0.0
  hedge_by:
    what: "откуда берётся сигнал страховки (вместо правила книги — готовые предсказания состояния рынка)"
  deposit_usd:
    what: "сумма регулярных довложений, $"
  deposit_every:
    what: "как часто довкладывают"
  hedge_columns:
