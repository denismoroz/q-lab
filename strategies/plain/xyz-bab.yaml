# Betting against beta на акциях раздела xyz Hyperliquid.
# Простое описание для страницы идеи (docs/PLAIN_PAGE.md).
id: xyz-bab
title: "Спокойные акции против бойких (раздел xyz на Hyperliquid)"
roots: [xyz-equity-bab]
code_refs:
  - qlab.strategies.bab:BettingAgainstBeta
base_specs:
  BettingAgainstBeta: specs/xyz-equity-bab.yaml
base_name: "как в карточке"
checked_against:
  - "src/qlab/strategies/bab.py (модульная строка: ранжирование по бете, спокойная половина против бойкой, каждая сторона приводится к бете один, пересборка в конце каждого календарного месяца)"
  - "cards/xyz-equity-bab.yaml (plain_summary)"
  - "specs/xyz-equity-bab.yaml (market: xyz:XYZ100, classes: [stock], rank_within_class: true)"
facts_default: {}
sentences:
  - >-
    Бета — это то, насколько бумага в среднем движется вместе с рынком: у бумаги с бетой 2 на каждый процент роста
    рынка приходится два процента, у бумаги с бетой 0.5 — полпроцента. Стратегия раз в месяц оценивает бету каждой
    акции по прошлым ценам и делит акции пополам: спокойные (с низкой бетой) покупает, бойкие (с высокой бетой) продаёт в короткую
    (продаёт взятое взаймы, это выигрывает, если цена падает).
  - >-
    Суммы подбирает так, чтобы обе половины двигались с рынком одинаково: спокойных берёт на большую сумму, бойких
    на меньшую. Общее падение или рост рынка в книге вычитается, остаётся разница между тем, как спокойные и бойкие ведут
    себя сверх рынка.
  - >-
    Зарабатывает на том, что многие инвесторы не могут или не хотят брать в долг и переплачивают за бойкие бумаги, а спокойные
    в среднем дают больше, чем положено за их риск. Рискует так: бета — оценка по прошлому, и в кризис все бумаги падают вместе,
    поэтому защита слабеет именно тогда, когда нужна; истории на этом рынке мало, и стенд может честно сказать, что отличить
    результат от случайности нельзя.
