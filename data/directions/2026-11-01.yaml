# The research director's directions (qlab.directions, docs/DIRECTOR.md).
# Written by CODE from the director agent's memo after validation -- do not edit the
# lists by hand (the next director run replaces them). The one hand edit that belongs
# to the owner: `pending_owner_review: false` once the first directions are reviewed
# (or `qlab director --approve`). While it is true the generator and the researcher
# ignore this file.
date: '2026-11-01'
memo: docs/research/director-2026-11-01.md
pending_owner_review: false
generator:
  prefer_mechanisms:
  - perp-funding-carry
  - classic-ts-momentum
  pause_mechanisms:
  - id: crypto-short-term-reversal
    why: Эффект в источниках держится на малооборотных монетах, а среди оборотистых его нет, поэтому испытание
      проверило бы пробел блоков, а не механизм.
  - id: crypto-low-vol
    why: Каталог называет собираемую версию воспроизведением отрицательного результата, попытка уже отвергнута,
      и повтор ничего нового не покажет, пока нет работ с числами, нашедших эффект.
researcher:
  frab:
    priority: high
    note: 'Живая книга снова ведёт себя на краю того, что видел стенд: дневной разброс выше всех его отрезков.
      Сначала закончить сверку живых сделок со стендом за те же часы и назвать, чего стенд не учитывает.
      Это разбор стенда, а не подбор чисел под живые дни. Новых вариантов до этого не заводить. Затем
      просьба владельца о децентрализованных биржах.'
  bv2:
    priority: normal
    note: Новых вариантов на уже отвеченные вопросы не заводить. Свести для владельца, на какие его вопросы
      о страховке уже есть ответ, и работать только над оставшимися. Список монет выбирать кодом и только
      по прошлому.
  trend:
    priority: normal
    note: 'Новых вариантов сигнала не заводить: ответ даст время. Ответить владельцу, зачем стратегии
      такая большая книга, опираясь на правило о капитале.'
  frab-binance-spot:
    priority: normal
    note: 'Новых опытов не ставить. Этот ход только для итогового ответа владельцу из уже сделанного:
      остаётся ли прибыль после всех издержек на его бюджетах. Правила о поддержке площадки и об одновременном
      исполнении говорят о нашем исполнении, а не об идее.'
  xsmom:
    priority: low
    note: 'Новых вариантов не заводить: выжившие в основном надстройки над одной базой, а мерка стенда
      ждёт исправлений о том, какие монеты торгуемы. Когда ход придёт, сверить, какие выжившие ещё живы
      и переживает ли прибыль издержки и правило о капитале.'
catalogue_requests:
- family: funding-and-basis
  look_for: Работы с окном усреднения ставки и сроком пересмотра в сутках и работы, сравнивающие монеты
    между собой по ставке; сверить таблицу недостающих параметров с правилами генератора.
  why: На этом семействе работают живые деньги, а по таблице в нём ничего не собирается.
- family: low-volatility
  look_for: Полные тексты работ, нашедших премию за спокойные монеты, с окнами и сроками в сутках.
  why: Собирается только версия из работы, где эффекта не нашли, поэтому механизм на паузе.
- family: reversal
  look_for: Работы о возврате цены среди крупных оборотистых монет и на бессрочных контрактах.
  why: Все источники каталога находят возврат только у малооборотных монет, поэтому единственный собираемый
    механизм на паузе.
- family: momentum
  look_for: Работы о продолжении движения на бессрочных контрактах с учётом издержек и платы за финансирование.
  why: Все попытки генератора в семействе получили отказ, а источники каталога часто меряют доходность
    без издержек.
data_requests:
- what: История ставок финансирования и цен децентрализованных бирж бессрочных контрактов, кроме Hyperliquid,
    на одной сетке с имеющимися площадками.
  why: Владелец просит найти такие биржи для FRAB, а механизму разницы ставок нужна панель из двух площадок.
- what: Открытый интерес и объёмы принудительных закрытий по монетам на Hyperliquid и Binance; если истории
    нет, начать хранить её сейчас.
  why: Механизму предупреждения об обвале дохода от ставки нужны эти данные, а лаборатория их не хранит.
code_requests:
- repo: qlab
  what: Сделать так, чтобы идея генератора, получившая отказ на первой площадке и ждущая ответа второй,
    не держала место в потолке стратегий; как именно это решить, выбирает владелец.
  why: Сейчас такие идеи, похоже, занимают единственное свободное место, и генератор не запускается, то
    есть поиск нового стоит.
  strategy: null
- repo: qlab
  what: Дать стратегиям с низкой важностью реже, но гарантированно получать ход в ротации исследователя,
    вместо того чтобы не получать его совсем, пока есть стратегии важнее.
  why: Сейчас при одной стратегии в ночь низкая важность означает ни одного хода, и указания руководителя
    этим стратегиям не выполняются.
  strategy: null
- repo: qlab
  what: Показывать в файле доказательств руководителя по каждому выжившему его статус сегодня, исход последнего
    прогона и общую базу, а цену выжившего считать только по действительно ждущим владельца.
  why: Число выживших не сходится со статусами, надстройки над одной базой считаются отдельными находками,
    а направления выбираются по этому числу.
  strategy: null
- repo: qlab
  what: 'Обеспечить детектору затухания историю стенда для основной бумажной книги тренда: сейчас выборки
    нет в кэше и сравнения нет.'
  why: Основная бумажная книга тренда остаётся без наблюдения, ведёт ли она себя как на стенде.
  strategy: trend
propose_close_family: []
problems: []
