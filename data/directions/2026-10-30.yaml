# The research director's directions (qlab.directions, docs/DIRECTOR.md).
# Written by CODE from the director agent's memo after validation -- do not edit the
# lists by hand (the next director run replaces them). The one hand edit that belongs
# to the owner: `pending_owner_review: false` once the first directions are reviewed
# (or `qlab director --approve`). While it is true the generator and the researcher
# ignore this file.
date: '2026-10-30'
memo: docs/research/director-2026-10-30.md
pending_owner_review: false
generator:
  prefer_mechanisms:
  - classic-carry
  - crypto-ts-momentum
  pause_mechanisms:
  - id: crypto-short-term-reversal
    why: Эффект в источниках держится на малооборотных монетах, а блока их отбора всё ещё нет, так что
      испытание проверило бы пробел блоков, а не механизм.
researcher:
  frab:
    priority: high
    note: 'Живые деньги снова ведут себя на краю того, что видел стенд: падение и дневные колебания. Сначала
      закончить поиск того, что стенд не учитывает в исполнении и издержках, сверяя живые сделки со стендом
      за те же часы; это разбор стенда, а не подбор чисел под живые дни. Новых вариантов до этого не заводить.
      Затем просьба владельца о децентрализованных биржах.'
  bv2:
    priority: normal
    note: Новых вариантов на уже отвеченные вопросы не заводить. Свести для владельца, на какие его вопросы
      о страховке уже есть ответ, и работать только над оставшимися. Прибавкой дохода занимается отдельная
      стратегия из ящика идей. Список монет выбирать кодом и только по прошлому.
  frab-binance-spot:
    priority: low
    note: 'Новых опытов не ставить. Написать владельцу итоговый ответ из уже сделанного: остаётся ли прибыль
      после всех издержек на его бюджетах. Правило о поддержке площадки говорит о нашем исполнении, а
      не об идее.'
  xsmom:
    priority: low
    note: 'Новых вариантов не заводить: выжившие в основном надстройки над одной базой. Если останется
      бюджет, проверить, переживает ли прибыль издержки и правило о капитале, и сверить, какие выжившие
      действительно ждут владельца.'
  trend:
    priority: low
    note: 'Ответ даст время: книга, где монеты выбирает код, только начала проверку вперёд. Новых вариантов
      сигнала не заводить. Ответить владельцу, зачем стратегии такая большая книга, опираясь на правило
      о капитале.'
catalogue_requests:
- family: funding-and-basis
  look_for: 'Сверить таблицу недостающих параметров с правилами генератора: где не хватает только срока
    истории монеты, механизм собирается. Найти работы с окном усреднения ставки и сроком пересмотра в
    сутках и работы, сравнивающие монеты между собой по ставке.'
  why: Таблица называет всё семейство несобираемым, хотя один механизм собирается; на этом семействе работают
    живые деньги.
- family: low-volatility
  look_for: Полные тексты работ, нашедших премию за спокойные монеты, с окнами и сроками в сутках.
  why: Собирается только версия из работы, где эффекта не нашли, поэтому новая попытка почти повторит
    прежнюю.
- family: reversal
  look_for: Работы о возврате цены среди крупных оборотистых монет и на бессрочных контрактах.
  why: Все источники каталога находят возврат только у малооборотных монет, поэтому единственный собираемый
    механизм на паузе.
- family: momentum
  look_for: Работы о продолжении движения на бессрочных контрактах с учётом издержек и платы за финансирование.
  why: Обе попытки генератора в семействе отвергнуты, в том числе по чистой прибыли и по капиталу, а источники
    каталога меряют доходность без издержек.
data_requests:
- what: История ставок финансирования и цен децентрализованных бирж бессрочных контрактов, кроме Hyperliquid,
    на одной сетке с имеющимися площадками.
  why: Владелец просит найти такие биржи для FRAB, а механизму разницы ставок между площадками нужна панель
    из двух площадок.
- what: Открытый интерес и объёмы принудительных закрытий по монетам на Hyperliquid и Binance; если истории
    нет, начать хранить её сейчас.
  why: Механизму о предупреждении обвала дохода от ставки нужны эти данные, а лаборатория их не хранит.
code_requests:
- repo: qlab
  what: 'Способ собрать связку монета против контракта с открытыми числами в пределах потолка вариантов:
    сейчас открытые параметры этой связки вместе дают больше вариантов, чем допускает потолок, и как это
    решить, выбирает владелец.'
  why: Без этого механизм сбора ставки финансирования генератору доступен только половиной, ставкой на
    падение цены.
  strategy: null
- repo: qlab
  what: Показывать в файле доказательств руководителя число вызовов генератора, сколько спеков он написал,
    сколько отвергла охрана и почему он не писал в остальные ночи.
  why: Генератор запускается каждую ночь, а идей почти нет; без этих чисел нельзя понять, что держит поиск
    нового.
  strategy: null
- repo: qlab
  what: 'Блок сигнала: положение текущей ставки финансирования монеты среди её собственной прошлой истории,
    и правило входа при выходе за порог и выхода при возврате.'
  why: Делает собираемым механизм резкого отскока ставки, для которого числа в каталоге уже есть.
  strategy: null
- repo: qlab
  what: Панель из ставок и цен двух площадок и позиция контракт против контракта на разных площадках.
  why: Нужна механизму разницы ставок между площадками и просьбе владельца о децентрализованных биржах
    для FRAB.
  strategy: frab
- repo: qlab
  what: Блок отбора монет с наименьшим средним оборотом, зеркальный нынешнему отбору самых оборотистых.
  why: Без него механизм краткого возврата цены нельзя испытать в той форме, в какой его нашли источники,
    и он остаётся на паузе.
  strategy: null
propose_close_family: []
problems: []
