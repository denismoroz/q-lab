# mechanism: crypto-xs-momentum
# Two-week cross-sectional momentum with the numbers of Borri, Liu, Tsyvinski, Wu (2026): quintiles by the
# past two weeks' return, weekly re-sort, 30-day sample filter. Equal weights (the authors weight by market
# cap; the stand's equal-weight sizing is a known difference). Their sample ends 2025-09-06, so the part of
# our history from 2025-09-07 on is a forward test.
idea_id: gen-xsmom-borri-2w
title: Продолжение роста за две недели — покупка пятой части лидеров, продажа пятой части отстающих, раз в неделю
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: all
  signal:
    block: momentum
    lookback_days: 14
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 30
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-10-24'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
