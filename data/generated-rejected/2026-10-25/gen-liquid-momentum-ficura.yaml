# mechanism: crypto-liquid-coins-momentum
# Momentum among the most traded coins: the 30 coins with the largest turnover over the past week, two-week
# return, quintiles, weekly re-sort (Ficura 2023; Grobys et al. 2025 for the 30 coins; Begusic, Kostanjcar
# 2019 for the 182-day history). Known differences: the blocks pick coins by turnover, not by market cap, and
# do not skip the last day. The latest source sample ends in December 2023, so history from 2024-01-01 on
# is a forward test.
idea_id: gen-liquid-momentum-ficura
title: Продолжение роста среди самых торгуемых монет — 30 монет с наибольшим оборотом, лидеры недели против отстающих
code_ref: qlab.strategies.blocks:Composed
params:
  universe:
    rule: top_volume
    n: 30
    window_days: 7
  signal:
    block: momentum
    lookback_days: 14
  portfolio:
    block: long_short_quantile
    quantiles: 5
  sizing:
    block: equal
    gross: 1.0
  rebalance_days: 7
  min_history_days: 182
data:
  source: binance
  interval: 1d
  start: '2019-09-08'
  end: '2026-10-24'
costs:
  taker_fee_bps: 3.5
  slippage_bps: 0.9
min_leg_notional: 10.0
simultaneous_legs: 1
noise_universe: panel
unexpressed_mechanisms: []
params_fixed_at: '2024-01-01'
params_fixed_evidence: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum: sources Ficura 2023 (sample 2017-06 to 2022-12), Begusic and Kostanjcar 2019 (2015 to January 2019), Grobys et al. 2025 (weekly data 2016-01 to 2023-12); the latest sample end is December 2023, the day after is 2024-01-01'
sources:
  universe: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, blocks field: universe top_volume (Ficura 2023)'
  universe.n: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row universe.n: 30 (Grobys et al. 2025)'
  universe.window_days: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row universe.window_days: 7 (Ficura 2023)'
  signal: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, blocks field: signal momentum (Ficura 2023)'
  signal.lookback_days: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row signal.lookback_days: 7, 14 (Ficura 2023)'
  portfolio: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, blocks field: portfolio long_short_quantile (Ficura 2023)'
  portfolio.quantiles: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row portfolio.quantiles: 5 (Ficura 2023)'
  sizing: 'docs/MECHANISMS.md, framework value: gross 1 = the whole capital, no leverage'
  rebalance_days: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row rebalance_days: 7 (Ficura 2023)'
  min_history_days: 'docs/MECHANISMS.md, mechanism crypto-liquid-coins-momentum, row min_history_days: 182 (Begusic, Kostanjcar 2019)'
  costs.taker_fee_bps: 'funding-rate-arbitrage/research/SCREENING.md line 32: «taker 3.5 + проскальзывание»'
  costs.slippage_bps: 'derived: 4.4 - 3.5; funding-rate-arbitrage/research/SCREENING.md line 32, «~4.4 б.п. на ногу (taker 3.5 + проскальзывание)»'
  min_leg_notional: 'funding-rate-arbitrage/src/frab/strategy/trend/params.py (TrendParams defaults; 25-coin DEFAULT_COINS), min_order_usd: HL''s own minimum order'
