      stepped with carry disabled: the book was created on 2026-09-13 while carry
      was still on, its persisted position sizes kept the carry-on values after
      carry was switched off, so b2 holds ~64% of the spot its declared
      configuration implies (BTC spot target $28.77 instead of $44.80). Replayed
      with the declared configuration from scratch, b2 would read +9.23% instead
      of the paper's +5.90% over the same hours.
    note: >
      The prediction was written against the TRANSCRIPTION, whose known mismatches
      (margin, ratchet state, one book vs two) it listed. It is checked here
      against the live-book adapter, which removes all three -- so the hit says
      the adapter and the data reproduce the engine, not that the old
      transcription would have.

  - stop_condition: "live-vs-model daily correlation below 0.3 over any 20-day window"
    applies_to: strategy-b-v2
