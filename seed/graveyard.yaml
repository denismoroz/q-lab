  # ---------------------------------------------------------------------
  - id: trend-tsmom-crypto
    title: "Трендовое следование (TSMOM-ансамбль) на крипто-перпах"
    source_type: graveyard
    source_url: null
    claimed_edge: >-
      Направленный тренд по каждой монете (лонг при росте, шорт при падении
      на 30-120-дневном горизонте), размер под волатильность. Изначально
      DSR(N=1)=0.89, pooled-OOS median Sharpe +0.94, 84% сегментов положительны.
    asset_class: crypto-perp
    driver_id: trend-following-premium
    profile: momentum
    status: bench
    notes: >-
      Прошёл несколько раундов пересмотра. 2026-06 (trend_following/FINDINGS.md):
      standalone маргинален (DSR 0.81 WARN, PBO 0.63 — высокий риск переподбора),
      коррелирован с XSMOM +0.40 — решение "не строить live". 2026-09-12/13
      (GRAVEYARD_REVIEW): реабилитирован из кладбища — отказ стоял на неверном
      критерии (корреляция с XSMOM), пересчитан с реальными костами HL: полная
      книга Sharpe 0.77, но нужен капитал ~$2200; версия на 10 мажорах
      помещается в ~$410, но по форме не лучше XSMOM. 2026-09-14
      (long_history.py, 6.7 лет вместо 3): PBO упал до 0.209 (было 0.63),
      впервые виден медведь 2022 (+4.6%), ортогонален и к B v2 (corr −0.004), и
      к carry-прокси FRAB (+0.097) — первая настоящая ортогональность. По
      заранее заданному 4-пунктовому правилу (2026-09-14) — NO-GO по одному
      пункту из четырёх (DSR 0.767 < 0.90), но рекомендован как "лучший
      кандидат на бумажный тест". Статус bench отражает именно это последнее,
      самое свежее решение, а не более ранние "не строить live". ВАЖНО: Sharpe
      0.77 (пересчёт GRAVEYARD_REVIEW, 2026-09-13) сам по себе — измеренное
      число БЕЗ формализованного порога в источнике (решение "не лучше
      XSMOM" принимал человек, а не правило); записано ниже как измерение
      (`comparator/threshold/passed = null`), а не как решение —
      придуманного порога 0.8 для sharpe_net ни в одном документе нет.
      Формальные пороги ЕСТЬ: в заранее зарегистрированной 4-пунктовой
      таблице от 2026-09-14 (используется ниже с decided_at 2026-09-14), в
      первом DSR-тесте от 2026-06 (">0.95", дословно в тексте), и в ДВУХ
      исходных, ныне отменённых правилах (`rules/2026-09-20.1.yaml`,
