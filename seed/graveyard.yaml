# Кладбище стратегий funding-rate-arbitrage, извлечённое в структурный формат.
#
# Источники — /Users/d/prj/funding-rate-arbitrage/research/*.md (только чтение).
# Все числа снабжены source_quote — точной цитатой из документа. Если число не
# найдено в документах, соответствующее поле оставлено null (см. EXTRACTION_NOTES.md
# по всем случаям, где это произошло, и по всем противоречиям между документами).
#
# Многие driver.description/kill_condition сформулированы НЕ дословной цитатой, а
# выведены агентом из описанного в документах механизма — это отмечено в notes
# соответствующих idea записей формулировкой "выведено", а не "процитировано".

drivers:
  - id: perp-funding-premium
    title: "Премия funding, которую платят лонги со плечом"
    description: >-
      На перп-биржах (HL и конкурентах) funding rate держит цену перпа у спота:
      когда лонги с плечом преобладают над шортами, они платят funding шортам.
      Стратегия занимает противоположную либо захеджированную по цене сторону и
      собирает эту выплату. Питает FRAB (spot против перп-шорта), кросс-биржевой
      funding-спред (шорт там, где funding выше) и кросс-секционный crypto-carry
      (ранжирование монет по funding). Выведено агентом из описания механизма в
      SCREENING.md и cross_exchange/PLAN.md, не дословная цитата.
    kill_condition: >-
      Устойчивое схлопывание перекоса funding в ноль на целевой площадке —
      переход рынка к преобладанию шортов или к дешёвому институциональному
      арбитражу, который сводит funding к издержкам хранения.
    observable: >-
      Средний/медианный funding rate по перпам HL (и конкурентов) на скользящем
      окне 30-90 дней; доля времени funding>0; funding history API HL/Binance/Bybit.

  - id: cross-sectional-momentum
    title: "Кросс-секционный ценовой моментум крипто-перпов"
    description: >-
      Монеты, выросшие относительно рынка за последние недели, в среднем
      продолжают обгонять упавшие ещё несколько недель — поведенческий эффект
      недоинвестирования в тренд плюс каскады ликвидаций. Long верхней трети /
      short нижней трети по z-score моментума собирает этот дрейф. Питает XSMOM.
      Выведено агентом из cross_sectional/PLAN.md и CRITICAL_REVIEW.md.
    kill_condition: >-
      Устойчивый переход рынка к отрицательной автокорреляции недельных
      доходностей, либо переполненность сделки (funding на лонг-ноге
      систематически съедает премию — на живой книге XSMOM задокументирован
      funding-драг −4.65%/год), либо арбитраж тем же сигналом со стороны рынка.
    observable: >-
      Rolling 52-week Sharpe long-top-tercile-minus-short-bottom-tercile книги
      на HL-перпах; funding, платимый лонг-ногой (weekly_attrib.py).

  - id: trend-following-premium
    title: "Временной тренд (TSMOM) на направленных активах"
    description: >-
      Актив, росший или падавший последние 1-4 месяца, с большей вероятностью
      продолжит движение в том же направлении ближайшие недели — премия managed
      futures. Позиция направленная (long при росте, short/flat при падении), не
      dollar-neutral, несёт выпуклость/crisis-alpha. Питает trend TSMOM (крипто),
      trend на индексах+золоте, trend на FX, и частично — трендовый тайминг входа
      в Strategy B. Выведено агентом из trend_following/PLAN.md.
    kill_condition: >-
      Структурный переход рынка в диапазонный/пилообразный режим на всех
      горизонтах разом — уже произошло на FX и индексах/золоте после 2011 года
      ("смерть трендового следования": Sharpe второй половины выборки упал с
      +0.67 до +0.07), либо арбитраж тем же сигналом со стороны систематических
      трендовых фондов.
    observable: >-
      Sharpe ансамбля TSMOM (lookback 30/60/90/120) на скользящем 2-3-летнем
      окне по целевому классу активов; доля прибыльных лет; net-exposure книги.

  - id: crypto-spot-risk-premium
    title: "Долгосрочная премия за риск от держания крипто-спота, снимаемая трендовым таймингом"
    description: >-
      Крупные криптоактивы (BTC/ETH/SOL/AVAX) долгосрочно дорожают быстрее
      безрискового актива — компенсация за волатильность и технологический риск.
      Strategy B держит эту премию в споте, но временно снимает экспозицию
      (шорт-перп хедж) на нисходящем 14/30-дневном моментуме, чтобы сохранить
      капитал в падении ценой части роста в быке. Выведено агентом из описания
      механизма в GRAVEYARD_REVIEW_2026_09.md ("держи и страхуй").
    kill_condition: >-
      Долгосрочный рост крупных криптоактивов прекращается (класс активов
      входит в структурную стагнацию) — тогда хеджу нечего сохранять. Проверено
      эмпирически: то же правило B на FX (где у валютной пары нет долгосрочного
      роста) даёт −1.5%/год с 2011 года — "половина от нуля — ноль минус комиссии".
    observable: >-
      Долгосрочный CAGR BTC/ETH/SOL/AVAX спот; доля времени в хедже; funding
      cost хеджа (per-coin funding rate шорта).

  - id: fx-rate-carry
    title: "Кэрри по разнице процентных ставок на FX"
    description: >-
      Валюты с более высокой ставкой центробанка в среднем не дешевеют
      настолько, чтобы по паритету процентных ставок компенсировать разницу —
      долгая позиция в высокодоходных / короткая в низкодоходных валютах
      собирает эту разницу (нарушение непокрытого процентного паритета).
      Выведено агентом из fx_carry/REPORT.md.
    kill_condition: >-
      Схлопывание межстрановых спредов ставок (синхронизация мировой
      монетарной политики), либо рост наценки посредника (своп/спред) выше
      самой разницы ставок — что уже наблюдается у розничных FX-брокеров.
    observable: >-
      3-месячные межбанковские ставки G10/EM (FRED/OECD) минус ставка США;
      своп-пункты форварда против спота у конкретного брокера.

  - id: token-unlock-selling-pressure
    title: "Механическое давление продаж от плановых анлоков токенов"
    description: >-
      Крупная плановая разблокировка токенов инвесторам/команде создаёт
      известную заранее продажу; рынок закладывает её в цену лишь частично —
      захеджированная по рынку короткая позиция в окне перед анлоком собирает
      недоучтённую часть движения. Формулировка близка к token_unlock/README.md
      ("Thesis").
    kill_condition: >-
      Рынок начинает полностью закладывать анлок в цену заранее (сигнал
      становится consensus trade и арбитражируется до нуля), либо эмитенты
      массово переходят на линейный вестинг без резких клифов.
    observable: >-
      Event-study CAR в окне [-10,-1] день перед крупными (≥1% supply)
      анлоками; DeFiLlama emissions API (`defillama-datasets.llama.fi/emissions/{slug}`).

  - id: onchain-protocol-revenue-growth
    title: "Рост реальных комиссий/доходов протокола"
    description: >-
      Токены протоколов с ускоряющимся ростом собираемых он-чейн комиссий
      (реальная экономическая активность) должны переоцениваться относительно
      токенов с падающими комиссиями — фундаментальный, не ценовой сигнал.
      Близко к формулировке onchain_fundamental/FINDINGS.md ("Hypothesis").
    kill_condition: >-
      Сигнал перестаёт быть отделим от цены/моментума (корреляция с
      cross-sectional momentum вырастает выше ~0.3), либо данные о комиссиях
      становятся ненадёжными (DefiLlama задним числом пересчитывает историю).
    observable: >-
      DefiLlama daily fees по протоколам/сетям, рост за 30/60/90 дней,
      z-score внутри группы (DeFi-приложения vs L1-газ).

  - id: sector-pair-cointegration
    title: "Коинтеграция цен монет одного сектора (гипотеза, эмпирически не подтвердилась)"
    description: >-
      Гипотеза: две монеты одного сектора (L1, DeFi, LST) связаны общими
      фундаментальными факторами сверх рыночной беты, поэтому отклонение
      спреда их цен от нормы должно возвращаться — pairs-trade механизм из
      equities/FX, перенесённый на крипту. Выведено агентом из
      pairs_cointegration/PLAN.md.
    kill_condition: >-
      Уже наступило по факту: на дневном горизонте, после нейтрализации общей
      BTC-беты, спред не возвращается, а продолжает расходиться (устойчивый
      слабый анти-сигнал, equal-weight book gross Sharpe ≈ −0.17). Драйвер
      эмпирически отсутствует в данных 2023-2026 на обеих проверенных осях
      (крипто-сектора и FX G10).
    observable: >-
      ADF/Engle-Granger p-value стационарности BTC-нейтрального (или
      USD-нейтрального для FX) спреда пары на скользящем окне; half-life
      реверсии; доля пар с положительным Sharpe.

  - id: price-mean-reversion-daily
    title: "Возврат цены монеты к своей скользящей средней (гипотеза, эмпирически не подтвердилась)"
    description: >-
      Гипотеза: монета, отклонившаяся от собственной скользящей средней
      (перекуплена/перепродана), должна скорректироваться обратно в течение
      нескольких дней — классический contrarian time-series механизм. Выведено
      агентом из cross_sectional/crypto/CRITICAL_REVIEW.md, раздел G.
    kill_condition: >-
      Уже наступило по факту: на дневном горизонте крипто-цена не revert, а
      трендит — gross Sharpe отрицателен на всех окнах {3,5,10,20,40} дней ДО
      костов. Возможно жив на внутридневном масштабе — не тестировался, нужны
      sub-daily данные и maker-исполнение.
    observable: >-
      Автокорреляция дневных доходностей монеты; z-score отклонения от rolling MA.

  - id: short-term-overreaction
    title: "Разворот после краткосрочного overreaction (гипотеза, эмпирически не подтвердилась)"
    description: >-
      Гипотеза: резкое относительное движение цены монеты за несколько дней
      или месяцев — overreaction, которое корректируется в последующие дни
      (short-/long-term reversal factor из equities). Выведено агентом из
      структуры факторов в cross_sectional/crypto (signals.reversal,
      value_signals.long_term_reversal).
    kill_condition: >-
      Уже наступило по факту: в крипте на горизонтах 7 и 120 дней доминирует
      momentum, а не reversal — стратегия устойчиво убыточна (Sharpe от −0.58
      до −0.95 после честного пересчёта на point-in-time универсе); умершие
      монеты — это и есть "дешёвые", что усиливает минус, а не создаёт эдж.
    observable: >-
      Кросс-секционный Sharpe стратегии long-losers/short-winners за 7 либо
      120 дней, дневной/недельный ребаланс.

  - id: crypto-value-contrarian
    title: "Дешевизна относительно недавнего максимума/средней (гипотеза, эмпирически не подтвердилась)"
    description: >-
      Гипотеза: монеты, сильно просевшие от своего максимума (дёшевы
      относительно собственной истории), должны опережать доходность дорогих
      монет — перенос equity value-фактора на крипту. Выведено агентом из
      cross_sectional/crypto/CRITICAL_REVIEW.md, раздел F.
    kill_condition: >-
      Уже наступило по факту: "дёшево" в крипте оказалось прокси на
      умирающие/делистнутые монеты, а не на недооценку (на честном
      point-in-time универсе фактор становится ещё отрицательнее). Фактор к
      тому же антикоррелирован с моментумом (−0.36…−0.84) — это перевёрнутый
      моментум, а не независимая премия.
    observable: >-
      Просадка монеты от 90/180-дневного максимума; дистанция от MA100;
      кросс-секционный z-score.

