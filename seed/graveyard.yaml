    status: rejected
    notes: >-
      Отказ формально стоял на PBO 0.73 (GRAVEYARD_REVIEW_2026_09.md называет
      это прямо в столбце "на чём стоял отказ") — меню было однородным
      (варианты одной идеи: веса/ребаланс/value-tilt/replacement поверх
      того же XSMOM-ранкинга), поэтому теперь этот вердикт помечен
      `rule_id: pbo_threshold_on_homogeneous_menu` — тем же ныне отменённым
      правилом, что и trend TSMOM. По расследованию валидационного стенда
      (xsmom_live_recon/AUDIT_2026_09.md, раздел 6.2) PBO~0.73 на однородном
      меню близнецов является "null-значением": варианты одной и той же идеи
      дают PBO~0.6-0.73 при ЛЮБОМ истинном Sharpe, включая истинный Sharpe
      3.0 — формально эта опора вердикта недействительна, что и стало
      причиной отмены правила 2026-09-12. Но качественный вывод
      (xsmom_signal_improve/GRAVEYARD_LESSONS.md) держится по другой
      причине: перестановка того же сигнала (когда выходишь / как
      взвешиваешь / насколько концентрируешь) не добавляет новой информации
      и не может создать эдж, которого нет в исходном ранкинге ("Режим 1" в
      этом документе) — поэтому status остаётся rejected, а не переходит в
      candidate для перепрогона, в отличие от cross-exchange-spread/trend
      TSMOM, у которых был независимый положительный довод (реальный эдж на
      честных данных) для реабилитации.
